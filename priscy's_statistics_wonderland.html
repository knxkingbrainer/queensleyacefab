<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priscy's Statistics Wonderland 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff8fd6; --pink-bright:#ff4fc3;
  --blue:#7fd6ff; --blue-bright:#3fb8ff;
  --purple:#b98cff; --purple-bright:#9b4dff;
  --cream:#fff7fd; --deep:#5a3a7a;
  --shadow:rgba(154,77,255,0.25);
  --good:#5fce9a; --bad:#ff6f8e;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Quicksand',sans-serif; color:var(--deep); min-height:100vh;
  background:linear-gradient(135deg,#ffe3f6 0%,#dcefff 35%,#ecdcff 65%,#ffe3f6 100%);
  background-size:400% 400%; animation:bgshift 22s ease infinite;
  overflow-x:hidden; position:relative;
}
@keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
h1,h2,h3,h4{font-family:'Baloo 2',cursive;margin:0;}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--purple-bright);outline-offset:2px;}

/* floating decorations */
#deco-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.floaty{position:absolute;opacity:.85;filter:drop-shadow(0 4px 10px rgba(154,77,255,.25));animation-timing-function:ease-in-out;animation-iteration-count:infinite;}
.cloud{animation-name:driftX}.heart{animation-name:bobY}.gem{animation-name:spinBob}.crown{animation-name:bobY}.sparkle{animation-name:twinkle}
@keyframes driftX{0%{transform:translateX(-10vw)}50%{transform:translateX(10vw) translateY(-2vh)}100%{transform:translateX(-10vw)}}
@keyframes bobY{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-22px) rotate(4deg)}}
@keyframes spinBob{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}

/* layout */
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:28px 20px 80px;}
header.hero{text-align:center;padding:18px 10px 26px;}
.hero h1{
  font-size:clamp(1.8rem,4vw,2.8rem);
  background:linear-gradient(90deg,var(--pink-bright),var(--purple-bright),var(--blue-bright));
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px;
}
.hero .sub{font-size:1.05rem;margin-top:8px;color:#7a4fa8;font-weight:600;}
.affirmation{
  margin:14px auto 0;max-width:560px;background:rgba(255,255,255,.65);
  border:2px dashed var(--pink);border-radius:20px;padding:10px 18px;
  font-weight:600;color:#a13d9a;backdrop-filter:blur(3px);min-height:2.6em;
}
.layout{display:grid;grid-template-columns:270px 1fr;gap:22px;margin-top:24px;}
.layout.focus{grid-template-columns:1fr;max-width:860px;margin-left:auto;margin-right:auto;}
.layout.focus nav.units{display:none;}
nav.units{
  background:rgba(255,255,255,.55);border-radius:24px;padding:14px;height:fit-content;
  border:2px solid rgba(255,255,255,.8);box-shadow:0 10px 30px var(--shadow);backdrop-filter:blur(6px);
  position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;
}
nav.units h3{padding:6px 10px 12px;color:#7a3fae;font-size:1rem;}
.unit-btn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;cursor:pointer;
  padding:10px 12px;margin-bottom:6px;border-radius:14px;font-weight:600;font-size:.9rem;color:#5a3a7a;transition:all .2s ease;
}
.unit-btn:hover{background:rgba(255,143,214,.18);transform:translateX(3px);}
.unit-btn.active{background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;box-shadow:0 6px 14px var(--shadow);}
.unit-btn .emoji{font-size:1.2rem;}
.unit-btn .score-pill{margin-left:auto;font-size:.7rem;background:rgba(255,255,255,.6);border-radius:10px;padding:2px 7px;color:#7a3fae;font-weight:700;white-space:nowrap;}
.unit-btn.active .score-pill{background:rgba(255,255,255,.35);color:#fff;}
main.content{
  background:rgba(255,255,255,.6);border-radius:28px;padding:26px 28px 34px;
  border:2px solid rgba(255,255,255,.85);box-shadow:0 14px 40px var(--shadow);backdrop-filter:blur(6px);min-height:400px;
}
@media (max-width:820px){
  .layout{grid-template-columns:1fr;}
  nav.units{position:static;max-height:none;padding:10px;}
  nav.units h3{padding:2px 8px 8px;}
  #unitList{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;}
  .unit-btn{width:auto;flex:0 0 auto;margin-bottom:0;white-space:nowrap;}
  main.content{padding:20px 16px 28px;}
}

/* buttons */
.btn{
  border:none;cursor:pointer;border-radius:999px;padding:11px 22px;font-family:'Baloo 2',cursive;font-size:1rem;font-weight:700;color:#fff;
  background:linear-gradient(90deg,var(--pink-bright),var(--purple-bright));box-shadow:0 6px 16px var(--shadow);transition:transform .15s ease;
}
.btn:hover{transform:translateY(-2px) scale(1.03);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn.secondary{background:linear-gradient(90deg,var(--blue-bright),var(--purple));}
.btn.ghost{background:rgba(255,255,255,.75);color:#7a3fae;box-shadow:none;border:2px solid var(--pink);}
.btn.big{font-size:1.25rem;padding:14px 34px;}
.btn.small{padding:7px 14px;font-size:.85rem;}

/* unit intro */
.unit-header{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.unit-header .big-emoji{font-size:2.4rem;}
.unit-header h2{font-size:clamp(1.3rem,2.6vw,1.8rem);color:#7a3fae;}
.unit-tagline{color:#a9679b;font-weight:600;margin:2px 0 18px;}
.love-note{
  background:rgba(255,255,255,.8);border:2px dashed var(--pink);border-radius:20px;padding:14px 18px;margin-bottom:18px;
  font-weight:600;color:#a13d9a;line-height:1.55;
}
.summary-card{
  background:linear-gradient(135deg,rgba(255,214,236,.55),rgba(180,214,255,.4));border-radius:20px;padding:18px 20px;margin-bottom:20px;
  border:1px solid rgba(255,255,255,.7);
}
.summary-card h3{color:#5a3a7a;margin-bottom:10px;font-size:1.05rem;}
.summary-card ul{margin:0;padding-left:20px;}
.summary-card li{margin-bottom:8px;line-height:1.5;font-size:.95rem;}
.rules{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;}
.rule{background:rgba(255,255,255,.8);border-radius:16px;padding:10px 14px;font-weight:700;font-size:.9rem;color:#6b3fa0;border:1.5px solid rgba(154,77,255,.18);}
.start-area{text-align:center;padding-top:6px;}
.start-area .hint{margin-top:10px;font-size:.88rem;color:#9a6fbf;font-weight:600;}
.best-line{margin-bottom:14px;font-weight:700;color:#7a3fae;}

/* quiz */
.quiz-bar{
  position:sticky;top:8px;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:rgba(255,255,255,.92);border:2px solid rgba(255,255,255,.95);border-radius:22px;padding:10px 16px;
  box-shadow:0 8px 24px var(--shadow);backdrop-filter:blur(8px);margin-bottom:14px;
}
.timer{font-family:'Baloo 2',cursive;font-size:1.6rem;font-weight:800;color:#7a3fae;min-width:110px;font-variant-numeric:tabular-nums;}
.timer.warn{color:#e0801f;}
.timer.danger{color:#e0345f;}
.prog-wrap{flex:1;min-width:140px;}
.prog{height:10px;background:rgba(154,77,255,.15);border-radius:99px;overflow:hidden;}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--pink-bright),var(--purple-bright));border-radius:99px;transition:width .3s ease;}
.pcount{font-size:.8rem;font-weight:700;color:#8a5fb5;margin-top:3px;}
.note-strip{
  background:rgba(255,255,255,.8);border:2px dashed var(--pink);border-radius:18px;padding:10px 16px;margin-bottom:14px;
  font-weight:600;color:#a13d9a;text-align:center;
}
.note-strip.pop{animation:pop .5s ease;}
@keyframes pop{0%{transform:scale(.96);background:#ffd6f0}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.qbox{background:rgba(255,255,255,.8);border-radius:22px;padding:20px 20px 18px;margin-bottom:14px;border:2px solid rgba(255,255,255,.9);}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
.qnum{font-family:'Baloo 2',cursive;color:var(--pink-bright);font-size:1rem;font-weight:800;}
.flag-btn{background:transparent;border:2px solid rgba(154,77,255,.25);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.8rem;color:#7a3fae;cursor:pointer;}
.flag-btn.on{background:#fff0b8;border-color:#f0c040;}
.qtext{font-weight:700;color:#4a3068;font-size:1.08rem;line-height:1.5;margin-bottom:14px;max-width:70ch;}
.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:9px;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,.75);border:2px solid rgba(154,77,255,.16);font-weight:600;font-size:.98rem;color:var(--deep);line-height:1.4;transition:all .15s ease;
}
.opt:hover{background:rgba(180,214,255,.35);}
.opt .letter{
  flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(154,77,255,.12);
  font-family:'Baloo 2',cursive;font-weight:800;font-size:.85rem;color:#7a3fae;
}
.opt.selected{background:linear-gradient(90deg,rgba(255,143,214,.35),rgba(185,140,255,.35));border-color:var(--purple-bright);}
.opt.selected .letter{background:var(--purple-bright);color:#fff;}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:8px;}
.palette{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin:16px 0;}
@media (max-width:560px){.palette{grid-template-columns:repeat(6,1fr);}}
.pbtn{
  aspect-ratio:1;border-radius:12px;border:2px solid rgba(154,77,255,.25);background:rgba(255,255,255,.75);cursor:pointer;
  font-weight:800;font-size:.85rem;color:#7a3fae;position:relative;
}
.pbtn.done{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border-color:transparent;}
.pbtn.cur{outline:3px solid var(--blue-bright);outline-offset:1px;}
.pbtn.flag::after{content:"🚩";position:absolute;top:-8px;right:-4px;font-size:.7rem;}
.submit-row{text-align:center;margin-top:6px;}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(90,58,122,.45);display:grid;place-items:center;z-index:100;padding:20px;}
.modal{background:#fff7fd;border-radius:24px;padding:24px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(90,58,122,.4);text-align:center;border:3px solid var(--pink);}
.modal h3{color:#7a3fae;margin-bottom:8px;font-size:1.3rem;}
.modal p{margin:0 0 18px;line-height:1.5;font-weight:600;}
.modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

/* results */
.result-top{text-align:center;margin-bottom:20px;}
.ring{
  --p:0;width:170px;height:170px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
  background:conic-gradient(var(--pink-bright) calc(var(--p)*1%),rgba(255,255,255,.85) 0);box-shadow:0 10px 30px var(--shadow);
}
.ring .inner{width:136px;height:136px;border-radius:50%;background:#fff7fd;display:grid;place-items:center;align-content:center;}
.ring .big{font-family:'Baloo 2',cursive;font-size:2.2rem;font-weight:800;color:#7a3fae;line-height:1;}
.ring .pc{font-weight:700;color:#a9679b;font-size:.95rem;}
.result-msg{
  max-width:600px;margin:0 auto 16px;background:linear-gradient(120deg,rgba(255,214,236,.8),rgba(200,180,255,.65));
  border-radius:20px;padding:16px 20px;font-family:'Baloo 2',cursive;font-size:1.15rem;color:#6b2f9a;line-height:1.45;
}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;}
.stat{background:rgba(255,255,255,.85);border-radius:16px;padding:8px 16px;font-weight:700;font-size:.9rem;}
.stat b{font-family:'Baloo 2',cursive;font-size:1.2rem;display:block;color:#7a3fae;}
.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px;}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;justify-content:center;}
.chip{border:2px solid var(--pink);background:rgba(255,255,255,.75);color:#7a3fae;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85rem;cursor:pointer;}
.chip.on{background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;border-color:transparent;}
.rcard{background:rgba(255,255,255,.82);border-radius:18px;padding:16px 18px;margin-bottom:14px;border-left:8px solid var(--good);}
.rcard.wrong{border-left-color:var(--bad);}
.rcard.skipped{border-left-color:#f0c040;}
.rcard .qtext{font-size:1rem;margin-bottom:10px;}
.ropt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:12px;margin-bottom:6px;font-weight:600;font-size:.93rem;background:rgba(255,255,255,.6);border:1.5px solid rgba(154,77,255,.12);}
.ropt.correct{background:rgba(140,230,180,.55);border-color:var(--good);}
.ropt.incorrect{background:rgba(255,150,170,.5);border-color:var(--bad);}
.ropt .tag{margin-left:auto;font-size:.75rem;font-weight:800;white-space:nowrap;padding-left:8px;}
.why{margin-top:10px;background:linear-gradient(135deg,rgba(255,240,184,.7),rgba(255,214,236,.5));border-radius:14px;padding:10px 14px;font-size:.92rem;line-height:1.55;font-weight:600;}
.verdict{font-weight:800;margin-bottom:8px;font-size:.9rem;}
.verdict.ok{color:#2c8f5f;}.verdict.no{color:#d0345f;}.verdict.skip{color:#b07d10;}

/* hearts confetti */
.confetti{position:fixed;top:-40px;z-index:90;pointer-events:none;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9;}}

footer.note{text-align:center;margin-top:30px;color:#9a6fbf;font-size:.85rem;font-weight:600;}
::selection{background:var(--pink);color:#fff;}
@media (prefers-reduced-motion:reduce){
  body{animation:none;} .floaty{animation:none;} .note-strip.pop{animation:none;} .confetti{display:none;}
  .btn,.unit-btn{transition:none;}
}
</style>
</head>
<body>
<div id="deco-layer" aria-hidden="true"></div>
<div class="wrap">
  <header class="hero">
    <h1>Priscy's Statistics Wonderland ✨</h1>
    <div class="sub">Simplified Statistics for Nursing &amp; Midwifery: 12 units, 30 questions each 📊💗</div>
    <div class="affirmation" id="affirmation">Loading a little sparkle for you...</div>
  </header>
  <div class="layout" id="layout">
    <nav class="units" aria-label="Units">
      <h3>🌸 Pick a unit, Priscy!</h3>
      <div id="unitList"></div>

    <main class="content" id="mainContent"></main>

  <footer class="note">made with 💕 for Priscy. Every question you practise makes you a stronger midwife 👑<br><a href="#" onclick="resetProgress();return false;" style="font-size:.8rem;opacity:.65;color:inherit">Reset my saved scores</a></footer>
</div>

 statistical method?", "o": ["Data interpretation", "Data presentation", "Data forecasting", "Data collection"], "a": 2, "e": "The four steps are collection, analysis, presentation and interpretation. Forecasting is not one of them."}, {"q": "The first step in any statistical activity is…", "o": ["data presentation", "data interpretation", "data analysis", "data collection"], "a": 3, "e": "You cannot analyse, present or interpret anything until data has been collected."}, {"q": "Data collection is best described as the process of…", "o": ["drawing conclusions from analysed data", "turning tables into graphs", "gathering observations or measurements from relevant sources using a variety of methods", "cleaning and screening raw data"], "a": 2, "e": "Turning tables into graphs is presentation, drawing conclusions is interpretation, and cleaning is part of analysis."}, {"q": "Descriptive statistics uses which methods to describe the essential features of a data set?", "o": ["Only random sampling", "Only hypothesis tests", "Tabular, graphical and numerical methods", "Only interviews and observation"], "a": 2, "e": "Descriptive statistics summarises data with tables, graphs and numerical indices such as measures of central location and variability."}, {"q": "Sources of data are classified as either…", "o": ["primary or secondary", "nominal or ordinal", "internal or external only", "discrete or continuous"], "a": 0, "e": "Discrete/continuous and nominal/ordinal describe types of variables, not sources of data."}, {"q": "Secondary sources of data refer to…", "o": ["data gathered for the first time by the researcher", "already-existing processed data", "data that has not yet been recorded", "data collected only through observation"], "a": 1, "e": "Secondary data already exists, for example in printed or electronic records or documents."}, {"q": "Which of these is a secondary source of data?", "o": ["A checklist you complete while watching a ward round", "Answers you collect today with your own questionnaire", "Printed hospital records that were compiled earlier", "Notes from an interview you personally conducted"], "a": 2, "e": "The other three are gathered first-hand by you, so they are primary data."}, {"q": "Which of these is NOT a method of data collection covered in the book?", "o": ["Observation method", "Laboratory titration", "Questionnaire method", "Interview"], "a": 1, "e": "The book covers questionnaire, interview, observation, and document/record review."}, {"q": "The questionnaire method usually involves administering a questionnaire to…", "o": ["no respondents; only records are used", "one respondent at a time only", "a large number of respondents", "a small focus group only"], "a": 2, "e": "Questionnaires are one of the most common methods because they can reach many respondents."}, {"q": "Two common approaches to administering questionnaires are…", "o": ["online administration and paper-based administration", "primary and secondary administration", "participant and non-participant administration", "individual and group administration"], "a": 0, "e": "Online uses technology and the internet; paper-based uses printed forms."}, {"q": "Printed questionnaires may be delivered to the target respondents…", "o": ["only by observation", "only through an FGD", "only by telephone", "by hand or by mail"], "a": 3, "e": "Paper-based questionnaires are delivered by hand or by mail."}, {"q": "An interview, as a data collection technique, is…", "o": ["a printed form filled in by many people", "a review of existing databases", "silent watching of a group", "a two-way purposeful conversation between interviewer(s) and interviewee(s)"], "a": 3, "e": "Interviews use questions to elicit oral responses from the interviewee(s)."}, {"q": "The two forms of interview are…", "o": ["individual interview and focus group discussion", "online and paper-based interview", "participant and non-participant interview", "primary and secondary interview"], "a": 0, "e": "An individual interview involves one person at a time; an FGD involves a group."}, {"q": "Individual interviews and FGDs are conducted using, respectively…", "o": ["an interview guide and a focus group discussion guide", "a checklist and a questionnaire", "a questionnaire and an observation guide", "a database and a register"], "a": 0, "e": "Each form of interview has its own guide."}, {"q": "A focus group discussion involves individuals who…", "o": ["have never met and share no characteristics", "are chosen with no shared feature at all", "are all interviewers", "have something in common, such as teenage mothers"], "a": 3, "e": "Examples in the book include teenage mothers, first-time mothers, men with diabetes mellitus and first-year midwifery trainees."}, {"q": "The three main processes involved in observation are…", "o": ["reading, writing and filing", "tallying, counting and grouping", "sensation, attention and perception", "questioning, probing and recording"], "a": 2, "e": "Observation is the systematic selection, watching and recording of naturally occurring phenomena."}, {"q": "The observation method collects data using…", "o": ["an interview guide and audio recorder only", "a checklist or observation guide, without the group having to answer questions", "a mailed questionnaire only", "a focus group discussion guide"], "a": 1, "e": "The target group is not required to answer any specific question."}, {"q": "In participant observation, the person collecting the data…", "o": ["watches from afar without taking part", "reads only from existing records", "takes part in the daily life or activities of the people being observed", "sends questionnaires by mail"], "a": 2, "e": "Participating in the group's activities is what defines participant observation."}, {"q": "In non-participant observation, the data collector…", "o": ["watches the group from afar and does not take part in its activities", "joins the group's daily activities", "asks each member a set of questions", "edits the group's existing records"], "a": 0, "e": "The observer stays outside the group's activities."}, {"q": "Document or record review involves examining…", "o": ["existing data such as databases, minutes, reports and hospital records", "fresh responses from a questionnaire", "spoken answers in an interview", "a group's spontaneous behaviour"], "a": 0, "e": "It uses data that already exists, such as attendance logs, financial records and newsletters."}, {"q": "Which of the following is a purpose of data collection?", "o": ["To evaluate programmes and projects", "To avoid making informed decisions", "To make analysis unnecessary", "To keep information away from others"], "a": 0, "e": "The book lists: obtain information, keep on record, make decisions, pass information on, and evaluate programmes and projects."}, {"q": "Raw or unprocessed data contain very little information and are therefore…", "o": ["the same as interpreted results", "of little meaning until they are analysed", "ready to guide decisions", "more reliable than analysed data"], "a": 1, "e": "Mishra et al. (2019): raw data must be analysed to obtain relevant information for decisions."}, {"q": "Data analysis refers to the process of…", "o": ["publishing findings in journals", "cleaning, screening, transforming and modelling data to derive relevant information", "gathering data from primary sources", "drawing pie charts only"], "a": 1, "e": "Analysis turns raw data into information, using appropriate statistical tools and software."}, {"q": "The two main statistical methods used for data analysis are…", "o": ["nominal and ordinal statistics", "primary and secondary statistics", "questionnaire and interview statistics", "descriptive statistics and inferential statistics"], "a": 3, "e": "Descriptive statistics summarises data; inferential statistics draws conclusions about a population."}, {"q": "Which of the following is a data presentation technique?", "o": ["Non-participant observation", "Tables", "Focus group discussion", "Record review"], "a": 1, "e": "Tables, graphs and numeric indices are the presentation techniques named in the book."}, {"q": "Inferential statistics differs from descriptive statistics because it…", "o": ["draws conclusions about a population from a sample", "only summarises the sample in tables", "never involves a sample", "only uses pie charts and bar charts"], "a": 0, "e": "Inferential statistics uses information from a sample to draw conclusions about the population the sample came from."}, {"q": "An individual interview refers to interviewing…", "o": ["one person at a time", "a whole group at once", "nobody directly, using only records", "people only by mail"], "a": 0, "e": "Individual interviews use an interview guide; a focus group discussion is the group version."}]}, {"id": "variables", "icon": "🧬", "title": "Variables, Data & Levels of Measurement", "tag": "Know your data before you touch it", "note": "This is the unit where lots of exam questions hide, Priscy. Nominal, ordinal, interval, ratio: you're about to master them 💎", "summary": ["A variable changes from person to person or over time. It is qualitative (categorical) or quantitative (numeric).", "Qualitative: nominal (no order) and ordinal (ordered). Quantitative: discrete (counts) and continuous (measurements).", "Data are the values of a variable for a group of people. They can be qualitative or quantitative.", "Measurement scales have 3 properties: magnitude, equal interval, absolute zero.", "Nominal = none. Ordinal = magnitude. Interval = magnitude + equal interval. Ratio = all three.", "Parameter describes a population; statistic describes a sample."], "qs": [{"q": "A variable is best defined as…", "o": ["a fixed number that never changes", "an attribute or characteristic that changes from one person to another or from time to time", "a table of frequencies", "a sample taken from a population"], "a": 1, "e": "Its values differ between people or change over time."}, {"q": "Height is a variable because…", "o": ["its values differ between people and can change over time", "it has no numeric value", "it is always the same for everyone", "it can only be counted in whole numbers"], "a": 0, "e": "Anything whose value varies between individuals or across time is a variable."}, {"q": "Variables are described as qualitative or quantitative based on…", "o": ["the hospital where they are collected", "the number of respondents", "the size of the sample", "the way they are measured"], "a": 3, "e": "The way a variable is measured decides its classification."}, {"q": "Qualitative (categorical) variables are represented by…", "o": ["measurements only", "counts only", "non-numeric values", "averages only"], "a": 2, "e": "Qualitative values describe quality or category, such as gender or type of disease."}, {"q": "Which is a qualitative variable?", "o": ["Pulse rate", "Weight", "Marital status", "Serum cholesterol level"], "a": 2, "e": "Marital status places people in categories. The others are numeric."}, {"q": "Qualitative variables are further divided into…", "o": ["interval and ratio variables", "nominal and ordinal variables", "discrete and continuous variables", "primary and secondary variables"], "a": 1, "e": "Discrete and continuous are the subdivisions of quantitative variables."}, {"q": "A nominal variable has values that…", "o": ["cannot be organised in a logical sequence", "are always whole numbers", "are always measured with a ruler", "can be ranked from highest to lowest"], "a": 0, "e": "It only classifies people into mutually exclusive categories."}, {"q": "Which is a nominal variable?", "o": ["Clothing size (small, medium, large)", "Eye colour", "Attitude (strongly agree to strongly disagree)", "Academic grade (A, B, C)"], "a": 1, "e": "Eye colour has no logical order. The other three can be ranked."}, {"q": "An ordinal variable has values that…", "o": ["are exact measurements", "cannot be ranked at all", "always include an absolute zero", "can be logically ordered or ranked, without a fixed numeric difference between categories"], "a": 3, "e": "Categories can be ranked higher or lower, but the gaps between them are not numerically defined."}, {"q": "Which is an ordinal variable?", "o": ["Religion", "Smell", "Sex", "Attitude scale: strongly agree, agree, disagree, strongly disagree"], "a": 3, "e": "Attitudes can be ranked in order; religion, sex and smell cannot."}, {"q": "Quantitative variables have values that describe…", "o": ["only membership of a group", "only rank order", "a measurable quantity using a number (how many or how much)", "a quality using words"], "a": 2, "e": "They yield numerical information."}, {"q": "Quantitative variables are subdivided into…", "o": ["discrete and continuous variables", "nominal and ordinal variables", "parametric and non-parametric variables", "primary and secondary variables"], "a": 0, "e": "Discrete = counts; continuous = measurements."}, {"q": "A discrete variable is one whose values are…", "o": ["words describing categories", "always fractions", "based on a count from a set of distinct whole numbers", "any value between two real numbers"], "a": 2, "e": "A discrete variable does not take the value of a fraction."}, {"q": "Which is a discrete variable?", "o": ["Serum cholesterol level", "Number of beds in a ward", "Blood sugar", "Chest circumference"], "a": 1, "e": "Beds are counted in whole numbers. The others are measured."}, {"q": "Continuous variables are numeric variables that…", "o": ["have no numeric value", "cannot be exhaustively counted and can take any value between a set of real numbers", "are always ranked", "can only be counted in whole numbers"], "a": 1, "e": "Their values usually come from measurement, for example head circumference."}, {"q": "Data can be defined as…", "o": ["a statistical formula", "the name of a variable", "the qualitative or quantitative values of a variable for a group of people", "a sample from a population"], "a": 2, "e": "For instance, the heights obtained from pregnant women are data."}, {"q": "Qualitative data are also known as…", "o": ["discrete data", "ratio data", "categorical data", "continuous data"], "a": 2, "e": "Qualitative data come from a qualitative (categorical) variable, such as religion or level of education."}, {"q": "Which of the following produces quantitative data?", "o": ["Marital status", "Heights of recruits", "Religion of patients", "Level of satisfaction with care"], "a": 1, "e": "Height is measured and expressed as numbers."}, {"q": "Number of abortion cases in a month is an example of…", "o": ["nominal data", "discrete data", "ordinal data", "continuous data"], "a": 1, "e": "It is counted in whole numbers."}, {"q": "Blood glucose level is an example of…", "o": ["nominal data", "ordinal data", "discrete data", "continuous data"], "a": 3, "e": "Blood glucose is measured and can take any value within a range."}, {"q": "Measurement is defined as…", "o": ["another word for a sample", "the total of all observations", "the process of drawing graphs", "the process of assigning numerical values to different characteristics of observations so they can be differentiated"], "a": 3, "e": "It is done using a measurement scale."}, {"q": "The three properties of a measurement scale are…", "o": ["nominal, ordinal and ratio", "mean, median and mode", "range, variance and deviation", "magnitude, equal interval and absolute zero"], "a": 3, "e": "These properties decide whether a scale is nominal, ordinal, interval or ratio."}, {"q": "Magnitude means that…", "o": ["one instance of the attribute can be judged greater than, less than or equal to another", "there is a true zero", "the values are only names", "the unit is the same across the scale"], "a": 0, "e": "It is the property of order."}, {"q": "Equal interval means that…", "o": ["values can only be ranked", "a unit of measurement between any two points on the scale is the same wherever the points fall", "there is nothing of the attribute at zero", "values are grouped in classes"], "a": 1, "e": "For example, the distance between 10 cm and 11 cm equals that between 75 cm and 76 cm."}, {"q": "Absolute zero means that…", "o": ["the scale has no units", "at one end of the scale, nothing at all of the attribute exists", "all values are equal", "the mean is zero"], "a": 1, "e": "For example, a weight of 0 kg."}, {"q": "Which measurement scale does not possess the property of magnitude?", "o": ["Ratio scale", "Nominal scale", "Interval scale", "Ordinal scale"], "a": 1, "e": "A nominal scale only classifies values into mutually exclusive categories."}, {"q": "The ordinal scale has which property?", "o": ["Magnitude only", "Magnitude and equal interval", "All three properties", "None of the three properties"], "a": 0, "e": "Ordinal data can be ordered from highest to lowest, for example degree of satisfaction."}, {"q": "Temperature on a thermometer scale is an example of which scale?", "o": ["Nominal scale", "Interval scale", "Ordinal scale", "Ratio scale"], "a": 1, "e": "It has magnitude and equal interval but no absolute zero."}, {"q": "A midwife takes a sample of 550 pregnant women and finds an average weight of 68 kg. The 68 kg is a…", "o": ["nominal value", "parameter", "variable", "statistic"], "a": 3, "e": "A statistic describes a sample. A parameter would be the average weight of all pregnant women aged 20 or older."}, {"q": "Which of these is measured on a ratio scale?", "o": ["Marital status", "Degree of satisfaction", "Temperature on a thermometer scale", "Weight"], "a": 3, "e": "Height, weight, volume, length and time have magnitude, equal interval and an absolute zero."}]}, {"id": "categorical", "icon": "🥧", "title": "Categorical Data: Tables, Pie & Bar Charts", "tag": "Tally, divide, draw", "note": "Tally marks, percentages, pie slices. This is the most hands-on unit, Priscy. Keep a calculator close 🌸", "summary": ["Categorical data is summarised with frequency and relative frequency tables, then shown with pie charts or bar charts.", "Relative frequency = frequency ÷ total frequency. It lies between 0 and 1 and all add up to 1.", "Percentage = relative frequency × 100.", "Pie chart: degrees = relative frequency × 360°. All sectors add to 360°.", "Bar chart: bars are separated by equal spaces, with equal widths. Height = frequency."], "qs": [{"q": "Descriptive statistics consists of methods for organising and summarising data using tables, graphs and…", "o": ["hypothesis tests", "random sampling", "population parameters", "numerical indices"], "a": 3, "e": "Tables, graphs and numerical indices are the three tools of descriptive statistics."}, {"q": "Which two methods are mainly used to summarise categorical (non-numeric) data?", "o": ["Mean and median", "Tables and graphs", "Standard deviation and variance", "t-test and ANOVA"], "a": 1, "e": "Mean, median, SD and variance need numeric data."}, {"q": "A frequency refers to…", "o": ["the total of all values", "the number of times a value of the variable occurs in a data set", "the middle value of the data", "the difference between the highest and lowest values"], "a": 1, "e": "It is a simple count of occurrences."}, {"q": "A frequency distribution is a table that displays…", "o": ["the population and sample sizes", "the distinct values of a variable and their frequencies", "only percentages, without categories", "only the mean and standard deviation"], "a": 1, "e": "Each distinct value is listed alongside how often it occurs."}, {"q": "Relative frequency is calculated as…", "o": ["frequency − total frequency", "total frequency ÷ frequency", "frequency ÷ total frequency", "frequency × total frequency"], "a": 2, "e": "RF = Frequency / Total Frequency."}, {"q": "Relative frequencies always fall between…", "o": ["0 and 1", "−1 and +1", "0 and 100", "1 and 100"], "a": 0, "e": "Each is a fraction of the total."}, {"q": "The relative frequencies of all categories in a distribution add up to…", "o": ["100", "0", "1", "the number of categories"], "a": 2, "e": "The fractions of the whole always sum to 1 (or 100% as percentages)."}, {"q": "Why are relative frequency distributions better for comparing two or more data sets?", "o": ["They only work for continuous data", "They are always larger than raw frequencies", "They provide a standard for comparison because they always lie between 0 and 1", "They remove the need for a title"], "a": 2, "e": "Data sets of different sizes can be compared on the same scale."}, {"q": "When constructing a frequency table for categorical data, Step 1 is to…", "o": ["list the distinct values of the data set in the first column", "draw a horizontal axis", "calculate the mean", "multiply each frequency by 360"], "a": 0, "e": "Then tally, count, divide by the total, and give the table a title."}, {"q": "Why does the book advise crossing out each value after tallying it?", "o": ["To make sure no observation is missed or duplicated", "To calculate relative frequency", "To shorten the data set", "To find the mode"], "a": 0, "e": "Crossing out gives you a running check on your tallying."}, {"q": "In Table 1 (Covid-19 place of residence), Alavanyo had 12 of the 40 patients. Its relative frequency is…", "o": ["0.40", "0.12", "0.3", "0.25"], "a": 2, "e": "12 ÷ 40 = 0.30, which is 30%."}, {"q": "Hohoe had 7 of the 40 Covid-19 patients. As a percentage, this is…", "o": ["15%", "17.5%", "7%", "20%"], "a": 1, "e": "7 ÷ 40 = 0.175, and 0.175 × 100 = 17.5%."}, {"q": "Wli had 5 of the 40 Covid-19 patients. Its relative frequency is…", "o": ["0.05", "0.15", "0.125", "0.25"], "a": 2, "e": "5 ÷ 40 = 0.125."}, {"q": "Godenu had 10 of the 40 Covid-19 patients. As a percentage, this is…", "o": ["30%", "40%", "25%", "10%"], "a": 2, "e": "10 ÷ 40 = 0.25, so 25%."}, {"q": "In Table 1, which area recorded the lowest number of Covid-19 cases?", "o": ["Wli", "Alavanyo", "Godenu", "Gborxome"], "a": 0, "e": "Wli had 5 cases (12.5%), the lowest. Alavanyo had the highest with 12."}, {"q": "To convert a relative frequency to a percentage, you…", "o": ["divide by 100", "multiply by 100", "multiply by 360", "subtract it from 1"], "a": 1, "e": "For example, 0.32 × 100 = 32%."}, {"q": "In Table 2 (OPD diagnoses), 16 of 50 patients had hypertension. Its relative frequency is…", "o": ["0.5", "0.26", "0.16", "0.32"], "a": 3, "e": "16 ÷ 50 = 0.32."}, {"q": "In Table 2, 13 of 50 patients had diabetes mellitus. As a percentage, this is…", "o": ["13%", "26%", "24%", "32%"], "a": 1, "e": "13 ÷ 50 = 0.26, so 26%."}, {"q": "In Table 2 (OPD), which was the leading diagnosis?", "o": ["Diabetes mellitus", "Malaria", "Urinary tract infection", "Hypertension"], "a": 3, "e": "Hypertension had the highest frequency (16, or 32%)."}, {"q": "A pie chart is…", "o": ["a circular chart divided into sectors, each representing a frequency or percentage", "a scatter of paired values", "a line joining class marks", "a set of touching vertical bars"], "a": 0, "e": "It shows the contributions of the parts that make up a whole."}, {"q": "To find the angle of a pie chart sector, multiply the relative frequency by…", "o": ["100", "360°", "90°", "180°"], "a": 1, "e": "A full circle is 360°."}, {"q": "In Table 3, malaria had a relative frequency of 0.3. Its sector angle is…", "o": ["120°", "300°", "30°", "108°"], "a": 3, "e": "0.3 × 360° = 108°."}, {"q": "Typhoid fever had a relative frequency of 0.125. Its sector angle is…", "o": ["12.5°", "36°", "45°", "60°"], "a": 2, "e": "0.125 × 360° = 45°."}, {"q": "Dysmenorrhoea had a relative frequency of 0.375. Its sector angle is…", "o": ["90°", "150°", "37.5°", "135°"], "a": 3, "e": "0.375 × 360° = 135°."}, {"q": "In a pie chart, 20 of 80 patients had a UTI. What is the angle of the UTI sector?", "o": ["45°", "25°", "72°", "90°"], "a": 3, "e": "20 ÷ 80 = 0.25, and 0.25 × 360° = 90°."}, {"q": "Which two graphs are most frequently used to describe categorical data?", "o": ["Histograms and ogives", "Pie charts and bar charts", "Ogives and scatter diagrams", "Frequency polygons and scatter diagrams"], "a": 1, "e": "Histograms, polygons and ogives are for quantitative data."}, {"q": "In a bar chart, the bars are…", "o": ["drawn as sectors of a circle", "separated from each other by equal spaces and have equal widths", "touching with no gaps", "plotted at class marks and joined by lines"], "a": 1, "e": "The width of the bars and the interval between them are equal."}, {"q": "In a bar chart, the vertical axis is labelled…", "o": ["with degree equivalents", "with frequency or relative frequency", "with the name of the variable", "with class marks"], "a": 1, "e": "The horizontal axis carries the name of the variable and the bars are labelled with its distinct values."}, {"q": "In Table 4 (children on admission), anaemia had 18 of the 40 children. Its relative frequency is…", "o": ["0.55", "0.4", "0.18", "0.45"], "a": 3, "e": "18 ÷ 40 = 0.45."}, {"q": "In Table 2 (OPD), 9 of 50 patients had a UTI. The percentage is…", "o": ["9%", "24%", "18%", "32%"], "a": 2, "e": "9 ÷ 50 = 0.18, so 18%."}]}, {"id": "grouping", "icon": "🧮", "title": "Grouping Quantitative Data", "tag": "Single-value, limit and cut-point", "note": "Class limits, boundaries, marks. These terms trip everyone up, Priscy, so read each explanation at the end carefully 💜", "summary": ["Three grouping methods: single-value (small number of discrete values), limit grouping (whole numbers), cut-point grouping (continuous/decimals).", "Class interval = UCL − LCL. Class boundaries = LCL − 0.5 and UCL + 0.5. Class size = (UCL − LCL) + 1.", "Class mark = (lower limit + upper limit) ÷ 2. Example: 50–59 → 54.5.", "Guidelines: 5 to 20 classes, no overlapping classes, equal class sizes where possible.", "Cut-point: upper cut-point = lower limit of next class. Width = upper − lower cut-point. Midpoint = average of cut-points."], "qs": [{"q": "The three most common methods of grouping quantitative data are…", "o": ["nominal, ordinal and ratio grouping", "pie, bar and histogram grouping", "mean, median and mode grouping", "single-value, limit and cut-point grouping"], "a": 3, "e": "These are the three methods the book uses to place quantitative data into classes."}, {"q": "Single-value grouping is particularly suitable for…", "o": ["continuous data with many decimals", "data with a very large range", "discrete data with only a small number of distinct values", "categorical data only"], "a": 2, "e": "Each single value becomes its own class, which only works when there are few distinct values."}, {"q": "In single-value grouping, each class is…", "o": ["one individual value from the data set", "a percentage", "a range of ten values", "a pair of cut-points"], "a": 0, "e": "For example, in the children-under-5 data the classes are 0, 1, 2, 3, 4 and 5."}, {"q": "In Table 5 (children under 5, n = 50), 16 households had exactly 1 child. The relative frequency is…", "o": ["0.5", "0.28", "0.16", "0.32"], "a": 3, "e": "16 ÷ 50 = 0.32."}, {"q": "In Table 5, the frequencies for 0, 1 and 2 children are 2, 16 and 14. The cumulative frequency at 2 children is…", "o": ["32", "18", "14", "30"], "a": 0, "e": "2 + 16 + 14 = 32."}, {"q": "The last cumulative frequency in any distribution always equals…", "o": ["1", "the total frequency", "100", "the highest single frequency"], "a": 1, "e": "It is the running total of all frequencies, so it ends at n."}, {"q": "Limit grouping is particularly useful when the data are whole numbers and…", "o": ["there are too many distinct values for single-value grouping", "there are only three distinct values", "the data have many decimals", "the data are nominal"], "a": 0, "e": "Decimal data call for cut-point grouping instead."}, {"q": "The two class limits of a class are…", "o": ["the lower-class limit and the upper-class limit", "the mean and the mode", "the class mark and the class size", "the cumulative and relative frequency"], "a": 0, "e": "They mark the beginning and end of the class interval."}, {"q": "The lower-class limit is…", "o": ["the number of values in the class", "the largest value that could go in a class", "the midpoint of the class", "the smallest value that could go in a class"], "a": 3, "e": "The upper-class limit is the largest value that could go in the class."}, {"q": "Class interval is calculated as…", "o": ["UCL ÷ LCL", "LCL − UCL", "UCL + LCL", "UCL − LCL"], "a": 3, "e": "It is the difference between the upper and lower class limits."}, {"q": "What is the class interval of the class 20–29?", "o": ["10", "9", "20", "29"], "a": 1, "e": "29 − 20 = 9."}, {"q": "Class boundaries are found by…", "o": ["subtracting 0.5 from the LCL and adding 0.5 to the UCL", "dividing the limits by 2", "adding 0.5 to the LCL and subtracting 0.5 from the UCL", "subtracting 1 from the LCL and adding 1 to the UCL"], "a": 0, "e": "Lower boundary = LCL − 0.5; upper boundary = UCL + 0.5."}, {"q": "The class boundaries of the class 10–19 are…", "o": ["10 – 19.5", "10.5 – 18.5", "9 – 20", "9.5 – 19.5"], "a": 3, "e": "10 − 0.5 = 9.5 and 19 + 0.5 = 19.5."}, {"q": "The class boundaries of the class 40–49 are…", "o": ["40 – 49.5", "39.5 – 49.5", "39 – 50", "40.5 – 48.5"], "a": 1, "e": "40 − 0.5 = 39.5 and 49 + 0.5 = 49.5."}, {"q": "Class size (number of individual values in a class) is calculated as…", "o": ["UCL − LCL; for 30–39 this is 9", "UCL + LCL; for 30–39 this is 69", "UCL ÷ LCL; for 30–39 this is 1.3", "(UCL − LCL) + 1; for 30–39 this is 10"], "a": 3, "e": "(39 − 30) + 1 = 10 values: 30, 31, …, 39."}, {"q": "The class mark of the class 50–59 is…", "o": ["55", "50", "59", "54.5"], "a": 3, "e": "(50 + 59) ÷ 2 = 109 ÷ 2 = 54.5."}, {"q": "The class mark of the class 70–79 is…", "o": ["74.5", "75", "79", "70"], "a": 0, "e": "(70 + 79) ÷ 2 = 74.5."}, {"q": "Cumulative frequency is…", "o": ["the largest frequency in the table", "the difference between two class limits", "the frequency divided by the total", "the successive sum of the frequencies, starting from the lowest class interval"], "a": 3, "e": "Add each frequency to the running total from the lowest class upward."}, {"q": "Cumulative percentage frequency can be obtained by…", "o": ["expressing each cumulative frequency as a percentage of the total", "dividing the range by the class size", "multiplying each class mark by its frequency", "subtracting 0.5 from each class limit"], "a": 0, "e": "It is also the successive sum of the percentage frequencies."}, {"q": "A rule of thumb for the number of classes in limit grouping is…", "o": ["between 30 and 50", "between 1 and 3", "between 5 and 20", "always exactly 10"], "a": 2, "e": "Small enough to summarise effectively, large enough to show the data's features."}, {"q": "Classes such as 30–40, 40–50 and 50–60 are wrong because…", "o": ["they start at the wrong value", "they have unequal sizes", "they overlap, so a value such as 40 would not belong to only one class", "they are too wide"], "a": 2, "e": "Each value must belong to one class only."}, {"q": "Whenever feasible, the classes should…", "o": ["be fewer than 3", "all have different sizes", "overlap slightly", "all have the same size"], "a": 3, "e": "Equal class sizes make graphical display of the data easier."}, {"q": "Popular class sizes mentioned in the book are…", "o": ["1, 2, 4 and 6", "2, 4, 8 and 16", "3, 5, 7 and 10", "12, 15, 20 and 25"], "a": 2, "e": "You arbitrarily pick one of these."}, {"q": "In the OPD weights example, the lowest weight is 36 kg and the highest is 99 kg. The range is…", "o": ["62 kg", "135 kg", "64 kg", "63 kg"], "a": 3, "e": "99 − 36 = 63."}, {"q": "The approximate number of classes is found by dividing…", "o": ["the range by the class size", "the class size by the range", "the total frequency by the range", "the highest value by the lowest value"], "a": 0, "e": "Range ÷ class size. For 63 ÷ 10 ≈ 6 to 7 classes."}, {"q": "In the OPD weights example, why was 30 chosen as the lower limit of the first class?", "o": ["It is the mean weight", "Classes must always start at zero", "It is a convenient value just below the lowest weight, 36 kg", "It is the highest weight"], "a": 2, "e": "The first class may start at the lowest value or any convenient value below it. That gave classes 30–39, 40–49 and so on."}, {"q": "In Table 7 (class size of 10, n = 70), 7 values fall in 10–19 and 44 in 20–29. The cumulative frequency at 20–29 is…", "o": ["70", "51", "7", "44"], "a": 1, "e": "7 + 44 = 51."}, {"q": "Cut-point grouping is particularly useful when the data are…", "o": ["continuous and expressed with decimals", "whole numbers only", "nominal", "discrete with very few values"], "a": 0, "e": "Heights such as 129.2 cm and 185.3 cm are a typical example."}, {"q": "In cut-point grouping, the upper cut-point of a class is the same as…", "o": ["the class mark", "the class width", "the lower limit of the same class", "the lower limit of the next higher class"], "a": 3, "e": "That is why the class 160–under 180 is followed by 180–under 200."}, {"q": "In Table 6 (weights of OPD patients, n = 40), 10 patients fall in the class 60–69. The percentage is…", "o": ["40%", "25%", "20%", "10%"], "a": 1, "e": "10 ÷ 40 = 0.25, so 25%."}]}, {"id": "graphs", "icon": "📈", "title": "Histograms, Polygons & Ogives", "tag": "Drawing what the numbers say", "note": "Bars that touch, lines that climb. You're going to see statistics come alive in this one, Priscy 🌈", "summary": ["Histogram: bars touch (no gaps). Height = frequency, relative frequency or percent of the class.", "Relative-frequency histograms compare data sets better: the vertical scale is always 0 to 1.", "Frequency polygon: plot a point above each class mark at the class frequency, join with straight lines, and extend to touch the horizontal axis.", "Ogive (cumulative frequency curve): plot cumulative frequency against the upper class boundary and join with a smooth curve.", "An ogive is used to study the growth rate of data through accumulation of frequency."], "qs": [{"q": "Quantitative data can be displayed graphically using…", "o": ["only scatter of names", "histograms, frequency polygons and cumulative frequency curves", "only tally marks", "only pie charts"], "a": 1, "e": "Pie and bar charts can also be used, but histograms, polygons and ogives are the main quantitative displays."}, {"q": "In a histogram, the bars…", "o": ["touch each other, with no gaps between them", "are separated by equal spaces", "are drawn as sectors of a circle", "are replaced by dots"], "a": 0, "e": "Touching bars reflect continuous classes."}, {"q": "A histogram displays the classes on the … axis and the frequencies on the … axis.", "o": ["horizontal; vertical", "vertical; vertical", "horizontal; horizontal", "vertical; horizontal"], "a": 0, "e": "Classes go along the bottom, frequencies up the side."}, {"q": "The height of a histogram bar equals…", "o": ["the number of classes", "the class width", "the frequency (or relative frequency or percent) of the class", "the class mark"], "a": 2, "e": "The taller the bar, the more values in that class."}, {"q": "What is the main difference between a histogram and a bar chart?", "o": ["Histogram bars touch and show quantitative classes; bar chart bars are separated and show categories", "There is no difference", "A histogram uses circles; a bar chart uses lines", "A histogram is for categories; a bar chart is for classes"], "a": 0, "e": "Bar charts are for categorical data, histograms for grouped quantitative data."}, {"q": "A frequency histogram has what on the vertical axis?", "o": ["Frequencies", "Relative frequencies", "Cumulative percentages", "Class marks"], "a": 0, "e": "A relative-frequency histogram uses relative frequencies instead."}, {"q": "A relative-frequency histogram has a vertical axis running from…", "o": ["0 to the total frequency", "−1 to +1", "0 to 1", "0 to 100"], "a": 2, "e": "Relative frequencies never exceed 1."}, {"q": "Relative-frequency histograms are better for comparing two data sets because…", "o": ["they do not need a title", "the same vertical scale (0 to 1) is used for both, making direct comparison easy", "they only use whole numbers", "their bars are always taller"], "a": 1, "e": "The vertical scale of a frequency histogram depends on the number of observations."}, {"q": "For single-value grouping, the bars of a histogram are labelled with…", "o": ["the distinct values, each centred under its bar", "upper class boundaries", "cumulative frequencies", "class widths"], "a": 0, "e": "Each value represents a class, so it sits under its own bar."}, {"q": "For limit grouping and cut-point grouping respectively, the book uses which values to label the bars?", "o": ["Class widths and class sizes", "Frequencies and percentages", "Cumulative frequencies and relative frequencies", "Upper-class boundaries and lower class cut-points"], "a": 3, "e": "The book states this in the introduction to histograms."}, {"q": "Step 1 of constructing a histogram is to…", "o": ["calculate the mean", "join the points with a smooth curve", "draw the bars", "organise the data into a frequency, relative frequency or percentage distribution"], "a": 3, "e": "You need the distribution before you can draw anything."}, {"q": "When drawing a histogram on graph paper, the vertical scale should be chosen so that…", "o": ["the highest bar is always exactly 1 cm", "all bars are the same height", "the bars are neither too tall nor too short, based on the highest frequency", "the scale starts at the total frequency"], "a": 2, "e": "Choose a scale that suits the highest frequency."}, {"q": "In Table 8 (test scores, n = 50), 13 students scored 35–42. The relative frequency is…", "o": ["0.13", "0.62", "0.35", "0.26"], "a": 3, "e": "13 ÷ 50 = 0.26."}, {"q": "In Table 8, which class gives the tallest histogram bar?", "o": ["43 – 50", "35 – 42", "59 – 66", "27 – 34"], "a": 1, "e": "It has the highest frequency, 13."}, {"q": "In Table 8, how many students scored 59–66?", "o": ["8", "4", "7", "2"], "a": 1, "e": "The last class has a frequency of 4 (relative frequency 0.08)."}, {"q": "The frequencies in Table 8 add up to…", "o": ["66", "13", "100", "50"], "a": 3, "e": "2 + 4 + 8 + 13 + 12 + 7 + 4 = 50."}, {"q": "What is the class mark of the class 27–34?", "o": ["30.5", "27", "31", "34"], "a": 0, "e": "(27 + 34) ÷ 2 = 30.5."}, {"q": "In a frequency polygon, a point is plotted above each … at a height equal to the class frequency.", "o": ["class boundary", "class width", "class mark", "cumulative frequency"], "a": 2, "e": "Class marks (midpoints) label the horizontal axis points."}, {"q": "The points of a frequency polygon are connected with…", "o": ["straight lines", "vertical bars", "dotted circles", "a smooth curve"], "a": 0, "e": "A smooth curve is used for the ogive, not the polygon."}, {"q": "To complete a frequency polygon, the line is extended so that the polygon…", "o": ["stops at the last class mark", "touches the horizontal axis", "crosses the vertical axis", "returns to the highest point"], "a": 1, "e": "The polygon starts and ends on the horizontal axis."}, {"q": "Another method of constructing a frequency polygon is to…", "o": ["join the corners of the bars with a smooth curve", "draw bars for cumulative frequencies", "join the midpoints of the tops of the histogram bars with straight lines", "plot upper class boundaries"], "a": 2, "e": "This uses the histogram's heights as the frequencies."}, {"q": "A cumulative frequency curve is also known as…", "o": ["an ogive", "a relative-frequency histogram", "a frequency polygon", "a scatter diagram"], "a": 0, "e": "An ogive is a line graph of cumulative frequency."}, {"q": "Cumulative frequency for an ogive is obtained by…", "o": ["subtracting the smallest frequency", "summing the frequencies of all values up to each point", "multiplying each class mark by its frequency", "dividing each frequency by the total"], "a": 1, "e": "It is the running total."}, {"q": "In an ogive, cumulative frequency is plotted on the … against the values of the variable on the …", "o": ["x-axis; x-axis", "y-axis; x-axis", "y-axis; y-axis", "x-axis; y-axis"], "a": 1, "e": "Cumulative frequency goes up the side, values along the bottom."}, {"q": "When drawing an ogive for grouped data, which value is plotted on the x-axis?", "o": ["The class width", "The lower class limit", "The upper boundary of each class", "The class mark"], "a": 2, "e": "Cumulative frequency is reached only once the whole class has been counted."}, {"q": "The points of an ogive are joined with…", "o": ["a set of sectors", "straight vertical lines", "separated bars", "a smooth curve"], "a": 3, "e": "The book says to join the points with a smooth curve."}, {"q": "An ogive is used to study…", "o": ["the correlation between two variables", "the growth rate of data, through the accumulation of frequency", "the most common category", "the spread of the middle 50%"], "a": 1, "e": "It shows how frequency accumulates."}, {"q": "In Table 9 (age of counsellees, n = 50), the frequencies for ages 10 to 14 are 3, 10, 8, 7 and 5. The cumulative frequency at age 14 is…", "o": ["38", "33", "28", "5"], "a": 1, "e": "3 + 10 + 8 + 7 + 5 = 33."}, {"q": "In the inpatient age table (total 674), the cumulative frequency at 30–39 is 252. The cumulative relative frequency is about…", "o": ["0.156", "0.426", "0.374", "0.252"], "a": 2, "e": "252 ÷ 674 ≈ 0.374."}, {"q": "In Table 8 (test scores), how many students scored 43–50?", "o": ["13", "7", "12", "14"], "a": 2, "e": "The class 43–50 has a frequency of 12 (relative frequency 0.24)."}]}, {"id": "mode", "icon": "🎯", "title": "Measures of Central Location: Mode", "tag": "The most popular value", "note": "Mode is the friendly one, Priscy. It just asks who shows up the most. The grouped-data formula is the only tricky part 💫", "summary": ["Three measures of central location: mode, median, mean. Mean and median need quantitative data; mode works for both types.", "Mode = most frequent value. Unimodal (one mode), bimodal (two modes), no mode if all frequencies are equal.", "Grouped data: the mode lies in the modal class (highest frequency).", "Mode = L1 + [Δ1 ÷ (Δ1 + Δ2)] × c.", "Δ1 = modal freq − preceding freq. Δ2 = modal freq − next freq. c = class size."], "qs": [{"q": "The three most important measures of central location are…", "o": ["mode, median and mean", "mode, range and quartile", "range, variance and mean", "median, standard deviation and mean"], "a": 0, "e": "Range and variance are measures of dispersion."}, {"q": "Which measure of central location can be used for both quantitative and categorical data?", "o": ["Both mean and median", "Median", "Mean", "Mode"], "a": 3, "e": "Mean and median apply only to quantitative data."}, {"q": "Measures of central location refer to…", "o": ["how spread out the data are", "the difference between the extremes", "the centre or most typical value of a data set", "the shape of the histogram"], "a": 2, "e": "They represent a value around which most of the data cluster."}, {"q": "The mode is…", "o": ["the most frequently occurring observation in a data set", "the middle value of the ordered data", "the difference between highest and lowest", "the sum of the values divided by n"], "a": 0, "e": "Mishra et al. (2019) define it as the most frequent observation."}, {"q": "A unimodal distribution is one in which…", "o": ["two values share the highest frequency", "no value is repeated", "one value has the highest frequency", "all values have equal frequency"], "a": 2, "e": "Uni = one."}, {"q": "A bimodal distribution is one in which…", "o": ["there are exactly two observations", "every value occurs once", "one value has the highest frequency", "two values have the same highest frequency"], "a": 3, "e": "Bi = two."}, {"q": "If every value in a distribution occurs the same number of times, then…", "o": ["the mode is the first value", "there is no mode", "the distribution is unimodal", "the mode is the mean"], "a": 1, "e": "No value stands out as most frequent."}, {"q": "In the causes-of-death data (Table 10), hypertension occurred 9 times among 21 deaths, more than any other cause. The mode is…", "o": ["hypertension", "anaemia", "septicaemia", "malaria"], "a": 0, "e": "Malaria had 5, anaemia 3, diabetes 2 and septicaemia 2."}, {"q": "What does the mode 'hypertension' tell us about that hospital?", "o": ["Hypertension was the leading cause of death among hospitalised patients that year", "All patients had hypertension", "Hypertension was the rarest cause of death", "Hypertension caused half of all admissions"], "a": 0, "e": "The mode is interpreted as the most common category."}, {"q": "The salaries of casual employees include GHC300 seven times, GHC400 twice, GHC450 twice, and GHC800, GHC940 and GHC1050 once each. The mode is…", "o": ["GHC400", "GHC300", "GHC450", "GHC940"], "a": 1, "e": "GHC300 has the greatest frequency (7)."}, {"q": "In the hospital-bill data, GHC580 occurs 8 times; every other value occurs once or twice. The mode is…", "o": ["GHC330", "GHC580", "GHC980", "GHC300"], "a": 1, "e": "It is the only value with the highest frequency."}, {"q": "The interpretation of a mode of GHC580 for hospital bills is that…", "o": ["a greater percentage of patients paid GHC580 than any other amount", "GHC580 is the lowest bill", "everyone paid GHC580", "GHC580 is the average bill"], "a": 0, "e": "The mode is the most common value, not the average."}, {"q": "For grouped data, the mode lies within…", "o": ["the median class", "the first class", "the modal class", "the class with the lowest frequency"], "a": 2, "e": "The modal class is the class with the highest frequency."}, {"q": "The modal class is…", "o": ["the class with the highest class mark", "the class with the highest frequency", "the middle class", "the widest class"], "a": 1, "e": "It is found by inspecting the frequency column."}, {"q": "Ages 5–9, 10–14, 15–19, 20–24 and 25–29 have frequencies 3, 4, 6, 2 and 5. The modal class is…", "o": ["15 – 19", "25 – 29", "10 – 14", "5 – 9"], "a": 0, "e": "6 is the highest frequency."}, {"q": "In Mo = L1 + [Δ1 ÷ (Δ1 + Δ2)] × c, L1 is…", "o": ["the total frequency", "the class mark", "the upper class limit of the modal class", "the lower class boundary of the modal class"], "a": 3, "e": "Boundaries are used, so 15–19 gives L1 = 14.5."}, {"q": "In the modal formula, Δ1 is…", "o": ["the class size", "the frequency of the modal class minus the frequency of the preceding (lower) class", "the frequency of the modal class minus the next higher class", "the total frequency"], "a": 1, "e": "Δ2 uses the next higher class instead."}, {"q": "In the modal formula, Δ2 is…", "o": ["the cumulative frequency", "the frequency of the modal class minus the preceding class", "the frequency of the modal class minus the frequency of the next higher class", "the class boundary"], "a": 2, "e": "Δ1 and Δ2 compare the modal class with its two neighbours."}, {"q": "In the modal formula, c stands for…", "o": ["the count of classes", "the class size or width", "the class mark", "the cumulative frequency"], "a": 1, "e": "It scales the fraction back to the units of the data."}, {"q": "In Table 13 (age distribution), the modal class 30–35 has frequency 24. What is L1?", "o": ["29.5", "24", "30", "35.5"], "a": 0, "e": "30 − 0.5 = 29.5."}, {"q": "In the same example, the neighbouring frequencies are 2 (before) and 20 (after). Δ1 and Δ2 are…", "o": ["22 and 20", "22 and 4", "24 and 20", "2 and 4"], "a": 1, "e": "Δ1 = 24 − 2 = 22 and Δ2 = 24 − 20 = 4."}, {"q": "In Table 13, the class size c = 35.5 − 29.5 =…", "o": ["6", "5", "35.5", "7"], "a": 0, "e": "Boundaries 29.5 to 35.5 give a class size of 6."}, {"q": "Using L1 = 29.5, Δ1 = 22, Δ2 = 4 and c = 6, the mode is…", "o": ["33.4", "29.5", "34.58", "35.5"], "a": 2, "e": "29.5 + (22 ÷ 26) × 6 = 29.5 + 5.077 = 34.58."}, {"q": "A mode of 34.58 years in that example means…", "o": ["34.58 years is the commonest age among the sample", "34.58 years is the middle age", "34.58 years is the oldest age", "34.58 years is the average age"], "a": 0, "e": "The mode describes the commonest value."}, {"q": "What is the mode of 3, 5, 5, 7, 8, 5, 9?", "o": ["3", "7", "5", "8"], "a": 2, "e": "5 appears three times and every other value appears once."}, {"q": "The data set 2, 2, 4, 4, 6 is…", "o": ["unimodal, with mode 4", "without a mode", "bimodal, with modes 2 and 4", "unimodal, with mode 2"], "a": 2, "e": "2 and 4 both appear twice."}, {"q": "For the data 10, 12, 14 (each appearing once), the mode is…", "o": ["14", "10", "no mode exists", "12"], "a": 2, "e": "Every value has the same frequency."}, {"q": "The data 112, 118, 110, 122, 107, 117, 116, 120, 100, 105, 114, 112, 119, 115, 116 have modes…", "o": ["112 and 116", "116 only", "112 only", "no mode"], "a": 0, "e": "Both 112 and 116 occur twice; all others once."}, {"q": "A modal class 20–24 has frequency 12. The class before it has frequency 8 and the class after it has frequency 5 (L1 = 19.5, c = 5). The mode is…", "o": ["24.5", "19.5", "21.32", "23.5"], "a": 2, "e": "Δ1 = 4, Δ2 = 7, so mode = 19.5 + (4 ÷ 11) × 5 = 21.32."}, {"q": "To find the mode from a histogram, the last step is to…", "o": ["read the height of the tallest bar", "draw a vertical line through the intersection of the two diagonals to meet the x-axis, where the mode is located", "join all bar tops with a smooth curve", "add up all the bar heights"], "a": 1, "e": "The modal class bar is crossed by two diagonals; their intersection gives the mode."}]}, {"id": "median", "icon": "⚖️", "title": "Measures of Central Location: Median", "tag": "The middle of the road", "note": "Sort first, then find the middle. That's the whole secret of the median, Priscy. You're already good at this 🌷", "summary": ["Median = middle value of ordered data; it splits the distribution into two equal halves.", "Ungrouped: position = (n + 1) ÷ 2. Odd n → middle value. Even n → mean of the two middle values.", "Grouped: median position = N ÷ 2, found from the cumulative frequency column. That gives the median class.", "Median = L1 + [(n/2 − Σf) ÷ f(med)] × c.", "L1 = lower boundary of the median class. Σf = cumulative frequency before the median class. c = class size."], "qs": [{"q": "The median is…", "o": ["the difference between the highest and lowest values", "the middle value of a data set arranged in ascending or descending order", "the most frequent value", "the sum of the values divided by n"], "a": 1, "e": "Mishra et al. (2019): it divides the data into two equal halves."}, {"q": "The term 'array' describes…", "o": ["a data set arranged in ascending or descending order", "a table of tally marks", "a group of quartiles", "a set of class limits"], "a": 0, "e": "Data must be in an array before you locate the median."}, {"q": "For n observations, the median position of ungrouped data is…", "o": ["n ÷ 2", "n + 2", "(n + 1) ÷ 2", "(n − 1) ÷ 2"], "a": 2, "e": "For grouped data, N ÷ 2 is used instead."}, {"q": "The first step in finding the median of ungrouped data is to…", "o": ["add all the values", "tally the values", "find the largest value", "arrange the data in ascending or descending order"], "a": 3, "e": "Then find the median position and count to it."}, {"q": "If the number of observations is odd, the median is…", "o": ["the most frequent value", "the mean of the whole data set", "the middle value of the array", "the mean of the two middle values"], "a": 2, "e": "There is exactly one middle value."}, {"q": "If the number of observations is even, the median is…", "o": ["the mode of the data", "the mean of the two middle values", "the larger of the two middle values", "the smaller of the two middle values"], "a": 1, "e": "There are two middle values, so we average them."}, {"q": "Temperature data set A has 9 observations. The median position is…", "o": ["9th", "4th", "5th", "4.5th"], "a": 2, "e": "(9 + 1) ÷ 2 = 5th."}, {"q": "Ordered data set A is 36.1, 36.3, 36.8, 37, 37.1, 37.3, 37.4, 38, 39.4. The median is…", "o": ["37.4", "37", "37.1", "37.3"], "a": 2, "e": "The 5th value is 37.1."}, {"q": "Temperature data set B has 12 observations. The median position is…", "o": ["12th", "6.5th", "6th", "7th"], "a": 1, "e": "(12 + 1) ÷ 2 = 6.5th, halfway between the 6th and 7th values."}, {"q": "In data set B, the 6th and 7th ordered values are 37.1 and 37.2. The median is…", "o": ["37.3", "37.15", "37.2", "37.1"], "a": 1, "e": "(37.1 + 37.2) ÷ 2 = 37.15."}, {"q": "What is the median of 5, 8, 3, 9, 7?", "o": ["7", "5", "8", "6.4"], "a": 0, "e": "Ordered: 3, 5, 7, 8, 9. The 3rd value is 7."}, {"q": "What is the median of 12, 15, 11, 20?", "o": ["13.5", "14.5", "12", "15"], "a": 0, "e": "Ordered: 11, 12, 15, 20. (12 + 15) ÷ 2 = 13.5."}, {"q": "For n = 25 ungrouped observations, the median is at which position?", "o": ["13th", "12.5th", "12th", "25th"], "a": 0, "e": "(25 + 1) ÷ 2 = 13."}, {"q": "For n = 40 ungrouped observations, the median position is…", "o": ["40th", "20.5th", "20th", "21st"], "a": 1, "e": "(40 + 1) ÷ 2 = 20.5, between the 20th and 21st values."}, {"q": "What is the median of 112, 118, 110, 122, 107, 117, 116, 120, 100, 105, 114, 112, 119, 115, 116?", "o": ["116", "114", "115", "112"], "a": 2, "e": "Ordered, the 8th of 15 values is 115."}, {"q": "What is the median of 10, 12, 11, 18, 17, 17, 16, 12, 10, 15, 14, 11?", "o": ["13", "14", "12", "12.5"], "a": 0, "e": "Ordered: 10, 10, 11, 11, 12, 12, 14, 15, 16, 17, 17, 18. The 6th and 7th values are 12 and 14, so the median is 13."}, {"q": "The median of grouped data lies within…", "o": ["the first class", "the modal class", "the median class", "the last class"], "a": 2, "e": "Locate it using the median position N ÷ 2."}, {"q": "For grouped data, the median position is…", "o": ["N ÷ 2", "(N + 1) ÷ 4", "3N ÷ 4", "N ÷ 4"], "a": 0, "e": "N is the total frequency."}, {"q": "The median class is found by…", "o": ["choosing the class with the highest frequency", "choosing the class with the highest class mark", "locating in the cumulative frequency column the number equal to N/2, or the smallest number greater than it", "choosing the middle class by count of classes"], "a": 2, "e": "That is the class where the running total first reaches N/2."}, {"q": "In Median = L1 + [(n/2 − Σf) ÷ f(med)] × c, Σf is…", "o": ["the frequency of the median class", "the total frequency", "the sum of frequencies (cumulative frequency) before the median class", "the class size"], "a": 2, "e": "Σf = cf up to but not including the median class."}, {"q": "In the median formula, L1 is…", "o": ["the upper class limit of the median class", "the lower class boundary of the median class", "the class mark of the median class", "the smallest value in the data"], "a": 1, "e": "For 31–35, L1 = 30.5."}, {"q": "In Example One (classes 16–20 to 46–50, N = 50), the median position is…", "o": ["25th", "12.5th", "50th", "26th"], "a": 0, "e": "50 ÷ 2 = 25."}, {"q": "In Example One, the cumulative frequencies are 3, 10, 18, 30, 40, 46, 50. The median class is…", "o": ["21 – 25", "31 – 35", "26 – 30", "36 – 40"], "a": 1, "e": "30 is the smallest cumulative frequency that is at least 25, and it belongs to 31–35."}, {"q": "In Example One, the values for the median formula are…", "o": ["L1 = 31, Σf = 18, f(med) = 12, c = 5", "L1 = 30.5, Σf = 18, f(med) = 10, c = 5", "L1 = 30.5, Σf = 30, f(med) = 12, c = 5", "L1 = 30.5, Σf = 18, f(med) = 12, c = 5"], "a": 3, "e": "Σf is the cumulative frequency before the class (18), not the one at the class (30)."}, {"q": "The median of Example One is…", "o": ["33.42", "30.5", "36.42", "35"], "a": 0, "e": "30.5 + [(25 − 18) ÷ 12] × 5 = 30.5 + 2.917 = 33.42."}, {"q": "In Example Two the total frequency N is 60. The median position is…", "o": ["60th", "15th", "31st", "30th"], "a": 3, "e": "60 ÷ 2 = 30."}, {"q": "In Example Two (ages), the cumulative frequencies are 6, 8, 32, 52, 55, 57, 60. The median class is…", "o": ["36 – 41", "18 – 23", "24 – 29", "30 – 35"], "a": 3, "e": "32 is the smallest cumulative frequency that is at least 30."}, {"q": "In Example Two, L1 = 29.5, Σf = 8, f(med) = 24 and c = 6. The median is…", "o": ["35.5", "35.0", "34.0", "29.5"], "a": 1, "e": "29.5 + [(30 − 8) ÷ 24] × 6 = 29.5 + 5.5 = 35.0."}, {"q": "A median class has L1 = 39.5, N = 100, cumulative frequency before it = 38, f(med) = 24, c = 10. The median is…", "o": ["44.5", "49.5", "46", "39.5"], "a": 0, "e": "39.5 + [(50 − 38) ÷ 24] × 10 = 39.5 + 5 = 44.5."}, {"q": "The median divides a distribution into…", "o": ["two equal halves", "ten equal parts", "three equal parts", "four equal parts"], "a": 0, "e": "Half of the values lie below the median and half above it."}]}, {"id": "mean", "icon": "🧁", "title": "Measures of Central Location: Mean", "tag": "Long method, short method", "note": "Add it all up, share it out equally. The mean is your everyday average, and the assumed-mean shortcut is a real time-saver, Priscy ✨", "summary": ["Mean = Σx ÷ n. It is sensitive to extreme values (its main disadvantage).", "Grouped data (weighted mean): multiply each class mark by its frequency, sum, then divide. Mean = Σfx ÷ n.", "Short method (assumed mean, A): d = x − A, then Mean = A + Σfd ÷ Σf.", "Choose A as one of the class marks; the answer does not depend on which one you choose.", "Mean and median apply only to quantitative data."], "qs": [{"q": "The arithmetic mean is commonly denoted by the symbol…", "o": ["x̄", "σ", "Q1", "Mo"], "a": 0, "e": "σ is the standard deviation and Q1 is the first quartile."}, {"q": "The mean is calculated by…", "o": ["subtracting the smallest from the largest", "picking the most frequent value", "summing all the values and dividing by the number of observations", "arranging the values and picking the middle"], "a": 2, "e": "Mean = Σx ÷ n."}, {"q": "A disadvantage of the mean is that it is…", "o": ["always equal to the mode", "impossible to calculate", "sensitive to extreme values", "only usable with categorical data"], "a": 2, "e": "One very large or very small value can pull the mean far from the typical value."}, {"q": "For ungrouped data, the mean formula is…", "o": ["x̄ = maximum − minimum", "x̄ = (n + 1) ÷ 2", "x̄ = Σfx ÷ Σf²", "x̄ = Σx ÷ n"], "a": 3, "e": "Σx is the sum of all values in the data set and n is the number of cases."}, {"q": "The systolic blood pressure of five inpatients is 120, 80, 90, 110 and 95 mmHg. The mean is…", "o": ["100 mmHg", "90 mmHg", "99 mmHg", "95 mmHg"], "a": 2, "e": "(120 + 80 + 90 + 110 + 95) ÷ 5 = 495 ÷ 5 = 99 mmHg."}, {"q": "What is the mean of 4, 8, 12 and 16?", "o": ["40", "8", "10", "12"], "a": 2, "e": "(4 + 8 + 12 + 16) ÷ 4 = 40 ÷ 4 = 10."}, {"q": "Six values add up to 54. Their mean is…", "o": ["324", "54", "9", "6"], "a": 2, "e": "54 ÷ 6 = 9."}, {"q": "The arithmetic mean of grouped data is called the…", "o": ["median mean", "weighted mean", "cumulative mean", "modal mean"], "a": 1, "e": "Each class mark is weighted by its frequency."}, {"q": "The two approaches to calculating the mean of grouped data are…", "o": ["the long method and the short method", "the modal and median methods", "the pie and bar methods", "the class and cut-point methods"], "a": 0, "e": "The short method is the assumed mean method."}, {"q": "In the long method, you first…", "o": ["find the cumulative frequency", "square each frequency", "subtract the assumed mean from each class mark", "multiply each class mark by its frequency"], "a": 3, "e": "That gives the fx column."}, {"q": "The long-method formula for the mean of grouped data is…", "o": ["x̄ = Σf ÷ Σfx", "x̄ = Σfx ÷ Σf", "x̄ = L1 + (Δ1 ÷ Δ2)c", "x̄ = A + Σfd ÷ Σf"], "a": 1, "e": "The second option is the short method; the third is the modal formula."}, {"q": "In the TB weight table, the class 10–19 has class mark 14.5 and frequency 18. Its fx is…", "o": ["261", "32.5", "18", "14.5"], "a": 0, "e": "14.5 × 18 = 261."}, {"q": "In the TB weight table, the class 60–69 has class mark 64.5 and frequency 22. Its fx is…", "o": ["1419.5", "1419", "1380", "1290"], "a": 1, "e": "64.5 × 22 = 1419."}, {"q": "In the TB weight example, Σfx = 3920 and n = 100. The mean weight is…", "o": ["392 kg", "40 kg", "3.92 kg", "39.2 kg"], "a": 3, "e": "3920 ÷ 100 = 39.2."}, {"q": "In the ages example (18–23 to 54–59), Σfx = 2400 and n = 60. The mean age is…", "o": ["38.5 years", "24 years", "60 years", "40 years"], "a": 3, "e": "2400 ÷ 60 = 40."}, {"q": "The class mark of the class 18–23 is…", "o": ["23", "20.5", "21", "18"], "a": 1, "e": "(18 + 23) ÷ 2 = 20.5."}, {"q": "The short method of calculating the mean is also called…", "o": ["the range method", "the assumed mean method", "the cumulative method", "the modal method"], "a": 1, "e": "It uses a guessed mean and the deviations from it."}, {"q": "In the assumed mean method, the deviation d is…", "o": ["x ÷ A", "x + A", "A − x", "x − A"], "a": 3, "e": "The assumed mean is subtracted from each class mark."}, {"q": "The assumed mean A is…", "o": ["the total frequency", "the highest class mark", "a reasonable guess of the mean, taken as one of the class marks", "always zero"], "a": 2, "e": "A class mark near the middle keeps the numbers small."}, {"q": "The short-method formula for the mean is…", "o": ["x̄ = A + Σfd ÷ Σf", "x̄ = Σd ÷ A", "x̄ = Σfx ÷ A", "x̄ = A − Σfd ÷ Σf²"], "a": 0, "e": "Add the average deviation back to the assumed mean."}, {"q": "With A = 38.5, the deviation for the class 18–23 (class mark 20.5) is…", "o": ["−20.5", "−18", "38.5", "18"], "a": 1, "e": "20.5 − 38.5 = −18."}, {"q": "In the assumed mean example, the class 42–47 has class mark 44.5, d = 6 and frequency 23. Its fd is…", "o": ["138", "6", "267", "44.5"], "a": 0, "e": "6 × 23 = 138."}, {"q": "In that example, A = 38.5, Σfd = 186 and Σf = 75. The mean is…", "o": ["41.5 kg", "40.98 kg", "38.5 kg", "2.48 kg"], "a": 1, "e": "38.5 + 186 ÷ 75 = 38.5 + 2.48 = 40.98."}, {"q": "If the assumed mean chosen happens to equal the true mean, Σfd will be…", "o": ["zero", "equal to n", "negative", "equal to Σf"], "a": 0, "e": "Deviations above and below the mean cancel out."}, {"q": "What is the mean of 5, 7, 9, 11, 11, 12, 12, 12, 14, 22, 15 (to 2 decimal places)?", "o": ["12", "11", "11.82", "13"], "a": 2, "e": "The sum is 130 and n = 11, so 130 ÷ 11 = 11.82."}, {"q": "Twelve adolescents weigh 40, 33, 45, 44, 38, 49, 42, 31, 35, 28, 35 and 30 kg. Their mean weight is…", "o": ["45 kg", "38 kg", "37.5 kg", "35 kg"], "a": 2, "e": "The sum is 450, and 450 ÷ 12 = 37.5."}, {"q": "The mean of the distribution 50, 2x, 40, 46, 42, 52 is 45. The value of x is…", "o": ["45", "20", "40", "25"], "a": 1, "e": "Sum = 6 × 45 = 270. 50 + 40 + 46 + 42 + 52 = 230, so 2x = 40 and x = 20."}, {"q": "Classes 0–9, 10–19 and 20–29 have frequencies 5, 10 and 5. The mean is…", "o": ["10", "15", "19.5", "14.5"], "a": 3, "e": "Class marks 4.5, 14.5, 24.5. Σfx = 22.5 + 145 + 122.5 = 290. 290 ÷ 20 = 14.5."}, {"q": "Adding 5 to every value in a data set will…", "o": ["double the mean", "leave the mean unchanged", "increase the mean by 5", "have no effect on any measure"], "a": 2, "e": "Every value moves up by 5, so their average also moves up by 5."}, {"q": "The mean and median apply only to…", "o": ["categorical data", "ordinal data only", "nominal data", "quantitative data"], "a": 3, "e": "They need numeric values; only the mode works for categorical data."}]}, {"id": "dispersion1", "icon": "📏", "title": "Range, Quartiles & Quartile Deviation", "tag": "How spread out is the data?", "note": "Now you're measuring the spread, Priscy. Quartiles look scary but they're just medians of halves 🌼", "summary": ["Measures of dispersion (variation) describe how spread out values are around the centre.", "Range = maximum − minimum. Grouped: upper limit of highest class − lower limit of lowest class.", "IQR = Q3 − Q1. Position of Q1 = (n + 1) ÷ 4; position of Q3 = 3(n + 1) ÷ 4.", "Grouped: Q1 = LQ1 + [(N/4 − cf) ÷ fQ1] × c and Q3 = LQ3 + [(3N
