/4 − cf) ÷ fQ3] × c.", "Quartile deviation (semi-interquartile range) = (Q3 − Q1) ÷ 2."], "qs": [{"q": "Measures of dispersion describe…", "o": ["how spread out the values in a data set are around the centre", "the middle value", "the most typical value", "the most frequent value"], "a": 0, "e": "They show how the values are scattered."}, {"q": "Another name for measures of dispersion is…", "o": ["measures of location", "measures of central tendency", "measures of variation", "measures of frequency"], "a": 2, "e": "Central location and central tendency are the same thing, and are different from dispersion."}, {"q": "Which of the following is a measure of dispersion?", "o": ["Interquartile range", "Median", "Mode", "Mean"], "a": 0, "e": "Mode, median and mean are measures of central location."}, {"q": "The range of a data set is…", "o": ["the mean minus the median", "the sum of the values", "the maximum value minus the minimum value", "the middle value"], "a": 2, "e": "Range = maximum value − minimum value."}, {"q": "For the data 80, 90, 95, 110 and 120, the range is…", "o": ["200", "40", "120", "30"], "a": 1, "e": "120 − 80 = 40."}, {"q": "The range is considered the least satisfactory measure of dispersion because…", "o": ["it considers only the two most extreme values", "it can only be used for categories", "it needs a computer to calculate", "it uses all values equally"], "a": 0, "e": "Values in between have no effect on it."}, {"q": "For grouped data, the range is found as…", "o": ["the highest frequency minus the lowest frequency", "the lower limit of the highest class minus the upper limit of the lowest class", "the class mark of the highest class minus the mean", "the upper limit of the highest class minus the lower limit of the lowest class"], "a": 3, "e": "It uses the extreme limits of the table."}, {"q": "The blood sugar table has classes 3–5, 6–8, 9–12, 13–15, 16–18 and 19–21. The range is…", "o": ["21", "18", "16", "19"], "a": 1, "e": "21 − 3 = 18."}, {"q": "The quartile deviation is also known as the…", "o": ["semi-interquartile range", "variance", "mean deviation", "coefficient of variation"], "a": 0, "e": "It is half the interquartile range."}, {"q": "Quartiles are values that divide a data set into…", "o": ["ten equal parts", "three equal parts", "two equal parts", "four equal parts"], "a": 3, "e": "The median divides it into two."}, {"q": "How many quartiles are there when a distribution is divided into four equal parts?", "o": ["Two", "Four", "Five", "Three"], "a": 3, "e": "Q1, Q2 and Q3 mark the three cuts."}, {"q": "The interquartile range (IQR) is…", "o": ["Q3 ÷ Q1", "Q1 − Q3", "Q3 + Q1", "Q3 − Q1"], "a": 3, "e": "It is the difference between the third and first quartiles."}, {"q": "The first quartile (Q1) is the value below which…", "o": ["10% of the values lie", "75% of the values lie", "50% of the values lie", "25% of the values lie"], "a": 3, "e": "Q1 marks the 25% point."}, {"q": "Which percentage of the values in a distribution lies below the third quartile (Q3)?", "o": ["25%", "75%", "50%", "100%"], "a": 1, "e": "Q3 marks the 75% point."}, {"q": "The quartile deviation formula is…", "o": ["QD = (Q3 + Q1) ÷ 2", "QD = (Q3 − Q1) ÷ 2", "QD = Q3 ÷ Q1", "QD = Q3 − Q1"], "a": 1, "e": "It is half the difference between the upper and lower quartiles."}, {"q": "When finding the IQR of ungrouped data by the halves method, Q1 is…", "o": ["the smallest value", "the median of the whole data set", "the mean of the whole data set", "the median of the first (lower) half of the ordered data"], "a": 3, "e": "Q3 is the median of the second half."}, {"q": "For ungrouped data, the position of Q1 is…", "o": ["3(n + 1) ÷ 4", "(n + 1) ÷ 2", "n ÷ 4 + 1", "(n + 1) ÷ 4"], "a": 3, "e": "Q3 uses 3(n + 1) ÷ 4."}, {"q": "For ungrouped data, the position of Q3 is…", "o": ["(n + 1) ÷ 4", "(n + 1) ÷ 2", "3n ÷ 2", "3(n + 1) ÷ 4"], "a": 3, "e": "Values must first be arranged in ascending order."}, {"q": "Ordered data: 9, 10, 11, 12, 13, 14, 15, 16, 17, 19. Q1 = 11 and Q3 = 16. The IQR is…", "o": ["10", "3", "8", "5"], "a": 3, "e": "16 − 11 = 5."}, {"q": "In that data set (n = 10), Q1 position = 2.75. Which value is taken as Q1?", "o": ["The 3rd value, 11", "The value 11.75", "The 4th value, 12", "The 2nd value, 10"], "a": 0, "e": "The book rounds 2.75 to the 3rd position, giving 11."}, {"q": "The ordered weights 28, 30, 32, 35, 38, 42, 45 have Q1 = 30 and Q3 = 42. The IQR is…", "o": ["12", "10", "7", "15"], "a": 0, "e": "42 − 30 = 12."}, {"q": "For n = 7, the Q3 position is…", "o": ["7th", "6th", "6.5th", "5th"], "a": 1, "e": "3(7 + 1) ÷ 4 = 6."}, {"q": "For the ordered data 3, 5, 6, 8, 10, 12, 15, 17, 20, 22, 25 (n = 11), the IQR is…", "o": ["17", "14", "22", "10"], "a": 1, "e": "Q1 is the 3rd value (6) and Q3 is the 9th value (20). 20 − 6 = 14."}, {"q": "For n = 15, the position of Q3 is…", "o": ["11.25th", "11th", "12th", "13th"], "a": 2, "e": "3(15 + 1) ÷ 4 = 12."}, {"q": "For grouped data, the first quartile class is located at which position?", "o": ["N ÷ 2", "3N ÷ 4", "N ÷ 4", "N + 1"], "a": 2, "e": "The third quartile class is at 3N ÷ 4."}, {"q": "For grouped data, the third quartile class is located at which position?", "o": ["3N ÷ 4", "N ÷ 4", "N ÷ 2", "3N ÷ 2"], "a": 0, "e": "It is found from the cumulative frequency column."}, {"q": "In the age distribution example, N = 60. The Q1 position is…", "o": ["30th", "15th", "45th", "60th"], "a": 1, "e": "60 ÷ 4 = 15, and the cumulative frequency 32 puts Q1 in class 30–35."}, {"q": "In the book's example, LQ1 = 30, N = 60, cf = 8, fQ1 = 24 and c = 6. Q1 is…", "o": ["35.5", "30", "31.75", "32.5"], "a": 2, "e": "30 + [(15 − 8) ÷ 24] × 6 = 30 + 1.75 = 31.75."}, {"q": "In the book's example, Q3 = 36 + [(45 − 32) ÷ 20] × 6 equals…", "o": ["41.85", "45", "36", "39.90"], "a": 3, "e": "13 ÷ 20 = 0.65, and 0.65 × 6 = 3.9, so 36 + 3.9 = 39.90."}, {"q": "If the IQR is 8.15, the quartile deviation is…", "o": ["16.3", "4.08", "2.04", "8.15"], "a": 1, "e": "8.15 ÷ 2 = 4.075, which is about 4.08."}]}, {"id": "sd", "icon": "🌊", "title": "Standard Deviation & Variance", "tag": "The strongest measure of spread", "note": "This is the big one, Priscy. Take it slow, do the table row by row, and trust your arithmetic. I believe in you 💕", "summary": ["Standard deviation (SD) = square root of the variance. Variance = mean of the squared deviations from the mean.", "Deviation = X − x̄. Ungrouped: s = √[Σ(X − x̄)² ÷ n] or s = √[ΣX²/n − x̄²].", "Grouped: s = √[Σf(x − x̄)² ÷ n] or s = √[Σfx²/n − (Σfx/n)²].", "Large SD = values far from the mean; small SD = values close to the mean.", "Steps: mean → deviations → square → sum → divide by n → square root for SD."], "qs": [{"q": "The standard deviation is…", "o": ["the square root of the variance", "the same as the range", "the square of the variance", "the difference between Q3 and Q1"], "a": 0, "e": "Variance is the square of the standard deviation."}, {"q": "The variance is…", "o": ["the middle value of the data", "the most frequent value", "the difference between the maximum and minimum", "the mean square of the deviations of the observations from the mean"], "a": 3, "e": "It is the average of the squared deviations."}, {"q": "The standard deviation indicates…", "o": ["the total of all values", "which value occurs most", "the middle of the distribution", "how far, on average, the values are from the mean"], "a": 3, "e": "It measures variation around the mean."}, {"q": "A large standard deviation means that…", "o": ["the mean is zero", "the values, on average, are far from the mean", "there is no variation", "the values are all close to the mean"], "a": 1, "e": "A large SD indicates a large amount of variation."}, {"q": "A small standard deviation means that…", "o": ["the observations are, on average, close to the mean", "the data has many outliers", "the data has no mean", "the observations are far from the mean"], "a": 0, "e": "A small SD indicates a small amount of variation."}, {"q": "The deviation of a value X from the mean is…", "o": ["X + x̄", "x̄ − X²", "X ÷ x̄", "X − x̄"], "a": 3, "e": "It is how far the value is from the mean."}, {"q": "The standard deviation formula for ungrouped data (as in the book) is…", "o": ["s = Σ(X − x̄)² ÷ n", "s = √[Σ(X − x̄) ÷ n]", "s = √[Σ(X − x̄)² ÷ n]", "s = √[ΣX × n]"], "a": 2, "e": "Square the deviations, sum them, divide by n, then take the square root."}, {"q": "After finding the deviations from the mean, the next step is to…", "o": ["find the median", "find the range", "square the deviations", "add the deviations"], "a": 2, "e": "Then sum, divide and take the square root."}, {"q": "The last step in calculating the standard deviation is to…", "o": ["find the square root of the result", "take the median", "multiply by n", "divide by the range"], "a": 0, "e": "The result before the square root is the variance."}, {"q": "For the data 48, 51, 50, 47, the mean is…", "o": ["196", "48", "49", "50"], "a": 2, "e": "(48 + 51 + 50 + 47) ÷ 4 = 196 ÷ 4 = 49."}, {"q": "For the data 48, 51, 50, 47 (mean 49), Σ(X − x̄)² = …", "o": ["196", "4", "10", "0"], "a": 2, "e": "Squared deviations: 1, 4, 1, 4 → 10."}, {"q": "For 48, 51, 50, 47, the variance is…", "o": ["1.58", "4", "10", "2.5"], "a": 3, "e": "10 ÷ 4 = 2.5."}, {"q": "For 48, 51, 50, 47, the standard deviation is…", "o": ["1.58", "2.5", "0.79", "10"], "a": 0, "e": "√2.5 = 1.58."}, {"q": "An alternative ungrouped SD formula is…", "o": ["s = √[ΣX − x̄]", "s = √[ΣX² × x̄²]", "s = ΣX² ÷ x̄", "s = √[ΣX²/n − x̄²]"], "a": 3, "e": "It is the mean of the squares minus the square of the mean."}, {"q": "For 48, 51, 50, 47, ΣX² = 9614, n = 4 and x̄ = 49. ΣX²/n − x̄² =", "o": ["2403.5", "10", "1.58", "2.5"], "a": 3, "e": "9614 ÷ 4 = 2403.5, and 2403.5 − 2401 = 2.5 (the variance)."}, {"q": "The standard deviation of 2, 4, 4, 4, 5, 5, 7, 9 is…", "o": ["1.5", "2", "5", "4"], "a": 1, "e": "Mean = 5. Squared deviations sum to 32. 32 ÷ 8 = 4, and √4 = 2."}, {"q": "For the data 2, 4, 3, 5, 6, the SD is (to 2 decimal places)…", "o": ["2", "1", "1.41", "1.58"], "a": 2, "e": "Mean 4. Squared deviations: 4, 0, 1, 1, 4 = 10. 10 ÷ 5 = 2, and √2 = 1.41."}, {"q": "For the data 12, 15, 19, 22, 25, 27, the variance is…", "o": ["168", "28", "20", "5.29"], "a": 1, "e": "Mean = 20. Squared deviations sum to 168. 168 ÷ 6 = 28."}, {"q": "For the data 12, 15, 19, 22, 25, 27, the SD is…", "o": ["4.58", "5.29", "28", "6.5"], "a": 1, "e": "√28 = 5.29."}, {"q": "For the data 5, 8, 11, 10, 12, 14, the variance is (to 2 decimal places)…", "o": ["10", "8.33", "2.89", "50"], "a": 1, "e": "Mean = 10. Squared deviations sum to 50. 50 ÷ 6 = 8.33."}, {"q": "For the data 5, 8, 11, 10, 12, 14, the SD is (to 2 decimal places)…", "o": ["3.5", "8.33", "2.89", "1.68"], "a": 2, "e": "√8.33 = 2.89."}, {"q": "If every value in a data set is identical, the standard deviation is…", "o": ["0", "undefined", "the value itself", "1"], "a": 0, "e": "Every deviation from the mean is zero."}, {"q": "If the variance of a data set is 49, the standard deviation is…", "o": ["24.5", "49", "7", "2401"], "a": 2, "e": "√49 = 7."}, {"q": "If the standard deviation is 6, the variance is…", "o": ["12", "3", "6", "36"], "a": 3, "e": "6² = 36."}, {"q": "The SD of grouped data by the long formula is…", "o": ["s = Σf(x − x̄) ÷ n", "s = √[Σf(x − x̄)² ÷ n]", "s = √[Σfx ÷ n]", "s = √[Σf² ÷ x̄]"], "a": 1, "e": "Each squared deviation is weighted by its frequency."}, {"q": "The short formula for the SD of grouped data is…", "o": ["s = √[Σfx²/n + (Σfx/n)²]", "s = √[Σfx²/n − (Σfx/n)²]", "s = Σfx² ÷ n", "s = √[Σfx ÷ n²]"], "a": 1, "e": "It is the mean of the squares minus the square of the mean."}, {"q": "In the weight table (16–20 to 46–50), Σfx = 1665 and Σf = 50. The mean is…", "o": ["35", "50", "33.3", "16.65"], "a": 2, "e": "1665 ÷ 50 = 33.3."}, {"q": "In that table Σf(x − x̄)² = 3332.14 and n = 50. The SD is…", "o": ["8.16", "33.3", "4.08", "66.64"], "a": 0, "e": "3332.14 ÷ 50 = 66.64, and √66.64 = 8.16."}, {"q": "In the surgical ward age table, Σfx = 1620 and n = 40. The mean age is…", "o": ["44.5", "40.5", "162", "30"], "a": 1, "e": "1620 ÷ 40 = 40.5."}, {"q": "In that table ΣfX²/n = 1884.25 and (Σfx/n)² = 1640.25. The variance is…", "o": ["3524.5", "15.62", "244", "40.5"], "a": 2, "e": "1884.25 − 1640.25 = 244."}]}, {"id": "inferential", "icon": "🔬", "title": "Inferential Statistics, Z-scores & t-test", "tag": "From a sample to the whole population", "note": "You've learned to describe data. Now you learn to draw conclusions from it. That's real research power, Priscy 👑", "summary": ["Inferential statistics: estimate population parameters from sample data and test hypotheses.", "Parametric (t-test, ANOVA, linear regression, Pearson): interval/ratio data, normal populations, equal variances.", "Non-parametric (Wilcoxon, chi-square, Mann-Whitney, Kruskal-Wallis, Spearman): nominal/ordinal data, distribution-free.", "Standard normal: mean 0, SD 1. Z = (X − μ) ÷ σ.", "t = (x̄ − μ) ÷ (s/√n) with n − 1 degrees of freedom. Used for small samples (n \u003c 30)."], "qs": [{"q": "The two broad purposes of inferential statistics are…", "o": ["to collect data and to store records", "to rank data and to name categories", "to estimate population parameters from sample data and to test hypotheses", "to draw graphs and to compute tables"], "a": 2, "e": "Inferential statistics generalises results from the sample to the population."}, {"q": "Inferential statistical tests are classified as either…", "o": ["discrete or continuous", "parametric or non-parametric", "nominal or interval", "primary or secondary"], "a": 1, "e": "The two types differ in their assumptions."}, {"q": "Parametric statistics rely on testing claims about…", "o": ["tally marks", "the shape of a graph", "parameters such as the population mean (μ), standard deviation (σ) or proportion (p)", "only the median"], "a": 2, "e": "They are based on population parameters."}, {"q": "Parametric statistics require which type of data?", "o": ["Nominal data only", "Ordinal data only", "Any data at all", "Interval or ratio data"], "a": 3, "e": "Non-parametric tests can use nominal and ordinal data."}, {"q": "Parametric statistics assume that the sample data come from populations that are…", "o": ["made up of nominal categories", "skewed with unequal variances", "normally distributed and have equal variances", "of unknown shape"], "a": 2, "e": "These are the key assumptions."}, {"q": "Which of the following is a parametric test?", "o": ["t-test", "Chi-square test", "Mann-Whitney test", "Kruskal-Wallis test"], "a": 0, "e": "The other three are non-parametric."}, {"q": "Compared with the normal distribution, the t-distribution has…", "o": ["a smaller spread", "the same spread at every sample size", "a greater spread", "no spread"], "a": 2, "e": "This is one of the five properties of the t-distribution."}, {"q": "Non-parametric tests are sometimes called…", "o": ["parameter tests", "normal tests", "distribution-free tests", "interval tests"], "a": 2, "e": "They do not make assumptions about the shape of the distribution."}, {"q": "Non-parametric tests may be used with…", "o": ["ratio data only", "interval data only", "nominal and ordinal data", "no type of data"], "a": 2, "e": "They require fewer assumptions."}, {"q": "Which of the following is a non-parametric test?", "o": ["Analysis of variance (ANOVA)", "Mann-Whitney test", "Linear regression", "t-test"], "a": 1, "e": "The others are parametric."}, {"q": "Which pair consists of non-parametric procedures?", "o": ["Pearson correlation and linear regression", "ANOVA and Mann-Whitney", "t-test and ANOVA", "Chi-square and Kruskal-Wallis"], "a": 3, "e": "The book also lists Wilcoxon signed ranks, logistic regression and Spearman rank correlation."}, {"q": "A standard normal distribution has a mean and standard deviation of…", "o": ["1 and 0", "0 and 1", "0 and 0", "1 and 1"], "a": 1, "e": "It is centred at zero with a standard deviation of 1."}, {"q": "Converting each raw score in a normal distribution to a z-score is called…", "o": ["standardization", "correlation", "tabulation", "cumulation"], "a": 0, "e": "The result is a standard score."}, {"q": "The z-score formula is…", "o": ["z = (X − μ) ÷ σ", "z = (X + μ) ÷ σ", "z = X ÷ σ", "z = (μ − X) × σ"], "a": 0, "e": "Subtract the mean, then divide by the standard deviation."}, {"q": "A z-score expresses a score in terms of…", "o": ["frequencies", "percentages of the total", "class widths", "standard deviations from the mean"], "a": 3, "e": "A z of 2 is two SDs above the mean."}, {"q": "In a normal distribution the variable is denoted by X. In the standard normal distribution it is denoted by…", "o": ["S", "Y", "N", "Z"], "a": 3, "e": "Z-scores belong to the standard normal distribution."}, {"q": "Standardization allows researchers to…", "o": ["put variables measured on different scales onto the same scale", "remove outliers automatically", "convert nominal data to ratio data", "change the sample size"], "a": 0, "e": "It makes realistic comparison of scores possible."}, {"q": "X is normally distributed with a mean of 20 and SD of 10. The z-score of X = 40 is…", "o": ["−2", "0.5", "4", "2"], "a": 3, "e": "(40 − 20) ÷ 10 = 2. The score is 2 SDs above the mean."}, {"q": "A normal distribution has a mean of 50 and SD of 10. The z-score of 26 is…", "o": ["−24", "−2.4", "−0.24", "2.4"], "a": 1, "e": "(26 − 50) ÷ 10 = −2.4."}, {"q": "A z-score of −2.4 means the score is…", "o": ["2.4 points above the mean", "2.4 standard deviations below the mean", "2.4 points below the mean", "24% below the mean"], "a": 1, "e": "Negative means below the mean, and the units are standard deviations."}, {"q": "A test has a mean of 60 and SD of 8. The z-score for a mark of 76 is…", "o": ["16", "1", "8", "2"], "a": 3, "e": "(76 − 60) ÷ 8 = 2."}, {"q": "A variable has a mean of 100 and SD of 15. The z-score of 85 is…", "o": ["−15", "1", "−1", "0"], "a": 2, "e": "(85 − 100) ÷ 15 = −1."}, {"q": "Student's t-test is used to determine…", "o": ["whether there is a difference in the mean between two groups", "the range of a sample", "the mode of a data set", "the correlation between ranks"], "a": 0, "e": "It tests null hypotheses about means."}, {"q": "The t-distribution approaches the Z distribution as…", "o": ["the degrees of freedom increase", "the sample size decreases", "the mean decreases", "the variance is set to zero"], "a": 0, "e": "With large degrees of freedom the two are almost identical."}, {"q": "Student's t-test is suited to…", "o": ["small samples (n \u003c 30) from a normally distributed population", "nominal data only", "very large samples only", "populations of unknown shape only"], "a": 0, "e": "It is a method for testing null hypotheses for small samples."}, {"q": "The null hypothesis in a t-test usually states that…", "o": ["there is a large difference between the groups", "the mean is zero", "there is no significant difference between the means of two groups", "the sample size is too small"], "a": 2, "e": "The test then checks whether the data contradict this."}, {"q": "The t statistic is defined as…", "o": ["t = (μ − x̄) × s × √n", "t = s ÷ (x̄ − μ)", "t = (x̄ + μ) ÷ s", "t = (x̄ − μ) ÷ (s/√n)"], "a": 3, "e": "It divides the difference between means by the standard error of the mean."}, {"q": "The degrees of freedom for a one-sample t-test are…", "o": ["n − 1", "n", "n ÷ 2", "n + 1"], "a": 0, "e": "n − 1 makes s² an unbiased estimate of σ²."}, {"q": "The t-distribution is symmetrical with a mean of…", "o": ["zero", "the sample size", "n − 1", "one"], "a": 0, "e": "It looks like a normal curve centred at zero."}, {"q": "A sample of 36 has x̄ = 52, s = 6, and the hypothesised mean μ = 50. The t value is…", "o": ["1", "12", "2", "0.33"], "a": 2, "e": "s/√n = 6/6 = 1, so t = (52 − 50) ÷ 1 = 2."}]}, {"id": "correlation", "icon": "💞", "title": "Correlation: Pearson, Spearman & r²", "tag": "How two variables move together", "note": <script>
const UNITS = JSON.parse(document.getElementById('quiz-data').textContent);
const TOTAL_SECONDS = 900;
const AFFIRMATIONS = [
  "You're glowing today, Priscy 💗 one unit at a time!",
  "Smart, soft, and unstoppable: that's you, Priscy 👑",
  "Every question you answer makes you a stronger midwife 💫",
  "Take a breath, sip some water. You're doing amazing 💧✨",
  "Statistics is just stories told in numbers, and you're a wonderful storyteller 📖💕",
  "Small steps today, big graduation gown tomorrow 🎓💜",
  "You are so capable, Priscy. Keep going, gem 💎",
  "Progress over perfection. Look how far you've come 🌷",
  "Someone out there is already proud of you, Priscy 💞",
  "Rest if you need to, then come back and shine 🌙"
];
const MILESTONES = {
  5:"Five answered, Priscy! You're warming up beautifully 🌸",
  10:"Ten done. Steady, calm and brilliant, just like you 💗",
  15:"Halfway there, gem! Someone is going to be so proud of you 💎",
  20:"Twenty! Look at you go, future midwife 👑",
  25:"Only five more, Priscy. The finish line is blushing at you 💕",
  30:"All 30 answered! Check any flagged questions, then submit when you're ready ✨"
};
const TIME_MSGS = {
  300:"Five minutes left, love. Breathe in, breathe out, keep going 🌷",
  60:"One minute left. Trust your first instinct, Priscy 💪💗",
  30:"Thirty seconds! You've got this, queen 👑"
};
const DEFAULT_NOTE = "Breathe, Priscy. You know more than you think 💗";

const PROGRESS_KEY='priscy_statistics_best';
function loadProgress(){ try{ return JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}'); }catch(e){ return {}; } }
function saveProgress(v){ try{ localStorage.setItem(PROGRESS_KEY,JSON.stringify(v)); }catch(e){} }
function resetProgress(){ if(confirm('Reset all your saved scores on this device?')){ try{ localStorage.removeItem(PROGRESS_KEY); }catch(e){} location.reload(); } }
const best = loadProgress();   // unitId -> {score,total} (saved on this device)
let currentUnitId = UNITS[0].id;
let attempt = null;       // active attempt
let tickHandle = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const fmtTime = s => { s = Math.max(0,Math.ceil(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const unitById = id => UNITS.find(u => u.id === id);
const LETTERS = ['A','B','C','D'];

/* ---------- decorations & affirmations ---------- */
function renderDecorations(){
  const layer = $('#deco-layer');
  const items = [
    ['cloud','☁️','3.2rem'],['cloud','☁️','2.2rem'],['cloud','☁️','4rem'],['heart','💗','1.6rem'],['heart','💜','1.3rem'],
    ['heart','💕','1.8rem'],['gem','💎','1.6rem'],['gem','💠','1.4rem'],['crown','👑','1.8rem'],['crown','👑','1.4rem'],
    ['sparkle','✨','1.3rem'],['sparkle','✨','1.1rem'],['sparkle','🌟','1.5rem'],['heart','💓','1.5rem'],['cloud','☁️','2.6rem']
  ];
  items.forEach(([t,e,s]) => {
    const el = document.createElement('div');
    el.className = 'floaty '+t; el.textContent = e; el.style.fontSize = s;
    el.style.left = (Math.random()*94)+'vw'; el.style.top = (Math.random()*90)+'vh';
    el.style.animationDuration = (14+Math.random()*14)+'s'; el.style.animationDelay = (Math.random()*8)+'s';
    layer.appendChild(el);
  });
}
function cycleAffirmation(){
  const el = $('#affirmation');
  el.style.transition = 'opacity .4s ease'; el.style.opacity = 0;
  setTimeout(() => { el.textContent = AFFIRMATIONS[Math.floor(Math.random()*AFFIRMATIONS.length)]; el.style.opacity = 1; }, 400);
}

/* ---------- nav ---------- */
function renderNav(){
  const list = $('#unitList'); list.innerHTML = '';
  UNITS.forEach((u,i) => {
    const b = document.createElement('button');
    b.className = 'unit-btn'+(u.id===currentUnitId?' active':'');
    const s = best[u.id];
    b.innerHTML = `<span class="emoji">${u.icon}</span><span>${i+1}. ${esc(u.title)}</span>` + (s ? `<span class="score-pill">${s.score}/${s.total}</span>` : '');
    b.onclick = () => { currentUnitId = u.id; renderNav(); showIntro(); window.scrollTo({top:0,behavior:'smooth'}); };
    list.appendChild(b);
  });
}
function setFocus(on){ $('#layout').classList.toggle('focus', on); }

/* ---------- modal ---------- */
function modal(title, body, buttons){
  const back = document.createElement('div'); back.className = 'modal-back'; back.setAttribute('role','dialog'); back.setAttribute('aria-modal','true');
  back.innerHTML = `<div class="modal"><h3>${title}</h3><p>${body}</p><div class="row"></div></div>`;
  const row = back.querySelector('.row');
  buttons.forEach(b => {
    const el = document.createElement('button'); el.className = 'btn '+(b.cls||''); el.textContent = b.label;
    el.onclick = () => { back.remove(); if(b.fn) b.fn(); };
    row.appendChild(el);
  });
  document.body.appendChild(back);
  row.querySelector('button').focus();
}
const modalOpen = () => !!document.querySelector('.modal-back');

/* ---------- unit intro ---------- */
function showIntro(){
  stopTimer(); attempt = null; setFocus(false);
  const u = unitById(currentUnitId);
  const idx = UNITS.indexOf(u);
  const b = best[u.id];
  $('#mainContent').innerHTML = `
    <div class="unit-header"><div class="big-emoji">${u.icon}</div>
      <div><h2>Unit ${idx+1}: ${esc(u.title)}</h2><div class="unit-tagline">${esc(u.tag)}</div></div></div>
    <div class="love-note">💌 ${esc(u.note)}</div>
    <div class="summary-card"><h3>💜 Quick review before you start</h3><ul>${u.summary.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>
    <div class="rules">
      <div class="rule">📝 ${u.qs.length} questions</div>
      <div class="rule">⏱️ 15:00 for the whole unit</div>
      <div class="rule">🔒 Answers revealed at the end</div>
      <div class="rule">🚩 Flag any question to revisit</div>
    </div>
    <div class="start-area">
      ${b ? `<div class="best-line">Your best so far: ${b.score}/${b.total} 💕</div>` : ''}
      <button class="btn big" id="startBtn">Start Quiz 💗</button>
      <div class="hint">The clock only starts when you tap the button, Priscy. Take your time to read first 🌷</div>
    </div>`;
  $('#startBtn').onclick = startQuiz;
}

/* ---------- quiz ---------- */
function startQuiz(){
  const u = unitById(currentUnitId);
  const qs = shuffle(u.qs).map(q => {
    const opts = shuffle(q.o.map((t,i) => ({t, c:i===q.a})));
    return {q:q.q, opts, a:opts.findIndex(o=>o.c), e:q.e};
  });
  attempt = {unit:u, qs, ans:qs.map(()=>null), flags:qs.map(()=>false), cur:0, endAt:Date.now()+TOTAL_SECONDS*1000, seen:new Set(), warned:new Set(), finished:false};
  setFocus(true);
  renderQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
  startTimer();
}

function renderQuiz(){
  const a = attempt;
  $('#mainContent').innerHTML = `
    <div class="quiz-bar">
      <div class="timer" id="timer" role="timer">${fmtTime(TOTAL_SECONDS)}</div>
      <div class="prog-wrap"><div class="prog"><div class="fill" id="pfill"></div></div><div class="pcount" id="pcount"></div></div>
      <button class="btn ghost small" id="quitBtn">Quit</button>
    </div>
    <div class="note-strip" id="noteStrip">${DEFAULT_NOTE}</div>
    <div id="qArea"></div>
    <div class="palette" id="palette" aria-label="Question navigator"></div>
    <div class="submit-row"><button class="btn secondary" id="submitBtn">Submit my answers 💗</button></div>`;
  $('#quitBtn').onclick = () => modal('Leave this quiz?', 'Your answers and timer for this attempt will be lost, Priscy.',
    [{label:'Keep going', fn:()=>{}}, {label:'Quit', cls:'ghost', fn:()=>{ stopTimer(); showIntro(); }}]);
  $('#submitBtn').onclick = trySubmit;
  renderQuestion(); updateBar(); tickTimer();
}

function renderQuestion(){
  const a = attempt, i = a.cur, q = a.qs[i];
  $('#qArea').innerHTML = `
    <div class="qbox">
      <div class="qhead"><span class="qnum">Question ${i+1} of ${a.qs.length}</span>
        <button class="flag-btn ${a.flags[i]?'on':''}" id="flagBtn" aria-pressed="${a.flags[i]}">🚩 ${a.flags[i]?'Flagged':'Flag'}</button></div>
      <div class="qtext">${esc(q.q)}</div>
      <div role="radiogroup" aria-label="Answer options">
        ${q.opts.map((o,oi)=>`<button class="opt ${a.ans[i]===oi?'selected':''}" role="radio" aria-checked="${a.ans[i]===oi}" data-oi="${oi}">
          <span class="letter">${LETTERS[oi]}</span><span>${esc(o.t)}</span></button>`).join('')}
      </div>
      <div class="qnav">
        <button class="btn ghost small" id="prevBtn" ${i===0?'disabled':''}>Back</button>
        <button class="btn small" id="nextBtn" ${i===a.qs.length-1?'disabled':''}>Next</button>
      </div>
    </div>`;
  document.querySelectorAll('#qArea .opt').forEach(el => el.onclick = () => choose(parseInt(el.dataset.oi)));
  $('#flagBtn').onclick = () => { a.flags[i] = !a.flags[i]; renderQuestion(); renderPalette(); };
  $('#prevBtn').onclick = () => go(i-1);
  $('#nextBtn').onclick = () => go(i+1);
  renderPalette();
}
function renderPalette(){
  const a = attempt, p = $('#palette'); if(!p) return; p.innerHTML = '';
  a.qs.forEach((_,i) => {
    const b = document.createElement('button');
    b.className = 'pbtn'+(a.ans[i]!==null?' done':'')+(i===a.cur?' cur':'')+(a.flags[i]?' flag':'');
    b.textContent = i+1; b.setAttribute('aria-label','Go to question '+(i+1)+(a.ans[i]!==null?', answered':', not answered'));
    b.onclick = () => go(i); p.appendChild(b);
  });
}
function go(i){ if(!attempt||i<0||i>=attempt.qs.length) return; attempt.cur = i; renderQuestion(); }
function choose(oi){
  const a = attempt; a.ans[a.cur] = oi; renderQuestion(); updateBar();
  const n = a.ans.filter(x=>x!==null).length;
  if(MILESTONES[n] && !a.seen.has(n)){ a.seen.add(n); showNote(MILESTONES[n]); }
}
function updateBar(){
  const a = attempt, n = a.ans.filter(x=>x!==null).length;
  $('#pfill').style.width = (n/a.qs.length*100)+'%';
  $('#pcount').textContent = n+' of '+a.qs.length+' answered';
}
function showNote(t){
  const el = $('#noteStrip'); if(!el) return;
  el.textContent = t; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
}

/* timer */
function startTimer(){ stopTimer(); tickHandle = setInterval(tickTimer, 250); }
function stopTimer(){ if(tickHandle){ clearInterval(tickHandle); tickHandle = null; } }
function tickTimer(){
  if(!attempt || attempt.finished) return;
  const left = (attempt.endAt-Date.now())/1000;
  const el = $('#timer'); if(!el) return;
  el.textContent = fmtTime(left);
  el.classList.toggle('warn', left<=180 && left>60);
  el.classList.toggle('danger', left<=60);
  Object.keys(TIME_MSGS).forEach(k => { if(left<=+k && !attempt.warned.has(k) && left>0){ attempt.warned.add(k); showNote(TIME_MSGS[k]); } });
  if(left<=0){ finish(true); }
}

function trySubmit(){
  const a = attempt, un = a.ans.filter(x=>x===null).length;
  const body = un ? `You still have <b>${un}</b> unanswered question${un>1?'s':''}. Unanswered ones count as wrong.` : 'All 30 answered. Ready to see how you did, Priscy?';
  modal('Submit your quiz?', body, [{label:un?'Go back':'Not yet', fn:()=>{}}, {label:'Submit 💗', cls:'secondary', fn:()=>finish(false)}]);
}

/* ---------- results ---------- */
function finish(timeUp){
  const a = attempt; if(!a || a.finished) return;
  a.finished = true; stopTimer();
  document.querySelectorAll('.modal-back').forEach(m=>m.remove());
  const used = Math.min(TOTAL_SECONDS, Math.round(TOTAL_SECONDS-(a.endAt-Date.now())/1000));
  let correct=0, wrong=0, skipped=0;
  a.qs.forEach((q,i) => { if(a.ans[i]===null) skipped++; else if(a.ans[i]===q.a) correct++; else wrong++; });
  const total = a.qs.length, pct = Math.round(correct/total*100);
  const prev = best[a.unit.id]; if(!prev || correct>prev.score){ best[a.unit.id] = {score:correct,total}; saveProgress(best); }
  renderNav();
  renderResults({a,timeUp,used,correct,wrong,skipped,total,pct});
  window.scrollTo({top:0,behavior:'smooth'});
  if(pct>=70) confetti();
}
function resultMessage(c,total){
  if(c===total) return "PERFECT 30 out of 30! Priscy, you are absolutely unstoppable. The whole class should be taking notes from you 👑💖";
  if(c>=27) return "Outstanding, Priscy! You're glowing and it shows. Just a couple of details left to polish 💎✨";
  if(c>=24) return "Beautiful work, Priscy! Statistics is bowing to you today 🌟";
  if(c>=21) return "Lovely score, love. Steady, strong and getting better with every attempt 💕";
  if(c>=15) return "You're more than halfway to mastery, Priscy. Read the explanations below and your next attempt will shine even brighter 🌷";
  return "Come here, gem. This one was tough today, and that's completely okay. Every explanation below is a gift to your future self, and you will get there 💗";
}
function renderResults(r){
  const {a,timeUp,used,correct,wrong,skipped,total,pct} = r;
  const idx = UNITS.indexOf(a.unit), next = UNITS[idx+1];
  setFocus(true);
  $('#mainContent').innerHTML = `
    <div class="result-top">
      ${timeUp ? '<div class="love-note">⏰ Time is up, Priscy! Here is how you did with the time you had 💗</div>' : ''}
      <div class="ring" style="--p:${pct}"><div class="inner"><div class="big">${correct}/${total}</div><div class="pc">${pct}%</div></div></div>
      <h2 style="color:#7a3fae;margin-bottom:10px">${a.unit.icon} ${esc(a.unit.title)}</h2>
      <div class="result-msg">${resultMessage(correct,total)}</div>
      <div class="stats">
        <div class="stat"><b>${correct}</b>correct</div>
        <div class="stat"><b>${wrong}</b>wrong</div>
        <div class="stat"><b>${skipped}</b>skipped</div>
        <div class="stat"><b>${fmtTime(used)}</b>time used</div>
      </div>
      <div class="result-actions">
        <button class="btn" id="retryBtn">Try this unit again 🔄</button>
        ${next ? '<button class="btn secondary" id="nextUnitBtn">Next unit ➜</button>' : ''}
        <button class="btn ghost" id="homeBtn">Back to unit page</button>
      </div>
    </div>
    <h3 style="color:#7a3fae;text-align:center;margin-bottom:10px">💡 Your answers &amp; explanations</h3>
    <div class="filters" id="filters">
      <button class="chip on" data-f="all">All (${total})</button>
      <button class="chip" data-f="wrong">Wrong (${wrong})</button>
      <button class="chip" data-f="skipped">Skipped (${skipped})</button>
      <button class="chip" data-f="correct">Correct (${correct})</button>
    </div>
    <div id="review"></div>`;
  $('#retryBtn').onclick = startQuiz;
  $('#homeBtn').onclick = showIntro;
  if(next) $('#nextUnitBtn').onclick = () => { currentUnitId = next.id; renderNav(); showIntro(); window.scrollTo({top:0,behavior:'smooth'}); };
  document.querySelectorAll('#filters .chip').forEach(c => c.onclick = () => {
    document.querySelectorAll('#filters .chip').forEach(x=>x.classList.remove('on')); c.classList.add('on'); renderReview(a, c.dataset.f);
  });
  renderReview(a,'all');
}
function renderReview(a, f){
  const box = $('#review'); let html = '', shown = 0;
  a.qs.forEach((q,i) => {
    const mine = a.ans[i];
    const st = mine===null ? 'skipped' : (mine===q.a ? 'correct' : 'wrong');
    if(f!=='all' && f!==st) return;
    shown++;
    const verdict = st==='correct' ? '<div class="verdict ok">✅ Correct, well done!</div>'
                  : st==='wrong' ? '<div class="verdict no">❌ Not quite. Check the explanation below</div>'
                  : '<div class="verdict skip">⏭️ You skipped this one</div>';
    html += `<div class="rcard ${st==='correct'?'':st}">
      <div class="qnum">Question ${i+1}</div>
      <div class="qtext">${esc(q.q)}</div>${verdict}
      ${q.opts.map((o,oi) => {
        const isC = oi===q.a, isM = oi===mine;
        const cls = isC ? 'correct' : (isM ? 'incorrect' : '');
        const tag = isC && isM ? '✅ Your answer' : isC ? '✅ Correct answer' : isM ? '❌ Your answer' : '';
        return `<div class="ropt ${cls}"><b>${LETTERS[oi]}.</b><span>${esc(o.t)}</span><span class="tag">${tag}</span></div>`;
      }).join('')}
      <div class="why">💡 <b>Why:</b> ${esc(q.e)}</div></div>`;
  });
  box.innerHTML = shown ? html : '<div class="love-note" style="text-align:center">Nothing in this group. That is a very good sign, Priscy 💗</div>';
}

function confetti(){
  const em = ['💗','💖','💕','✨','💜','🌸','👑'];
  for(let i=0;i<32;i++){
    const el = document.createElement('div'); el.className = 'confetti'; el.textContent = em[i%em.length];
    el.style.left = Math.random()*100+'vw'; el.style.fontSize = (1+Math.random()*1.3)+'rem';
    el.style.animationDuration = (3+Math.random()*3)+'s'; el.style.animationDelay = (Math.random()*1.2)+'s';
    document.body.appendChild(el); setTimeout(()=>el.remove(), 7500);
  }
}

/* keyboard */
document.addEventListener('keydown', e => {
  if(!attempt || attempt.finished || modalOpen()) return;
  const k = e.key.toLowerCase();
  if(['1','2','3','4'].includes(k)) choose(+k-1);
  else if(['a','b','c','d'].includes(k)) choose(k.charCodeAt(0)-97);
  else if(e.key==='ArrowRight') go(attempt.cur+1);
  else if(e.key==='ArrowLeft') go(attempt.cur-1);
});

renderDecorations(); renderNav(); showIntro(); cycleAffirmation(); setInterval(cycleAffirmation, 9000);
</script>
</body>
