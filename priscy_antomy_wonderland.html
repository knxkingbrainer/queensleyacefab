<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priscy's Midwifery Wonderland 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink: #ff8fd6;
  --pink-bright: #ff4fc3;
  --blue: #7fd6ff;
  --blue-bright: #3fb8ff;
  --purple: #b98cff;
  --purple-bright: #9b4dff;
  --cream: #fff7fd;
  --deep: #5a3a7a;
  --shadow: rgba(154, 77, 255, 0.25);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Quicksand', sans-serif;
  color:var(--deep);
  min-height:100vh;
  background: linear-gradient(135deg,#ffe3f6 0%, #dcefff 35%, #ecdcff 65%, #ffe3f6 100%);
  background-size: 400% 400%;
  animation: bgshift 22s ease infinite;
  overflow-x:hidden;
  position:relative;
}
@keyframes bgshift{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
h1,h2,h3,h4{font-family:'Baloo 2', cursive; margin:0;}

/* ---------- floating decorations ---------- */
#deco-layer{
  position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
}
.floaty{
  position:absolute;
  opacity:0.85;
  filter: drop-shadow(0 4px 10px rgba(154,77,255,0.25));
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}
.cloud{ animation-name: driftX; }
.heart{ animation-name: bobY; }
.gem{ animation-name: spinBob; }
.crown{ animation-name: bobY; }
.sparkle{ animation-name: twinkle; }

@keyframes driftX{
  0%{ transform: translateX(-10vw) translateY(0);}
  50%{ transform: translateX(10vw) translateY(-2vh);}
  100%{ transform: translateX(-10vw) translateY(0);}
}
@keyframes bobY{
  0%,100%{ transform: translateY(0) rotate(-4deg);}
  50%{ transform: translateY(-22px) rotate(4deg);}
}
@keyframes spinBob{
  0%{ transform: translateY(0) rotate(0deg);}
  50%{ transform: translateY(-16px) rotate(180deg);}
  100%{ transform: translateY(0) rotate(360deg);}
}
@keyframes twinkle{
  0%,100%{ opacity:0.2; transform:scale(0.8);}
  50%{ opacity:1; transform:scale(1.3);}
}

/* ---------- layout ---------- */
.wrap{
  position:relative; z-index:1;
  max-width:1200px; margin:0 auto; padding: 28px 20px 80px;
}
header.hero{
  text-align:center; padding: 18px 10px 26px;
}
.hero h1{
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  background: linear-gradient(90deg, var(--pink-bright), var(--purple-bright), var(--blue-bright));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  letter-spacing: 0.5px;
}
.hero .sub{
  font-size:1.05rem; margin-top:8px; color:#7a4fa8; font-weight:600;
}
.affirmation{
  margin: 14px auto 0; max-width: 560px;
  background: rgba(255,255,255,0.65);
  border: 2px dashed var(--pink);
  border-radius: 20px;
  padding: 10px 18px;
  font-weight:600; color:#a13d9a;
  backdrop-filter: blur(3px);
}

.layout{
  display:grid;
  grid-template-columns: 260px 1fr;
  gap: 22px;
  margin-top: 24px;
}
@media (max-width: 820px){
  .layout{ grid-template-columns: 1fr; }
}

nav.units{
  background: rgba(255,255,255,0.55);
  border-radius: 24px;
  padding: 14px;
  height: fit-content;
  border: 2px solid rgba(255,255,255,0.8);
  box-shadow: 0 10px 30px var(--shadow);
  backdrop-filter: blur(6px);
  position: sticky; top: 16px;
}
nav.units h3{ padding: 6px 10px 12px; color:#7a3fae; font-size:1rem;}
.unit-btn{
  display:flex; align-items:center; gap:10px;
  width:100%; text-align:left;
  background: transparent; border:none; cursor:pointer;
  padding: 10px 12px; margin-bottom:6px;
  border-radius: 14px;
  font-family:'Quicksand',sans-serif; font-weight:600; font-size:0.92rem;
  color:#5a3a7a;
  transition: all 0.2s ease;
}
.unit-btn:hover{ background: rgba(255,143,214,0.18); transform: translateX(3px); }
.unit-btn.active{
  background: linear-gradient(90deg, var(--pink), var(--purple));
  color:white;
  box-shadow: 0 6px 14px var(--shadow);
}
.unit-btn .emoji{ font-size:1.2rem; }
.unit-btn .score-pill{
  margin-left:auto; font-size:0.7rem; background:rgba(255,255,255,0.6);
  border-radius: 10px; padding:2px 7px; color:#7a3fae; font-weight:700;
}
.unit-btn.active .score-pill{ background: rgba(255,255,255,0.35); color:white; }

main.content{
  background: rgba(255,255,255,0.6);
  border-radius: 28px;
  padding: 26px 28px 34px;
  border: 2px solid rgba(255,255,255,0.85);
  box-shadow: 0 14px 40px var(--shadow);
  backdrop-filter: blur(6px);
  min-height: 400px;
}
.unit-header{
  display:flex; align-items:center; gap:14px; margin-bottom: 6px;
}
.unit-header .big-emoji{ font-size:2.4rem; }
.unit-header h2{
  font-size: clamp(1.3rem, 2.6vw, 1.8rem);
  color:#7a3fae;
}
.unit-tagline{ color:#a9679b; font-weight:600; margin-top:2px; margin-bottom:18px;}

.summary-card{
  background: linear-gradient(135deg, rgba(255,214,236,0.55), rgba(180,214,255,0.4));
  border-radius: 20px;
  padding: 18px 20px;
  margin-bottom: 26px;
  border: 1px solid rgba(255,255,255,0.7);
}
.summary-card h3{ color:#5a3a7a; margin-bottom:10px; font-size:1.05rem;}
.summary-card ul{ margin:0; padding-left: 20px; }
.summary-card li{ margin-bottom: 8px; line-height:1.5; font-size:0.95rem;}

.quiz-toolbar{
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  margin-bottom: 14px;
}
.quiz-toolbar h3{ color:#5a3a7a; font-size:1.1rem; }
.btn{
  font-family:'Baloo 2', cursive;
  border:none; cursor:pointer; border-radius: 999px;
  padding: 10px 20px; font-size:0.95rem; font-weight:700; color:white;
  background: linear-gradient(90deg, var(--pink-bright), var(--purple-bright));
  box-shadow: 0 6px 16px var(--shadow);
  transition: transform 0.15s ease;
}
.btn:hover{ transform: translateY(-2px) scale(1.03); }
.btn.secondary{
  background: linear-gradient(90deg, var(--blue-bright), var(--purple));
}
.btn.ghost{
  background: rgba(255,255,255,0.7); color:#7a3fae; box-shadow:none; border:2px solid var(--pink);
}

.qcard{
  background: rgba(255,255,255,0.75);
  border-radius: 18px;
  padding: 16px 18px;
  margin-bottom: 14px;
  border: 2px solid transparent;
  transition: border-color 0.2s ease;
}
.qcard .qtext{ font-weight:700; color:#4a3068; margin-bottom:10px; }
.qnum{ color: var(--pink-bright); margin-right:6px;}
.opt{
  display:flex; align-items:center; gap:10px;
  padding: 9px 12px; margin-bottom:7px;
  border-radius: 12px; cursor:pointer;
  background: rgba(255,255,255,0.6);
  border: 1.5px solid rgba(154,77,255,0.15);
  font-weight:600; font-size:0.92rem;
  transition: all 0.15s ease;
}
.opt:hover{ background: rgba(180,214,255,0.35); }
.opt input{ accent-color: var(--purple-bright); }
.opt.correct{ background: rgba(140,230,180,0.55); border-color:#5fce9a; }
.opt.incorrect{ background: rgba(255,150,170,0.5); border-color:#ff6f8e; }
.qcard.answered .opt{ pointer-events:none; }

.result-banner{
  text-align:center; padding: 20px; border-radius:20px; margin-top:10px;
  background: linear-gradient(120deg, rgba(255,214,236,0.7), rgba(200,180,255,0.6));
  font-family:'Baloo 2', cursive; font-size:1.2rem; color:#7a3fae;
  display:none;
}

footer.note{
  text-align:center; margin-top: 30px; color:#9a6fbf; font-size:0.85rem; font-weight:600;
}

::selection{ background: var(--pink); color:white; }
</style>
</head>

<div id="deco-layer"></div>

<div class="wrap">

    <h1>Priscy's Midwifery Wonderland ✨</h1>
    <div class="sub">Obstetric Anatomy — Foetus &amp; Reproductive System Study Space 💗</div>
    <div class="affirmation" id="affirmation">Loading a little sparkle of encouragement...</div>

40,000", "400,000", "2,000,000", "10,000"], "a": 2, "note": ""}, {"q": "By puberty, primordial follicles reduce to about:", "options": ["2,000,000", "400,000", "40,000", "4,000"], "a": 2, "note": ""}, {"q": "Approximately how many of the 40,000 primordial follicles will mature and ovulate in a lifetime?", "options": ["40", "400", "4,000", "40,000"], "a": 1, "note": ""}, {"q": "The stages of follicular development in order are:", "options": ["Graafian, Secondary, Primary, Primordial", "Primordial, Primary, Secondary, Graafian", "Primary, Primordial, Graafian, Secondary", "Secondary, Primary, Graafian, Primordial"], "a": 1, "note": ""}, {"q": "Meiosis I is completed:", "options": ["At birth", "Just before ovulation", "Only after fertilization", "During menopause"], "a": 1, "note": ""}, {"q": "Meiosis II is completed:", "options": ["Before puberty", "Just before ovulation", "Only upon fertilization", "Never"], "a": 2, "note": ""}, {"q": "After ovulation, the ruptured follicle becomes the:", "options": ["Corpus albicans", "Corpus luteum", "Corpus fibrosum", "Graafian follicle"], "a": 1, "note": ""}, {"q": "The corpus luteum mainly produces:", "options": ["Oestrogen only", "Progesterone with a little oestrogen", "FSH", "Testosterone"], "a": 1, "note": ""}, {"q": "If fertilization does not occur, the corpus luteum degenerates after about:", "options": ["7 days", "14 days", "21 days", "28 days"], "a": 1, "note": ""}, {"q": "The white scar left after degeneration of the corpus luteum is the:", "options": ["Corpus fibrosum", "Corpus luteum", "Corpus albicans", "Corona radiata"], "a": 2, "note": ""}, {"q": "The final stage of fibrosis seen in the post-menopausal period is the:", "options": ["Corpus albicans", "Corpus luteum", "Corpus fibrosum", "Graafian follicle"], "a": 2, "note": ""}, {"q": "Mid-cycle pain accompanying ovulation is called:", "options": ["Dysmenorrhoea", "Mittelschmerz", "Menorrhagia", "Metrorrhagia"], "a": 1, "note": ""}, {"q": "One primary oocyte ultimately gives rise to:", "options": ["Four ova", "One ovum (plus degenerating polar bodies)", "Two ova", "No ova"], "a": 1, "note": ""}, {"q": "By contrast, one primary spermatocyte produces:", "options": ["One sperm", "Two sperm", "Four sperm", "Eight sperm"], "a": 2, "note": ""}, {"q": "The ovary is covered externally by a modified peritoneum called the:", "options": ["Tunica albuginea", "Germinal epithelium", "Mesovarium", "Stroma"], "a": 1, "note": ""}, {"q": "By menopause, the ovary contains:", "options": ["Many primordial follicles still", "No ova remaining", "Only Graafian follicles", "Corpus luteum only"], "a": 1, "note": ""}, {"q": "Lymphatic drainage of the ovary is into the:", "options": ["Inguinal glands", "Lumbar glands", "Sacral glands", "Iliac glands only"], "a": 1, "note": ""}]}, {"id": "pelvis", "title": "Female Pelvis & Obstetric Application", "icon": "\ud83d\udc51", "summary": ["Bony basin-shaped ring linking vertebral column to lower limbs; true pelvis = bony birth canal.", "4 bones: two hip bones (ilium, ischium, pubis fused at acetabulum), sacrum, coccyx.", "Pelvic brim divides false pelvis (above, supports abdominal contents) from true pelvis (below - inlet, cavity, outlet = birth canal).", "Ischial spines: reference point for fetal station; interspinous diameter = narrowest transverse diameter of midpelvis.", "4 Classical (Caldwell-Moloy) pelvic types: Gynaecoid (rounded, favourable), Android (heart-shaped, harder labour), Anthropoid (oval, long AP), Platypelloid (flat, short AP).", "Anatomical/Obstetric/Diagonal conjugates: Obstetric conjugate = shortest fixed AP diameter (~10.5-11cm) baby's head must pass; estimated from diagonal conjugate minus 1.5-2cm.", "Transverse diameter of inlet ~13cm; Interspinous (midpelvis) ~10-10.5cm; Intertuberous (outlet) ~10.5-11cm.", "Pelvic joints: 2 sacroiliac joints, symphysis pubis, sacrococcygeal joint, lumbosacral joint.", "Female vs Male pelvis: female is lighter, wider, shallower, rounder inlet, wider pubic arch (80-90\u00b0+), less prominent ischial spines.", "Axis of birth canal = Curve of Carus.", "Pelvic floor = levator ani (puborectalis, pubococcygeus, iliococcygeus) + coccygeus; supports pelvic organs, resists intra-abdominal pressure."], "questions": [{"q": "The bony pelvis consists of how many bones?", "options": ["2", "3", "4", "5"], "a": 2, "note": ""}, {"q": "Each hip bone is formed by fusion of the ilium, ischium and pubis at the:", "options": ["Iliac crest", "Acetabulum", "Obturator foramen", "Sacral promontory"], "a": 1, "note": ""}, {"q": "The pelvic brim divides the pelvis into the false pelvis and the:", "options": ["True pelvis", "Sacral pelvis", "Obturator pelvis", "Coccygeal pelvis"], "a": 0, "note": ""}, {"q": "The false (greater) pelvis mainly:", "options": ["Forms the bony birth canal", "Supports abdominal contents", "Contains the ischial spines", "Is part of the true pelvis"], "a": 1, "note": ""}, {"q": "The true (lesser) pelvis includes the inlet, cavity and:", "options": ["Iliac fossa", "Outlet", "Acetabulum", "Sacral ala"], "a": 1, "note": ""}, {"q": "The ischial spines are used clinically to assess:", "options": ["Cervical dilation", "Fetal head station", "Pelvic type only", "Placental location"], "a": 1, "note": ""}, {"q": "The interspinous diameter is the narrowest transverse diameter of the:", "options": ["Inlet", "Midpelvis", "Outlet", "False pelvis"], "a": 1, "note": ""}, {"q": "Which pelvic type has a rounded inlet, roomy cavity and wide pubic arch, usually favourable for birth?", "options": ["Android", "Anthropoid", "Gynaecoid", "Platypelloid"], "a": 2, "note": ""}, {"q": "Which pelvic type has a heart-shaped inlet and narrow pubic arch, associated with deep transverse arrest?", "options": ["Gynaecoid", "Android", "Anthropoid", "Platypelloid"], "a": 1, "note": ""}, {"q": "Which pelvic type has an oval inlet with a long anteroposterior diameter?", "options": ["Gynaecoid", "Android", "Anthropoid", "Platypelloid"], "a": 2, "note": ""}, 0"], "a": 1, "note": ""}, {"q": "The imaginary curved line through the centre of the inlet, cavity and outlet is called the:", "options": ["Pelvic inclination", "Curve of Carus (axis of the birth canal)", "Obstetric conjugate", "Sacral curve"], "a": 1, "note": ""}, {"q": "During birth, the presenting part follows a path that goes:", "options": ["Straight down only", "Downward/backward then downward/forward beneath the pubic arch", "Straight forward", "Upward first"], "a": 1, "note": ""}, {"q": "The most important muscle group of the pelvic floor is the:", "options": ["Piriformis", "Levator ani", "Obturator internus", "Gluteus maximus"], "a": 1, "note": ""}, {"q": "A wide pubic arch generally provides:", "options": ["Less room at the outlet", "More room at the anterior outlet", "No effect on labour", "Only relevance to the inlet"], "a": 1, "note": ""}, {"q": "Routine antenatal radiographic pelvimetry is generally:", "options": ["Recommended for all women", "Not used routinely", "Required before every vaginal exam", "Mandatory in the third trimester"], "a": 1, "note": ""}]}, {"id": "menstrual", "title": "Menstrual Cycle", "icon": "\ud83e\ude77", "summary": ["Monthly physiological changes regulated by hypothalamus, anterior pituitary & ovaries, preparing the uterus for fertilization.", "3 interlinked cycles: Pituitary cycle, Ovarian cycle, Uterine (endometrial) cycle.", "Pituitary: hypothalamus secretes GnRH \u2192 anterior pituitary releases FSH & LH.", "Ovarian cycle 3 phases: Follicular phase (FSH develops Graafian follicles), Ovulation (LH surge ruptures follicle, day 14), Luteal phase (corpus luteum produces progesterone, oestrogen, relaxin, inhibin).", "Ovum viable for fertilization only ~12-24 hours (survives ~72hrs total before disintegrating).", "Uterine cycle phases: Proliferative/regenerative (oestrogen-driven, endometrium regrows), Secretory/luteal (progesterone-driven, endometrium spongy & rich), Menstrual bleeding (prostaglandin causes spiral artery spasm \u2192 shedding).", "Average cycle = 28 days (range 21-35); bleeding lasts 3-5 days (average 2-7), blood loss ~50-150ml.", "Plasmin prevents menstrual blood from clotting.", "Menstrual flow = blood, mucus, endometrial cells, unfertilized ovum.", "Disorders: Oligomenorrhoea (scanty), Polymenorrhoea (cycle <21 days), Amenorrhoea (absence), Menorrhagia (excessive/prolonged), Dysmenorrhoea (painful).", "PMS: cyclical physical/emotional distress in luteal phase, disappears with menstruation; PMDD = more severe, managed with SSRIs."], "questions": [{"q": "The hypothalamus secretes which hormone to stimulate the pituitary?", "options": ["FSH", "LH", "GnRH", "Oestrogen"], "a": 2, "note": ""}, {"q": "The anterior pituitary produces which two gonadotropins?", "options": ["Oestrogen and Progesterone", "FSH and LH", "GnRH and Inhibin", "Prolactin and Oxytocin"], "a": 1, "note": ""}, {"q": "The three phases of the ovarian cycle are:", "options": ["Menstrual, Proliferative, Secretory", "Follicular, Ovulation, Luteal", "Pituitary, Ovarian, Uterine", "Basal, Functional, Regenerative"], "a": 1, "note": ""}, {"q": "During the follicular phase, which hormone drives development of Graafian follicles?", "options": ["LH", "FSH", "Progesterone", "Oxytocin"], "a": 1, "note": ""}, {"q": "Ovulation is triggered by a surge in:", "options": ["FSH", "LH", "Progesterone", "Prolactin"], "a": 1, "note": ""}, {"q": "Ovulation typically occurs around which day of a 28-day cycle?", "options": ["Day 7", "Day 14", "Day 21", "Day 28"], "a": 1, "note": ""}, {"q": "After ovulation, the egg remains capable of fertilization for about:", "options": ["1-3 hours", "12-24 hours", "3-4 days", "1 week"], "a": 1, "note": ""}, {"q": "The corpus luteum produces progesterone, oestrogen, relaxin and:", "options": ["FSH", "Inhibin", "GnRH", "hCG"], "a": 1, "note": ""}, {"q": "The uterine (endometrial) cycle occurs:", "options": ["Independently of the ovarian cycle", "Concurrently with the ovarian cycle", "Only after menopause", "Only in pregnancy"], "a": 1, "note": ""}, {"q": "The average length of the menstrual cycle is taken as:", "options": ["21 days", "24 days", "28 days", "35 days"], "a": 2, "note": ""}, {"q": "The normal range of cycle length is:", "options": ["14-21 days", "21-35 days", "35-45 days", "10-15 days"], "a": 1, "note": ""}, {"q": "The proliferative phase of the uterine cycle is under the control of:", "options": ["Progesterone", "Oestrogen", "LH", "Inhibin"], "a": 1, "note": ""}, {"q": "The secretory (luteal) phase of the uterine cycle is under the control of:", "options": ["Oestrogen", "Progesterone", "FSH", "GnRH"], "a": 1, "note": ""}, {"q": "The secretory phase lasts approximately:", "options": ["7 days", "14 days", "21 days", "28 days"], "a": 1, "note": ""}, {"q": "At the end of the proliferative phase, the endometrium has how many layers?", "options": ["1", "2", "3", "4"], "a": 2, "note": ""}, {"q": "Menstrual bleeding occurs after a fall in oestrogen and progesterone, stimulating release of:", "options": ["Prolactin", "Prostaglandin", "Relaxin", "Inhibin"], "a": 1, "note": ""}, {"q": "Prostaglandin causes the spiral arteries to:", "options": ["Dilate permanently", "Go into spasm, reducing blood supply", "Rupture immediately", "Have no effect"], "a": 1, "note": ""}, {"q": "An enzyme that prevents menstrual blood from clotting is:", "options": ["Prolactin", "Plasmin", "Oxytocin", "Relaxin"], "a": 1, "note": ""}, {"q": "Normal regular menstrual flow is called:", "options": ["Menorrhagia", "Eumenorrhoea", "Oligomenorrhoea", "Dysmenorrhoea"], "a": 1, "note": ""}, {"q": "Average blood loss during a normal period is approximately:", "options": ["10-20ml", "50-150ml", "300-400ml", "500ml"], "a": 1, "note": ""}, {"q": "Absence of menstruation is called:", "options": ["Dysmenorrhoea", "Amenorrhoea", "Menorrhagia", "Polymenorrhoea"], "a": 1, "note": ""}, {"q": "Excessively prolonged or profuse menstrual bleeding is called:", "options": ["Oligomenorrhoea", "Polymenorrhoea", "Menorrhagia", "Amenorrhoea"], "a": 2, "note": ""}, {"q": "Cycle length less than 21 days with normal-amount but frequent bleeding is:", "options": ["Menorrhagia", "Polymenorrhoea", "Oligomenorrhoea", "Dysmenorrhoea"], "a": 1, "note": ""}, {"q": "Premenstrual Syndrome (PMS) typically appears during which phase and disappears with menstruation?", "options": ["Follicular phase", "Postovulatory (luteal) phase", "Menstrual phase", "Proliferative phase"], "a": 1, "note": ""}, {"q": "A medication class used in managing both PMS and PMDD is:", "options": ["Antibiotics", "SSRIs (selective serotonin reuptake inhibitors)", "Antihistamines", "Beta-blockers only"], "a": 1, "note": ""}]}, {"id": "menopause", "title": "Menopause / Andropause / Puberty", "icon": "\u2728", "summary": ["Menopause = physiological cessation of menstruation due to decreasing ovarian function.", "Perimenopause = years before/after last menses (increased then decreased frequency of menses). Climacteric = longer phase of losing reproductive capacity, begins before perimenopause.", "Menopause usually 45-52 years (can be as early as 40 or delayed to 55+). Complete menopause = after 1 year with no periods.", "Physiological changes: ovaries respond less to FSH/LH, follicular phase shortens, fewer ovulations, decreased progesterone, eventually oestrogen falls further inhibiting FSH/LH release.", "Genital tract changes: atrophy of ovaries, tubes, uterus; thin/smooth vaginal wall with reduced acidity; flatter labia; reduced pubic hair; possible ligament atrophy/prolapse.", "Symptoms: Hot flashes (feeling of heat, face/neck/chest, peripheral vasodilation, lasts 1-3 mins), vaginal dryness/burning/dyspareunia, mood changes, insomnia, osteoporosis risk, cardiovascular disease risk.", "Long-term effects of oestrogen deficiency: Osteoporosis (bone calcium loss), Cardiovascular disease (e.g. hypertension).", "Management: counselling, diet advice, Hormone Replacement Therapy (HRT - oestrogen tablets/pessaries).", "Post-menopausal bleeding causes: atrophic vaginitis, endometrial/cervical carcinoma, ovarian tumour - needs prompt investigation.", "Andropause: climacteric changes in men (declining testosterone, no specific age, reduced desire/erection but reproduction doesn't cease completely).", "Puberty (female): 9-12 years; first signs = breast development & pubic hair; ends with Menarche (first period); driven by GnRH \u2192 LH & FSH surge; leptin from adipose tissue signals adequate energy stores."], "questions": [{"q": "Menopause is defined as:", "options": ["Any irregular bleeding", "Physiological cessation of menstruation from decreasing ovarian function", "Removal of the uterus", "Onset of puberty"], "a": 1, "note": ""}, {"q": "Perimenopause usually lasts:", "options": ["Less than a month", "6 years or more", "Exactly 1 year", "10-15 years"], "a": 1, "note": ""}, {"q": "The word for the longer phase in which women lose reproductive capacity, beginning before perimenopause, is:", "options": ["Menarche", "Climacteric", "Andropause", "Involution"], "a": 1, "note": ""}, {"q": "Menstruation generally ceases between:", "options": ["30-35 years", "35-40 years", "45-52 years", "60-65 years"], "a": 2, "note": ""}, {"q": "A woman is said to have complete menopause after how long without periods?", "options": ["3 months", "6 months", "1 year", "2 years"], "a": 2, "note": ""}, {"q": "As ovaries age, their response to pituitary gonadotrophins:", "options": ["Increases", "Decreases", "Stays the same", "Doubles"], "a": 1, "note": ""}, {"q": "Anovulatory cycles become more frequent as menopause approaches, so fertility:", "options": ["Increases", "Diminishes", "Stays constant", "Is unaffected"], "a": 1, "note": ""}, {"q": "After menopause, the vaginal wall becomes:", "options": ["Thicker and more acidic", "Thin and smooth with reduced acidity", "Unchanged", "More rugose"], "a": 1, "note": ""}, {"q": "A classic vasomotor symptom of menopause is:", "options": ["Increased appetite", " Menstruation stops", "Reproductive organs undergo a surge in development to reach maturity", "Ovaries shrink", "Bones stop growing"], "a": 1, "note": ""}, {"q": "Onset of puberty is marked by a high flow of which two hormones?", "options": ["Oestrogen and Progesterone", "LH and FSH", "Prolactin and Oxytocin", "Inhibin and Relaxin"], "a": 1, "note": ""}, {"q": "The pituitary hormone surge at puberty is triggered by:", "options": ["Inhibin", "GnRH from the hypothalamus", "Testosterone", "Cortisol"], "a": 1, "note": ""}, {"q": "A hormone from adipose tissue believed to signal that energy stores are adequate for puberty to begin is:", "options": ["Insulin", "Leptin", "Cortisol", "Relaxin"], "a": 1, "note": ""}, {"q": "The first signs of puberty in girls are:", "options": ["Menarche and voice change", "Breast development and pubic hair", "Growth of facial hair", "Reduced height growth"], "a": 1, "note": ""}, {"q": "The first menstrual period is called:", "options": ["Menopause", "Menarche", "Climacteric", "Perimenopause"], "a": 1, "note": ""}]}, {"id": "pelvicfloor", "title": "Pelvic Floor", "icon": "\ud83c\udf37", "summary": ["Musculotendinous (soft tissue) sheet filling the pelvic outlet, hammock/gutter-shaped; pierced by urethra, vagina, rectum.", "Superficial muscles: Transverse perinei, Bulbospongiosus (Bulbocavernosus), Ischiocavernosus, External anal sphincter, Membranous sphincter of urethra + Triangular ligaments + Ischioanal fossa.", "Bulbospongiosus constricts the vaginal orifice & helps maintain clitoral erection.", "Deep muscles = Levator Ani (3 pairs): Pubococcygeus (most important, forms U-loop around vagina), Iliococcygeus, Ischiococcygeus.", "Blood: pudendal arteries. Nerve: pudendal nerve.", "6 layers of pelvic floor (outwards to in... actually within to out): Peritoneum, pelvic fascia/ligaments, deep muscles, superficial muscles, subcutaneous fat, skin.", "Perineal body: fibromuscular pyramid between vagina & rectum, apex up, base = skin, 3.5cm each side.", "Predisposing causes of pelvic floor injury: macrosomic baby, preterm labour, primiparity, vaginal surgical delivery, prolonged/precipitate labour.", "Injuries: stress incontinence (urine/faeces), rectovaginal fistula, vesicovaginal fistula, retroverted uterus, uterine prolapse, procidentia, dyspareunia, rectocele, urethrocele, cystocele.", "Prevention: primary (elective C/S, Kegel exercises), secondary (restrictive episiotomy, vacuum over forceps, perineal massage), tertiary (mode of delivery decisions for those with prior injury).", "Perineal tear classification: 1st degree (fourchette/vaginal mucosa/perineal skin only), 2nd degree (+ superficial muscles), 3rd degree (+ external anal sphincter), 4th degree (+ internal anal sphincter + rectal mucosa)."], "questions": [{"q": "Three canals pierce the pelvic floor. They are the urethra, vagina and:", "options": ["Ureter", "Rectum (anal canal)", "Fallopian tube", "Cervix"], "a": 1, "note": ""}, {"q": "Which superficial pelvic floor muscle helps constrict the vaginal orifice and maintain clitoral erection?", "options": ["Ischiocavernosus", "Bulbospongiosus (Bulbocavernosus)", "Transverse perinei", "External anal sphincter"], "a": 1, "note": ""}, {"q": "The transverse perinei muscles help to fix the position of the:", "options": ["Cervix", "Perineal body", "Bladder neck", "Ovary"], "a": 1, "note": ""}, {"q": "Ischiocavernosus muscles insert into the corpora cavernosa of the:", "options": ["Vagina", "Clitoris", "Urethra", "Uterus"], "a": 1, "note": ""}, {"q": "The membranous sphincter of the urethra controls urine flow by:", "options": ["Being a true sphincter always closed", "Compression and relaxation", "Peristalsis", "Ciliary action"], "a": 1, "note": ""}, {"q": "The deep pelvic floor muscles are collectively called:", "options": ["Perineal muscles", "Levator Ani", "Ischiocavernosus group", "Bulbospongiosus group"], "a": 1, "note": ""}, {"q": "Which levator ani muscle is considered the most important pelvic floor muscle?", "options": ["Iliococcygeus", "Ischiococcygeus", "Pubococcygeus", "Coccygeus"], "a": 2, "note": ""}, {"q": "The pubococcygeus muscle forms a U-loop around the:", "options": ["Rectum only", "Vagina", "Bladder only", "Urethra only"], "a": 1, "note": ""}, {"q": "Nerve supply to the pelvic floor muscles is mainly the:", "options": ["Sciatic nerve", "Pudendal nerve", "Femoral nerve", "Obturator nerve"], "a": 1, "note": ""}, {"q": "The pelvic floor closes the pelvic outlet and supports the weight of:", "options": ["Only the bladder", "Pelvic and abdominal organs", "Only the rectum", "Only the uterus"], "a": 1, "note": ""}, {"q": "During childbirth, the pelvic floor helps by allowing the foetal head to:", "options": ["Extend fully", "Flex, reducing the diameter distending the perineum", "Rotate only externally", "Remain rigid"], "a": 1, "note": ""}, {"q": "How many layers make up the pelvic floor (from within outwards)?", "options": ["Three", "Four", "Five", "Six"], "a": 3, "note": ""}, {"q": "The perineal body lies between the vagina and:", "options": ["Bladder", "Rectum", "Symphysis pubis", "Ovary"], "a": 1, "note": ""}, {"q": "The apex of the perineal body points:", "options": ["Downwards", "Upwards", "Laterally", "Posteriorly"], "a": 1, "note": ""}, {"q": "Approximate size of the perineal body on all sides:", "options": ["1cm", "2cm", "3.5cm", "5cm"], "a": 2, "note": ""}, {"q": "A predisposing cause of pelvic floor injury is:", "options": ["Small baby", "Macrosomic baby", "Post-term delivery only", "Multiparity only"], "a": 1, "note": ""}, {"q": "Detachment of the levator ani from its pubic bone insertion is associated with:", "options": ["Improved bladder control", "Vaginal prolapse", "Increased fertility", "No clinical significance"], "a": 1, "note": ""}, {"q": "Bulging of the front rectal wall into the back wall of the vagina is called:", "options": ["Cystocele", "Rectocele", "Urethrocele", "Procidentia"], "a": 1, "note": ""}, {"q": "Prolapse of the female urethra into the vagina is called:", "options": ["Cystocele", "Urethrocele", "Rectocele", "Dyspareunia"], "a": 1, "note": ""}, {"q": "Bulging or dropping of the bladder into the vagina is called:", "options": ["Rectocele", "Urethrocele", "Cystocele", "Procidentia"], "a": 2, "note": ""}, {"q": "Complete uterine prolapse with the cervix protruding through the vulva is called:", "options": ["Retroverted uterus", "Complete procidentia", "Rectocele", "Cystocele"], "a": 1, "note": ""}, {"q": "A primary prevention strategy for pelvic floor injury is:", "options": ["Restrictive episiotomy", "Elective caesarean section / antepartum Kegel exercises", "Forceps delivery routinely", "Rapid uncontrolled pushing"], "a": 1, "note": ""}, {"q": "A first-degree perineal tear involves:", "options": ["Skin, mucous membrane and superficial muscles", "Only the fourchette, vaginal mucosa and perineal skin", "External anal sphincter", "Rectal mucosa"], "a": 1, "note": ""}, {"q": "A third-degree perineal tear involves the skin, superficial muscles and:", "options": ["Internal anal sphincter only", "External anal sphincter", "Rectal mucosa only", "Bladder"], "a": 1, "note": ""}, {"q": "A fourth-degree perineal tear involves perineal skin, deep/superficial muscles, internal anal sphincter and:", "options": ["Bladder mucosa", "Rectal mucosa", "Cervix", "Labia majora"], "a": 1, "note": ""}]}, {"id": "episiotomy", "title": "Episiotomy (Perineotomy)", "icon": "\ud83d\udc97", "summary": ["Definition: a cut made in the perineum during the 2nd stage of labour prior to delivery of the baby.", "Indications: shorten 2nd stage (heart disease, eclampsia, pre-eclampsia, sickle cell, maternal/foetal distress, cord prolapse); prevent trauma (rigid perineum, FGM scarring); prevent tears (malpresentation, previous 3rd degree tear, large baby); reduce pressure on foetal head (prematurity); allow room for operative delivery (forceps/vacuum/breech).", "3 types: Medio-lateral, Median, J-shaped.", "Median incision: starts at centre of fourchette, ~2.5cm, directed posteriorly. Advantages: easy repair, less bleeding, heals early. Disadvantage: can easily extend to anus (3rd degree tear), less room for manipulation.", "Mediolateral incision: starts midline of fourchette, directed ~2.5cm away from anus. Advantages: easy to perform, avoids anal sphincter/Bartholin's gland damage. Disadvantage: difficult to repair, slower healing, more blood loss.", "Best timing: when baby's head is well advanced/perineum thin & bulging, at the height of a contraction (bleeding controlled by foetal head pressure).", "Suture material: absorbable (Vicryl 0 or 2-0); round/taper needle for vaginal epithelium+muscle, cutting needle for skin. Local anaesthesia: 1% Lignocaine.", "Repair layers in order: Vaginal mucosa (continuous stitch to hymenal ring) \u2192 Muscles (interrupted sutures) \u2192 Perineal skin (subcuticular stitches).", "Rectal examination after repair checks for: occult 3rd/4th degree tear, integrity of anal sphincter, presence of suture in rectum.", "Complications: bleeding, perineal pain/haematoma, tearing into rectal tissue/anal sphincter, infection, dysuria."], "questions": [{"q": "Episiotomy is defined as a cut made in the perineum during which stage of labour?", "options": ["First stage", "Second stage", "Third stage", "Fourth stage"], "a": 1, "note": ""}, {"q": "Episiotomy is performed prior to:", "options": ["Onset of labour", "Delivery of the baby", "Delivery of the placenta", "Rupture of membranes"], "a": 1, "note": ""}, {"q": "Episiotomy may be indicated to shorten the second stage in women with:", "options": ["Normal blood pressure", "Heart disease, eclampsia or pre-eclampsia", "Anaemia only", "Mild headache"], "a": 1, "note": ""}, {"q": "Episiotomy may be needed to prevent excessive trauma in cases of:", "options": ["Soft supple perineum", "Rigid perineum or FGM scarring", "Small baby", "Multiparity"], "a": 1, "note": ""}, {"q": "Episiotomy to prevent perineal tear may be indicated with:", "options": ["Occipito-anterior position", "Malpresentation e.g. face or occipito-posterior position", "Normal vertex delivery", "Term pregnancy only"], "a": 1, "note": ""}, {"q": "Episiotomy may reduce pressure on the foetal head in cases of:", "options": ["Post-term babies", "Prematurity", "Macrosomia only", "Twin pregnancy only"], "a": 1, "note": ""}, {"q": "The three types of episiotomy are median, J-shaped and:", "options": ["Vertical", "Mediolateral", "Transverse", "Circular"], "a": 1, "note": ""}, {"q": "The median incision starts at the centre of the fourchette and is directed:", "options": ["Anteriorly", "Posteriorly", "Laterally to the left only", "Towards the clitoris"], "a": 1, "note": ""}, {"q": "Approximate length of a median incision:", "options": ["1cm", "2.5cm", "5cm", "10cm"], "a": 1, "note": ""}, {"q": "An advantage of the median incision is:", "options": ["More blood loss", "Easy to repair with less bleeding", "Difficult to repair", "Higher infection risk"], "a": 1, "note": ""}, {"q": "A disadvantage of the median incision is that it:", "options": ["Heals slowly", "Can easily extend to the anus (3rd degree tear)", "Damages Bartholin's glands", "Cannot be repaired"], "a": 1, "note": ""}, {"q": "An advantage of the mediolateral incision is that it:", "options": ["Is harder to perform", "Avoids damage to the anal sphincter and Bartholin's glands", "Heals faster than median", "Causes less blood loss than median"], "a": 1, "note": ""}, {"q": "A disadvantage of the mediolateral incision is:", "options": ["Easy to repair", "More difficult to repair and slower to heal", "Cannot control bleeding", "Rarely used"], "a": 1, "note": ""}, {"q": "The best time to perform an episiotomy is when the perineum is:", "options": ["Thick and not bulging", "Thin, bulging and the head is well advanced", "Just starting to stretch", "After the head has already delivered"], "a": 1, "note": ""}, {"q": "Episiotomy should ideally be given at:", "options": ["The start of a contraction", "The height of a contraction", "Between contractions only", "Any random time"], "a": 1, "note": ""}, {"q": "For a mediolateral episiotomy, the scissors are directed at approximately what angle?", "options": ["15 degrees", "30 degrees", "45 degrees", "90 degrees"], "a": 2, "note": ""}, {"q": "Local anaesthesia commonly used for episiotomy is:", "options": ["2% Chlorhexidine", "1% Lignocaine", "Povidone iodine", "General anaesthesia routinely"], "a": 1, "note": ""}, {"q": "Suture material commonly used for episiotomy repair is:", "options": ["Silk 2-0", "Vicryl (0 or 2-0)", "Catgut only", "Nylon"], "a": 1, "note": ""}, {"q": "For repairing episiotomy, which needle type is used for the vaginal epithelium and muscles?", "options": ["Cutting needle", "Round (taper) needle", "Straight needle", "No needle needed"], "a": 1, "note": ""}, {"q": "For the skin closure during episiotomy repair, which needle is used?", "options": ["Round (taper) needle", "Cutting needle", "Curved blunt needle", "No needle needed"], "a": 1, "note": ""}, {"q": "The vaginal mucosa is sutured using a continuous stitch down to the:", "options": ["External os", "Hymenal ring", "Perineal skin", "Anus"], "a": 1, "note": ""}, {"q": "After suturing an episiotomy, a rectal examination is performed to check for all EXCEPT:", "options": ["Occult 3rd/4th degree tear", "Integrity of the anal sphincter", "Presence of suture in the rectum", "Cervical dilation"], "a": 3, "note": ""}, {"q": "A possible complication of episiotomy is:", "options": ["Improved bladder control", "Perineal haematoma", "Reduced infection risk", "Faster labour"], "a": 1, "note": ""}, {"q": "Post-episiotomy care includes lukewarm sitz baths and:", "options": ["Avoiding all fluids", "Kegel exercises", "Strenuous exercise immediately", "Tight clothing"], "a": 1, "note": ""}, {"q": "Women are advised to refrain from sexual intercourse after episiotomy repair for about:", "options": ["1 week", "4-6 weeks or until fully healed", "6 months", "No restriction needed"], "a": 1, "note": ""}]}, {"id": "breast", "title": "Female Breast", "icon": "\ud83d\udc9d", "summary": ["Accessory organs of reproduction; lie over pectoralis major, from 2nd to 6th rib, sternum to mid-axillary line; held by suspensory ligaments.", "Hemispherical shape with axillary tail of Spence extending to the axilla.", "Gross parts: Areola (pigmented, ~2.5cm, contains Montgomery's tubercles which lubricate nipple), Nipple (~6mm, erectile tissue, perforated by lactiferous ducts), Axillary tail.", "Microscopic: Glandular tissue (18-20 lobes, each lobe = alveoli with Acini cells for milk production, surrounded by Myo-epithelial/Basket cells that contract with oxytocin), Lactiferous tubules \u2192 Lactiferous ducts \u2192 Ampulla (milk reservoir under areola) \u2192 nipple.", "Also fibrous + adipose (fatty) tissue for support.", "Blood: internal/external mammary arteries. Lymph: axillary, mediastinal glands, portal fissure of liver (lymphatics of both breasts communicate - explains spread of malignancy).", "Development: mammary ridges appear ~week 4 of gestation (ectodermal thickening); mammary buds form ~week 6; canalize by end of pregnancy forming acini/alveoli, lactiferous ducts.", "'Witches milk' = temporary neonatal breast secretion from maternal hormones crossing placenta.", "Puberty: growth of ducts via oestrogen, progesterone, prolactin, corticoids, growth hormone.", "Lactation: Prolactin (production - acts on acini cells) + Oxytocin (flow/let-down reflex - contracts myoepithelial cells). Back pressure + Neuro-hormonal reflex control milk flow. Maintenance depends on suckling + complete emptying of breast.", "Abnormalities: Athelia (absent nipple), Amastia/Aplasia (absent breast), Polymastia (extra breast), Polythelia (extra nipple), Inverted nipples."], "questions": [{"q": "The breasts lie over which muscle?", "options": ["Pectoralis minor", "Pectoralis major", "Latissimus dorsi", "Serratus anterior"], "a": 1, "note": ""}, {"q": "The breast extends vertically from the 2nd rib to the:", "options": ["4th rib", "6th rib", "8th rib", "10th rib"], "a": 1, "note": ""}, {"q": "The tail of breast tissue extending into the axilla is called the:", "options": ["Areola", "Axillary tail of Spence", "Ampulla", "Lactiferous duct"], "a": 1, "note": ""}, {"q": "The pigmented area surrounding the nipple is the:", "options": ["Ampulla", "Areola", "Alveolus", "Lobule"], "a": 1, "note": ""}, {"q": "Approximate diameter of the areola:", "options": ["1cm", "2.5cm", "5cm", "7cm"], "a": 1, "note": ""}, {"q": "Sebaceous glands in the areola that lubricate the nipple during pregnancy/breastfeeding are called:", "options": ["Bartholin's glands", "Montgomery's tubercles", "Skene's glands", "Acini glands"], "a": 1, "note": ""}, {"q": "Approximate length of the nipple:", "options": ["1mm", "6mm", "2cm", "5cm"], "a": 1, "note": ""}, {"q": "The functioning, milk-producing part of the breast is the:", "options": ["Fibrous tissue", "Adipose tissue", "Glandular tissue", "Areola"], "a": 2, "note": ""}, {"q": "The breast's glandular tissue is arranged into approximately how many lobes?", "options": ["5-10", "18-20", "30-40", "50-60"], "a": 1, "note": ""}, {"q": "Milk-secreting cells within the alveoli are called:", "options": ["Myoepithelial cells", "Acini cells", "Basket cells only", "Stromal cells"], "a": 1, "note": ""}, {"q": "Contractile cells surrounding the alveoli that expel milk are called:", "options": ["Acini cells", "Myo-epithelial (basket) cells", "Goblet cells", "Ciliated cells"], "a": 1, "note": ""}, {"q": "Myoepithelial cells contract in response to which hormone?", "options": ["Prolactin", "Oxytocin", "FSH", "LH"], "a": 1, "note": ""}, {"q": "Small ducts leading from the alveoli that drain milk into larger ducts are the:", "options": ["Lactiferous ducts", "Lactiferous tubules", "Ampulla", "Areola ducts"], "a": 1, "note": ""}, {"q": "The widened reservoir portion of the lactiferous duct under the areola is the:", "options": ["Lobule", "Ampulla", "Alveolus", "Nipple pit"], "a": 1, "note": ""}, {"q": "Blood supply to the breast is via the internal and external:", "options": ["Iliac arteries", "Mammary arteries", "Pudendal arteries", "Ovarian arteries"], "a": 1, "note": ""}, {"q": "Lymphatic drainage of the breast includes axillary, mediastinal glands and the:", "options": ["Inguinal glands", "Portal fissure of the liver", "Sacral glands", "Lumbar glands"], "a": 1, "note": ""}, {"q": "Because lymphatic vessels of each breast communicate freely with each other, this explains:", "options": ["Increased milk production", "Spread of malignant growth from one breast to the other", "Reduced infection risk", "Faster wound healing"], "a": 1, "note": ""}, {"q": "Development of the mammary gland begins around which week of gestation?", "options": ["Week 2", "Week 4", "Week 10", "Week 20"], "a": 1, "note": ""}, {"q": "The ectodermal thickening from which mammary glands develop is called the:", "options": ["Genital ridge", "Mammary ridge/milk line", "Neural crest", "Urogenital fold"], "a": 1, "note": ""}, {"q": "Temporary breast secretion sometimes seen in newborns due to maternal hormones is called:", "options": ["Colostrum", "Witches' milk", "Foremilk", "Hindmilk"], "a": 1, "note": ""}, {"q": "During puberty, breast duct growth is mainly driven by:", "options": ["Testosterone", "Oestrogen, progesterone, prolactin and growth hormones", "Insulin only", "Cortisol only"], "a": 1, "note": ""}, {"q": "Which hormone is primarily responsible for milk production (acting on acini cells)?", "options": ["Oxytocin", "Prolactin", "Relaxin", "Inhibin"], "a": 1, "note": ""}, {"q": "The let-down (milk ejection) reflex is mediated by:", "options": ["Prolactin", "Oxytocin", "FSH", "hCG"], "a": 1, "note": ""}, {"q": "Absence of the nipple is called:", "options": ["Amastia", "Athelia", "Polythelia", "Polymastia"], "a": 1, "note": ""}, {"q": "The presence of an extra nipple is called:", "op ourethral glands (lubricating mucus, neutralizes acidic urine traces).", "Penis: root, body, glans; 2 corpora cavernosa + 1 corpus spongiosum (surrounds urethra, forms glans).", "Hormonal control: GnRH (hypothalamus)\u2192FSH (acts on Sertoli cells) & LH (acts on Leydig cells\u2192testosterone); Inhibin (from Sertoli cells) reduces FSH via negative feedback.", "Clinical conditions: Cryptorchidism (undescended testes), Testicular torsion (emergency), Hydrocele, Varicocele, Epididymitis/orchitis, Benign prostatic enlargement, Infertility."], "questions": [{"q": "The male gonads are the:", "options": ["Epididymides", "Two testes", "Seminal vesicles", "Prostate"], "a": 1, "note": ""}, {"q": "The scrotum keeps the testes at approximately what temperature relative to core body temperature?", "options": ["2-3\u00b0C above", "2-3\u00b0C below", "Equal to", "10\u00b0C below"], "a": 1, "note": ""}, {"q": "Which scrotal muscle wrinkles the skin in cold conditions?", "options": ["Cremaster muscle", "Dartos muscle", "Levator ani", "Detrusor muscle"], "a": 1, "note": ""}, {"q": "Which muscle raises the testes closer to the body in cold conditions?", "options": ["Dartos muscle", "Cremaster muscle", "Bulbospongiosus", "Ischiocavernosus"], "a": 1, "note": ""}, {"q": "The strong fibrous capsule surrounding the testis is the:", "options": ["Tunica vaginalis", "Tunica albuginea", "Tunica vasculosa", "Mediastinum testis"], "a": 1, "note": ""}, {"q": "The serous sac covering the front and sides of the testis, allowing it to move with little friction, is the:", "options": ["Tunica albuginea", "Tunica vaginalis", "Tunica vasculosa", "Rete testis"], "a": 1, "note": ""}, {"q": "Sertoli cells function to:", "options": ["Produce testosterone", "Support, nourish germ cells and form the blood-testis barrier", "Store sperm long term", "Produce seminal fluid"], "a": 1, "note": ""}, {"q": "Leydig cells are located:", "options": ["Within the seminiferous tubule lining", "In connective tissue between  \u2192 epididymis \u2192 rete testis"], "a": 1, "note": ""}, {"q": "The main site of sperm maturation and temporary storage is the:", "options": ["Seminal vesicle", "Epididymis", "Prostate", "Bulbourethral gland"], "a": 1, "note": ""}, {"q": "Approximate length of the ductus (vas) deferens:", "options": ["10cm", "20cm", "45cm", "70cm"], "a": 2, "note": ""}, {"q": "The pampiniform plexus in the spermatic cord functions to:", "options": ["Produce sperm", "Cool arterial blood before it reaches the testis", "Store sperm", "Produce testosterone"], "a": 1, "note": ""}, {"q": "Seminal vesicles contribute a fluid that is:", "options": ["Acidic and low in nutrients", "Alkaline and fructose-rich", "Purely mucus", "Identical to prostatic fluid"], "a": 1, "note": ""}, {"q": "The prostate gland adds a fluid containing citrate, enzymes and:", "options": ["Fructose only", "Prostate-specific antigen (PSA)", "Testosterone", "Inhibin"], "a": 1, "note": ""}, {"q": "Bulbourethral glands secrete mucus that helps to:", "options": ["Increase acidity of semen", "Neutralise traces of acidic urine and lubricate the urethra", "Produce sperm", "Store sperm"], "a": 1, "note": ""}, {"q": "Inhibin, secreted by Sertoli cells, acts to:", "options": ["Increase FSH secretion", "Reduce FSH secretion via negative feedback", "Increase testosterone directly", "Stop LH production only"], "a": 1, "note": ""}, {"q": "Failure of one or both testes to descend into the scrotum is called:", "options": ["Varicocele", "Cryptorchidism", "Hydrocele", "Testicular torsion"], "a": 1, "note": ""}, {"q": "Sudden severe scrotal pain from twisting of the spermatic cord is called:", "options": ["Hydrocele", "Varicocele", "Testicular torsion (an emergency)", "Epididymitis"], "a": 2, "note": ""}]}]

<script>
const UNITS = JSON.parse(document.getElementById('quiz-data').textContent);

const AFFIRMATIONS = [
  "You're glowing today, Priscy 💗 one unit at a time!",
  "Smart, soft, and unstoppable — that's you, Priscy 👑",
  "Every question you answer makes you a stronger midwife 💫",
  "Take a breath, sip some water, you're doing amazing 💧✨",
  "Your future patients are lucky to have you someday 💕",
  "Small steps today, big graduation gown tomorrow 🎓💜",
  "You are so capable, Priscy. Keep going, gem 💎",
  "Progress > perfection. Look how far you've come 🌷",
  "Priscy the future midwife, casually being brilliant ✨",
  "Rest if you need to, then come back and shine 🌙"
];

const PROGRESS_KEY='priscy_midwifery_scores';
function loadProgress(){ try{ return JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}'); }catch(e){ return {}; } }
function saveProgress(v){ try{ localStorage.setItem(PROGRESS_KEY,JSON.stringify(v)); }catch(e){} }
function resetProgress(){ if(confirm('Reset all your saved scores on this device?')){ try{ localStorage.removeItem(PROGRESS_KEY); }catch(e){} location.reload(); } }
let scores = {}; // unitId -> {done, correct}
UNITS.forEach(u => scores[u.id] = {done:0, correct:0, total:u.questions.length});
{ const saved = loadProgress(); UNITS.forEach(u => { const s = saved[u.id]; if(s && s.total === u.questions.length) scores[u.id] = s; }); }

let currentUnitId = UNITS[0].id;

function renderDecorations(){
  const layer = document.getElementById('deco-layer');
  const items = [
    {type:'cloud', emoji:'☁️', size:'3.2rem'},
    {type:'cloud', emoji:'☁️', size:'2.2rem'},
    {type:'cloud', emoji:'☁️', size:'4rem'},
    {type:'heart', emoji:'💗', size:'1.6rem'},
    {type:'heart', emoji:'💜', size:'1.3rem'},
    {type:'heart', emoji:'💕', size:'1.8rem'},
    {type:'gem', emoji:'💎', size:'1.6rem'},
    {type:'gem', emoji:'💠', size:'1.4rem'},
    {type:'crown', emoji:'👑', size:'1.8rem'},
    {type:'crown', emoji:'👑', size:'1.4rem'},
    {type:'sparkle', emoji:'✨', size:'1.3rem'},
    {type:'sparkle', emoji:'✨', size:'1.1rem'},
    {type:'sparkle', emoji:'🌟', size:'1.5rem'},
    {type:'heart', emoji:'💓', size:'1.5rem'},
    {type:'cloud', emoji:'☁️', size:'2.6rem'},
  ];
  items.forEach((it, i) => {
    const el = document.createElement('div');
    el.className = 'floaty ' + it.type;
    el.textContent = it.emoji;
    el.style.fontSize = it.size;
    el.style.left = (Math.random()*94)+'vw';
    el.style.top = (Math.random()*90)+'vh';
    el.style.animationDuration = (14 + Math.random()*14)+'s';
    el.style.animationDelay = (Math.random()*8)+'s';
    layer.appendChild(el);
  });
}

function renderNav(){
  const list = document.getElementById('unitList');
  list.innerHTML = '';
  UNITS.forEach(u => {
    const btn = document.createElement('button');
    btn.className = 'unit-btn' + (u.id === currentUnitId ? ' active' : '');
    const s = scores[u.id];
    btn.innerHTML = `<span class="emoji">${u.icon}</span><span>${u.title}</span>` +
      (s.done > 0 ? `<span class="score-pill">${s.correct}/${s.done}</span>` : '');
    btn.onclick = () => { currentUnitId = u.id; renderNav(); renderMain(); window.scrollTo({top:0, behavior:'smooth'}); };
    list.appendChild(btn);
  });
}

function renderMain(){
  const unit = UNITS.find(u => u.id === currentUnitId);
  const main = document.getElementById('mainContent');

  let summaryHtml = unit.summary.map(s => `<li>${s}</li>`).join('');
  let quizHtml = unit.questions.map((q, idx) => {
    let optsHtml = q.options.map((opt, oi) => `
      <label class="opt" data-oi="${oi}">
        <input type="radio" name="q${idx}" value="${oi}">
        <span>${opt}</span>
      </label>`).join('');
    return `
      <div class="qcard" id="qcard-${idx}" data-answer="${q.a}">
        <div class="qtext"><span class="qnum">Q${idx+1}.</span>${q.q}</div>
        <div class="opts">${optsHtml}</div>
      </div>`;
  }).join('');

  main.innerHTML = `
    <div class="unit-header">
      <div class="big-emoji">${unit.icon}</div>
      <div>
        <h2>${unit.title}</h2>
        <div class="unit-tagline">Sparkle through this unit, one fact at a time 💫</div>
      </div>
    </div>

    <div class="summary-card">
      <h3>💜 Quick Review</h3>
      <ul>${summaryHtml}</ul>
    </div>

    <div class="quiz-toolbar">
      <h3>🌸 Practice Quiz — ${unit.questions.length} questions</h3>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn" id="checkAllBtn">Check my answers 💗</button>
        <button class="btn ghost" id="resetBtn">Reset quiz 🔄</button>
      </div>
    </div>

    <div id="quizArea">${quizHtml}</div>
    <div class="result-banner" id="resultBanner"></div>
  `;

  document.getElementById('checkAllBtn').onclick = () => checkAnswers(unit);
  document.getElementById('resetBtn').onclick = () => renderMain();

  // click-to-select styling
  document.querySelectorAll('#quizArea .opt').forEach(label => {
    label.addEventListener('click', () => {
      const card = label.closest('.qcard');
      if (card.classList.contains('answered')) return;
      card.querySelectorAll('.opt').forEach(o => o.style.background = 'rgba(255,255,255,0.6)');
    });
  });
}

function checkAnswers(unit){
  let correct = 0;
  let answeredCount = 0;
  unit.questions.forEach((q, idx) => {
    const card = document.getElementById('qcard-' + idx);
    const selected = card.querySelector('input[type=radio]:checked');
    card.classList.add('answered');
    const opts = card.querySelectorAll('.opt');
    if (selected){
      answeredCount++;
      const sel = parseInt(selected.value);
      opts.forEach((o, oi) => {
        if (oi === q.a) o.classList.add('correct');
        else if (oi === sel) o.classList.add('incorrect');
      });
      if (sel === q.a) correct++;
    } else {
      opts[q.a].classList.add('correct');
    }
  });

  scores[unit.id] = {done: unit.questions.length, correct, total: unit.questions.length};
  saveProgress(scores);
  renderNav();

  const banner = document.getElementById('resultBanner');
  banner.style.display = 'block';
  const pct = Math.round((correct/unit.questions.length)*100);
  let msg = `You scored ${correct}/${unit.questions.length} (${pct}%) 💕`;
  if (pct === 100) msg += " — PERFECT, Priscy! You're an absolute queen 👑✨";
  else if (pct >= 80) msg += " — amazing work, gem! 💎";
  else if (pct >= 50) msg += " — good progress, keep glowing 🌷";
  else msg += " — no worries, review and try again, you've got this 💪💗";
  banner.textContent = msg;
  banner.scrollIntoView({behavior:'smooth', block:'center'});
}

function cycleAffirmation(){
  const el = document.getElementById('affirmation');
  el.style.opacity = 0;
  setTimeout(() => {
    el.textContent = AFFIRMATIONS[Math.floor(Math.random()*AFFIRMATIONS.length)];
    el.style.transition = 'opacity 0.6s ease';
    el.style.opacity = 1;
  }, 300);
}

renderDecorations();
renderNav();
renderMain();
cycleAffirmation();
setInterval(cycleAffirmation, 9000);
</script>
</body>
</html>
