<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priscy's Midwifery Quiz Garden 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff8fd6;--pink-bright:#ff4fc3;--blue:#7fd6ff;--blue-bright:#3fb8ff;--purple:#b98cff;--purple-bright:#9b4dff;--deep:#5a3a7a;--shadow:rgba(154,77,255,.25);--good:#5fce9a;--bad:#ff6f8e;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Quicksand',sans-serif;color:var(--deep);min-height:100vh;background:linear-gradient(135deg,#ffe3f6 0%,#dcefff 35%,#ecdcff 65%,#ffe3f6 100%);background-size:400% 400%;animation:bgshift 22s ease infinite;overflow-x:hidden;}
@keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
h1,h2,h3,h4{font-family:'Baloo 2',cursive;margin:0;}
#deco-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.floaty{position:absolute;opacity:.8;filter:drop-shadow(0 4px 10px rgba(154,77,255,.25));animation-timing-function:ease-in-out;animation-iteration-count:infinite;}
.cloud{animation-name:driftX}.heart{animation-name:bobY}.gem{animation-name:spinBob}.sparkle{animation-name:twinkle}
@keyframes driftX{0%,100%{transform:translateX(-10vw)}50%{transform:translateX(10vw) translateY(-2vh)}}
@keyframes bobY{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-22px) rotate(4deg)}}
@keyframes spinBob{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.floaty,body{animation:none!important}}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:24px 18px 80px;}
header.hero{text-align:center;padding:14px 10px 18px;}
.hero h1{font-size:clamp(1.7rem,4vw,2.7rem);background:linear-gradient(90deg,var(--pink-bright),var(--purple-bright),var(--blue-bright));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero .sub{font-size:1.02rem;margin-top:6px;color:#7a4fa8;font-weight:600;}
.affirmation{margin:12px auto 0;max-width:600px;background:rgba(255,255,255,.65);border:2px dashed var(--pink);border-radius:20px;padding:10px 18px;font-weight:600;color:#a13d9a;backdrop-filter:blur(3px);min-height:46px;transition:opacity .6s;}
.layout{display:grid;grid-template-columns:290px 1fr;gap:22px;margin-top:20px;}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
nav.units{background:rgba(255,255,255,.55);border-radius:24px;padding:14px;height:fit-content;border:2px solid rgba(255,255,255,.8);box-shadow:0 10px 30px var(--shadow);backdrop-filter:blur(6px);position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;}
@media (max-width:860px){nav.units{position:static;max-height:260px}}
nav.units h3{padding:6px 10px 10px;color:#7a3fae;font-size:1rem;}
.unit-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;cursor:pointer;padding:9px 11px;margin-bottom:5px;border-radius:14px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:.88rem;color:#5a3a7a;transition:all .2s;}
.unit-btn:hover{background:rgba(255,143,214,.18);transform:translateX(3px)}
.unit-btn:focus-visible,.btn:focus-visible,.opt:focus-within{outline:3px solid var(--purple-bright);outline-offset:2px}
.unit-btn.active{background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;box-shadow:0 6px 14px var(--shadow)}
.unit-btn .emoji{font-size:1.15rem}
.unit-btn .num{opacity:.7;font-size:.75rem}
.pill{margin-left:auto;font-size:.7rem;background:rgba(255,255,255,.7);border-radius:10px;padding:2px 7px;color:#7a3fae;font-weight:700;white-space:nowrap}
.unit-btn.active .pill{background:rgba(255,255,255,.35);color:#fff}
main.content{background:rgba(255,255,255,.62);border-radius:28px;padding:24px 26px 32px;border:2px solid rgba(255,255,255,.85);box-shadow:0 14px 40px var(--shadow);backdrop-filter:blur(6px);min-height:420px;}
.unit-header{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.big-emoji{font-size:2.4rem}
.unit-header h2{font-size:clamp(1.25rem,2.6vw,1.75rem);color:#7a3fae}
.tagline{color:#a9679b;font-weight:600;margin:2px 0 16px}
.card{background:linear-gradient(135deg,rgba(255,214,236,.55),rgba(180,214,255,.4));border-radius:20px;padding:16px 20px;margin-bottom:20px;border:1px solid rgba(255,255,255,.7)}
.card h3{color:#5a3a7a;margin-bottom:8px;font-size:1.05rem}
.card ul{margin:0;padding-left:20px}.card li{margin-bottom:7px;line-height:1.5;font-size:.95rem}
.rules{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}
.rule{background:rgba(255,255,255,.75);border:1.5px solid rgba(154,77,255,.2);border-radius:14px;padding:8px 14px;font-weight:700;font-size:.9rem}
.btn{font-family:'Baloo 2',cursive;border:none;cursor:pointer;border-radius:999px;padding:11px 24px;font-size:1rem;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--pink-bright),var(--purple-bright));box-shadow:0 6px 16px var(--shadow);transition:transform .15s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn.ghost{background:rgba(255,255,255,.75);color:#7a3fae;box-shadow:none;border:2px solid var(--pink)}
.btn.big{font-size:1.25rem;padding:14px 36px}
.center{text-align:center}
.best{margin-top:12px;font-weight:700;color:#a13d9a}
/* quiz */
.timerbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);border-radius:18px;padding:10px 16px;margin:0 0 16px;box-shadow:0 8px 20px var(--shadow);border:2px solid var(--pink);backdrop-filter:blur(6px)}
.timerrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.clock{font-family:'Baloo 2',cursive;font-size:1.7rem;color:#7a3fae;font-variant-numeric:tabular-nums}
.clock.low{color:#e0245e;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.prog{font-weight:700;font-size:.9rem}
.track{height:10px;background:rgba(154,77,255,.15);border-radius:99px;margin-top:8px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--pink-bright),var(--purple-bright));border-radius:99px;transition:width .3s}
.timefill{height:6px;margin-top:6px;background:rgba(63,184,255,.2);border-radius:99px;overflow:hidden}
.timefill>div{height:100%;width:100%;background:linear-gradient(90deg,var(--blue-bright),var(--purple));transition:width 1s linear}
.love{margin-top:8px;font-size:.85rem;font-weight:600;color:#a13d9a;min-height:1.2em}
.qcard{background:rgba(255,255,255,.78);border-radius:18px;padding:15px 18px;margin-bottom:13px;border:2px solid transparent}
.qcard.unans{border-color:var(--pink)}
.qtext{font-weight:700;color:#4a3068;margin-bottom:10px;line-height:1.45}
.qnum{color:var(--pink-bright);margin-right:6px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;margin-bottom:7px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.65);border:1.5px solid rgba(154,77,255,.15);font-weight:600;font-size:.92rem;line-height:1.4}
.opt:hover{background:rgba(180,214,255,.35)}
.opt input{accent-color:var(--purple-bright);margin-top:3px}
.opt.sel{background:rgba(185,140,255,.22);border-color:var(--purple-bright)}
.opt.correct{background:rgba(140,230,180,.55);border-color:var(--good)}
.opt.incorrect{background:rgba(255,150,170,.5);border-color:var(--bad)}
.opt.locked{pointer-events:none}
.tag{margin-left:auto;font-size:.72rem;font-weight:800;white-space:nowrap;padding-left:8px}
.expl{margin-top:8px;padding:10px 14px;border-radius:12px;background:linear-gradient(120deg,rgba(255,235,248,.9),rgba(226,240,255,.9));border-left:5px solid var(--purple-bright);font-size:.9rem;line-height:1.5}
.expl b{color:#7a3fae}
.verdict{font-family:'Baloo 2',cursive;font-size:.9rem;margin-bottom:6px}
.verdict.ok{color:#1c8f5c}.verdict.no{color:#d0244f}.verdict.skip{color:#a9679b}
.submitrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.result{text-align:center;padding:22px 18px;border-radius:22px;margin-bottom:18px;background:linear-gradient(120deg,rgba(255,214,236,.8),rgba(200,180,255,.65));}
.result .score{font-family:'Baloo 2',cursive;font-size:2.6rem;color:#7a3fae;line-height:1.1}
.result .msg{font-weight:700;margin-top:8px;font-size:1.05rem;line-height:1.5}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.stat{background:rgba(255,255,255,.8);border-radius:14px;padding:6px 14px;font-weight:700;font-size:.88rem}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{border:2px solid var(--pink);background:rgba(255,255,255,.75);color:#7a3fae;border-radius:99px;padding:6px 14px;font-weight:700;cursor:pointer;font-family:'Quicksand',sans-serif}
.chip.on{background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;border-color:transparent}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:#fff;border:2px solid var(--pink);border-radius:18px;padding:12px 20px;font-weight:700;color:#a13d9a;box-shadow:0 10px 30px var(--shadow);z-index:50;max-width:92vw;text-align:center;transition:all .4s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer.note{text-align:center;margin-top:28px;color:#9a6fbf;font-size:.85rem;font-weight:600}
</style>
</head>
<body>
<div id="deco-layer"></div>
<div class="wrap">
  <header class="hero">
    <h1>Priscy's Midwifery Quiz Garden ✨</h1>
    <div class="sub">Physiology &amp; Normal Pregnancy — 15 units, 30 questions each 💗</div>
    <div class="affirmation" id="affirmation" aria-live="polite"></div>
  </header>
  <div class="layout">
    <nav class="units" aria-label="Units"><h3>🌸 Pick a unit, Priscy!</h3><div id="unitList"></div></nav>
    <main class="content" id="main"></main>
  </div>
  <footer class="note">made with 💕 for Priscy — every answer is a petal, and you're growing a whole garden 🌷👑<br><a href="#" onclick="resetProgress();return false;" style="font-size:.8rem;opacity:.65;color:inherit">Reset my saved scores</a></footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script id="quiz-data" type="application/json">[{"id":"u1","icon":"💗","title":"Reproductive Health & Safe Motherhood","recap":["Reproductive health = complete physical, mental and social well-being, not merely the absence of disease.","Safe motherhood: a woman can choose pregnancy and gets care to avoid death or disability from complications.","Clinical decision making has five steps: gather, interpret, plan (with client input), implement, evaluate."],"qs":[{"q":"Reproductive health is best defined as a state of…","o":["complete physical, mental and social well-being in all matters of the reproductive system","absence of disease of the reproductive organs only","freedom from pregnancy and childbirth","access to family planning services only"],"e":"It covers complete well-being, not merely the absence of disease or infirmity."},{"q":"Which of these is a listed component of reproductive health?","o":["Prevention and management of unsafe abortion and post-abortion care","Treatment of malaria only","Dental hygiene programmes","Sports injury management"],"e":"Post-abortion care is a listed component; safe abortion services are provided where the law permits."},{"q":"FGM, early marriage and domestic or sexual violence are examples of…","o":["harmful practices that reproductive health seeks to eliminate","traditional fertility treatments","routine screening tests","methods of family planning"],"e":"They are harmful traditional practices to be discouraged and eliminated."},{"q":"Responding to concerns about which life stage is a component of reproductive health?","o":["Menopause","Weaning","Teething","School entry"],"e":"Menopause concerns are explicitly listed among the components."},{"q":"Safe motherhood is best defined as…","o":["creating circumstances in which a woman can choose pregnancy and receives care to avoid death or disability from complications","delivering every baby by caesarean section","providing postnatal check-ups only","preventing all pregnancies"],"e":"It spans choice, prevention, treatment, emergency obstetric care and care after birth."},{"q":"Safe motherhood can also be defined as…","o":["a woman's ability to have a safe and healthy pregnancy and childbirth","a woman's right to skip antenatal visits","the capacity of a hospital's labour ward","a country's birth rate"],"e":"This is the short definition given in your notes."},{"q":"The main goal of safe motherhood is to…","o":["improve women's health and reduce maternal mortality and morbidity, contributing to lower infant mortality","increase the national birth rate","replace all trained attendants","promote home births only"],"e":"Maternal health is the focus, with infant mortality and morbidity also reduced."},{"q":"Which is NOT a component of safe motherhood?","o":["Cosmetic surgery","Antenatal care","Postnatal care","Breastfeeding"],"e":"The listed components are antenatal, labour and delivery, postnatal, breastfeeding, family planning, health education and preconception care."},{"q":"Which of these is also a component of safe motherhood?","o":["Preconception care","Elective hysterectomy","Cosmetic care","Dental extraction"],"e":"Preconception care sits alongside antenatal, labour, postnatal, breastfeeding, FP and health education."},{"q":"Immunoglobulin is given to babies after birth if the mother is…","o":["Hepatitis B positive","Rhesus positive","anaemic","diabetic"],"e":"Hepatitis B immunoglobulin protects the newborn of a Hep B positive mother."},{"q":"Macrosomia means…","o":["a big baby","a small baby","a premature baby","twin pregnancy"],"e":"Macrosomic baby = big baby, one of the risks of maternal obesity."},{"q":"Which group is a target group of safe motherhood?","o":["Men, families and communities","Only married women over 40","Only hospital staff","Only women already in labour"],"e":"Target groups include couples, adolescents, pregnant and puerperal women and babies, men, families and communities."},{"q":"One objective of safe motherhood is to help the client develop…","o":["birth preparedness and complication readiness plans","a vehicle registration plan","a tax plan","a fitness programme only"],"e":"Birth preparedness and complication readiness planning is a stated objective."},{"q":"Safe motherhood aims to prevent mother-to-child transmission of…","o":["HIV/AIDS","asthma","diabetes","migraine"],"e":"Preventing MTCT of HIV/AIDS is one of the nine objectives."},{"q":"A safe motherhood objective for delivery is to ensure…","o":["a full-term healthy baby with minimal stress or injury to mother and baby","every delivery is instrumental","fast delivery whatever the condition","delivery before term"],"e":"Safe delivery means healthy full-term baby and minimal injury."},{"q":"Safe motherhood education for mother and baby includes…","o":["nutrition, FP, STI/HIV prevention, danger signs, rest/sleep and hygiene","nutrition only","immunisation only","exercise only"],"e":"A broad package promotes physical, mental and social health."},{"q":"Which objective involves detecting problems in pregnancy?","o":["To detect and treat all complications, whether surgical, medical or obstetric","To treat only obstetric complications","To refer every pregnancy to a specialist","To ignore medical conditions"],"e":"All complications are covered — surgical, medical and obstetric."},{"q":"Clinical decision making is…","o":["a purposeful, organised thinking process to gather information, assess, diagnose, care and evaluate","a random selection of treatments","a laboratory test","a referral form"],"e":"It is a logical series of steps that links assessment, care and evaluation."},{"q":"How many steps are in clinical decision making?","o":["Five","Three","Seven","Ten"],"e":"Gather, interpret, plan, implement, evaluate."},{"q":"Step 1 of clinical decision making is…","o":["gathering information (look, listen, feel)","evaluating the plan","implementing the plan","developing an action plan"],"e":"Step 1 uses history, physical exam, laboratory tests and previous records."},{"q":"Which is NOT part of gathering information?","o":["Implementing treatment","Client history","Physical examination","Laboratory investigations"],"e":"Implementing treatment is Step 4."},{"q":"Step 2 involves…","o":["interpreting the information and identifying the problem or making a diagnosis","recording information","giving return appointments","taking the history"],"e":"Interpretation turns the gathered data into a diagnosis."},{"q":"The action plan in Step 3 must be developed…","o":["with client input","by the doctor alone","by the family alone","after evaluation"],"e":"The plan is individualised and made with the client's input."},{"q":"An individualised plan takes into account the client's…","o":["preferences, lifestyle, cultural beliefs and socioeconomic status","cost of drugs only","hospital policy only","age only"],"e":"Care is tailored to the client's needs and circumstances."},{"q":"Which activity belongs to Step 4 (implementing the plan)?","o":["Giving a return appointment","Identifying the problem","Reviewing previous records","Asking whether the plan was effective"],"e":"Step 4 includes treatments, education, lab tests, referral, recording and return appointment."},{"q":"Step 5, evaluating the plan, asks…","o":["Was the plan carried out, was it effective, does it need modification?","What is the client's history?","What is the diagnosis?","Which drug should be given?"],"e":"Evaluation may lead to a new history, re-examination or repeat lab tests."},{"q":"A benefit of clinical decision making is that it…","o":["links assessment with care provision and evaluation through logical steps","replaces record keeping","removes the need for the client's input","shortens training"],"e":"It creates a logical chain from assessment through to evaluation."},{"q":"Using clinical decision making steps improves…","o":["communication among various providers caring for one client","the price of drugs","bed capacity","salaries"],"e":"Shared logical steps help providers communicate."},{"q":"In focused antenatal care, clinical decision making promotes care that avoids…","o":["unnecessary, inappropriate or excessive treatments","all laboratory tests","client involvement","record keeping"],"e":"It keeps care focused and appropriate."},{"q":"Clinical decision making in FANC enables effective use of information so that…","o":["problems or needs can be correctly identified","every client is referred","no records are needed","drugs are given to all"],"e":"Well-used information leads to correct identification of problems and needs."}]},{"id":"u2","icon":"🌷","title":"Preconception Care","recap":["Care given to the couple before pregnancy — usually 3 months to 1 year before conception.","BMI = weight (kg) ÷ height² (m²). Optimal is about 23; extremes raise risks.","Investigations: BMI, BP, urinalysis, Hb, sickling, grouping, semen analysis, smear/HVS, VDRL, rubella immunity."],"qs":[{"q":"Preconception care is…","o":["specialised care and advice given to a couple before they embark on pregnancy","care given only in labour","care of the newborn","drug treatment of infertility only"],"e":"It is given by a doctor, midwife or nurse before pregnancy begins."},{"q":"The usual period of preconception care is…","o":["three months to one year before conception","the first trimester","six weeks after delivery","during labour"],"e":"Care starts well before conception so health can be optimised."},{"q":"Preconception care is essential for…","o":["all partners unless the pregnancy is unplanned","women over 35 only","women with a previous caesarean only","first-time mothers only"],"e":"It is essential for all couples planning pregnancy."},{"q":"One aim of preconception care is to ensure that…","o":["the woman and her partner are in optimal physical and emotional health at the onset of pregnancy","ovulation is induced","pregnancy is confirmed","antenatal visits are reduced"],"e":"Optimal health at conception is the central aim."},{"q":"Preconception care also aims to…","o":["enhance growth and avoid fetal abnormality","shorten labour","induce menstruation","replace antenatal care"],"e":"Healthy parents at conception support normal fetal growth."},{"q":"Preconception care gives prospective parents…","o":["options that may not be available once pregnancy is confirmed","an automatic referral","free medication","a delivery date"],"e":"Some choices are only possible before conception."},{"q":"Which information is elicited in the social history?","o":["Occupation, diet, smoking and alcohol","Only blood group","Only previous surgery","Only the partner's name"],"e":"The social history also covers personal details."},{"q":"The Quetelet score is another name for…","o":["body mass index","blood pressure","haemoglobin level","Apgar score"],"e":"BMI is calculated by dividing weight in kg by height in metres squared."},{"q":"BMI is calculated as…","o":["weight in kg divided by height in metres squared","height divided by weight","weight multiplied by height","weight divided by age"],"e":"This is the Quetelet formula."},{"q":"A woman weighs 90 kg and is 1.60 m tall. Her BMI is about…","o":["35.16","56.25","14.4","28.1"],"e":"90 ÷ (1.6 × 1.6) = 90 ÷ 2.56 = 35.16."},{"q":"A BMI of 30–39.9 is classified as…","o":["obese (Grade III)","healthy (Grade I)","overweight (Grade II)","underweight (Grade 0)"],"e":"BMI 30–39.9 falls in Grade III, obese."},{"q":"A BMI below 20 is classified as…","o":["underweight (Grade 0)","healthy","overweight","obese"],"e":"Grade 0 is below 20."},{"q":"A BMI of 25–29.9 is classified as…","o":["overweight (Grade II)","healthy","obese","underweight"],"e":"Grade II = overweight."},{"q":"The optimal BMI for fertility and a healthy baby is around…","o":["23","15","35","42"],"e":"BMI around 23 supports maximum fertility and normal birth weight."},{"q":"Low pre-pregnancy weight is associated with…","o":["low birth weight, uterine growth restriction and preterm labour","gestational diabetes and macrosomia","neural tube defects only","no increased risk"],"e":"Underweight women risk small babies and early labour."},{"q":"Overweight and obesity could result in…","o":["gestational diabetes and pregnancy-induced hypertension","low birth weight babies","preterm labour only","uterine growth restriction"],"e":"These are the notes' listed risks of raised BMI."},{"q":"Severe obesity could result in…","o":["high caesarean rates, macrosomia, neural tube defects and late fetal deaths","only mild backache","no complications","low birth weight only"],"e":"Severe obesity carries major obstetric and fetal risks."},{"q":"Dietary change and weight loss should occur at least…","o":["3–4 months before attempting conception","the week of conception","in the third trimester","after delivery"],"e":"Time is needed to adjust weight safely before conception."},{"q":"The male investigation done in preconception care is…","o":["semen analysis","cervical smear","high vaginal swab","rubella immunity"],"e":"Semen analysis assesses the male partner's fertility."},{"q":"Which investigations are specific to the female partner?","o":["Cervical smear and high vaginal swab (HVS)","Semen analysis","Testicular biopsy","Prostate examination"],"e":"These screen for cervical changes and infection."},{"q":"VDRL is done to screen for…","o":["syphilis","rubella","sickle cell disease","anaemia"],"e":"VDRL = Venereal Diseases Research Laboratory test."},{"q":"Blood tests in preconception care include…","o":["haemoglobin, sickling and blood grouping","blood sugar only","cholesterol only","malaria only"],"e":"These detect anaemia, haemoglobinopathies and Rhesus status."},{"q":"Why is nutrition before and just after conception so important?","o":["Cell organisation, differentiation and organogenesis occur in the first weeks before pregnancy is recognised","Fetal weight is set at birth","The placenta does not form until term","Breast milk is made early"],"e":"Damage at this time can cause fetal harm and stunted growth."},{"q":"An energy-deficient diet before conception may result in…","o":["nutritional deficiencies affecting organogenesis and cell differentiation","faster fetal growth","no effect","macrosomia"],"e":"The fetus could be disadvantaged from the very start."},{"q":"Which women benefit from preconception care?","o":["Those with a previous stillbirth, preterm labour or a caesarean section","Women with no risk factors only","Only women under 20","Only postmenopausal women"],"e":"Previous unsuccessful pregnancy or obstetric complications are indications."},{"q":"Which chronic conditions are listed for women needing preconception care?","o":["Heart disease, hypertension, diabetes and epilepsy","Common cold and headache","Minor cuts","Mild seasonal allergy"],"e":"Women with continuing disease worry about pregnancy worsening their condition or harming the child."},{"q":"Which family history calls for preconception care?","o":["Diabetes, hypertension, sickle cell disease and haemophilia","Fair hair","Left-handedness","Short stature only"],"e":"These diseases can adversely affect the fetus."},{"q":"Which are examples of genetic problems needing special investigation?","o":["Down syndrome, Klinefelter syndrome, achondroplasia and cleft lip","Malaria and typhoid","Common cold","Hay fever"],"e":"Chromosomal studies are done by a specialist."},{"q":"Frigidity in women and premature ejaculation in men are examples of…","o":["psychosexual problems","genetic problems","infections","anatomical abnormalities"],"e":"They are psychosexual problems that need preconception counselling."},{"q":"Which blood group status is listed as needing preconception care?","o":["Rhesus negative","Rhesus positive","Group O positive","Group AB positive"],"e":"A Rhesus negative woman may need special care to protect future pregnancies."}]},{"id":"u3","icon":"🧠","title":"Psychology of Pregnancy","recap":["Psychology = scientific study of behaviour: understand, explain, predict and control.","Trimester moods: first = adjustment; second = 'radiant health' but anxiety and attachment; third = heaviness, fear of labour.","The midwife builds trust, educates, counsels, refers and involves a social worker when needed."],"qs":[{"q":"Psychology is…","o":["the scientific study of human behaviour","the study of the uterus","the study of hormones only","the study of diet"],"e":"Its aim is to understand, explain, predict and control behaviour."},{"q":"The aim of psychology is to…","o":["understand, explain, predict and control behaviour","diagnose infections","measure hormones","prescribe drugs"],"e":"Those four verbs summarise the aim."},{"q":"Pregnancy is best described as…","o":["the period of development and growth of a fetus inside its mother's uterus","the period after delivery","the time of ovulation","a menstrual disorder"],"e":"It runs from conception to delivery."},{"q":"The duration of pregnancy is counted from…","o":["the first day of the last menstruation","the day of conception","the first missed period","the first booking visit"],"e":"Gestation is dated from the LMP."},{"q":"The first trimester covers…","o":["the first 12 weeks","weeks 13–26","the last 12 weeks","the puerperium"],"e":"The second and third trimesters follow."},{"q":"Which trimester is often called 'radiant health'?","o":["The second trimester","The first trimester","The third trimester","The puerperium"],"e":"The woman generally feels good and is largely free of minor discomforts."},{"q":"Psychological changes during pregnancy are also called…","o":["pre-partum blues","quickening","engagement","lightening"],"e":"The woman feels different from her pre-pregnant state."},{"q":"Which hormones contribute to psychological change in pregnancy?","o":["Oestrogen, progesterone and HCG","Insulin only","Thyroxine only","Adrenaline only"],"e":"Their raised production affects mood."},{"q":"If a woman sees pregnancy as a burden or problem, her…","o":["level of anxiety and worry will be high","a ng without sex","total isolation","strenuous exercise","travelling"],"e":"Affection is wanted, though libido may be impaired."},{"q":"Impaired libido in pregnancy may be due to…","o":["fatigue, nausea, depression, painful enlarged breasts or worries","increased energy","weight loss","cold weather"],"e":"Physical and emotional discomforts reduce desire."},{"q":"If a pregnant woman is neglected she could…","o":["develop a mental illness","gain no weight","have a shorter labour","ovulate again"],"e":"Neglect is a risk factor for mental illness."},{"q":"Physiological discomforts that trigger third-trimester psychological change include…","o":["backache, heartburn and varicosity","morning sickness only","quickening","ptyalism only"],"e":"Along with altered body image and heaviness."},{"q":"Anxiety about fetal abnormality in the third trimester may cause…","o":["disturbed sleep or nightmares","rapid weight loss","ovulation","early labour always"],"e":"Worry commonly disturbs sleep."},{"q":"The third-trimester changes may be shown by…","o":["confusion, depression, indecision and forgetfulness","calmness and energy","increased concentration","a stronger memory"],"e":"Also inability to stand stress."},{"q":"Loneliness in late pregnancy may be linked to…","o":["maternity leave","antenatal clinic visits","ultrasound scanning","increased appetite"],"e":"Being at home alone can heighten anxiety."},{"q":"Knowing the psychology of pregnancy helps the midwife to…","o":["detect women likely to develop mental problems and refer them","avoid antenatal care","stop hormonal changes","treat all women identically"],"e":"Early detection allows timely referral beyond her scope."},{"q":"The midwife builds a relationship of trust so that the woman can…","o":["discuss her fears, interests and problems","avoid clinic visits","skip examinations","change her diet"],"e":"Trust makes disclosure possible."},{"q":"If anxiety or sorrow is related to socio-economic factors, the midwife should…","o":["s wer the vaginal pH to about 4.5–5.0 and protect against infection."},{"q":"The white vaginal discharge of pregnancy is called…","o":["leucorrhoea","menorrhagia","lochia","show"],"e":"Increased glycogen and lactic acid produce leucorrhoea."},{"q":"Which organism thrives in the pregnant vagina causing frequent vaginitis?","o":["Candida albicans","Doderlein bacillus","Lactobacillus only","Streptococcus viridans"],"e":"The altered connective tissue and glycogen favour Candida."},{"q":"In pregnancy the ovaries…","o":["are raised out of the pelvic cavity as the uterus enlarges","descend into the labia","enlarge to fill the pelvis","stop making hormones at once"],"e":"They are lifted up as the uterus grows."},{"q":"Ovulation during pregnancy is…","o":["suppressed","increased","unchanged","irregular"],"e":"Rising oestrogen and progesterone suppress ovulation."},{"q":"What happens to the Fallopian tubes in pregnancy?","o":["They are lifted out of the pelvis as the uterus grows","They shorten and close","They become the uterus","They enlarge to contain the fetus"],"e":"There is also some decidual reaction in the mucous membrane."},{"q":"A prickling, tingling sensation in the breasts is noticed at about…","o":["3–4 weeks","16 weeks","28 weeks","36 weeks"],"e":"This is the earliest breast change due to increased blood supply."},{"q":"Montgomery's tubercles appear at about…","o":["8–12 weeks","3–4 weeks","28 weeks","36 weeks"],"e":"These enlarged sebaceous glands keep the nipple soft and pliable."},{"q":"The secondary areola appears at about…","o":["16 weeks","4 weeks","8 weeks","40 weeks"],"e":"It is a mottled zone of pigmentation beyond the primary areola."},{"q":"Which hormone develops the breast duct system and fat deposition?","o":["Oestrogen","Progesterone","Prolactin","Oxytocin"],"e":"Oestrogen develops the ducts; progesterone the glandular tissue."},{"q":"Which hormone develops the glandular (alveolar) tissue of the breast?","o":["Progesterone","Oestrogen","Insulin","Thy e."},{"q":"In pregnancy the kidneys increase in length by about…","o":["1 cm","5 cm","10 cm","0.1 cm"],"e":"There is also an increase in weight."},{"q":"The ureters dilate and lengthen in pregnancy because of…","o":["progesterone","insulin","adrenaline","vasopressin"],"e":"Progesterone relaxes smooth muscle."},{"q":"Frequency of micturition at 8–12 weeks is due to…","o":["the enlarging pelvic uterus compressing the bladder","fetal head engagement","kidney failure","diabetes"],"e":"Frequency recurs near term when the presenting part engages."},{"q":"Urinary stasis in pregnancy predisposes the woman to…","o":["urinary tract infection such as pyelonephritis","urinary incontinence only","kidney stones only","polyuria only"],"e":"Slow ureteric peristalsis causes stasis."},{"q":"Oestrogen makes the gums oedematous and spongy. The midwife should advise…","o":["a soft toothbrush and regular dental check-ups","stopping brushing","hard brushing","tooth extraction"],"e":"Gums may bleed easily; inflammation is called epulis or gingivitis."},{"q":"Craving for unnatural substances such as coal or mud is called…","o":["pica","ptyalism","hyperemesis","dysgeusia"],"e":"Pica is a food craving disorder."},{"q":"Excessive salivation in pregnancy is termed…","o":["ptyalism","pica","epulis","gingivitis"],"e":"Ptyalism is a minor disorder of pregnancy."}]},{"id":"u5","icon":"🧪","title":"Hormones of Pregnancy","recap":["HCG (trophoblast) keeps the corpus luteum going until the placenta takes over at 10–12 weeks; basis of pregnancy tests.","Oestrogen → growth of uterus & ducts (oestriol); progesterone → relaxes smooth muscle (pregnanediol).","HPL: glucose for fetus; relaxin: softens joints/cervix; pituitary, thyroid and adrenal changes."],"qs":[{"q":"Human chorionic gonadotrophin (HCG) is produced by…","o":["the trophoblast cells of the developing placenta","the anterior pituitary","the adrenal cortex","the thyroid gland"],"e":"HCG comes from the trophoblast."},{"q":"HCG can be detected in orts the uterine lining."},{"q":"Progesterone relaxes smooth muscle. A result is…","o":["constipation, heartburn and varicose veins","hypertension only","faster digestion","anaemia"],"e":"Smooth muscle relaxation slows the gut and dilates veins."},{"q":"Progesterone prevents early spontaneous abortion by…","o":["inhibiting uterine activity","stimulating contractions","causing ovulation","softening the cervix"],"e":"It quietens the uterus."},{"q":"Progesterone is measured in urine as…","o":["pregnanediol","oestriol","HCG","cortisol"],"e":"Pregnanediol is its urinary metabolite."},{"q":"Human placental lactogen (HPL) is secreted by…","o":["the placenta","the corpus luteum","the pituitary","the thyroid"],"e":"It aids breast growth and metabolism."},{"q":"HPL alters maternal metabolism by…","o":["impairing glucose uptake so glucose is available for the fetus","lowering blood sugar","storing more maternal fat only","stopping gluconeogenesis"],"e":"Glucose helps the fetal body and brain to grow."},{"q":"Relaxin is produced by the corpus luteum and later by…","o":["the placenta (chorion)","the adrenal gland","the pancreas","the thyroid"],"e":"Relaxin relaxes joints and ligaments."},{"q":"Relaxin causes relaxation of…","o":["joints and ligaments, including the pelvic joint","the heart","blood vessels only","the bladder only"],"e":"This eases labour but may cause backache."},{"q":"Other actions of relaxin include…","o":["softening the cervix and inhibiting uterine contractions","hardening the cervix","strengthening uterine contractions","stimulating lactation"],"e":"Relaxin softens the cervix and dampens contractions."},{"q":"The pituitary gland enlarges in pregnancy because of…","o":["hypertrophy of the anterior lobe","hypertrophy of the posterior lobe","a tumour","infection"],"e":"It can cause headaches and reduced visual fields."},{"q":"Enlarged pituitary may compress the…","o":["optic chiasma","auditory nerve","facial nerve","spinal cord"],"e":"This may cause reduction i
