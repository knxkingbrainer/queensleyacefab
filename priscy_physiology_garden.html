ine blood flow at term reaches a maximum of about…","o":["450–700 ml per minute","5 ml per minute","50 ml per minute only","5 litres per minute"],"e":"It rises about tenfold from 50 ml at 10 weeks."},{"q":"Uterine soufflé is produced by…","o":["blood flowing through enlarged, coiled uterine arteries","fetal heart beat","cord blood flow","maternal heart"],"e":"It is heard on auscultation."},{"q":"At 12 weeks the fundus is palpable…","o":["about the symphysis pubis","at the umbilicus","at the xiphisternum","in the pelvis only"],"e":"The uterus is about the size of a grapefruit."},{"q":"The fundus is at the umbilicus at about…","o":["22–24 weeks","12 weeks","30 weeks","40 weeks"],"e":"At 20 weeks it is just below the umbilicus."},{"q":"At 36–38 weeks the fundus reaches…","o":["the xiphisternum, possibly causing breathlessness","the symphysis","the umbilicus","the pelvic brim"],"e":"Fundal height may fall at about 40 weeks as the head engages."},{"q":"The cervix in pregnancy becomes…","o":["softer and purplish due to increased blood supply","harder and pale","shorter and wider from 12 weeks","dry"],"e":"Its length stays the same (2.5 cm) but width increases."},{"q":"The operculum is…","o":["a mucous plug that seals the cervical canal against infection","a cervical ligament","a muscle layer","a fold of peritoneum"],"e":"It is shed with a streak of blood at the onset of labour (a show)."},{"q":"The cervical canal is described as…","o":["fusiform (spindle-shaped) between the internal and external os","triangular","straight only","square"],"e":"In pregnancy it changes toward funnel shape."}]},{"id":"u7","icon":"🥚","title":"Fallopian Tubes & Ovaries","recap":["Tube (10 cm): interstitial → isthmus (narrowest) → ampulla (widest; fertilisation) → infundibulum with fimbriae.","Tube layers: ciliated cuboidal epithelium, vascular connective tissue, muscle coat (+ peritoneum).","Ovary: gonad, 3×2×1 cm, 5–8 g, almond-shaped; cortex (follicles) and medulla (vessels)."],"qs":[{"q":"Each Fallopian tube measures about…","o":["10 cm","2.5 cm","20 cm","5 mm"],"e":"It has two openings: one into the uterus, one into the peritoneal cavity."},{"q":"Which is NOT a part of the uterine tube?","o":["Fundus","Interstitial portion","Isthmus","Ampulla"],"e":"The four parts are interstitial, isthmus, ampulla and infundibulum."},{"q":"The interstitial portion of the tube lies…","o":["within the wall of the uterus","in the broad ligament","in the ovary","at the fimbriated end"],"e":"It is 2.5 cm long with a lumen 1 mm wide."},{"q":"The narrowest portion of the tube is the…","o":["isthmus","ampulla","infundibulum","interstitial portion"],"e":"It is about 2.5 cm long."},{"q":"The widest and longest portion of the tube is the…","o":["ampulla","isthmus","interstitial portion","fimbriae"],"e":"It measures about 5 cm long and 6 mm wide."},{"q":"Fertilisation of the ovum normally occurs in the…","o":["ampulla","isthmus","uterine cavity","ovary"],"e":"The ampullary portion is the usual site."},{"q":"The finger-like projections at the end of the tube are the…","o":["fimbriae","plicae","cilia only","villi"],"e":"They are at the infundibulum."},{"q":"The fimbria ovarica…","o":["is longer than the others and lies in close contact with the ovary","lines the uterus","forms the isthmus","produces hormones"],"e":"It attracts and conducts ova into the tube."},{"q":"The innermost layer of the tube is…","o":["ciliated cuboidal epithelium","muscle coat","peritoneum","vascular connective tissue"],"e":"It is thrown into folds called plicae."},{"q":"The plicae serve to…","o":["slow the movement of the fertilised ovum towards the uterus","speed up transport","produce ova","secrete hormones"],"e":"Folds allow time for early development."},{"q":"Goblet cells in the tubal lining secrete…","o":["a glycogen-containing fluid that nourishes the fertilised ovum","mucus plug","oestrogen","lactic acid"],"e":"This provides nutrition on the journey."},{"q":"The muscle coat of the tube consists of…","o":["inner circular and outer longitudinal fibres","only circular fibres","three layers","skeletal muscle"],"e":"Contraction causes peristalsis."},{"q":"The ovum is propelled along the tube by…","o":["ciliary movement and peristaltic action","gravity only","fetal movement","uterine contractions"],"e":"Cilia waft the ovum toward the uterus."},{"q":"The tube receives blood from…","o":["the uterine and ovarian arteries","the renal artery","the pudendal artery","the internal mammary"],"e":"Lymph drains into the lumbar glands."},{"q":"Tubal blockage may follow…","o":["severe infection after abortion or gonorrhoea","exercise","pregnancy","menstruation"],"e":"Chronic salpingitis can block the lumen."},{"q":"Repeated pelvic infections may lead to…","o":["narrowing of the tube lumen through adhesions and scars","widening of the tube","new ovulation","increased fertility"],"e":"Narrowing predisposes to infertility."},{"q":"Which is a congenital abnormality of the tube?","o":["Absence of cilia","Salpingitis","Ectopic pregnancy","Tubal blockage from gonorrhoea"],"e":"Others listed: abnormally long or short tube, absence of one or both tubes, diverticulum."},{"q":"The ovaries are also known as…","o":["gonads","adrenals","glands of Bartholin","fimbriae"],"e":"They are the female gonads."},{"q":"The ovaries are…","o":["both gonads and endocrine (ductless) glands","only exocrine glands","only supporting organs","ducted glands"],"e":"They produce ova and hormones."},{"q":"The ovary lies in a small depression called the…","o":["ovarian fossa","hilum","mesovarium","cornua"],"e":"It is near the pelvic brim."},{"q":"The adult ovary measures about…","o":["3 cm long, 2 cm wide and 1 cm thick","10 cm long","1 cm long","6 cm wide"],"e":"Shape is ovoid (almond)."},{"q":"The adult ovary weighs about…","o":["5–8 g","50 g","100 g","1 g"],"e":"Colour is dull white."},{"q":"After menopause the ovaries become…","o":["smaller, shrunken and covered with scar tissue (atrophy)","larger","more active","unchanged"],"e":"Post-menopausal atrophy."},{"q":"Each ovary has two main parts, namely the…","o":["cortex and medulla","hilum and fossa","stroma and follicle only","body and fundus"],"e":"The cortex contains follicles; the medulla vessels and nerves."},{"q":"The working part of the ovary is the…","o":["cortex","medulla","hilum","mesovarium"],"e":"It is composed of vascular fibrous tissue (stroma)."},{"q":"Ovarian follicles each contain an immature egg called…","o":["an oocyte","a zygote","a polar body","a spermatid"],"e":"Follicles are embedded in the cortex."},{"q":"The ovary is covered outside by a modified peritoneum called the…","o":["germinal epithelium","tunica vaginalis","perimetrium","decidua"],"e":"Beneath it lies the tunica albuginea."},{"q":"The point where vessels and nerves enter the ovary is the…","o":["hilum","fossa","cornua","fimbria"],"e":"The medulla is made of vessels, nerves and lymphatics."},{"q":"The ovary is attached to the broad ligament by the…","o":["mesovarium","fundus","pubocervical ligament","round ligament"],"e":"The ovarian ligament also supports it."},{"q":"Which is a pathological condition affecting the ovary?","o":["Theca lutein cyst","Bicornuate uterus","Cystocele","Rectocele"],"e":"Others: follicular and luteal cyst, fibromas."}]},{"id":"u8","icon":"🌙","title":"Oogenesis & Ovarian Hormones","recap":["Oogenesis: oogonia (2n) → primary oocytes (prophase I, arrested) → secondary oocyte (metaphase II) → ovum after fertilisation.","Follicle stages: primordial → primary → secondary → Graafian; then corpus luteum → albicans → fibrosum.","One primary oocyte gives one ovum (males: four sperm). Oestrogen = proliferation; progesterone = secretory."],"qs":[{"q":"Oogenesis is…","o":["the formation of gametes in the ovaries","the formation of sperm","fertilisation","implantation"],"e":"It produces haploid secondary oocytes."},{"q":"In contrast to spermatogenesis, oogenesis begins…","o":["before females are born","at puberty","at menopause","after fertilisation"],"e":"Females start oogenesis in fetal life."},{"q":"Primordial germ cells migrate to the ovaries from the…","o":["yolk sac","kidney","liver","placenta"],"e":"They migrate during early fetal development."},{"q":"Oogonia are…","o":["diploid (2n) stem cells that divide by mitosis","haploid cells","mature ova","polar bodies"],"e":"They produce millions of germ cells."},{"q":"Primary oocytes enter which stage of meiosis before birth?","o":["Prophase of meiosis I","Metaphase II","Telophase II","Anaphase II"],"e":"They remain arrested until after puberty."},{"q":"A primary oocyte surrounded by a single layer of flat follicular cells forms the…","o":["primordial follicle","primary follicle","Graafian follicle","corpus luteum"],"e":"It is the earliest follicle stage."},{"q":"About how many primordial follicles remain at puberty?","o":["40,000","400","4 million","2 billion"],"e":"Only about 400 will mature and ovulate."},{"q":"About how many ova are ovulated in a woman's lifetime?","o":["400","40,000","4,000","40"],"e":"Of about 40,000 follicles, roughly 400 mature."},{"q":"In the primary follicle, granulosa cells…","o":["become cuboidal and form more than one layer","are flat","disappear","form the corpus luteum"],"e":"The zona pellucida also forms."},{"q":"The zona pellucida forms around the…","o":["oocyte","corpus luteum","ovary","theca"],"e":"It lies between ovum and corona radiata."},{"q":"Secondary follicles develop…","o":["fluid-filled vesicles among granulosa cells and theca cells around them","a single flat layer","polar bodies","an ovum"],"e":"Corona radiata is also formed."},{"q":"A single fluid-filled cavity is called the…","o":["antrum","hilum","fossa","corona"],"e":"The mature Graafian follicle contains an antrum."},{"q":"Which hormone matures the follicles at puberty?","o":["Follicle-stimulating hormone (FSH)","Oxytocin","Prolactin","Progesterone"],"e":"FSH causes the follicles to ripen."},{"q":"The outer coat of the Graafian follicle consists of…","o":["theca interna and theca externa","zona pellucida","corona radiata","mesovarium"],"e":"Granulosa cells line the inside."},{"q":"Just before ovulation, the primary oocyte divides into…","o":["a secondary oocyte and the first polar body","two ova","four ova","three polar bodies"],"e":"The secondary oocyte keeps most of the cytoplasm."},{"q":"The secondary oocyte begins meiosis II but stops in…","o":["metaphase","prophase","telophase","anaphase"],"e":"Meiosis II resumes only on fertilisation."},{"q":"Meiosis II is completed only…","o":["when a sperm penetrates the secondary oocyte","at birth","at puberty","at menopause"],"e":"Fertilisation triggers the resumption."},{"q":"The first polar body…","o":["is nutrient-poor and degenerates","becomes the ovum","becomes the corpus luteum","becomes the zygote"],"e":"It is forced into the perivitelline space."},{"q":"One primary oocyte gives rise to…","o":["a single ovum","four ova","two ova","three ova"],"e":"In males one primary spermatocyte gives four sperm."},{"q":"Ovulation occurs about…","o":["once every month","daily","every week","once a year"],"e":"One or two mature follicles release an ovum."},{"q":"Inter-menstrual pain accompanying ovulation is called…","o":["mittelschmerz","dysmenorrhoea","menorrhagia","after-pain"],"e":"It affects some women."},{"q":"After ovulation the walls of the follicle collapse to form the…","o":["corpus luteum","corpus albicans","corpus fibrosum","Graafian follicle"],"e":"The yellow body."},{"q":"The corpus luteum produces high amounts of…","o":["progesterone with a little oestrogen","oestrogen only","FSH","HCG"],"e":"Progesterone prepares the endometrium for pregnancy."},{"q":"If fertilisation does not occur the corpus luteum persists for about…","o":["14 days","3 days","6 weeks","6 months"],"e":"Then it ceases to function and degenerates."},{"q":"The white scar left after degeneration of the corpus luteum is the…","o":["corpus albicans","corpus fibrosum","corpus cavernosum","corpus spongiosum"],"e":"It remains on the ovarian surface."},{"q":"Corpus fibrosum is the…","o":["final stage of fibrosis in the post-menopausal period","yellow body","Graafian follicle","new follicle"],"e":"It consists of scars left by each ovulation."},{"q":"The ovaries produce which two hormones under influence of the anterior pituitary?","o":["Oestrogen and progesterone","Insulin and glucagon","Thyroxine and cortisol","Oxytocin and ADH"],"e":"FSH and LH drive their production."},{"q":"Which are the three types of oestrogen?","o":["Oestriol, oestradiol and oestrone","Pregnanediol only","Oestrogen A, B and C","Prolactin, HCG, HPL"],"e":"They are produced by theca and granulosa cells."},{"q":"In puberty, oestrogen is responsible for…","o":["development of secondary sexual characteristics","milk secretion","ovulation only","menstruation only"],"e":"E.g. breast development, widening of hips, pubic and axillary hair."},{"q":"Progesterone causes the body temperature to rise by…","o":["0.5 °C after ovulation","5 °C","0.05 °C","2 °C"],"e":"This is used in natural family planning."}]},{"id":"u9","icon":"🦴","title":"Female Pelvis & Obstetric Application","recap":["Bony pelvis: two hip bones (ilium, ischium, pubis), sacrum, coccyx. Brim divides false from true pelvis.","Conjugates: anatomical 11.5–12 · obstetric 10.5–11 (shortest AP) · diagonal 12.5–13 cm; obstetric = diagonal − 1.5–2 cm.","Caldwell–Moloy types: gynaecoid, android, anthropoid, platypelloid."],"qs":[{"q":"The bony pelvis consists of…","o":["two hip bones, one sacrum and one coccyx","one hip bone and two sacra","the ilium only","the femurs"],"e":"It is a basin-shaped ring of bone."},{"q":"Each hip bone is formed by fusion of…","o":["ilium, ischium and pubis at the acetabulum","ilium and sacrum","femur and tibia","ischium and coccyx"],"e":"In children they are separated by triradiate cartilage."},{"q":"Which is a function of the pelvis?","o":["Forms the bony framework of the birth canal","Produces ova","Secretes hormones","Filters blood"],"e":"It also supports upper body weight and protects pelvic organs."},{"q":"The pelvic brim divides the pelvis into…","o":["the false and true pelvis","anterior and posterior","upper and middle","inlet and outlet"],"e":"False lies above; true below."},{"q":"The true pelvis consists of…","o":["inlet, cavity and outlet","brim only","false pelvis only","sacrum only"],"e":"It forms the bony birth canal."},{"q":"The ischial spines are used to assess…","o":["fetal head station","pelvic outlet size only","fetal weight","gestational age"],"e":"Station 0 = presenting part at the level of the spines."},{"q":"Station 0 means the presenting part is…","o":["at the level of the ischial spines","above the brim","at the perineum","beyond the outlet"],"e":"Negative stations are above; positive below."},{"q":"The narrowest transverse diameter of the midpelvis is the…","o":["interspinous diameter","intertuberous diameter","transverse of inlet","oblique"],"e":"About 10–10.5 cm."},{"q":"The pubic arch is formed by…","o":["the inferior pubic rami","the superior pubic rami","the ischial spines","the sacrum"],"e":"A wide arch gives more room at the anterior outlet."},{"q":"The sacral promontory is used in…","o":["estimating pelvic conjugates","assessing station","measuring outlet","palpating the fundus"],"e":"It is the landmark at the top of the sacrum."},{"q":"The coccyx moving backwards during birth…","o":["increases the anteroposterior diameter of the anatomical outlet","narrows the outlet","reduces the cavity","has no effect"],"e":"A mobile coccyx helps."},{"q":"The iliac crest is…","o":["the curved upper border of the ilium, felt at the waist","the socket for the femur","the lower ischium","the sacral wing"],"e":"Its front end is the anterior superior iliac spine."},{"q":"The acetabulum is…","o":["the cup-shaped socket that receives the head of the femur","a pelvic foramen","the pubic arch","a ligament"],"e":"It is where ilium, ischium and pubis fuse."},{"q":"The obturator foramen is formed by the…","o":["pubis and ischium","ilium and sacrum","sacrum and coccyx","ilium only"],"e":"It is mostly closed by the obturator membrane."},{"q":"Sciatic notches become foramina by the…","o":["sacrotuberous and sacrospinous ligaments","round ligaments","broad ligaments","uterosacral ligaments"],"e":"They stabilise the sacrum too."},{"q":"The sacroiliac joints…","o":["transfer body weight and allow a small amount of movement","are the joint between the pubic bones","join L5 and S1","are the hip joints"],"e":"They are strong, supported by sacroiliac ligaments."},{"q":"Excessive separation of the symphysis pubis in pregnancy may cause…","o":["pelvic pain","hypertension","anaemia","polyhydramnios"],"e":"Normal pregnancy produces small laxity."},{"q":"The lumbosacral joint lies between…","o":["L5 and S1","S1 and S2","the pubic bones","sacrum and coccyx"],"e":"It contributes to posture and pelvic inclination."},{"q":"The pelvic joint changes in pregnancy are due to…","o":["oestrogen, progesterone and relaxin","insulin","thyroxine","FSH only"],"e":"They increase soft-tissue and ligament laxity."},{"q":"Compared with the male, the typical female pelvis is…","o":["lighter, wider and shallower","heavier and deeper","narrower and heart-shaped","more prominent-spined"],"e":"The female inlet is rounded or transversely oval."},{"q":"The typical female subpubic angle is…","o":["about 80–90° or more","under 70°","exactly 45°","about 30°"],"e":"The male angle is smaller."},{"q":"The typical male pelvic inlet is often…","o":["heart-shaped and narrow","rounded","transversely oval","wide"],"e":"In the male, the cavity is also narrower."},{"q":"The Caldwell–Moloy classification describes how many classical pelvic types?","o":["Four","Two","Three","Six"],"e":"Gynaecoid, android, anthropoid and platypelloid."},{"q":"Which pelvic type is usually favourable for vaginal birth?","o":["Gynaecoid","Android","Anthropoid","Platypelloid"],"e":"It has a rounded inlet and wide pubic arch."},{"q":"A heart-shaped inlet with convergent side walls is…","o":["android","gynaecoid","anthropoid","platypelloid"],"e":"May be associated with deep transverse arrest."},{"q":"An oval inlet with a long anteroposterior diameter is…","o":["anthropoid","gynaecoid","android","platypelloid"],"e":"Occipitoposterior engagement is more common."},{"q":"A flat, transversely oval inlet is…","o":["platypelloid","anthropoid","gynaecoid","android"],"e":"Engagement may be delayed."},{"q":"The obstetric conjugate is…","o":["the shortest fixed anteroposterior diameter of the inlet, about 10.5–11 cm","about 13 cm","the widest diameter","the outlet diameter"],"e":"The fetal head must pass through it."},{"q":"The diagonal conjugate is measured from the sacral promontory to…","o":["the lower border of the symphysis pubis","the upper border of the symphysis","the ischial spine","the coccyx"],"e":"It is about 12.5–13 cm."},{"q":"The obstetric conjugate is estimated by…","o":["subtracting about 1.5–2 cm from the diagonal conjugate","adding 2 cm","doubling it","measuring directly with X-ray"],"e":"Fixed relationships allow the estimate."}]},{"id":"u10","icon":"🌕","title":"Menstrual Cycle","recap":["Three linked cycles: pituitary (GnRH → FSH, LH), ovarian (follicular, ovulation, luteal), uterine (proliferative, secretory, menstrual).","Average cycle 28 days (21–35); ovulation around day 14; variation is in the proliferative phase.","Menstrual disorders: oligo-, poly-, amenorrhoea, dysmenorrhoea, menorrhagia; PMS and PMDD."],"qs":[{"q":"Menstruation is best defined as…","o":["the monthly physiological changes in the ovaries and uterus regulated by hormones","a disease of the uterus","bleeding after delivery","bleeding in pregnancy"],"e":"It prepares the uterus to receive and nourish a fertilised ovum."},{"q":"The hypothalamus secretes…","o":["gonadotrophin-releasing hormone (GnRH)","FSH","LH","progesterone"],"e":"GnRH stimulates the anterior pituitary."},{"q":"The anterior pituitary produces which two gonadotrophins?","o":["FSH and LH","Oestrogen and progesterone","Oxytocin and ADH","Prolactin and HCG"],"e":"They travel to the ovaries via the blood."},{"q":"The ovarian cycle has how many phases?","o":["Three","Two","Four","Five"],"e":"Follicular, ovulation, luteal."},{"q":"FSH in the follicular phase causes…","o":["development of several Graafian follicles","ovulation","corpus luteum formation","menstruation"],"e":"It acts in the first half of the ovarian cycle."},{"q":"Ovulation is triggered by…","o":["a sudden rise in LH due to high oestrogen","a fall in oestrogen","progesterone","prolactin"],"e":"It occurs at mid-cycle."},{"q":"Ovulation typically occurs at about…","o":["day 14 of a 28-day cycle","day 1","day 7","day 25"],"e":"The Graafian follicle ruptures."},{"q":"At ovulation the cervical mucus becomes…","o":["slimy, stringy and clear","thick and sticky","scanty and dry","yellow"],"e":"It facilitates sperm passage."},{"q":"The ovum can be fertilised for only about…","o":["12–24 hours","3 weeks","1 week","72 hours after implantation"],"e":"It disintegrates in the tube if not fertilised."},{"q":"The luteal phase is the…","o":["last half of the ovarian cycle","first half of the cycle","phase of ovulation","phase of menstruation"],"e":"The ruptured follicle becomes the corpus luteum."},{"q":"The corpus luteum produces…","o":["progesterone, oestrogen, relaxin and inhibin","only FSH","only LH","only HCG"],"e":"Progesterone inhibits FSH and LH."},{"q":"Degeneration of the corpus luteum causes…","o":["a sharp fall in progesterone and oestrogen","a rise in FSH","ovulation","implantation"],"e":"The inhibitory effect on FSH and LH is removed."},{"q":"The average length of the menstrual cycle is…","o":["28 days (range 21–35)","14 days","45 days","60 days"],"e":"Variations arise mostly from the proliferative phase."},{"q":"The first day of menstruation marks…","o":["the beginning of the follicular phase and the end of the previous cycle","ovulation","the luteal phase","implantation"],"e":"It is day 1."},{"q":"The proliferative phase is controlled by…","o":["oestrogen from the Graafian follicle","progesterone","HCG","prolactin"],"e":"It lasts until ovulation."},{"q":"The basal layer of the endometrium…","o":["never changes and regenerates the new endometrium","is shed monthly","is the functional layer","is the stroma"],"e":"It is about 1 mm thick."},{"q":"The functional layer (stroma) is about…","o":["2.5 mm thick","10 mm","0.1 mm","25 mm"],"e":"It changes constantly under hormonal control."},{"q":"The secretory phase is under the influence of…","o":["progesterone","oestrogen only","FSH","GnRH"],"e":"It lasts about 14 days."},{"q":"In the secretory phase the endometrium becomes…","o":["spongy and rich in blood supply with tortuous glands","thin and pale","shed","sclerotic"],"e":"This 'rich' lining receives a fertilised ovum."},{"q":"Menstrual bleeding occurs after…","o":["oestrogen and progesterone levels fall","oestrogen rises","LH surge","HCG rises"],"e":"Prostaglandin causes spiral artery spasm."},{"q":"Which enzyme prevents menstrual blood from clotting?","o":["Plasmin","Thrombin","Pepsin","Amylase"],"e":"Contained in the endometrium."},{"q":"Normal regular menstrual flow is called…","o":["eumenorrhoea","oligomenorrhoea","amenorrhoea","menorrhagia"],"e":"Normal blood loss is about 50–150 ml."},{"q":"Menstrual flow is composed of…","o":["blood, mucus, endometrial cells and an unfertilised ovum","urine and mucus","pus","only blood"],"e":"This is the composition."},{"q":"Which is a clinical significance of menstruation?","o":["It helps the midwife to calculate the Expected Date of Delivery","It cures infertility","It replaces antenatal care","It prevents infections"],"e":"Also helps determine fertile and safe days."},{"q":"Cycle length of less than 21 days is called…","o":["polymenorrhoea","oligomenorrhoea","amenorrhoea","menorrhagia"],"e":"Bleeding is normal in amount but too frequent."},{"q":"Scanty menses are called…","o":["oligomenorrhoea","polymenorrhoea","dysmenorrhoea","menorrhagia"],"e":"Amenorrhoea is absence of menstruation."},{"q":"Pain associated with menstruation is…","o":["dysmenorrhoea","amenorrhoea","menorrhagia","polymenorrhoea"],"e":"It is a common menstrual disorder."},{"q":"Excessively prolonged or profuse menstrual flow is…","o":["menorrhagia","oligomenorrhoea","amenorrhoea","dysmenorrhoea"],"e":"Causes include fibroids, IUDs and infection."},{"q":"Premenstrual syndrome appears during…","o":["the postovulatory (luteal) phase","menstruation","the follicular phase","ovulation"],"e":"It disappears when menstruation begins."},{"q":"PMDD is treated with…","o":["selective serotonin reuptake inhibitors (SSRIs)","antibiotics","insulin","iron"],"e":"SSRIs treat both PMS and PMDD."}]},{"id":"u11","icon":"🌺","title":"Menopause, Andropause & Puberty","recap":["Menopause = permanent end of menstruation; complete after 1 year without a period; usually 45–52 years.","Symptoms: hot flushes, vaginal dryness; long-term: osteoporosis, cardiovascular disease.","Puberty: GnRH → FSH/LH; first signs breast buds and pubic hair; menarche ends puberty."],"qs":[{"q":"Menopause is the physiological cessation of menstruation due to…","o":["decreasing ovarian function","pregnancy","infection","weight gain"],"e":"Ovarian response to FSH and LH decreases."},{"q":"The climacteric refers to…","o":["the longer phase in which women lose reproductive capacity","the first period","ovulation","puberty only"],"e":"It begins before perimenopause."},{"q":"Perimenopause is the…","o":["transitional time before natural menopause when changes begin","time after menopause only","time of puberty","time of first menses"],"e":"It includes the 12 months after the last period."},{"q":"Menstruation generally ceases at about…","o":["45–52 years","20–25 years","30–35 years","60–65 years"],"e":"It may occur as early as 40 or as late as 55."},{"q":"A woman has complete menopause after…","o":["one year without a period","one month","3 months","5 years"],"e":"One year from the last period."},{"q":"Anovular cycles become more frequent as menopause approaches, so fertility…","o":["diminishes","increases","is unchanged","peaks"],"e":"Fewer ovulations occur."},{"q":"As ovaries age, the follicular phase becomes…","o":["shorter and more irregular","longer","fixed at 14 days","absent immediately"],"e":"Progesterone production also decreases."},{"q":"After menopause the decline in oestrogen leads to…","o":["atrophy of the reproductive organs and breasts","hypertrophy of the uterus","increased fertility","breast enlargement"],"e":"The ovaries, tubes and uterus atrophy."},{"q":"The vaginal wall after menopause becomes…","o":["thin and smooth with reduced acidity","thick and moist","more acidic","unchanged"],"e":"The labia are flatter and pubic hair diminished."},{"q":"The pelvic floor loses tone in menopause because…","o":["its blood supply is reduced","it is overused","of infection","of pregnancy"],"e":"Supporting ligaments may atrophy and cause prolapse."},{"q":"The commonest menopausal symptoms are…","o":["hot flushes and vaginal symptoms","hair growth","weight loss","ovulation pain"],"e":"They result from a fall in oestrogen."},{"q":"During a hot flush the woman feels…","o":["heat centred on the face that spreads to the neck and chest","cold limbs","severe headache only","chest pain"],"e":"It is associated with peripheral vasodilatation."},{"q":"A hot flush typically lasts…","o":["1–3 minutes","5 hours","2 days","1 week"],"e":"Often accompanied by profuse sweating."},{"q":"Vaginal symptoms in menopause include…","o":["dryness, burning and painful sexual intercourse","heavy bleeding","discharge with fever","bulging"],"e":"They are due to reduced oestrogen."},{"q":"Which is an 'other symptom' of menopause?","o":["Loss of interest in sex, insomnia and irritability","Increased libido","Improved sleep","Hair growth"],"e":"Also headaches, anxiety, depression, fatigue and obesity."},{"q":"Long-term oestrogen deficiency leads to loss of calcium from bones, causing…","o":["osteoporosis","osteomyelitis","rickets","gout"],"e":"Bones fracture with slight trauma."},{"q":"Oestrogen administration in osteoporosis…","o":["prevents further loss of calcium but does not replace what is lost","restores all lost calcium","has no effect","causes bone loss"],"e":"It stops further loss."},{"q":"Menopausal women have an increased risk of…","o":["cardiovascular disease such as hypertension","lower blood pressure","increased fertility","hypotension"],"e":"Loss of oestrogen's protective effect."},{"q":"Counselling in the management of climacteric includes…","o":["explaining changes, reassurance and encouraging the client to ask questions","only prescribing drugs","stopping antenatal care","surgery"],"e":"Most women adjust with family support."},{"q":"Hormone replacement therapy may range from…","o":["daily oestrogen tablets to oestrogen pessaries","insulin injections","antibiotics","iron only"],"e":"Continued until symptoms are relieved."},{"q":"Irregular vaginal bleeding after menopause should be investigated…","o":["without delay","after 1 year","never","only if heavy"],"e":"Causes include atrophic vaginitis and carcinoma."},{"q":"Investigations for post-menopausal bleeding include…","o":["inspection of the vagina, Pap smear and endometrial biopsy","chest X-ray","blood sugar only","ECG"],"e":"Treatment depends on the cause."},{"q":"Andropause is…","o":["climacteric changes in men as testosterone declines","menopause in women","puberty in boys","infertility"],"e":"No specific age is established."},{"q":"In andropause, general reproductive activity…","o":["declines but does not cease completely","stops completely","increases","is unchanged"],"e":"Unlike in women."},{"q":"Puberty is the period during which…","o":["the reproductive organs undergo a surge in development and reach maturity","menstruation stops","a child is born","ovulation stops"],"e":"Secondary sex characteristics develop."},{"q":"Puberty in girls occurs at about…","o":["9–12 years","2–4 years","16–18 years","20–25 years"],"e":"In boys it is 11–14 years."},{"q":"The onset of puberty is marked by high flow of…","o":["LH and FSH triggered by GnRH","oestrogen only","prolactin","insulin"],"e":"Secreted by the hypothalamus and pituitary."},{"q":"The hormone leptin from adipose tissue signals the hypothalamus that…","o":["energy stores are adequate for reproductive function to begin","the woman is pregnant","ovulation has occurred","menopause has begun"],"e":"Triglycerides in adipose tissue are the long-term energy stores."},{"q":"The first signs of female puberty are…","o":["breast development and appearance of pubic hair","first menstruation","voice change","height loss"],"e":"Menarche is the end of puberty."},{"q":"The first menstrual period is called…","o":["menarche","menopause","menorrhagia","mittelschmerz"],"e":"Puberty ends with its onset."}]},{"id":"u12","icon":"🛡️","title":"Pelvic Floor & Perineum","recap":["Pelvic floor: hammock-shaped sheet pierced by urethra, vagina and rectum; deep layer = levator ani (pubococcygeus, iliococcygeus, ischiococcygeus).","Perineal body: fibromuscular pyramid between vagina and rectum, 3.5 cm each side.","Perineal tears: 1st (skin/mucosa) → 2nd (muscle) → 3rd (external anal sphincter) → 4th (rectal mucosa)."],"qs":[{"q":"The pelvic floor is…","o":["a musculotendinous sheet that fills the pelvic outlet","a bone","a hormone","a ligament only"],"e":"It is hammock or gutter shaped."},{"q":"Which three canals pierce the pelvic floor?","o":["Urethra, vagina and rectum","Ureter, vagina and colon","Urethra, uterus and rectum","Vagina, bladder and colon"],"e":"They pass through the pelvic outlet."},{"q":"Which is a superficial pelvic floor muscle?","o":["Bulbospongiosus (bulbocavernosus)","Pubococcygeus","Iliococcygeus","Ischiococcygeus"],"e":"The deep layer is the levator ani."},{"q":"The transverse perinei muscles arise from…","o":["the inner part of the ischial tuberosities to the perineal body","the pubic symphysis","the coccyx","the ischial spine"],"e":"They help fix the position of the perineal body."},{"q":"Bulbospongiosus muscles pass forward around the vagina to…","o":["the corpora cavernosa of the clitoris","the sacrum","the anus","the ischial spine"],"e":"They constrict the vaginal orifice."},{"q":"The external anal sphincter is…","o":["a ring of muscle surrounding the anus","the deep pelvic floor","a ligament","a membrane"],"e":"It is attached behind by a few fibres to the coccyx."},{"q":"The membranous sphincter of the urethra…","o":["closes the urethra by compression and opens on relaxation","is a true sphincter","surrounds the anus","lies in the vagina"],"e":"It is not a true sphincter."},{"q":"Triangular ligaments are…","o":["musculo-membranous tissue occupying the two triangular areas anteriorly","bony","cartilaginous","nerves"],"e":"They support the bladder neck."},{"q":"The ischioanal fossa is filled with…","o":["fat, blood vessels and nerves including the pudendal vessels","bone","muscle only","air"],"e":"It is bounded by gluteus maximus and the sacrospinous ligament."},{"q":"The Levator ani muscles are so called because they…","o":["elevate the anus","elevate the uterus","widen the vagina","contract the bladder"],"e":"Three pairs make up the group."},{"q":"Which is NOT a levator ani muscle?","o":["Bulbospongiosus","Pubococcygeus","Iliococcygeus","Ischiococcygeus"],"e":"Bulbospongiosus is superficial."},{"q":"The most important of all pelvic floor muscles is the…","o":["pubococcygeus","iliococcygeus","ischiococcygeus","transverse perinei"],"e":"It forms the anterior and middle part of the deep layer."},{"q":"The pubococcygeus forms a U-loop around the…","o":["vagina (pubovaginalis)","bladder only","femur","uterus"],"e":"Fibres arise from the pubis surrounding the urethra."},{"q":"Ischiococcygeus passes from the ischial spines to…","o":["the coccyx and lower border of the sacrum","the pubis","the vagina","the clitoris"],"e":"It lies in front of the sacrospinous ligament."},{"q":"Pudendal arteries are branches of the…","o":["internal iliac artery","external iliac","femoral","renal"],"e":"Nerve supply is the pudendal nerve."},{"q":"A function of the pelvic floor is to…","o":["support the weight of the pelvic and abdominal organs","secrete oestrogen","produce ova","filter urine"],"e":"It also closes the pelvic outlet."},{"q":"During childbirth the pelvic floor…","o":["influences the passive movements of the fetus through the birth canal","secretes hormones","produces the placenta","closes the cervix"],"e":"It also allows the head to flex."},{"q":"How many layers of tissue fill the pelvic outlet?","o":["Six","Two","Ten","Three"],"e":"From peritoneum to skin."},{"q":"The perineal body is…","o":["a fibromuscular pyramid between the vagina and rectum","a bone","a gland","a ligament"],"e":"The base is the skin; the apex points upward."},{"q":"The perineal body measures about…","o":["3.5 cm on all sides","10 cm","1 cm","20 cm"],"e":"It is triangular in shape."},{"q":"The apex of the perineal body is formed by fibres of the…","o":["pubococcygeus","bulbospongiosus","external anal sphincter","transverse perinei"],"e":"This gives central attachment for muscles and fascia."},{"q":"Which is a predisposing factor for pelvic floor injury?","o":["Macrosomic baby","Small baby","Elective caesarean","Antenatal exercises"],"e":"Others: preterm labour, primiparity, vaginal surgical delivery, prolonged and precipitate labour."},{"q":"Uterine prolapse with the cervix protruding through the vulva is…","o":["complete procidentia","cystocele","rectocele","urethrocele"],"e":"It is the most severe form."},{"q":"Bulging of the front wall of the rectum into the back wall of the vagina is a…","o":["rectocele","cystocele","urethrocele","procidentia"],"e":"It is a pelvic floor injury."},{"q":"A cystocele is…","o":["bulging or dropping of the bladder into the vagina","bulging of the rectum","prolapse of the uterus","a fistula"],"e":"It often occurs with urethrocele."},{"q":"Incontinence of faeces through the vagina points to a…","o":["rectovaginal fistula","vesicovaginal fistula","cystocele","urethrocele"],"e":"A vesicovaginal fistula causes urinary incontinence."},{"q":"An antepartum strategy for preventing pelvic floor injuries is…","o":["Kegel exercises","forceps delivery","routine episiotomy","vigorous pushing"],"e":"Antepartum pelvic floor exercises are a primary strategy."},{"q":"Which encourages a slow delivery of the head to protect the perineum?","o":["Encouraging the mother to breathe out or pant","Pushing hard","Hands on the perineum","Fundal pressure"],"e":"Maintain flexion and keep hands off the perineum."},{"q":"A first degree tear involves…","o":["the fourchette, vaginal mucosa and perineal skin only","the anal sphincter","the rectal mucosa","the levator ani"],"e":"Second degree involves superficial pelvic floor muscles."},{"q":"A third degree tear extends to the…","o":["external anal sphincter","vaginal mucosa only","perineal skin only","cervix"],"e":"A fourth degree tear involves the internal anal sphincter and rectal mucosa."}]},{"id":"u13","icon":"✂️","title":"Episiotomy","recap":["A cut in the perineum in the second stage before delivery of the baby.","Types: mediolateral, median, J-shape. Mediolateral: 4–5 cm at 45° (about 7 o'clock), during a contraction with the head advanced.","Repair with absorbable suture (Vicryl): vaginal mucosa → muscles → skin; do a rectal check afterwards."],"qs":[{"q":"Episiotomy is…","o":["a cut made in the perineum during the second stage of labour before delivery of the baby","a cut in the cervix","a caesarean section","suturing of a tear"],"e":"It is a surgical incision of the perineum."},{"q":"Which is an indication to shorten the second stage?","o":["Maternal heart disease","A small baby","Normal progress","Elective caesarean"],"e":"Others: eclampsia, pre-eclampsia, sickle cell disease, maternal or fetal distress, cord prolapse."},{"q":"Episiotomy is indicated to prevent excessive trauma in the presence of…","o":["a rigid perineum or scarring from female genital mutilation","a lax perineum","a small baby","a normal perineum"],"e":"FGM scarring reduces elasticity."},{"q":"An episiotomy may be done to prevent tears in…","o":["malpresentation (face, occipito-posterior), previous 3rd degree tear or a very large baby","a small term baby","a normal vertex delivery","a lax perineum"],"e":"These raise the risk of tears or overstretching."},{"q":"In a premature baby episiotomy is done to…","o":["reduce pressure on the fetal head and protect from cerebral damage","speed up labour","stop bleeding","induce contractions"],"e":"A delicate head needs protection."},{"q":"Episiotomy allows more space for…","o":["operative or manipulative deliveries such as forceps, vacuum or breech","antenatal exam","cord clamping","placental delivery only"],"e":"It eases instrumental delivery."},{"q":"Which is NOT a type of episiotomy?","o":["Lateral","Mediolateral","Median","J-shape"],"e":"The three types are mediolateral, median and J-shape."},{"q":"The median incision starts…","o":["at the centre of the fourchette and is directed posteriorly for about 2.5 cm","2.5 cm from the anus","laterally","at 7 o'clock"],"e":"It is easy to repair."},{"q":"An advantage of the median episiotomy is that it…","o":["is easy to repair with less bleeding","avoids anal sphincter injury","gives more room","heals slowly"],"e":"It also heals early and is less uncomfortable."},{"q":"A disadvantage of the median episiotomy is that it…","o":["can easily extend to the anus (3rd degree tear)","is hard to repair","causes more bleeding","is painful to cut"],"e":"It also gives inadequate room for manipulation."},{"q":"A mediolateral incision starts…","o":["from the midline of the fourchette, directed about 2.5 cm away from the anus","at the anus","along the labia","above the clitoris"],"e":"This avoids the anal sphincter."},{"q":"An advantage of the mediolateral incision is that it…","o":["avoids damage to the anal sphincter and Bartholin's glands","is easy to repair","causes less bleeding","heals fast"],"e":"It is also easy to perform."},{"q":"A disadvantage of mediolateral episiotomy is that it is…","o":["difficult to repair, slower to heal and causes more blood loss","easy to repair","avoids the sphincter","heals quickly"],"e":"Those are the trade-offs."},{"q":"The best time to cut an episiotomy is when…","o":["the head is well advanced, the perineum thin and bulging, at the height of a contraction","the cervix is 3 cm dilated","the membranes rupture","the placenta separates"],"e":"Cutting too early or too late causes bleeding."},{"q":"Which local anaesthetic is infiltrated before the cut?","o":["1% lignocaine","Adrenaline alone","Pethidine","Oxytocin"],"e":"About 10 ml is drawn up."},{"q":"Before cutting, two fingers are placed between the scissors and the baby's head to…","o":["prevent accidentally cutting the baby","stretch the perineum","measure dilation","count contractions"],"e":"This protects the fetus."},{"q":"The mediolateral cut is angled at about…","o":["45° (about the 7 o'clock position)","90°","10°","180°"],"e":"Start at the centre of the perineum and slant outwards."},{"q":"The incision is made…","o":["in one deliberate cut of about 4–5 cm","in many small snips","with a blunt scissor","after the head is delivered"],"e":"Many tiny cuts leave ragged edges that are hard to repair."},{"q":"After the cut, bleeding is controlled by…","o":["firm gauze pressure while the woman pushes with contractions","tourniquet","ice packs","fundal pressure"],"e":"Do not delay delivery of the head."},{"q":"Which suture material is used for the repair?","o":["Absorbable Vicryl 0 or 2-0","Silk","Nylon","Steel wire"],"e":"One on a round taper needle for the vagina and muscle and one on a cutting needle for skin."},{"q":"The three layers sutured in an episiotomy repair are…","o":["vaginal mucosa, muscles and perineal skin","cervix, uterus and bladder","fat, fascia and bone","peritoneum, muscle and skin"],"e":"In that order."},{"q":"The first stitch is placed about…","o":["1 cm above the apex of the vaginal wound","5 cm above the wound","at the fourchette","in the muscle"],"e":"It is an anchoring stitch, tied with a knot."},{"q":"The vaginal mucosa is sutured using…","o":["a continuous stitch down to the hymenal ring","interrupted stitches","staples","glue"],"e":"The stitch should not be pulled too tight."},{"q":"The perineal muscles are repaired with…","o":["interrupted sutures all the way to the bottom of the wound","a continuous stitch","no sutures","staples"],"e":"Then the subcuticular stitch closes the skin."},{"q":"A rectal examination after suturing is done to…","o":["identify an occult 3rd/4th degree tear, check sphincter integrity and detect a suture in the rectum","measure dilation","check for retained placenta","assess bladder"],"e":"Remove gauze and check patency of the rectum."},{"q":"3rd and 4th degree tears must be repaired…","o":["in an operating theatre with appropriate anaesthesia","in the labour ward under local anaesthesia","at home","without sutures"],"e":"They are serious."},{"q":"Which is part of caring for an episiotomy wound?","o":["Lukewarm sitz baths and good hand washing","Douching","Using tampons","Early intercourse"],"e":"Also Kegel exercises, analgesia, vitamin C-rich fruits."},{"q":"The woman should refrain from intercourse, douching and tampons for…","o":["4–6 weeks or until the wound is healed","1 week","3 days","6 months"],"e":"This prevents infection and breakdown."},{"q":"Which is a complication of episiotomy?","o":["Bleeding, perineal haematoma, infection and dysuria","Increased fertility","Reduced blood loss","Faster healing always"],"e":"It may also extend into rectal tissue and anal sphincter."},{"q":"Which measure improves perineal integrity?","o":["Good nutrition, Kegels, slowed second stage and warm compresses","Early pushing","Fundal pressure","Immediate cutting"],"e":"These promote healthy, stretchy skin."}]},{"id":"u14","icon":"🍼","title":"Female Breast & Lactation","recap":["Breast: areola (20 sebaceous glands = Montgomery's tubercles), nipple, axillary tail of Spence; 18–20 lobes.","Alveoli (acini cells) make milk; myoepithelial cells squeeze it; lactiferous ducts → ampulla → nipple.","Prolactin makes milk; oxytocin lets it down. Removal of milk maintains lactation."],"qs":[{"q":"The breasts are…","o":["accessory organs of reproduction (mammary glands)","primary sex organs","muscles","glands of digestion"],"e":"They are modified sweat glands."},{"q":"Each breast extends vertically from the…","o":["2nd rib to the 6th rib","1st to 3rd rib","5th to 12th rib","clavicle to the umbilicus"],"e":"They lie over the pectoralis major."},{"q":"The axillary tail of Spence is…","o":["tissue extending toward the axilla","a nipple","a milk duct","a ligament"],"e":"It is part of the breast."},{"q":"The breast is held in position by…","o":["suspensory ligaments","the pectoral fascia only","bones","the areola"],"e":"These are Cooper's ligaments."},{"q":"The areola is about…","o":["2.5 cm in diameter of dark pigmented skin","10 cm","0.5 cm","6 mm"],"e":"It surrounds the nipple."},{"q":"The sebaceous glands in the areola are called… in pregnancy","o":["Montgomery's tubercles","Bartholin's glands","Skene's glands","lactiferous glands"],"e":"They lubricate the nipple with sebum."},{"q":"A function of the areola is to…","o":["act as a marker for the infant to attach and protect from friction","produce milk","store milk","secrete oestrogen"],"e":"It also lubricates the nipple."},{"q":"The nipple is about…","o":["6 mm long, made of erectile tissue","3 cm long","1 mm","2 cm"],"e":"It lies in the centre of the areola."},{"q":"The nipple surface is perforated by…","o":["small openings of lactiferous ducts","sebaceous glands","hair follicles","sweat pores only"],"e":"It also has a sphincter-like action."},{"q":"The breast is composed mainly of…","o":["glandular, fatty and fibrous tissue","muscle","bone","cartilage"],"e":"Covered externally by skin."},{"q":"The functioning part of the breast is…","o":["glandular tissue","fatty tissue","fibrous tissue","skin"],"e":"It is arranged into 18–20 lobes."},{"q":"How many lobes does the breast have?","o":["18–20","2–3","50–60","6"],"e":"Each lobe is divided into lobules."},{"q":"Alveoli are lined with milk-secreting cells called…","o":["acini cells","Sertoli cells","Leydig cells","goblet cells"],"e":"They extract substances from maternal blood."},{"q":"Myoepithelial (basket) cells…","o":["contract when stimulated by oxytocin to expel milk","produce milk","secrete prolactin","store fat"],"e":"They surround each alveolus."},{"q":"The ampulla is…","o":["the widened portion of the lactiferous duct acting as a milk reservoir","a nipple","an alveolus","a ligament"],"e":"It lies under the areola."},{"q":"Lymph from the breast drains mainly into the…","o":["axillary glands","inguinal glands","lumbar glands","popliteal glands"],"e":"Also mediastinal glands."},{"q":"The breast skin and function are supplied by…","o":["thoracic nerves (function largely hormonal)","the pudendal nerve","the sciatic nerve","the vagus"],"e":"Function is largely controlled by hormones."},{"q":"Breast development begins in the fetus at about…","o":["4 weeks of gestation","20 weeks","36 weeks","puberty"],"e":"Ectoderm thickens into mammary ridges."},{"q":"The mammary ridge is also called the…","o":["milk line","hilum","fossa","areola"],"e":"It runs between the arm and lower limb buds."},{"q":"'Witches milk' in newborns is due to…","o":["maternal hormones entering fetal circulation","fetal hormones","infection","lactation"],"e":"It is temporary."},{"q":"At birth the breasts consist of…","o":["a nipple and a few rudimentary ducts","fully developed lobes","alveoli","nothing"],"e":"No further development until pu tem","recap":["Testes: sperm in seminiferous tubules, testosterone by Leydig cells; Sertoli cells nourish sperm and form the blood–testis barrier.","Sperm pathway: seminiferous tubules → straight tubules → rete testis → efferent ductules → epididymis → ductus deferens → ejaculatory duct → urethra.","Accessory glands: seminal vesicles (most of semen), prostate, bulbourethral. Scrotum keeps testes 2–3 °C cooler."],"qs":[{"q":"The male gonads are the…","o":["testes","seminal vesicles","prostate","epididymides"],"e":"They produce sperm and testosterone."},{"q":"The scrotum keeps the testes about…","o":["2–3 °C below core body temperature","10 °C above","the same as core","5 °C above"],"e":"This supports normal sperm production."},{"q":"The cremaster muscles…","o":["raise the testes closer to the body when it is cold","wrinkle the skin","produce sperm","make semen"],"e":"They lower the testes when warm; the dartos muscle wrinkles the skin."},{"q":"The tunica albuginea is…","o":["a strong fibrous capsule surrounding the testis","a serous sac","a vascular layer","the epididymis"],"e":"It sends septa inward to form lobules."},{"q":"The tunica vaginalis…","o":["is a serous covering allowing the testis to move with little friction","is the tough capsule","supplies blood","produces sperm"],"e":"It covers the front and sides."},{"q":"The testes are divided into how many lobules?","o":["About 200–300","2–3","10","2000"],"e":"Each contains one to four seminiferous tubules."},{"q":"Testosterone is produced mainly by…","o":["Leydig cells","Sertoli cells","spermatogonia","the epididymis"],"e":"They lie between the seminiferous tubules."},{"q":"Leydig cells produce testosterone in response to…","o":["luteinising hormone","FSH","GnRH","inhibin"],"e":"LH stimulates them."},{"q":"Sertoli cells…","o":["support, protect and nourish developing sperm and form the blood–testis barrier","produce testosterone","store sperm","form semen"],"e":"They also secrete inhibin and androgen-binding protein."},{"q":"FSH acts mainly on…","o":["Sertoli cells to support spermatogenesis","Leydig cells","the prostate","the epididymis"],"e":"It acts on the seminiferous epithelium."},{"q":"Inhibin from Sertoli cells…","o":["reduces FSH secretion through negative feedback","raises LH","produces testosterone","makes sperm"],"e":"It regulates spermatogenesis."},{"q":"Spermatogenesis begins at…","o":["puberty","birth","adolescence end","age 40"],"e":"It continues throughout adult life."},{"q":"One complete spermatogenic cycle takes about…","o":["64–74 days","7 days","6 months","1 year"],"e":"Followed by maturation in the epididymis."},{"q":"Spermatogonia divide by…","o":["mitosis","meiosis only","binary fission","budding"],"e":"Type B spermatogonia become primary spermatocytes."},{"q":"Each primary spermatocyte divides in meiosis I to form…","o":["two secondary spermatocytes","four spermatids","one spermatid","two ova"],"e":"Meiosis II forms spermatids."},{"q":"Spermiogenesis is…","o":["the transformation of spermatids into spermatozoa","division of spermatogonia","meiosis I","fertilisation"],"e":"There is no further chromosome division."},{"q":"One primary spermatocyte produces…","o":["four sperm cells","one sperm","two sperm","three sperm"],"e":"Unlike the oocyte, which gives one ovum."},{"q":"The head of the sperm contains…","o":["a haploid nucleus and an enzyme-containing acrosome","many mitochondria","the flagellum","the centrioles only"],"e":"The acrosome helps penetrate the oocyte coverings."},{"q":"The middle piece of the sperm…","o":["contains many mitochondria and produces energy for movement","carries the DNA","propels the sperm","forms the acrosome"],"e":"It is arranged around the axial filament."},{"q":"The tail of the sperm…","o":["is a long flagellum that propels the sperm forward","carries DNA","produces energy","contains enzymes"],"e":"It is formed around an axoneme."},{"q":"Sperm acquire motility and maturity in the…","o":["epididymis","seminiferous tubule","urethra","prostate"],"e":"Capacitation occurs later in the female tract."},{"q":"Which is the correct pathway of sperm out of the testis?","o":["Seminiferous tubules → straight tubules → rete testis → efferent ductules → epididymis","Rete testis → epididymis → straight tubules","Epididymis → seminiferous tubules","Vas deferens → rete testis"],"e":"Then ductus deferens, ejaculatory duct and urethra."},{"q":"The ductus deferens is about…","o":["45 cm long","5 cm","15 cm","100 cm"],"e":"It ascends in the spermatic cord."},{"q":"The pampiniform plexus…","o":["cools arterial blood before it reaches the testis","produces sperm","stores semen","makes testosterone"],"e":"It supports the lower temperature needed."},{"q":"The ejaculatory duct is formed by the union of…","o":["the ductus deferens and the duct of the seminal vesicle","the epididymis and urethra","two ductus deferens","the prostate and bladder"],"e":"It opens into the prostatic urethra."},{"q":"The male urethra is about…","o":["18–20 cm long","5 cm","30 cm","10 cm"],"e":"It carries urine or semen at different times."},{"q":"The three parts of the male urethra are…","o":["prostatic, membranous and spongy","proximal, middle and distal","bulbar only","anterior, posterior and lateral"],"e":"Membranous is surrounded by the external urethral sphincter."},{"q":"The penis contains how many masses of erectile tissue?","o":["Three (two corpora cavernosa and one corpus spongiosum)","Two","Four","One"],"e":"The corpus spongiosum surrounds the urethra."},{"q":"Which gland produces most of the seminal fluid?","o":["Seminal vesicles","Prostate","Bulbourethral glands","Epididymis"],"e":"Their alkaline, fructose-rich secretion supplies energy."},{"q":"Cryptorchidism is…","o":["failure of one or both testes to descend into the scrotum","twisting of the spermatic cord","fluid in the tunica vaginalis","dilated pampiniform veins"],"e":"Early referral is important."}]}]</script>
<script>
const UNITS = JSON.parse(document.getElementById('quiz-data').textContent);
const TOTAL_SECONDS = 900;
const LETTERS = ['A','B','C','D'];

const AFFIRMATIONS = [
  "You're glowing today, Priscy 💗 one unit at a time!",
  "Future midwife Priscy: gentle hands, brilliant mind 👑",
  "Every question you answer makes you a stronger midwife 💫",
  "Sip some water, Priscy 💧 you're doing amazing ✨",
  "Somewhere, a mother and baby will feel safe because of you 💕",
  "Small steps today, graduation gown tomorrow 🎓💜",
  "You are so capable, Priscy. Keep going, gem 💎",
  "Progress over perfection — look how far you've come 🌷",
  "Hohoe's brightest future midwife, casually being brilliant ✨",
  "Rest if you need to, then come back and shine 🌙",
  "Your heart is as strong as your brain, Priscy 💖",
  "Loved, capable and unstoppable — that's you 🌹"
];
const MID_LOVE = [
  "Halfway petals bloomed, Priscy 🌸 you're doing beautifully!",
  "Your future patients will be so lucky to have you 💕",
  "Steady heart, sharp mind — that's my Priscy 💗",
  "Breathe in, breathe out, and glow on ✨",
  "You're built for this, gem 💎 keep going!",
  "Every fact you know is a life you may save someday 🌷",
  "Soft hands, strong knowledge, big heart 👑",
  "Proud of you already, Priscy 💜"
];
const TIMER_LOVE = [
  "Take your time, beautiful. You know more than you think 💗",
  "Trust your first instinct, Priscy ✨",
  "Skipped one? Come back to it — you're doing great 🌷",
  "Deep breath. You've got this 💫",
  "A midwife in the making 👑",
  "Sending you warm hugs through the screen 🤗💕"
];
const PERFECT = [
  "PERFECT, Priscy!! 👑✨ A flawless garden. The world is lucky you're becoming a midwife 💖",
  "100%! You're a queen, a genius and the love of every textbook 💎💗"
];
const GREAT = [
  "Brilliant work, Priscy! 💎 You're blooming beautifully — just a few petals left to polish 🌸",
  "So proud of you 💕 That's a really strong result. Review the pink ones and you'll be unstoppable!"
];
const GOOD = [
  "Lovely progress, Priscy 🌷 You know a lot already — read the explanations and go again, you'll fly!",
  "You're growing, gem 💜 Every mistake you review now is one you won't make in the ward."
];
const KIND = [
  "Hey, Priscy 💗 this one was tough and that's completely okay. Read the explanations slowly, then try again — you'll surprise yourself 💪🌸",
  "Not your day, but it IS your journey 🌷 Champions review, rest and return. I believe in you, always 💕"
];

const PROGRESS_KEY='priscy_quizgarden_best';
function loadProgress(){ try{ return JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}'); }catch(e){ return {}; } }
function saveProgress(v){ try{ localStorage.setItem(PROGRESS_KEY,JSON.stringify(v)); }catch(e){} }
function resetProgress(){ if(confirm('Reset all your saved scores on this device?')){ try{ localStorage.removeItem(PROGRESS_KEY); }catch(e){} location.reload(); } }
let best = loadProgress();   // unitId -> best percent (saved on this device)
let current = UNITS[0].id;
let session = null;            // active quiz
let tick = null;

const $ = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const fmt = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

function deco(){
  const layer=$('#deco-layer');
  const items=[['cloud','☁️','3.2rem'],['cloud','☁️','2.2rem'],['cloud','☁️','4rem'],['heart','💗','1.6rem'],['heart','💜','1.3rem'],['heart','💕','1.8rem'],['gem','💎','1.5rem'],['gem','💠','1.3rem'],['sparkle','✨','1.3rem'],['sparkle','🌟','1.4rem'],['heart','🌷','1.6rem'],['heart','🌸','1.5rem'],['sparkle','✨','1.1rem']];
  items.forEach(([t,e,s])=>{const el=document.createElement('div');el.className='floaty '+t;el.textContent=e;el.style.fontSize=s;el.style.left=Math.random()*94+'vw';el.style.top=Math.random()*90+'vh';el.style.animationDuration=(14+Math.random()*14)+'s';el.style.animationDelay=(Math.random()*8)+'s';layer.appendChild(el);});
}
function affirm(){
  const el=$('#affirmation'); el.style.opacity=0;
  setTimeout(()=>{el.textContent=pick(AFFIRMATIONS);el.style.opacity=1;},300);
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),3800);
}

function renderNav(){
  const list=$('#unitList'); list.innerHTML='';
  UNITS.forEach((u,i)=>{
    const b=document.createElement('button');
    b.className='unit-btn'+(u.id===current?' active':'');
    b.innerHTML=`<span class="emoji">${u.icon}</span><span><span class="num">Unit ${i+1}</span><br>${u.title}</span>`+(best[u.id]!=null?`<span class="pill">${best[u.id]}%</span>`:'');
    b.onclick=()=>{
      if(session && !session.finished){
        if(!confirm('Leave this quiz? Your timer and answers will be lost.')) return;
        stopTimer(); session=null;
      }
      current=u.id; renderNav(); renderIntro(); window.scrollTo({top:0,behavior:'smooth'});
    };
    list.appendChild(b);
  });
}

function unit(){ return UNITS.find(u=>u.id===current); }
function unitNo(){ return UNITS.findIndex(u=>u.id===current)+1; }

function renderIntro(){
  const u=unit();
  $('#main').innerHTML=`
    <div class="unit-header"><div class="big-emoji">${u.icon}</div><div><h2>Unit ${unitNo()}: ${u.title}</h2><div class="tagline">Ready to bloom through this unit, Priscy? 🌷</div></div></div>
    <div class="card"><h3>💜 Quick review before you start</h3><ul>${u.recap.map(r=>`<li>${r}</li>`).join('')}</ul></div>
    <div class="rules">
      <div class="rule">📝 ${u.qs.length} questions</div>
      <div class="rule">⏱️ 15:00 for the whole unit</div>
      <div class="rule">🙈 Answers &amp; explanations appear after you submit</div>
      <div class="rule">🔀 Questions &amp; options are shuffled</div>
    </div>
    <div class="center">
      <button class="btn big" id="startBtn">Start Quiz 💗</button>
      <div class="best">${best[u.id]!=null?`Your best on this unit: ${best[u.id]}% 👑`:'The timer only starts when you tap the button. Take a breath first 🌬️'}</div>
    </div>`;
  $('#startBtn').onclick=startQuiz;
}

function startQuiz(){
  const u=unit();
  const qs=shuffle(u.qs).map(q=>{
    const opts=shuffle(q.o.map((t,i)=>({t,ok:i===0})));
    return {q:q.q,e:q.e,opts,pick:null};
  });
  session={unitId:u.id,qs,left:TOTAL_SECONDS,finished:false,loveAt:{}};
  renderQuiz();
  toast(`Good luck, Priscy! 15 minutes, all yours 💕`);
  tick=setInterval(()=>{
    session.left--;
    updateClock();
    if(session.left<=0){ toast("Time's up, sweet girl ⏰ — submitting your beautiful work 💗"); submitQuiz(true); }
  },1000);
}
function stopTimer(){ clearInterval(tick); tick=null; }

function renderQuiz(){
  const u=unit(), s=session;
  $('#main').innerHTML=`
    <div class="unit-header"><div class="big-emoji">${u.icon}</div><div><h2>Unit ${unitNo()}: ${u.title}</h2></div></div>
    <div class="timerbar" id="timerbar">
      <div class="timerrow"><div class="clock" id="clock">${fmt(s.left)}</div><div class="prog" id="prog"></div></div>
      <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
      <div class="timefill" aria-hidden="true"><div id="tfill"></div></div>
      <div class="love" id="love">${pick(TIMER_LOVE)}</div>
    </div>
    <div id="qs">${s.qs.map((q,i)=>`
      <div class="qcard" id="qc${i}">
        <div class="qtext"><span class="qnum">Q${i+1}.</span>${esc(q.q)}</div>
        ${q.opts.map((o,oi)=>`<label class="opt" data-q="${i}" data-o="${oi}"><input type="radio" name="q${i}" value="${oi}"><span><b>${LETTERS[oi]}.</b> ${esc(o.t)}</span></label>`).join('')}
      </div>`).join('')}
    </div>
    <div class="submitrow"><button class="btn" id="submitBtn">Submit my answers 💗</button></div>`;
  document.querySelectorAll('#qs input').forEach(inp=>{
    inp.addEventListener('change',e=>{
      const lab=e.target.closest('.opt'); const qi=+lab.dataset.q, oi=+lab.dataset.o;
      session.qs[qi].pick=oi;
      document.querySelectorAll(`#qc${qi} .opt`).forEach(o=>o.classList.remove('sel'));
      lab.classList.add('sel');
      $('#qc'+qi).classList.remove('unans');
      updateProgress();
    });
  });
  $('#submitBtn').onclick=()=>submitQuiz(false);
  updateProgress(); updateClock();
  setInterval.love && clearInterval(setInterval.love);
  setInterval.love=setInterval(()=>{const l=$('#love'); if(l&&session&&!session.finished) l.textContent=pick(TIMER_LOVE);},12000);
}
function answered(){ return session.qs.filter(q=>q.pick!==null).length; }
function updateProgress(){
  const n=answered(), t=session.qs.length;
  $('#prog').textContent=`${n} / ${t} answered`;
  $('#fill').style.width=(n/t*100)+'%';
  [10,20].forEach(m=>{ if(n===m && !session.loveAt[m]){ session.loveAt[m]=1; toast(pick(MID_LOVE)); } });
  if(n===t && !session.loveAt.all){ session.loveAt.all=1; toast("All answered! Review if you like, then submit 💕"); }
}
function updateClock(){
  const c=$('#clock'); if(!c) return;
  c.textContent=fmt(Math.max(0,session.left));
  c.classList.toggle('low',session.left<=60);
  $('#tfill').style.width=(Math.max(0,session.left)/TOTAL_SECONDS*100)+'%';
  if(session.left===60) toast("One minute left, Priscy — you've got this! 💪💗");
}

function submitQuiz(auto){
  const s=session; if(!s||s.finished) return;
  const n=answered(), t=s.qs.length;
  if(!auto && n<t){
    if(!confirm(`You have ${t-n} unanswered question(s). Submit anyway?`)){
      const first=s.qs.findIndex(q=>q.pick===null);
      s.qs.forEach((q,i)=>{ if(q.pick===null) $('#qc'+i).classList.add('unans'); });
      $('#qc'+first).scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
  }
  stopTimer(); clearInterval(setInterval.love);
  s.finished=true;
  const used=TOTAL_SECONDS-Math.max(0,s.left);
  const correct=s.qs.filter(q=>q.pick!==null&&q.opts[q.pick].ok).length;
  const wrong=s.qs.filter(q=>q.pick!==null&&!q.opts[q.pick].ok).length;
  const skipped=t-n;
  const pct=Math.round(correct/t*100);
  if(best[s.unitId]==null||pct>best[s.unitId]){ best[s.unitId]=pct; saveProgress(best); }
  s.result={correct,wrong,skipped,pct,used};
  renderNav(); renderReview('all');
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderReview(filter){
  const u=unit(), s=session, r=s.result;
  let msg;
  if(r.pct===100) msg=pick(PERFECT); else if(r.pct>=80) msg=pick(GREAT); else if(r.pct>=50) msg=pick(GOOD); else msg=pick(KIND);
  if(!s.msg) s.msg=msg;
  const visible=s.qs.map((q,i)=>({q,i})).filter(({q})=>{
    const ok=q.pick!==null&&q.opts[q.pick].ok;
    if(filter==='wrong') return q.pick!==null&&!ok;
    if(filter==='skipped') return q.pick===null;
    return true;
  });
  $('#main').innerHTML=`
    <div class="unit-header"><div class="big-emoji">${u.icon}</div><div><h2>Unit ${unitNo()}: ${u.title}</h2><div class="tagline">Your results, Priscy 💗</div></div></div>
    <div class="result">
      <div class="score">${r.correct} / ${s.qs.length} &nbsp;(${r.pct}%)</div>
      <div class="msg">${s.msg}</div>
      <div class="stats"><div class="stat">✅ ${r.correct} correct</div><div class="stat">❌ ${r.wrong} wrong</div><div class="stat">⏭️ ${r.skipped} skipped</div><div class="stat">⏱️ ${fmt(r.used)} used</div></div>
    </div>
    <div class="filters" role="group" aria-label="Filter answers">
      <button class="chip ${filter==='all'?'on':''}" data-f="all">All (${s.qs.length})</button>
      <button class="chip ${filter==='wrong'?'on':''}" data-f="wrong">Wrong (${r.wrong})</button>
      <button class="chip ${filter==='skipped'?'on':''}" data-f="skipped">Skipped (${r.skipped})</button>
    </div>
    <div id="review">${visible.length?visible.map(({q,i})=>reviewCard(q,i)).join(''):'<div class="card center">Nothing here — beautiful! 🌸</div>'}</div>
    <div class="submitrow">
      <button class="btn" id="retry">Try again 🔄</button>
      ${unitNo()<UNITS.length?'<button class="btn ghost" id="next">Next unit 🌷</button>':''}
    </div>`;
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>renderReview(c.dataset.f));
  $('#retry').onclick=()=>{session=null;renderIntro();window.scrollTo({top:0,behavior:'smooth'});};
  const nx=$('#next'); if(nx) nx.onclick=()=>{session=null;current=UNITS[unitNo()].id;renderNav();renderIntro();window.scrollTo({top:0,behavior:'smooth'});};
}
function reviewCard(q,i){
  const ok=q.pick!==null&&q.opts[q.pick].ok;
  const verdict=q.pick===null?'<div class="verdict skip">⏭️ Skipped</div>':ok?'<div class="verdict ok">✅ Correct — well done, Priscy! 💗</div>':'<div class="verdict no">❌ Not quite — here\'s why 💜</div>';
  const opts=q.opts.map((o,oi)=>{
    let cls='opt locked', tag='';
    if(o.ok){cls+=' correct';tag='<span class="tag">✔ Correct answer</span>';}
    else if(oi===q.pick){cls+=' incorrect';tag='<span class="tag">Your answer</span>';}
    return `<div class="${cls}"><span><b>${LETTERS[oi]}.</b> ${esc(o.t)}</span>${tag}</div>`;
  }).join('');
  return `<div class="qcard"><div class="qtext"><span class="qnum">Q${i+1}.</span>${esc(q.q)}</div>${verdict}${opts}<div class="expl"><b>Why:</b> ${esc(q.e)}</div></div>`;
}

deco(); renderNav(); renderIntro(); affirm(); setInterval(affirm,9000);
</script>
</body>
</html>
