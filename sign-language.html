<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4b2a4f">
<title>Sign Language · Priscy's Signing Studio 🤟</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤟%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf6ef;--paper2:#f5e8da;--card:#fffdfa;--ink:#2b2030;--ink2:#6a5a70;
  --plum:#4b2a4f;--rose:#d9557f;--rose2:#f4c6d4;--rose-soft:#fdeaf0;
  --sage:#3b7a70;--sage-soft:#e0f0ea;--gold:#b98a3e;--gold-soft:#f8ecd2;--sky:#4a7fb5;
  --ok:#2c8a68;--ok-soft:#dcf2e8;--bad:#c43d5a;--bad-soft:#fde3e8;
  --line:rgba(75,42,79,.14);--r:22px;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 14px 34px -16px rgba(75,42,79,.34);
  --display:'Fraunces','Iowan Old Style',Georgia,serif;
  --body:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --hand:'Caveat','Bradley Hand','Segoe Script',cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#171019;--paper2:#201526;--card:#2a1c31;--ink:#f6ecf4;--ink2:#c2b0c7;
  --plum:#e9cdf0;--rose:#f0799f;--rose2:#6b2f49;--rose-soft:#3b2236;
  --sage:#7ccdbd;--sage-soft:#1f3a37;--gold:#e2b765;--gold-soft:#3b3222;--sky:#8fbbe8;
  --ok:#5fd3a6;--ok-soft:#173a2f;--bad:#ff7c99;--bad-soft:#42212c;--line:rgba(233,205,240,.16);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px -16px rgba(0,0,0,.6);}}
:root[data-theme="dark"]{
  --paper:#171019;--paper2:#201526;--card:#2a1c31;--ink:#f6ecf4;--ink2:#c2b0c7;
  --plum:#e9cdf0;--rose:#f0799f;--rose2:#6b2f49;--rose-soft:#3b2236;
  --sage:#7ccdbd;--sage-soft:#1f3a37;--gold:#e2b765;--gold-soft:#3b3222;--sky:#8fbbe8;
  --ok:#5fd3a6;--ok-soft:#173a2f;--bad:#ff7c99;--bad-soft:#42212c;--line:rgba(233,205,240,.16);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px -16px rgba(0,0,0,.6);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.45;min-height:100vh;
  background-image:radial-gradient(1200px 500px at 85% -10%,var(--rose-soft),transparent 60%),radial-gradient(900px 500px at -10% 30%,var(--gold-soft),transparent 55%);
  background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 90px}
h1,h2,h3{font-family:var(--display);margin:0;color:var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;box-shadow:var(--shadow)}
.back{font-weight:600}
.hero{position:relative;border-radius:28px;padding:26px 22px 22px;background:linear-gradient(135deg,var(--plum),#7b3b6b 60%,var(--rose));color:#fff;overflow:hidden;box-shadow:var(--shadow)}
:root[data-theme="dark"] .hero,:root:not([data-theme="light"]) .hero{--hx:1}
.hero h1{color:#fff;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:4px 0 6px}
.hero .eyebrow{font-family:var(--hand);font-size:22px;opacity:.95}
.hero p{margin:0 0 14px;opacity:.92;max-width:34ch}
.hero .emoji{position:absolute;right:14px;top:8px;font-size:78px;opacity:.9;transform:rotate(12deg)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.16);border-radius:16px;padding:8px 12px;min-width:92px}
.stat b{display:block;font-size:22px;font-family:var(--display)}
.stat span{font-size:12px;opacity:.9}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:16px;background:var(--rose);color:#fff;font-weight:600;box-shadow:0 10px 22px -12px var(--rose)}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);box-shadow:none}
.btn.white{background:#fff;color:var(--plum);box-shadow:none}
.btn:active{transform:scale(.97)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec{margin:22px 2px 10px;display:flex;align-items:baseline;justify-content:space-between}
.sec h2{font-size:22px}.sec small{color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.tcard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.tcard .ic{font-size:30px}
.tcard h3{font-size:17px;line-height:1.15}
.tcard small{color:var(--ink2)}
.bar{height:7px;border-radius:9px;background:var(--rose-soft);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:9px;transition:width .4s}
.tcard.done::after{content:"✓";position:absolute;right:12px;top:10px;color:var(--ok);font-weight:700}
.search{width:100%;padding:13px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;box-shadow:var(--shadow)}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:5px;margin:12px 0;box-shadow:var(--shadow)}
.tabs button{flex:1;padding:10px 6px;border-radius:13px;font-weight:600;color:var(--ink2)}
.tabs button.on{background:var(--plum);color:#fff}
:root[data-theme="dark"] .tabs button.on{color:#171019}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button.on{color:#171019}}
.title{display:flex;align-items:center;gap:10px;margin:6px 2px}
.title .ic{font-size:36px}.title h1{font-size:26px}
.fc{perspective:1200px;margin:10px 0 14px}
.fcin{position:relative;width:100%;aspect-ratio:1/1.12;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fcin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.face.back{transform:rotateY(180deg);gap:8px;justify-content:flex-start;padding-top:18px}
.face img.ph{width:100%;height:calc(100% - 26px);object-fit:contain;border-radius:16px;background:#fff}
.face .hint{position:absolute;bottom:3px;font-family:var(--hand);font-size:20px;color:var(--ink2)}
.word{font-family:var(--display);font-size:clamp(28px,8vw,44px);font-weight:700;text-align:center;line-height:1.05;color:var(--rose)}
.howto{width:100%;background:#fff;border-radius:14px;padding:4px;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.howto img{max-width:100%;max-height:100%;object-fit:contain}
.face.back .mini{width:88px;height:88px;object-fit:cover;border-radius:14px;position:absolute;left:12px;top:12px;border:2px solid var(--rose2)}
.face.back .word{margin-left:96px;margin-right:6px;font-size:clamp(22px,6.5vw,34px);text-align:left;min-height:70px;display:flex;align-items:center;width:calc(100% - 96px)}
.count{text-align:center;color:var(--ink2);font-size:14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-top:10px}
.q .qimg{width:100%;max-height:300px;object-fit:contain;background:#fff;border-radius:16px;display:block}
.q h3{font-size:20px;text-align:center;margin:4px 0 12px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{padding:14px;border-radius:16px;background:var(--paper);border:2px solid var(--line);font-weight:600;font-size:17px;text-align:center}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pgrid button{border-radius:16px;border:3px solid var(--line);overflow:hidden;background:#fff;padding:0;aspect-ratio:1/1}
.pgrid button img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid button.ok{border-color:var(--ok)}.pgrid button.no{border-color:var(--bad)}
.prog{height:8px;border-radius:9px;background:var(--rose-soft);overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:var(--rose);transition:width .3s}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:620px){.wgrid{grid-template-columns:repeat(4,1fr)}}
.wcell{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:center;box-shadow:var(--shadow);position:relative}
.wcell img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#fff}
.wcell span{display:block;padding:6px 4px 8px;font-size:13px;font-weight:600;line-height:1.1}
.wcell.l::after{content:"✓";position:absolute;right:6px;top:4px;background:var(--ok);color:#fff;width:20px;height:20px;border-radius:50%;font-size:12px;display:grid;place-items:center}
.modal{position:fixed;inset:0;background:rgba(20,10,25,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mbox{background:var(--card);border-radius:24px;padding:14px;max-width:460px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 60px -20px #000}
.mbox img.ph{width:100%;max-height:48vh;object-fit:contain;background:#fff;border-radius:14px;display:block}
.mbox .howto{margin-top:10px}
.res{text-align:center}
.res .big{font-family:var(--display);font-size:56px;color:var(--rose)}
.rv{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:var(--paper);margin-top:8px;text-align:left}
.rv img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:#fff}
.rv.bad{border-left:5px solid var(--bad)}.rv.good{border-left:5px solid var(--ok)}
.loading{text-align:center;padding:40px 0;color:var(--ink2);font-family:var(--hand);font-size:24px}
textarea.code{width:100%;min-height:90px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px;font-size:12px;word-break:break-all}
.warn{background:var(--gold-soft);border-radius:14px;padding:10px 12px;font-size:14px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--plum);color:#fff;padding:10px 16px;border-radius:14px;z-index:60;font-size:14px}
:root[data-theme="dark"] .toast{color:#171019}
.foot{text-align:center;color:var(--ink2);font-family:var(--hand);font-size:20px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="sign-index.js"></script>
<script>
(function(){
'use strict';
var IDX=window.SIGN_INDEX||{topics:[]};
var KEY='priscy_signlang_v1',THEME='priscy_signlang_theme';
var store={v:1,b:{},best:{},days:{},tot:{a:0,c:0},last:''};
var persistWarn=false;
function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.v===1){store=o;store.b=store.b||{};store.best=store.best||{};store.days=store.days||{};store.tot=store.tot||{a:0,c:0}}}}catch(e){persistWarn=true}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){persistWarn=true}}
load();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{var th=localStorage.getItem(THEME);if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function topic(id){for(var i=0;i<IDX.topics.length;i++)if(IDX.topics[i].id===id)return IDX.topics[i]}
function lvl(id){return store.b[id]||0}
function learned(id){return lvl(id)>=2}
function tprog(t){var n=0;t.items.forEach(function(it){if(learned(it.id))n++});return n}
function allLearned(){var n=0,tot=0;IDX.topics.forEach(function(t){n+=tprog(t);tot+=t.items.length});return [n,tot]}
function streak(){var n=0,d=new Date();for(;;){var k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();if(store.days[k]){n++;d.setDate(d.getDate()-1)}else if(n===0&&k===today()){d.setDate(d.getDate()-1)}else break}return n}
function mark(){store.days[today()]=1}
function note(id,ok){var b=lvl(id);store.b[id]=ok?Math.min(b+1,3):Math.max(b-1,0);mark();save()}
var loaded={};
function loadTopic(id){
  var t=topic(id);
  if(window.SIGN_IMG&&window.SIGN_IMG[id])return Promise.resolve();
  if(loaded[t.file])return loaded[t.file];
  loaded[t.file]=new Promise(function(res,rej){
    var s=document.createElement('script');s.src=t.file+'?v='+IDX.version;
    s.onload=function(){res()};s.onerror=function(){delete loaded[t.file];rej(new Error('missing '+t.file))};
    document.head.appendChild(s);
  });
  return loaded[t.file];
}
function img(tid,id,k){var o=window.SIGN_IMG&&window.SIGN_IMG[tid]&&window.SIGN_IMG[tid][id];return o&&o[k||'p']?'data:image/jpeg;base64,'+o[k||'p']:''}
function topicOf(id){for(var i=0;i<IDX.topics.length;i++){var t=IDX.topics[i];for(var j=0;j<t.items.length;j++)if(t.items[j].id===id)return t.id}}
var app=$('#app');
var view={name:'home'};
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function head(back){
  return '<div class="top">'+(back?'<button class="chip back" data-go="home">← Back</button>':'<span class="chip">🤟 Signing Studio</span>')+
  '<span class="row"><span class="chip">🔥 '+streak()+'</span><button class="chip" data-act="theme" aria-label="theme">🌓</button></span></div>';
}
function home(){
  var al=allLearned(),pc=al[1]?Math.round(al[0]*100/al[1]):0;
  var h=head(false)+'<div class="hero"><span class="emoji">🤟</span><div class="eyebrow">for Priscy, with love</div><h1>Learn Ghanaian<br>Sign Language</h1><p>Pictures first, words second. Flip, practise, quiz — your progress is saved on this phone.</p>'+
  '<div class="stats"><div class="stat"><b>'+al[0]+'</b><span>signs learned</span></div><div class="stat"><b>'+al[1]+'</b><span>signs in total</span></div><div class="stat"><b>'+pc+'%</b><span>complete</span></div></div>'+
  '<div class="row" style="margin-top:16px"><button class="btn white" data-act="mix">🎲 Surprise quiz</button><button class="btn white" data-act="search" style="background:rgba(255,255,255,.2);color:#fff">🔎 Find a sign</button></div></div>';
  if(persistWarn)h+='<div class="warn">⚠️ This browser is not letting me save progress (private mode?). Open the page in a normal tab so your learning is kept.</div>';
  h+='<div class="sec"><h2>Pick a topic</h2><small>'+IDX.topics.length+' topics</small></div><div class="grid">';
  IDX.topics.forEach(function(t){var n=tprog(t),p=Math.round(n*100/t.items.length);
    h+='<button class="tcard'+(n===t.items.length?' done':'')+'" data-topic="'+t.id+'"><span class="ic">'+t.icon+'</span><h3>'+esc(t.title)+'</h3><small>'+n+' / '+t.items.length+' learned</small><div class="bar"><i style="width:'+p+'%"></i></div></button>'});
  h+='</div><div class="sec"><h2>Keep it safe</h2></div><div class="row"><button class="btn alt" data-act="backup">💾 Backup / restore</button></div><div class="foot">Practise a little every day 💛</div>';
  app.innerHTML=h;window.scrollTo(0,0);
}
var T=null,DECK=[],DI=0,tab='cards';
function openTopic(id,t2){
  T=topic(id);tab=t2||'cards';store.last=id;save();
  app.innerHTML=head(true)+'<div class="loading">Opening '+esc(T.title)+'…</div>';
  loadTopic(id).then(function(){buildDeck();renderTopic()}).catch(function(){app.innerHTML=head(true)+'<div class="warn">Could not load <b>'+esc(T.file)+'</b>. Make sure this file was uploaded next to this page (same folder), then refresh.</div>'});
}
function buildDeck(){
  var un=T.items.filter(function(i){return !learned(i.id)}),le=T.items.filter(function(i){return learned(i.id)});
  DECK=shuffle(un).concat(shuffle(le));DI=0;
}
function renderTopic(){
  var h=head(true)+'<div class="title"><span class="ic">'+T.icon+'</span><div><h1>'+esc(T.title)+'</h1><small style="color:var(--ink2)">'+tprog(T)+' of '+T.items.length+' learned</small></div></div>'+
  '<div class="tabs"><button data-tab="cards" class="'+(tab==='cards'?'on':'')+'">🃏 Cards</button><button data-tab="quiz" class="'+(tab==='quiz'?'on':'')+'">🎯 Quiz</button><button data-tab="words" class="'+(tab==='words'?'on':'')+'">📖 All signs</button></div><div id="pane"></div>';
  app.innerHTML=h;
  if(tab==='cards')cards();else if(tab==='quiz')quizStart([T.id],10,'t:'+T.id);else words();
}
function cards(){
  var it=DECK[DI];if(!it){return}
  var tid=T.id,ph=img(tid,it.id,'p'),cp=img(tid,it.id,'c');
  var bk=cp?'<div class="howto"><img alt="how to sign" src="'+cp+'"></div>':'';
  $('#pane').innerHTML='<div class="count">Card '+(DI+1)+' of '+DECK.length+(learned(it.id)?' · ✓ learned':'')+'</div><div class="prog"><i style="width:'+Math.round((DI)*100/DECK.length)+'%"></i></div>'+
  '<div class="fc" id="fc"><div class="fcin"><div class="face front"><img class="ph" alt="sign" src="'+ph+'"><span class="hint">tap to flip 👆</span></div>'+
  '<div class="face back"><img class="mini" alt="" src="'+ph+'"><div class="word">'+esc(it.w)+'</div>'+bk+'</div></div></div>'+
  '<div class="row" style="justify-content:center"><button class="btn alt" data-act="again">🔁 Still learning</button><button class="btn" data-act="got">✅ I know it</button></div>'+
  '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost" data-act="prev">‹ Prev</button><button class="btn ghost" data-act="next">Skip ›</button></div>';
  $('#fc').onclick=function(){this.classList.toggle('flip')};
}
function nextCard(){DI++;if(DI>=DECK.length){$('#pane').innerHTML='<div class="q res"><div class="big">🎉</div><h3>Round finished!</h3><p>'+tprog(T)+' of '+T.items.length+' signs learned in this topic.</p><div class="row" style="justify-content:center"><button class="btn" data-act="restart">Go again</button><button class="btn alt" data-tab="quiz">Take the quiz</button></div></div>';$('.title small').textContent=tprog(T)+' of '+T.items.length+' learned';return}cards()}
function words(){
  var tid=T.id,h='<div class="wgrid">';
  T.items.forEach(function(it){h+='<button class="wcell'+(learned(it.id)?' l':'')+'" data-w="'+it.id+'"><img loading="lazy" alt="" src="'+img(tid,it.id,'p')+'"><span>'+esc(it.w)+'</span></button>'});
  $('#pane').innerHTML=h+'</div>';
}
function modal(tid,id,word){
  var cp=img(tid,id,'c');
  var m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="mbox"><div class="word" style="margin:4px 0 10px">'+esc(word)+'</div><img class="ph" alt="" src="'+img(tid,id,'p')+'">'+(cp?'<div class="howto"><img alt="how to sign" src="'+cp+'"></div>':'')+'<div class="row" style="justify-content:center;margin-top:12px"><button class="btn alt" data-close>Close</button></div></div>';
  m.onclick=function(e){if(e.target===m||e.target.hasAttribute('data-close'))m.remove()};
  document.body.appendChild(m);
}
/* ---- quiz ---- */
var Q=null;
function quizStart(tids,n,key){
  $('#pane')&&($('#pane').innerHTML='<div class="loading">Getting questions ready…</div>');
  Promise.all(tids.map(loadTopic)).then(function(){
    var pool=[];tids.forEach(function(id){topic(id).items.forEach(function(it){pool.push({id:it.id,w:it.w,t:id})})});
    // prefer signs not yet learned
    var un=shuffle(pool.filter(function(p){return !learned(p.id)})),le=shuffle(pool.filter(function(p){return learned(p.id)}));
    var pick=un.concat(le).slice(0,Math.min(n,pool.length));pick=shuffle(pick);
    var qs=pick.map(function(p){
      var same=pool.filter(function(x){return x.t===p.t&&x.id!==p.id&&x.w!==p.w});
      var others=shuffle(same.length>=3?same:pool.filter(function(x){return x.id!==p.id&&x.w!==p.w})).slice(0,3);
      var type=Math.random()<0.55?'p2w':'w2p';
      return {t:type,c:p,o:shuffle(others.concat([p]))};
    });
    Q={qs:qs,i:0,score:0,wrong:[],key:key,ok:[]};
    if(!$('#pane')){app.innerHTML=head(true)+'<div id="pane"></div>'}
    showQ();
  }).catch(function(){toast('Some picture files are missing — upload all sign-*.js files')});
}
function showQ(){
  var q=Q.qs[Q.i],c=q.c,tid=c.t,h;
  var pr='<div class="count">Question '+(Q.i+1)+' of '+Q.qs.length+'</div><div class="prog"><i style="width:'+Math.round(Q.i*100/Q.qs.length)+'%"></i></div>';
  if(q.t==='p2w'){
    h=pr+'<div class="q"><img class="qimg" alt="sign" src="'+img(tid,c.id,'p')+'"><h3>What does this sign mean?</h3><div class="opts">'+q.o.map(function(o,i){return '<button class="opt" data-o="'+i+'">'+esc(o.w)+'</button>'}).join('')+'</div></div>';
  }else{
    h=pr+'<div class="q"><h3>Which picture is “'+esc(c.w)+'”?</h3><div class="pgrid">'+q.o.map(function(o,i){return '<button data-o="'+i+'"><img alt="" src="'+img(o.t,o.id,'p')+'"></button>'}).join('')+'</div></div>';
  }
  $('#pane').innerHTML=h;window.scrollTo(0,0);
}
function answer(i){
  var q=Q.qs[Q.i];if(q.done)return;q.done=true;
  var right=q.o[i].id===q.c.id;
  var btns=document.querySelectorAll('[data-o]');
  btns.forEach(function(b,k){if(q.o[k].id===q.c.id)b.classList.add('ok');else if(k===i)b.classList.add('no')});
  note(q.c.id,right);store.tot.a++;if(right){store.tot.c++;Q.score++}else Q.wrong.push(q.c);Q.ok.push({c:q.c,r:right});save();
  setTimeout(function(){
    var extra='<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-act="qnext">'+(Q.i+1>=Q.qs.length?'See my result':'Next ›')+'</button></div>';
    if(q.t==='w2p'){var wd=document.createElement('div');wd.innerHTML='<div class="word" style="margin-top:12px;font-size:26px">'+esc(q.c.w)+'</div>';$('.q').appendChild(wd)}
    var e=document.createElement('div');e.innerHTML=extra;$('.q').appendChild(e);
    if(right){var n=$('.q h3');}
  },350);
}
function result(){
  var n=Q.qs.length,pct=Math.round(Q.score*100/n);
  var prev=store.best[Q.key]||0;if(pct>prev){store.best[Q.key]=pct;save()}
  var msg=pct===100?'Perfect! Queen of signs 👑':pct>=80?'Beautiful work 🌟':pct>=50?'Good going — keep practising 💪':'Every try teaches you. Again? 💛';
  var h='<div class="q res"><div class="big">'+Q.score+'/'+n+'</div><h3>'+msg+'</h3><p style="color:var(--ink2)">Best score here: '+Math.max(pct,prev)+'%</p><div class="row" style="justify-content:center"><button class="btn" data-act="qagain">Play again</button>'+(view.name==='mix'?'':'<button class="btn alt" data-tab="cards">Cards</button>')+'</div></div>';
  if(Q.wrong.length){h+='<div class="sec"><h2>Look again</h2></div>';Q.wrong.forEach(function(c){h+='<button class="rv bad" style="width:100%" data-rv="'+c.t+'|'+c.id+'|'+esc(c.w)+'"><img alt="" src="'+img(c.t,c.id,'p')+'"><b>'+esc(c.w)+'</b></button>'})}
  $('#pane').innerHTML=h;window.scrollTo(0,0);
}
function mixQuiz(){
  view.name='mix';
  var ids=shuffle(IDX.topics.map(function(t){return t.id})).slice(0,3);
  app.innerHTML=head(true)+'<div class="title"><span class="ic">🎲</span><h1>Surprise quiz</h1></div><div id="pane"></div>';
  quizStart(ids,12,'mix');
}
function searchView(){
  view.name='search';
  app.innerHTML=head(true)+'<div class="title"><span class="ic">🔎</span><h1>Find a sign</h1></div><input class="search" id="sq" placeholder="Type a word, e.g. mother" autocomplete="off"><div id="sr" style="margin-top:12px"></div>';
  var all=[];IDX.topics.forEach(function(t){t.items.forEach(function(it){all.push({id:it.id,w:it.w,t:t.id,tt:t.title})})});
  $('#sq').addEventListener('input',function(){
    var v=this.value.trim().toUpperCase();var box=$('#sr');
    if(v.length<2){box.innerHTML='<div class="count">Type at least 2 letters</div>';return}
    var m=all.filter(function(x){return x.w.indexOf(v)>=0}).slice(0,24);
    box.innerHTML=m.length?m.map(function(x){return '<button class="rv" style="width:100%" data-sr="'+x.t+'|'+x.id+'|'+esc(x.w)+'"><b>'+esc(x.w)+'</b><small style="color:var(--ink2)">'+esc(x.tt)+'</small></button>'}).join(''):'<div class="count">No match — try another spelling</div>';
  });
  $('#sq').focus();
}
function backup(){
  view.name='backup';
  var code='PRISCYSIGN1:'+btoa(unescape(encodeURIComponent(JSON.stringify(store))));
  app.innerHTML=head(true)+'<div class="title"><span class="ic">💾</span><h1>Backup</h1></div><div class="q"><p>Copy this code and keep it (WhatsApp it to yourself). If you ever change phone, paste it below to get your progress back.</p><textarea class="code" id="bc" readonly>'+code+'</textarea><div class="row" style="margin-top:8px"><button class="btn" data-act="copy">Copy code</button></div></div>'+
  '<div class="q"><h3 style="text-align:left;font-size:18px">Restore</h3><textarea class="code" id="rc" placeholder="Paste a PRISCYSIGN1:… code here"></textarea><div class="row" style="margin-top:8px"><button class="btn alt" data-act="restore">Restore progress</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-go],[data-topic],[data-act],[data-tab],[data-o],[data-w],[data-rv],[data-sr]');if(!el)return;
  if(el.hasAttribute('data-go')){view={name:'home'};Q=null;home();return}
  if(el.dataset.topic){view={name:'topic'};openTopic(el.dataset.topic);return}
  if(el.dataset.tab){tab=el.dataset.tab;view={name:'topic'};renderTopic();return}
  if(el.dataset.o!==undefined){answer(+el.dataset.o);return}
  if(el.dataset.w){var tt=T.id;var it=T.items.filter(function(x){return x.id===el.dataset.w})[0];modal(tt,it.id,it.w);return}
  if(el.dataset.rv||el.dataset.sr){var p=(el.dataset.rv||el.dataset.sr).split('|');
    loadTopic(p[0]).then(function(){modal(p[0],p[1],p[2])}).catch(function(){toast('Picture file missing')});return}
  var a=el.dataset.act;
  if(a==='theme'){var cur=document.documentElement.getAttribute('data-theme');var dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;var nx=dark?'light':'dark';document.documentElement.setAttribute('data-theme',nx);try{localStorage.setItem(THEME,nx)}catch(e){}}
  else if(a==='got'){note(DECK[DI].id,true);nextCard()}
  else if(a==='again'){note(DECK[DI].id,false);nextCard()}
  else if(a==='next'){nextCard()}
  else if(a==='prev'){if(DI>0){DI--;cards()}}
  else if(a==='restart'){buildDeck();cards()}
  else if(a==='qnext'){Q.i++;if(Q.i>=Q.qs.length)result();else showQ()}
  else if(a==='qagain'){if(view.name==='mix')mixQuiz();else quizStart([T.id],10,'t:'+T.id)}
  else if(a==='mix')mixQuiz();
  else if(a==='search')searchView();
  else if(a==='backup')backup();
  else if(a==='copy'){var t=$('#bc');t.select();try{document.execCommand('copy');toast('Copied ✓')}catch(e){toast('Select and copy the code manually')}}
  else if(a==='restore'){
    var v=($('#rc').value||'').trim();
    try{if(v.indexOf('PRISCYSIGN1:')!==0)throw 0;var o=JSON.parse(decodeURIComponent(escape(atob(v.slice(12)))));if(!o||o.v!==1)throw 0;store=o;save();toast('Progress restored ✓');view={name:'home'};home()}catch(err){toast('That code does not look right')}
  }
});
document.addEventListener('visibilitychange',function(){if(document.hidden)save()});
window.addEventListener('pagehide',save);
home();
})();
</script>
</body>
