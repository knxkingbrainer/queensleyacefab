<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priscy's Medical Nursing Quiz Garden 🌷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff8fd6;--pink-bright:#ff4fc3;--blue:#7fd6ff;--blue-bright:#3fb8ff;--purple:#b98cff;--purple-bright:#9b4dff;--deep:#5a3a7a;--shadow:rgba(154,77,255,.25);--good:#5fce9a;--bad:#ff6f8e;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Quicksand',sans-serif;color:var(--deep);min-height:100vh;background:linear-gradient(135deg,#ffe3f6 0%,#dcefff 35%,#ecdcff 65%,#fff0e0 85%,#ffe3f6 100%);background-size:400% 400%;animation:bgshift 22s ease infinite;overflow-x:hidden;}
@keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
h1,h2,h3,h4{font-family:'Baloo 2',cursive;margin:0;}
#deco-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.floaty{position:absolute;opacity:.8;filter:drop-shadow(0 4px 10px rgba(154,77,255,.25));animation-timing-function:ease-in-out;animation-iteration-count:infinite;}
.cloud{animation-name:driftX}.heart{animation-name:bobY}.gem{animation-name:spinBob}.sparkle{animation-name:twinkle}
@keyframes driftX{0%,100%{transform:translateX(-10vw)}50%{transform:translateX(10vw) translateY(-2vh)}}
@keyframes bobY{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-22px) rotate(4deg)}}
@keyframes spinBob{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.floaty,body,.fall{animation:none!important}}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:24px 18px 80px;}
header.hero{text-align:center;padding:14px 10px 18px;}
.hero h1{font-size:clamp(1.7rem,4vw,2.7rem);background:linear-gradient(90deg,var(--pink-bright),var(--purple-bright),var(--blue-bright));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero .sub{font-size:1.02rem;margin-top:6px;color:#7a4fa8;font-weight:600;}
.mascot{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px auto 0;max-width:680px}
.bunny{font-size:2.4rem;animation:bobY 4s ease-in-out infinite}
.affirmation{flex:1;background:rgba(255,255,255,.7);border:2px dashed var(--pink);border-radius:22px;padding:10px 18px;font-weight:600;color:#a13d9a;backdrop-filter:blur(3px);min-height:46px;transition:opacity .6s;text-align:left;position:relative}
.garden-meter{margin:12px auto 0;max-width:520px;background:rgba(255,255,255,.7);border-radius:18px;padding:8px 14px;border:2px solid rgba(255,255,255,.9);box-shadow:0 6px 16px var(--shadow)}
.garden-meter .gm-top{display:flex;justify-content:space-between;font-weight:700;font-size:.88rem;color:#7a3fae}
.garden-meter .gm-track{height:10px;border-radius:99px;background:rgba(154,77,255,.15);margin-top:6px;overflow:hidden}
.garden-meter .gm-fill{height:100%;width:0;background:linear-gradient(90deg,#ffb3e6,#ff4fc3,#9b4dff);border-radius:99px;transition:width .6s}
.layout{display:grid;grid-template-columns:310px 1fr;gap:22px;margin-top:20px;}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
nav.units{background:rgba(255,255,255,.55);border-radius:24px;padding:14px;height:fit-content;border:2px solid rgba(255,255,255,.8);box-shadow:0 10px 30px var(--shadow);backdrop-filter:blur(6px);position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;}
@media (max-width:860px){nav.units{position:static;max-height:300px}}
nav.units h3{padding:6px 10px 8px;color:#7a3fae;font-size:1rem;}
.search{width:100%;border:2px solid var(--pink);border-radius:999px;padding:8px 14px;font-family:'Quicksand',sans-serif;font-weight:600;color:var(--deep);background:rgba(255,255,255,.85);margin-bottom:10px;outline:none}
.search:focus{border-color:var(--purple-bright)}
.unit-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;cursor:pointer;padding:9px 11px;margin-bottom:5px;border-radius:14px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:.86rem;color:#5a3a7a;transition:all .2s}
.unit-btn:hover{background:rgba(255,143,214,.18);transform:translateX(3px)}
.unit-btn:focus-visible,.btn:focus-visible,.opt:focus-within,.dot:focus-visible{outline:3px solid var(--purple-bright);outline-offset:2px}
.unit-btn.active{background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;box-shadow:0 6px 14px var(--shadow)}
.unit-btn.mix{background:linear-gradient(90deg,rgba(255,214,236,.8),rgba(200,230,255,.8));border:2px dashed var(--pink);margin-bottom:10px}
.unit-btn.mix.active{background:linear-gradient(90deg,var(--pink-bright),var(--blue-bright))}
.unit-btn .emoji{font-size:1.15rem}
.unit-btn .num{opacity:.7;font-size:.75rem}
.pill{margin-left:auto;font-size:.7rem;background:rgba(255,255,255,.7);border-radius:10px;padding:2px 7px;color:#7a3fae;font-weight:700;white-space:nowrap}
.unit-btn.active .pill{background:rgba(255,255,255,.35);color:#fff}
main.content{background:rgba(255,255,255,.62);border-radius:28px;padding:24px 26px 32px;border:2px solid rgba(255,255,255,.85);box-shadow:0 14px 40px var(--shadow);backdrop-filter:blur(6px);min-height:420px;}
@media (max-width:520px){main.content{padding:18px 14px 26px}}
.unit-header{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.big-emoji{font-size:2.4rem}
.unit-header h2{font-size:clamp(1.25rem,2.6vw,1.75rem);color:#7a3fae}
.tagline{color:#a9679b;font-weight:600;margin:2px 0 16px}
.card{background:linear-gradient(135deg,rgba(255,214,236,.55),rgba(180,214,255,.4));border-radius:20px;padding:16px 20px;margin-bottom:20px;border:1px solid rgba(255,255,255,.7)}
.card h3{color:#5a3a7a;margin-bottom:8px;font-size:1.05rem}
.card ul{margin:0;padding-left:20px}.card li{margin-bottom:7px;line-height:1.5;font-size:.95rem}
.rules{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}
.rule{background:rgba(255,255,255,.75);border:1.5px solid rgba(154,77,255,.2);border-radius:14px;padding:8px 14px;font-weight:700;font-size:.9rem}
.btn{font-family:'Baloo 2',cursive;border:none;cursor:pointer;border-radius:999px;padding:11px 24px;font-size:1rem;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--pink-bright),var(--purple-bright));box-shadow:0 6px 16px var(--shadow);transition:transform .15s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn.ghost{background:rgba(255,255,255,.75);color:#7a3fae;box-shadow:none;border:2px solid var(--pink)}
.btn.big{font-size:1.25rem;padding:14px 36px}
.center{text-align:center}
.best{margin-top:12px;font-weight:700;color:#a13d9a}
.timerbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);border-radius:18px;padding:10px 16px;margin:0 0 16px;box-shadow:0 8px 20px var(--shadow);border:2px solid var(--pink);backdrop-filter:blur(6px)}
.timerrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.clock{font-family:'Baloo 2',cursive;font-size:1.7rem;color:#7a3fae;font-variant-numeric:tabular-nums}
.clock.low{color:#e0245e;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.prog{font-weight:700;font-size:.9rem}
.track{height:10px;background:rgba(154,77,255,.15);border-radius:99px;margin-top:8px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--pink-bright),var(--purple-bright));border-radius:99px;transition:width .3s}
.timefill{height:6px;margin-top:6px;background:rgba(63,184,255,.2);border-radius:99px;overflow:hidden}
.timefill>div{height:100%;width:100%;background:linear-gradient(90deg,var(--blue-bright),var(--purple));transition:width 1s linear}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--pink);background:rgba(255,255,255,.8);font-size:.6rem;font-weight:700;color:#a13d9a;cursor:pointer;padding:0;line-height:1;font-family:'Quicksand',sans-serif}
.dot.done{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border-color:transparent}
.love{margin-top:8px;font-size:.85rem;font-weight:600;color:#a13d9a;min-height:1.2em}
.qcard{background:rgba(255,255,255,.78);border-radius:18px;padding:15px 18px;margin-bottom:13px;border:2px solid transparent;scroll-margin-top:170px}
.qcard.unans{border-color:var(--pink)}
.qtext{font-weight:700;color:#4a3068;margin-bottom:10px;line-height:1.45}
.qnum{color:var(--pink-bright);margin-right:6px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;margin-bottom:7px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.65);border:1.5px solid rgba(154,77,255,.15);font-weight:600;font-size:.92rem;line-height:1.4}
.opt:hover{background:rgba(180,214,255,.35)}
.opt input{accent-color:var(--purple-bright);margin-top:3px}
.opt.sel{background:rgba(185,140,255,.22);border-color:var(--purple-bright)}
.opt.correct{background:rgba(140,230,180,.55);border-color:var(--good)}
.opt.incorrect{background:rgba(255,150,170,.5);border-color:var(--bad)}
.opt.locked{pointer-events:none}
.tag{margin-left:auto;font-size:.72rem;font-weight:800;white-space:nowrap;padding-left:8px}
.expl{margin-top:8px;padding:10px 14px;border-radius:12px;background:linear-gradient(120deg,rgba(255,235,248,.9),rgba(226,240,255,.9));border-left:5px solid var(--purple-bright);font-size:.9rem;line-height:1.5}
.expl b{color:#7a3fae}
.src{font-size:.75rem;color:#a9679b;font-weight:700;margin-bottom:4px}
.verdict{font-family:'Baloo 2',cursive;font-size:.9rem;margin-bottom:6px}
.verdict.ok{color:#1c8f5c}.verdict.no{color:#d0244f}.verdict.skip{color:#a9679b}
.submitrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.result{text-align:center;padding:22px 18px;border-radius:22px;margin-bottom:18px;background:linear-gradient(120deg,rgba(255,214,236,.8),rgba(200,180,255,.65));}
.result .badge{font-size:3rem;line-height:1}
.result .score{font-family:'Baloo 2',cursive;font-size:2.6rem;color:#7a3fae;line-height:1.1}
.result .msg{font-weight:700;margin-top:8px;font-size:1.05rem;line-height:1.5}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.stat{background:rgba(255,255,255,.8);border-radius:14px;padding:6px 14px;font-weight:700;font-size:.88rem}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{border:2px solid var(--pink);background:rgba(255,255,255,.75);color:#7a3fae;border-radius:99px;padding:6px 14px;font-weight:700;cursor:pointer;font-family:'Quicksand',sans-serif}
.chip.on{background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;border-color:transparent}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:#fff;border:2px solid var(--pink);border-radius:18px;padding:12px 20px;font-weight:700;color:#a13d9a;box-shadow:0 10px 30px var(--shadow);z-index:50;max-width:92vw;text-align:center;transition:all .4s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fall{position:fixed;top:-40px;z-index:60;pointer-events:none;animation:fallDown linear forwards}
@keyframes fallDown{to{transform:translateY(112vh) rotate(540deg);opacity:.9}}
@media (max-width:520px){.dots{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.dot{flex:0 0 22px}}
footer.note{text-align:center;margin-top:28px;color:#9a6fbf;font-size:.85rem;font-weight:600}
</style>
</head>
<body>
<div id="deco-layer"></div>
<div class="wrap">
  <header class="hero">
    <h1>Priscy's Medical Nursing Quiz Garden 🌷</h1>
    <div class="sub">Medical Nursing handout — <span id="unitCount"></span> units, 40 questions each 💗</div>
    <div class="mascot"><div class="bunny" aria-hidden="true">🐰</div><div class="affirmation" id="affirmation" aria-live="polite"></div></div>
    <div class="garden-meter"><div class="gm-top"><span>🌱 Your garden</span><span id="gmText"></span></div><div class="gm-track"><div class="gm-fill" id="gmFill"></div></div></div>
  </header>
  <div class="layout">
    <nav class="units" aria-label="Units"><h3>🌸 Pick a unit, Priscy!</h3><input class="search" id="search" type="search" placeholder="🔍 Search units…" aria-label="Search units"><div id="unitList"></div></nav>
    <main class="content" id="main"></main>
  </div>
  <footer class="note">made with 💕 for Priscy — every answer is a petal, and you're growing a whole garden 🌷👑<br><a href="#" onclick="resetProgress();return false;" style="font-size:.8rem;opacity:.65;color:inherit">Reset my saved scores</a></footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script id="quiz-data" type="application/json">[{"id":"u1","icon":"🛏️","title":"General Nursing Management of the Medical Patient","recap":["Ten cardinal points: rest & comfort, personal hygiene, nutrition, psychotherapy, medication, health education, physiotherapy, observation, elimination, barrier nursing (if communicable).","Bed rest brings atelectasis, thrombophlebitis, contractures, constipation, bedsores and depression, so give active and passive exercises plus deep breathing.","Barrier nursing: separate equipment, disinfect linen/secreta/equipment, gloves for faeces and soiled linen, scrub hands after each contact."],"qs":[{"q":"Irrespective of the disease condition, how many cardinal points guide the nursing management of a medical patient?","o":["Ten","Five","Seven","Twelve"],"e":"The notes list ten cardinal points, from rest and comfort through to barrier nursing."},{"q":"Which of these is one of the cardinal points of general nursing management?","o":["Personal hygiene","Surgical incision","Radiotherapy","Genetic counselling"],"e":"Personal hygiene is the second cardinal point after rest and comfort."},{"q":"Barrier nursing is carried out only when the patient has…","o":["a communicable disease","a fracture","hypertension","a skin allergy"],"e":"Cardinal point 10 applies \"if it is a communicable disease\"."},{"q":"Which measure helps to ensure rest for the patient?","o":["Restricting visitors","Encouraging many visitors","Leaving the bed wrinkled","Keeping the ward noisy"],"e":"Visitors are restricted so the patient gets enough rest."},{"q":"The patient's bed should be…","o":["clean, dry and free of wrinkles","slightly damp and warm","covered with extra folds","low and unmade"],"e":"A clean, dry, wrinkle-free bed promotes rest and prevents bedsores."},{"q":"The ward environment for a resting patient should be…","o":["well ventilated with traffic and noise minimised","dark and closed","busy so the patient stays alert","noisy but warm"],"e":"Ventilation, low traffic and low noise ensure maximum rest and comfort."},{"q":"A bed bath is given to…","o":["patients who are bed-ridden","only visitors","only children","patients ready for discharge"],"e":"Bed-ridden patients cannot bath themselves so are given a bed bath."},{"q":"Bathing a patient helps prevent bedsores because it…","o":["stimulates circulation in the tissues","dries the skin","reduces oedema","raises temperature"],"e":"Improved circulation prevents pressure sores."},{"q":"Besides hygiene, a bed bath is also an opportunity to…","o":["observe the patient, establish rapport and give informal education","prescribe drugs","take a chest X-ray","discharge the patient"],"e":"The notes list observation, rapport and informal education."},{"q":"Oral toileting is done before and after meals because it…","o":["stimulates appetite","causes nausea","reduces thirst","replaces feeding"],"e":"Cleaning the mouth improves appetite."},{"q":"Which item should be kept near the patient for oral toileting?","o":["Swabs, mouthwash and a basin for expectoration","A stethoscope","A bed pan only","A syringe"],"e":"Mucus accumulates in the mouth and throat and needs to be cleared."},{"q":"Which is an appetite-improving measure?","o":["Serving food in bits in an attractive manner","Serving cold, large portions","Withholding explanations","Giving drugs before every meal"],"e":"Attractive small portions plus oral hygiene and an explained rationale improve intake."},{"q":"Protein intake is increased in medical patients in order to…","o":["repair broken-down tissues, reduce oedema and improve anaemia","provide energy in fever only","reduce oedema by restricting it","treat constipation"],"e":"These are the reasons the notes give for increasing protein."},{"q":"Protein intake is decreased when…","o":["ammonia toxicity sets in","the patient is anaemic","there is oedema","tissues are broken down"],"e":"In ammonia toxicity, protein is reduced."},{"q":"Carbohydrate intake is increased in…","o":["feverish patients who need energy","bed-ridden patients who need little energy","patients with ammonia toxicity","no patients"],"e":"Bed-ridden patients need less energy, so their carbohydrate intake is reduced."},{"q":"Salt (minerals) intake should be reduced in patients with…","o":["oedema and cardiac problems","anaemia","constipation","fever"],"e":"Salt restriction helps to reduce oedema and cardiac workload."},{"q":"Since salt-free diets are not appetising, the nurse should…","o":["explain the rationale to the patient","force feed the patient","add extra salt secretly","stop the diet"],"e":"Explaining the rationale improves compliance."},{"q":"Which is given to patients to help bring down oedema?","o":["Acidified fruits","Salty snacks","Fatty foods","Sweet drinks"],"e":"The notes recommend acidified fruits together with salt restriction."},{"q":"Psychotherapy is needed because the signs of the illness or the diagnosis may…","o":["frighten the patient or come as a shock","cure the patient","shorten the stay","cause hunger"],"e":"Fear and shock at diagnosis are why psychotherapy is needed."},{"q":"Which is a psychotherapy measure?","o":["Introducing the health team members to the patient","Hiding the diagnosis","Isolating the patient","Avoiding conversation"],"e":"Introducing the team shows the patient that they care for him."},{"q":"Why should procedures be explained to the patient before they are done?","o":["To elicit his cooperation","To delay the procedure","To reduce costs","To replace consent"],"e":"Explanations win cooperation."},{"q":"A patient may be encouraged to converse with…","o":["patients who have similar conditions","visitors only","staff only","nobody"],"e":"Peer conversation helps the patient cope."},{"q":"Which is NOT a complication of prolonged bed rest?","o":["Hypertension from exercise","Atelectasis","Thrombophlebitis","Bedsores"],"e":"Listed problems are atelectasis, thrombophlebitis, contractures, constipation, bedsores and depression."},{"q":"To prevent complications of bed rest the patient should be encouraged to do…","o":["active and passive exercises","strenuous jogging","no movement","only sleeping"],"e":"Active and passive exercises plus deep breathing are advised."},{"q":"Deep breathing exercises in a bed-ridden patient help to prevent…","o":["atelectasis","gout","anaemia","oedema"],"e":"Lung collapse (atelectasis) is a bed-rest complication."},{"q":"As the patient's condition improves, activity should be…","o":["allowed gradually","stopped completely","maximised at once","avoided until discharge"],"e":"Graded activity abates the problems of bed rest."},{"q":"In health education, the patient is educated on…","o":["causes and predisposing factors of the condition","hospital finances","other patients' diagnoses","nursing salaries"],"e":"He should then refrain from those habits."},{"q":"Follow-up is emphasised in health education in order to…","o":["prevent relapses","lengthen admission","increase drug use","reduce rest"],"e":"Follow-up prevents relapse after recovery."},{"q":"Precautions before giving a drug include…","o":["test doses and giving the right drug","giving it without checking","doubling the dose","skipping side-effect education"],"e":"Test doses and right-drug checks are precautions."},{"q":"The rationale for a drug is explained to the patient to…","o":["elicit drug compliance","delay treatment","reduce side effects","cut costs"],"e":"Understanding why encourages the patient to take it."},{"q":"Under observation, the nurse should…","o":["monitor vital signs and report abnormalities","ignore minor changes","only record intake","leave observation to the doctor"],"e":"Also watch for complications and signs of improvement."},{"q":"Under elimination, the nurse should observe the patient's…","o":["bowel movement, its frequency and efforts","shoe size","appetite only","hair colour"],"e":"Bowel and urine elimination are both monitored."},{"q":"An accurate input and output chart is especially important in patients with…","o":["cardiac or kidney problems","a sprained ankle","a common cold","dental caries"],"e":"Accurate fluid balance monitoring is vital here."},{"q":"In barrier nursing, the patient is nursed alone because…","o":["the explanation given is to prevent spread of infection","he is unimportant","the ward is full","he prefers it"],"e":"The nurse explains to him and relatives why he is nursed alone."},{"q":"In barrier nursing, the patient's bed linen is…","o":["disinfected before being sent to laundry","sent straight to laundry","burnt always","shared with others"],"e":"Linen and equipment are disinfected first."},{"q":"In barrier nursing, the nurse should put on gloves before…","o":["handling faeces and soiled linen","taking temperature only","giving oral fluids","greeting visitors"],"e":"Gloves protect against contaminated material."},{"q":"After each contact with a barrier-nursed patient, the nurse should…","o":["scrub her hands","wipe her hands on her apron","do nothing","wear the same gloves"],"e":"Hand scrubbing after each contact prevents cross infection."},{"q":"The patient's secreta are…","o":["disinfected before being discarded","thrown away untreated","kept at the bedside","given to relatives"],"e":"Disinfection prevents spread of infection."},{"q":"Positioning of the patient should be…","o":["appropriate to his condition","random","always flat","always sitting"],"e":"Appropriate positioning is one of the measures ensuring rest."},{"q":"Symptomatic nursing management is carried out to ensure…","o":["maximum rest and comfort","faster discharge","less documentation","more visitors"],"e":"Relieving symptoms lets the patient rest and feel comfortable."}]},{"id":"u2","icon":"🔬","title":"General Diagnostic Methods","recap":["History (identifying data, family, past medical, present complaints), vital signs, physical examination (inspection, palpation, percussion, auscultation), laboratory and instrumental methods.","ESR: Westergren method, 3-5 mm/h in men and 4-7 mm/h in women; Hb: 14-18 g/dl men, 12-17 g/dl women; raised WBC = infection/inflammation.","Cardiac enzymes: CPK rises within 24 h and normalises in 4 days; LDH rises in 8 h and normalises in 14 days; ECG records the heart's electrical impulses."],"qs":[{"q":"The general diagnostic methods give…","o":["an overall picture of the patient's health status","only a diagnosis of the heart","only laboratory values","a treatment plan"],"e":"They give an overall picture of health status."},{"q":"Which is NOT part of the history?","o":["Percussion","Identifying information","Family history","Present complaints"],"e":"Percussion is a physical examination technique."},{"q":"Family history in a medical history gives information on…","o":["hereditary predisposition","the current drug list","vital signs","X-ray findings"],"e":"It reveals hereditary predisposition to disease."},{"q":"Which are taken as vital signs?","o":["Temperature, pulse, respiration and blood pressure","Height, weight and age","Hb and ESR","Urine and stool"],"e":"These four are the standard vital signs."},{"q":"The four methods of physical examination are…","o":["inspection, palpation, percussion and auscultation","history, vitals, labs and X-ray","look, touch, taste and smell","scan, ECG, EEG and biopsy"],"e":"These are the four classic methods."},{"q":"The first step in physical examination is…","o":["inspection","percussion","auscultation","palpation"],"e":"Inspection gives the clinician the most diagnostic hints."},{"q":"During inspection, the clinician mostly uses…","o":["the power of vision","touch","hearing","smell"],"e":"Vision is mainly used, preferably in adequate light."},{"q":"For effective palpation, the palpating hands should be…","o":["soft and warm","cold and hard","gloved with ice","wet"],"e":"Cold hands cause muscle tension and false findings."},{"q":"During palpation the clinician stands…","o":["at the patient's right side facing the patient","at the foot of the bed","behind the patient","at the left side with back turned"],"e":"This is the recommended position."},{"q":"In percussion the clinician…","o":["taps the patient and listens to the sound","feels the skin","looks at the organ","listens with a stethoscope only"],"e":"The pitch of the sound helps to determine the pathological condition of the organ."},{"q":"Auscultation is done by listening with…","o":["a stethoscope","a torch","a tape measure","a thermometer"],"e":"It is used to examine the heart, lungs, blood vessels and abdomen."},{"q":"The macroscopic study of sputum includes its…","o":["odour, consistency, colour and quantity","cell count","bacteria only","protein content"],"e":"Microscopy looks for epithelial cells, leukocytes and erythrocytes."},{"q":"The Erythrocyte Sedimentation Rate measures…","o":["how fast red cells settle in unclotted blood in one hour","the number of red cells","haemoglobin content","clotting time"],"e":"It is a measure of settling of RBCs per hour."},{"q":"The commonest ESR method is…","o":["Westergren","Wintrobe only","Dacie","Coulter"],"e":"The Westergren method is the common one."},{"q":"The normal ESR in men is…","o":["3-5 mm per hour","10-20 mm per hour","50 mm per hour","100 mm per hour"],"e":"Women's normal range is 4-7 mm per hour."},{"q":"ESR is raised in…","o":["inflammation, tuberculosis and myocardial infarction","polycythaemia","cholera","food poisoning"],"e":"It is decreased in conditions that thicken the blood, like polycythaemia and cholera."},{"q":"ESR is described as…","o":["non-specific for any single disorder","specific for tuberculosis","specific for heart disease","only used in children"],"e":"It shows an inflammatory process but not the cause."},{"q":"Why do RBCs settle faster in inflammation?","o":["Blood protein changes make them aggregate and become heavier","They shrink","They multiply","They lose haemoglobin"],"e":"Aggregated cells fall faster in the vertical tube."},{"q":"If a haematoma develops at the venipuncture site, the nurse applies…","o":["a warm compress","an ice pack","a tight bandage","nothing"],"e":"This is the post-test care."},{"q":"A decrease in haemoglobin may indicate…","o":["anaemia, recent haemorrhage or haemodilution","polycythaemia","dehydration","infection"],"e":"Raised Hb suggests polycythaemia or dehydration."},{"q":"The normal Hb in men is…","o":["14-18 g/dl","6-8 g/dl","20-24 g/dl","9-11 g/dl"],"e":"Women's range is 12-17 g/dl."},{"q":"An elevated WBC count is called…","o":["leukocytosis","leukopenia","polycythaemia","erythrocytosis"],"e":"It indicates infection or inflammation."},{"q":"Leukocytosis may be seen in…","o":["abscess, meningitis and appendicitis","typhoid fever and influenza","bone marrow depression","viral hepatitis only"],"e":"Typhoid, influenza and infective hepatitis cause leukopenia."},{"q":"A low WBC count is called…","o":["leukopenia","leukocytosis","polycythaemia","anaemia"],"e":"It is seen in bone marrow depression and some viral infections."},{"q":"The WBC differential count shows…","o":["the relative number of each type of WBC","the total volume of blood","the haemoglobin","the ESR"],"e":"It gives more specific information on immune status."},{"q":"Which is a purpose of the differential count?","o":["Detecting allergic reactions and parasitic infection","Measuring blood sugar","Assessing kidney function","Measuring cholesterol"],"e":"It also evaluates resistance to infection and stage of infection."},{"q":"Urine analysis includes which physical property?","o":["Colour, reaction, specific gravity and daily amount","Sugar only","Casts only","Protein only"],"e":"Chemical analysis tests for protein, sugar, acetone and others."},{"q":"Analysis of faeces is necessary in patients with diseases of the…","o":["gastrointestinal tract","heart","lungs","brain"],"e":"It reveals blood, mucus, parasites, worm eggs and protozoa."},{"q":"Damaged cardiac tissue releases…","o":["enzymes into the bloodstream","urine","bile","mucus"],"e":"The commonly measured enzymes are CPK, LDH and SGOT."},{"q":"CPK begins to rise in serum within…","o":["24 hours of damage","8 hours","14 days","48 hours"],"e":"CPK settles to normal within about 4 days."},{"q":"LDH begins to rise in the serum within…","o":["8 hours","24 hours","4 days","30 days"],"e":"LDH returns to normal in about 14 days."},{"q":"X-rays are able to penetrate tissue because they have…","o":["a very short wavelength","a long wavelength","no energy","high sound frequency"],"e":"They are electromagnetic energy of very short wavelength."},{"q":"A barium sulphate suspension is given orally to examine the…","o":["oesophagus, stomach and GIT","lungs","heart","brain"],"e":"It is radio-opaque and gives contrast."},{"q":"Two X-ray views are taken at right angles because…","o":["low-density tissue may be hidden behind high-density tissue in one view","it saves film","the machine requires it","one view is always blurred"],"e":"A structure hidden in one view may be visible in the other."},{"q":"Which is NOT a nursing precaution for X-ray?","o":["Ask a pregnant woman to lie still without shielding","Remove metal objects","Explain the procedure","Shield against unnecessary radiation"],"e":"Pregnant women need protection because of fetal risk."},{"q":"Endoscopy is visual inspection of hollow viscera using…","o":["an endoscope","a stethoscope","an X-ray","an ECG"],"e":"Bronchoscopy, gastroscopy and cystoscopy are examples."},{"q":"Examination of the urinary bladder by endoscope is called…","o":["cystoscopy","bronchoscopy","gastroscopy","laryngoscopy"],"e":"Cyst- refers to the bladder."},{"q":"The ECG is a graphic record of…","o":["electrical impulses generated by the myocardium","blood pressure","breathing","brain waves"],"e":"It records depolarisation and repolarisation."},{"q":"During an ECG the patient should…","o":["lie still, breathe normally and not talk","run","talk continuously","hold breath throughout"],"e":"Talking may distort the reading."},{"q":"The normal blood pressure given in the notes is…","o":["120/80 mmHg","90/40 mmHg","160/100 mmHg","60/30 mmHg"],"e":"Normal pulse is 64-84 beats per minute and respiration 16-20 per minute."}]},{"id":"u3","icon":"💧","title":"Fluid & Electrolyte Balance","recap":["ICF holds about two-thirds of body fluid; ECF (intravascular, interstitial, transcellular) holds the rest. Third spacing = ECF trapped where it cannot be used (ascites, burns, peritonitis).","Sodium 135-145 mEq/L (main ECF cation); potassium is the main intracellular cation; bicarbonate 22-26 and chloride 100-106 mEq/L.","FVD: weak rapid pulse, low BP, poor turgor, concentrated urine. FVE: bounding pulse, oedema, crackles, distended neck veins. Weigh daily: 0.5 kg = 500 ml."],"qs":[{"q":"The two main body fluid compartments are…","o":["intracellular and extracellular","arterial and venous","plasma and lymph only","cellular and skeletal"],"e":"Fluid inside cells is ICF; outside cells is ECF."},{"q":"About what fraction of body fluid is intracellular?","o":["Two-thirds","One-third","One-half","One-quarter"],"e":"The ICF holds about two-thirds of body fluid."},{"q":"Intravascular fluid is found…","o":["within the blood","between the cells","in the joints only","inside the cells"],"e":"It is the plasma, the transport medium of the body."},{"q":"Which is an example of transcellular fluid?","o":["Cerebrospinal fluid","Blood plasma","Cytoplasm","Intracellular fluid"],"e":"CSF, perspiration and digestive secretions are transcellular."},{"q":"The ECF carries oxygen and nutrients to cells and…","o":["carries waste products away from them","stores fat","makes hormones","produces bone"],"e":"It is the transport medium."},{"q":"Abnormal accumulation of fluid in the interstitial space is called…","o":["second spacing","first spacing","third spacing","fourth spacing"],"e":"This is what happens in oedema."},{"q":"Third spacing is…","o":["loss of ECF into a space where it is unavailable for functional use","normal fluid distribution","fluid gain by drinking","fluid loss in urine"],"e":"Fluid becomes trapped and cannot help maintain equilibrium."},{"q":"Which is an example of third spacing?","o":["Ascites","Sweating","Normal urine output","Drinking water"],"e":"Others are burns, peritonitis, bowel obstruction and massive bleeding into joints."},{"q":"A sign of third spacing is…","o":["decreased urine output despite adequate fluid intake","increased blood pressure","weight loss","slow pulse"],"e":"Also increased heart rate, increased weight and low BP."},{"q":"Electrolyte concentration is expressed in…","o":["milliequivalents per litre","grams per kilogram","kilograms","pascals only"],"e":"It measures the chemical combining power of ions."},{"q":"Which is a major cation?","o":["Sodium","Chloride","Bicarbonate","Phosphate"],"e":"Cations are positively charged; the others listed are anions."},{"q":"Which is a major anion?","o":["Bicarbonate","Potassium","Calcium","Magnesium"],"e":"Anions include chloride, bicarbonate, phosphate and sulphate."},{"q":"The most abundant cation in the ECF is…","o":["sodium","potassium","calcium","magnesium"],"e":"Sodium controls movement of water between compartments."},{"q":"The normal serum sodium level is…","o":["135-145 mEq/L","3.5-5 mEq/L","100-106 mEq/L","22-26 mEq/L"],"e":"Below 135 is hyponatraemia; above 145 is hypernatraemia."},{"q":"Sodium regulation is influenced by…","o":["salt intake, urinary output and aldosterone","insulin only","adrenaline only","vitamin C"],"e":"Aldosterone conserves sodium."},{"q":"The main intracellular cation is…","o":["potassium","sodium","chloride","calcium"],"e":"It also regulates neuromuscular excitability and muscle contraction."},{"q":"Potassium ions exchange with which ions to correct acid-base imbalances?","o":["Hydrogen ions","Sodium ions","Chloride ions","Calcium ions"],"e":"K+ and H+ exchange across cell membranes."},{"q":"The major chemical buffer of the body is…","o":["bicarbonate","chloride","phosphate only","sulphate"],"e":"Its normal value is 22-26 mEq/L and it is regulated by the kidneys."},{"q":"Osmosis is the movement of…","o":["water through a semipermeable membrane toward higher solute concentration","solutes to lower solute concentration","blood around the body","air into the lungs"],"e":"It is the primary process controlling fluid movement between ICF and ECF."},{"q":"Osmolality refers to the number of solutes per…","o":["kilogram of water","litre of solution","millilitre of blood","gram of salt"],"e":"Osmolarity is per litre of solution."},{"q":"Oncotic pressure is exerted by…","o":["proteins such as albumin","sodium","glucose","potassium"],"e":"Albumin pulls fluid from tissues into the vascular space."},{"q":"Osmotic diuresis follows excretion of substances such as…","o":["mannitol or glucose","sodium chloride","water","potassium only"],"e":"Urine output rises because of the solute load."},{"q":"Fluid volume deficit (hypovolaemia) occurs when…","o":["loss of ECF volume exceeds intake","fluid intake exceeds loss","sodium alone is lost","cells swell"],"e":"It may follow diarrhoea, polyuria, haemorrhage or poor intake."},{"q":"Which is a cause of hypovolaemia?","o":["Haemorrhage","Heart failure","Renal failure","Excess isotonic IV fluid"],"e":"The others cause fluid volume excess."},{"q":"Which is a sign of fluid volume deficit?","o":["Decreased skin turgor","Bounding pulse","Distended neck veins","Crackles in the lungs"],"e":"Also increased pulse, postural hypotension and concentrated urine."},{"q":"In fluid volume deficit the haematocrit and BUN are…","o":["elevated","reduced","normal","absent"],"e":"The blood becomes concentrated."},{"q":"A weight change of 0.5 kg in a day represents a fluid loss of about…","o":["500 ml","50 ml","5 litres","2 litres"],"e":"Daily weight is a sensitive indicator of fluid change."},{"q":"Fluid resuscitation in hypovolaemia commonly uses…","o":["lactated Ringer's or 0.9% normal saline","3% dextrose","distilled water","oral iron"],"e":"Blood transfusion is used when loss is due to blood loss."},{"q":"Skin turgor is best assessed over the…","o":["sternum or forehead","palm","sole","knee"],"e":"In the elderly, tongue turgor may be more accurate."},{"q":"Fluid volume excess is a…","o":["isotonic expansion of the ECF","loss of ECF","loss of ICF only","shift of ICF"],"e":"Water and sodium are retained in similar proportions."},{"q":"Which is a cause of fluid volume excess?","o":["Heart failure","Diarrhoea","Haemorrhage","Vomiting"],"e":"Renal failure, steroid use and excessive isotonic IV fluid are others."},{"q":"Which is a manifestation of fluid volume excess?","o":["Distended neck veins","Postural hypotension","Decreased skin turgor","Concentrated urine"],"e":"Also bounding pulse, hypertension, crackles and oedema."},{"q":"Management of fluid volume excess includes…","o":["sodium and fluid restriction","increased salt","rapid IV saline","no monitoring"],"e":"Diuretics are prescribed too."},{"q":"Thiazide diuretics act by…","o":["blocking sodium reabsorption in the distal tubule","increasing sodium reabsorption","raising blood volume","dilating arteries only"],"e":"Hydrochlorothiazide is an example."},{"q":"In fluid volume excess, daily weight should be taken…","o":["early in the morning, with the same clothing and scale","at random times","only weekly","after meals"],"e":"Consistency makes weights comparable."},{"q":"An oedematous patient should be turned regularly to…","o":["prevent skin breakdown","raise BP","reduce weight","increase output"],"e":"Oedematous skin breaks down easily."},{"q":"Hyponatraemia is a serum sodium below…","o":["135 mEq/L","145 mEq/L","5 mEq/L","22 mEq/L"],"e":"It results from sodium loss or from water gains that dilute the ECF."},{"q":"Hypernatraemia is also known as…","o":["hypertonic dehydration","hypotonic overload","water intoxication","fluid excess"],"e":"Sodium is above 145 mEq/L."},{"q":"The first manifestation of hypernatraemia is…","o":["thirst","seizures","coma","oedema"],"e":"Others include dry sticky mucous membranes, restlessness and lethargy."},{"q":"A solution used to lower serum sodium gradually in hypernatraemia is…","o":["hypotonic fluid such as 0.45% sodium chloride","3% sodium chloride","sodium bicarbonate","potassium chloride"],"e":"Gradual correction reduces the risk of cerebral oedema."}]},{"id":"u4","icon":"⚖️","title":"Acid-Base Balance & Imbalances","recap":["Normal pH 7.35-7.45; PaCO2 35-45 mmHg; PaO2 80-100 mmHg; HCO3 22-26 mEq/L. Bicarbonate : carbonic acid ratio is 20:1.","Three regulators: buffers (fastest), lungs (minutes, blow off CO2), kidneys (slowest, hours to days, excrete H+ and retain/regenerate bicarbonate).","Metabolic: pH and HCO3 move together. Respiratory: pH and PaCO2 move oppositely. Low CO2 = respiratory alkalosis; high CO2 = respiratory acidosis."],"qs":[{"q":"The normal pH of body fluids is…","o":["7.35 to 7.45","6.35 to 6.45","7.55 to 7.65","8.0 to 8.5"],"e":"Body fluid is slightly alkaline."},{"q":"The higher the hydrogen ion concentration, the…","o":["lower the pH","higher the pH","the same pH","neutral pH"],"e":"pH is inversely related to H+ concentration."},{"q":"An acid is a substance that…","o":["releases hydrogen ions","accepts hydrogen ions","has no effect on H+","absorbs water"],"e":"A base (alkali) accepts hydrogen ions."},{"q":"The only volatile acid produced in the body is…","o":["carbonic acid","lactic acid","hydrochloric acid","sulphuric acid"],"e":"It is eliminated by the lungs as CO2."},{"q":"Which is a non-volatile acid?","o":["Lactic acid","Carbonic acid","Carbon dioxide","Water"],"e":"Others include hydrochloric, sulphuric and phosphoric acids."},{"q":"Non-volatile acids are eliminated by the…","o":["kidneys","lungs","skin only","liver only"],"e":"They must be metabolised or excreted in urine."},{"q":"The fastest acid-base regulator is the…","o":["buffer system","kidney","lungs","liver"],"e":"Buffers act chemically within seconds."},{"q":"The primary buffer system of the ECF is the…","o":["bicarbonate-carbonic acid system","haemoglobin only","protein only","phosphate only"],"e":"It keeps pH near normal but has limited capacity."},{"q":"The normal ratio of bicarbonate to carbonic acid is…","o":["20:1","1:20","10:1","5:1"],"e":"The ratio must stay this way to keep pH normal."},{"q":"Normal serum bicarbonate level is about…","o":["24 mEq/L","1.2 mEq/L","40 mEq/L","10 mEq/L"],"e":"Carbonic acid is about 1.2 mEq/L."},{"q":"The respiratory system regulates acid-base by…","o":["eliminating or retaining CO2","excreting bicarbonate","making hormones","filtering urine"],"e":"CO2 combines with water to form carbonic acid."},{"q":"A rise in CO2 or H+ in the blood makes breathing…","o":["faster and deeper","slower","shallower","stop"],"e":"Increased ventilation blows off CO2."},{"q":"Respiratory compensation for excess H+ starts within…","o":["a minute","24 hours","one week","one month"],"e":"It becomes less effective over time."},{"q":"The kidneys respond to pH changes…","o":["slowly, over hours to days","in seconds","instantly","never"],"e":"They provide long-term regulation."},{"q":"In acidosis, the kidneys…","o":["excrete H+ and retain bicarbonate","retain H+ and excrete bicarbonate","excrete both","retain both"],"e":"This restores pH toward normal."},{"q":"In alkalosis, the kidneys…","o":["retain H+ and excrete bicarbonate","excrete H+","retain bicarbonate","do nothing"],"e":"The opposite of the acidosis response."},{"q":"Acidosis is a pH…","o":["below 7.35","above 7.45","of exactly 7.4","above 8"],"e":"Alkalosis is above 7.45."},{"q":"An abnormal PaCO2 points to a…","o":["respiratory problem","metabolic problem","renal problem only","cardiac problem"],"e":"An abnormal HCO3 points to a metabolic disorder."},{"q":"A low HCO3 indicates…","o":["metabolic acidosis","metabolic alkalosis","respiratory acidosis","respiratory alkalosis"],"e":"High HCO3 means metabolic alkalosis."},{"q":"A high PaCO2 indicates…","o":["respiratory acidosis","respiratory carbonate","more alkali","fasting"],"e":"Severe cases may need dilute hydrochloric acid or ammonium chloride."},{"q":"Respiratory acidosis is caused by…","o":["hypoventilation and CO2 retention","hyperventilation","bicarbonate loss","excess acid intake"],"e":"Carbonic acid accumulates."},{"q":"A risk factor for respiratory acidosis is…","o":["COPD or pneumonia","anxiety","fever only","diarrhoea"],"e":"Excess narcotics and airway obstruction also depress ventilation."},{"q":"In respiratory acidosis, the ABG shows…","o":["pH below 7.35 and PaCO2 above 45 mmHg","pH above 7.45","PaCO2 below 35","HCO3 below 22 only"],"e":"It is due to excess carbonic acid."},{"q":"A manifestation of respiratory acidosis is…","o":["drowsiness and headache","hyperactivity","cold pale skin","hypotension only"],"e":"Also warm flushed skin and hyperkalaemia."},{"q":"Respiratory alkalosis occurs with…","o":["hyperventilation","hypoventilation","vomiting","diarrhoea"],"e":"CO2 is lost, so PaCO2 falls below 35 mmHg."},{"q":"A cause of respiratory alkalosis is…","o":["anxiety with hyperventilation","COPD","narcotic overdose","airway obstruction"],"e":"Mechanical ventilation can also cause it."},{"q":"A patient hyperventilating from anxiety may be helped by…","o":["breathing into a paper bag","taking sedatives only","exercise","oxygen mask only"],"e":"Rebreathing exhaled CO2 raises PaCO2."},{"q":"If respiratory alkalosis is due to mechanical ventilation, the nurse should…","o":["adjust settings to reduce respiratory rate and tidal volume","increase the rate","stop oxygen","sedate heavily"],"e":"This allows CO2 to build up again."},{"q":"ABG results tell whether a patient has…","o":["acidosis or alkalosis and whether it is respiratory or metabolic","infection","anaemia","heart disease"],"e":"This is what interpretation aims to show."}]},{"id":"u5","icon":"💉","title":"Intravenous Fluid Therapy","recap":["Colloids (albumin, hydroxyethyl starch) hold fluid in the vessels; crystalloids are isotonic (0.9% NaCl, lactated Ringer's, D5W), hypotonic (0.45% NaCl) or hypertonic (3% NaCl).","Drip rate (drops/min) = volume (ml) x drop factor / time (min). Drop factors: 10 (blood set), 15 (regular), 60 (microdrop).","Complications: infiltration, phlebitis/thrombophlebitis, infection, hypothermia from cold fluids, fluid overload."],"qs":[{"q":"Intravenous fluid therapy is…","o":["the introduction of fluids into the patient through a vein","giving drugs by mouth","giving fluids by rectum","fluid by injection into muscle"],"e":"It prevents or treats fluid and electrolyte imbalance."},{"q":"Which is a purpose of IV therapy?","o":["To provide fluids when the patient cannot take them orally","To reduce body weight","To cause dehydration","To increase appetite"],"e":"It is also used to keep a vein open for drugs or blood."},{"q":"IV fluids are classified as…","o":["colloids or crystalloids","acids or bases","salts or sugars","oral or rectal"],"e":"Crystalloids are further divided by tonicity."},{"q":"Colloids are solutions containing…","o":["large molecules that do not cross capillary membranes easily","small molecules only","only water","only sugar"],"e":"They raise oncotic pressure in the vessels."},{"q":"Colloids expand intravascular volume by…","o":["drawing fluid from the interstitial space","pushing fluid into cells","dehydrating the blood","adding electrolytes"],"e":"Their higher oncotic pressure pulls fluid into the vessels."},{"q":"An example of a colloid solution is…","o":["human albumin","0.9% sodium chloride","lactated Ringer's","5% dextrose"],"e":"Hydroxyethyl starches are another example."},{"q":"Crystalloids are solutions with…","o":["small molecules that pass easily across membranes","large proteins","no solutes","blood cells"],"e":"They raise fluid volume in both the interstitial and intravascular spaces."},{"q":"A solution is isotonic when…","o":["its solute concentration is similar to plasma","it has more solutes than plasma","it has fewer solutes than plasma","it has no solutes"],"e":"Isotonic fluids do not cause major water shifts."},{"q":"Which is an isotonic solution?","o":["0.9% sodium chloride","0.45% sodium chloride","3% sodium chloride","0.2% sodium chloride"],"e":"0.9% NaCl is normal saline."},{"q":"Normal saline is the fluid of choice for…","o":["resuscitation and with blood products","hypernatraemia","cerebral oedema","liver disease only"],"e":"It is the only fluid used with blood products."},{"q":"Normal saline may be given for…","o":["mild hyponatraemia, DKA and fluid volume deficit","hypernatraemia","severe hypertension","heart failure"],"e":"It replaces sodium and volume."},{"q":"Lactated Ringer's is metabolised in the liver, where lactate is converted to…","o":["bicarbonate","glucose","urea","protein"],"e":"It is useful in metabolic acidosis."},{"q":"Lactated Ringer's should NOT be given to a patient with…","o":["liver disease","dehydration from vomiting","burns","fistula drainage"],"e":"The liver cannot convert lactate."},{"q":"Caution is needed with lactated Ringer's in severe renal impairment because it contains…","o":["potassium","glucose","protein","iron"],"e":"Potassium can accumulate."},{"q":"Lactated Ringer's should not be given if the pH is greater than…","o":["7.5","7.0","7.35","6.5"],"e":"It could worsen alkalosis."},{"q":"Dextrose 5% in water is…","o":["isotonic in the bag but hypotonic once dextrose is metabolised","hypertonic always","colloid","the same as normal saline"],"e":"Glucose is absorbed, leaving free water that shifts into cells."},{"q":"D5W provides…","o":["calories but does not replace electrolytes","electrolytes only","protein","no calories"],"e":"It expands fluid volume in both ICF and ECF."},{"q":"D5W is unsuitable for a patient with…","o":["renal failure or cardiac problems","dehydration only","mild hunger","fever only"],"e":"It may cause fluid overload."},{"q":"D5W should not be used in patients at risk of…","o":["raised intracranial pressure","low blood sugar","shivering","anaemia"],"e":"It can increase cerebral oedema."},{"q":"Dextrose should never be mixed with…","o":["blood during transfusion","normal saline","water","vitamins"],"e":"It causes haemolysis."},{"q":"D5W is not used for resuscitation because…","o":["it does not remain in the intravascular space","it is too costly","it is too salty","it is a colloid"],"e":"Most of it moves into cells."},{"q":"Hypotonic fluids have…","o":["a lower concentration than intracellular fluid","the same concentration as plasma","higher concentration than plasma","no water"],"e":"They shift water into the cells."},{"q":"Hypotonic fluid causes fluid to shift from…","o":["the vessels into the cells and interstitium","cells into vessels","interstitium into vessels","the gut"],"e":"It hydrates cells but may deplete circulating volume."},{"q":"An example of a hypotonic fluid is…","o":["0.45% sodium chloride","0.9% sodium chloride","3% sodium chloride","albumin"],"e":"0.33% and 0.2% NaCl are also hypotonic."},{"q":"Hypotonic fluids are indicated in…","o":["hypernatraemia and diabetic ketoacidosis","hyponatraemia","haemorrhage","shock"],"e":"They treat intracellular dehydration."},{"q":"Hypotonic solutions should never be given to patients at risk of…","o":["raised ICP or cerebral oedema","anaemia","fever","constipation"],"e":"Water shift into brain cells is dangerous."},{"q":"Hypertonic solutions draw water…","o":["out of the cells into the ECF","into cells","out of the blood","nowhere"],"e":"They act as volume expanders."},{"q":"An example of a hypertonic solution is…","o":["3% sodium chloride","0.45% sodium chloride","5% dextrose in water","sterile water"],"e":"It may be used in severe hyponatraemia."},{"q":"A risk of hypertonic fluids is…","o":["intravascular overload and pulmonary oedema","dehydration","hypothermia only","haemolysis only"],"e":"Vigilance is needed, and they are not for prolonged use."},{"q":"Hypertonic saline should be stored…","o":["apart from regular IV stock","with normal saline","anywhere","in the freezer"],"e":"This avoids mix-ups."},{"q":"A drop factor is…","o":["the number of drops per millilitre of IV fluid","the total volume","the infusion time","the vein size"],"e":"It is set by the giving set."},{"q":"Which is a common drop factor for a regular set?","o":["15 drops per ml","5 drops per ml","100 drops per ml","30 drops per ml"],"e":"Blood sets deliver 10 and microdrip sets 60."},{"q":"A microdrip set gives…","o":["60 drops per ml","15 drops per ml","10 drops per ml","5 drops per ml"],"e":"It is used with burettes."},{"q":"The drip rate formula is…","o":["volume x drop factor divided by time in minutes","volume divided by drop factor","time x volume","drop factor only"],"e":"This gives drops per minute."},{"q":"1000 ml over 8 hours with a 15 drop/ml set is about…","o":["31 drops per minute","15 drops per minute","60 drops per minute","125 drops per minute"],"e":"1000 x 15 / 480 = 31."},{"q":"Which factor affects the infusion rate?","o":["Height of the IV container","Colour of fluid","Patient's age only","Room colour"],"e":"Bending the extremity and kinking of tubing also alter flow."},{"q":"Infiltration occurs when…","o":["IV fluid enters the subcutaneous tissue","the vein is inflamed","blood clots in the vein","the fluid is too cold"],"e":"The needle or catheter slips out of the vein."},{"q":"Phlebitis is…","o":["inflammation of a vein","fluid leaking into tissue","air in the vein","fever"],"e":"With a clot it is called thrombophlebitis."},{"q":"A factor contributing to phlebitis is…","o":["irritating substances such as potassium and antibiotics","using large veins","short catheter time","warm fluids"],"e":"Small veins and long catheter dwell also contribute."},{"q":"Rapid infusion of large amounts of cold fluid can cause…","o":["hypothermia","fever","hypertension","bradycardia only"],"e":"Body temperature falls."}]},{"id":"u6","icon":"🥣","title":"Malnutrition, Kwashiorkor & Marasmus","recap":["Childhood undernutrition: wasting (low weight-for-height), stunting (low height-for-age), underweight (low weight-for-age) and micronutrient deficiencies.","Kwashiorkor (\"disease of the displaced child\"): oedema, growth failure, mental changes; marasmus: extreme wasting without oedema, under 2 years.","Treatment phases: stabilisation (hypoglycaemia, hypothermia, dehydration, electrolytes), rehabilitation, follow-up. CMAM has four components."],"qs":[{"q":"Malnutrition is a state in which there is…","o":["an imbalance between nutrient intake and the body's requirements","only lack of food","only overeating","no disease"],"e":"It covers undernutrition, micronutrient deficiency and overnutrition."},{"q":"Low weight-for-height is called…","o":["wasting","stunting","underweight","obesity"],"e":"Wasting usually indicates recent, severe weight loss."},{"q":"Low height-for-age is called…","o":["stunting","wasting","underweight","marasmus"],"e":"It reflects chronic or recurrent undernutrition."},{"q":"Low weight-for-age is called…","o":["underweight","stunting","wasting","oedema"],"e":"An underweight child may be stunted, wasted or both."},{"q":"A lack of vitamin A, iron or iodine is an example of…","o":["micronutrient deficiency","overnutrition","stunting","wasting"],"e":"These are inadequate intake of essential vitamins and minerals."},{"q":"Which is a cause of childhood malnutrition?","o":["Lack of clean water and sanitation","Exclusive breastfeeding","Full immunisation","Adequate diet"],"e":"Repeated infections worsen malnutrition."},{"q":"Which infections worsen malnutrition?","o":["Diarrhoea and respiratory infections","Sprains","Dental caries","Acne"],"e":"They reduce absorption, raise requirements and reduce appetite."},{"q":"Protein-energy malnutrition (PEM) is…","o":["an imbalance between protein and energy supply and the body's demand","a lack of vitamins only","excess protein","excess energy only"],"e":"It is the WHO definition in the notes."},{"q":"The relationship between SAM and PEM is that…","o":["SAM is a subset of PEM","PEM is a subset of SAM","they are unrelated","SAM is overnutrition"],"e":"SAM is the most severe form."},{"q":"The word \"kwashiorkor\" means…","o":["disease of the displaced child","big belly","dry skin","thin child"],"e":"It is a Ga word describing the child displaced from the breast by a new baby."},{"q":"Kwashiorkor mostly occurs in children aged…","o":["1 to 3 years","under 1 month","10 to 15 years","adults"],"e":"It occurs after weaning onto low-protein food."},{"q":"Which are the three main signs of kwashiorkor?","o":["Oedema, growth failure and mental changes","Fever, cough and rash","Vomiting, diarrhoea and pain","Anaemia, jaundice and fits"],"e":"These are the cardinal signs in the notes."},{"q":"A cause of kwashiorkor is…","o":["low protein diet after weaning","high protein intake","exclusive breastfeeding","excess fruit"],"e":"Infections also predispose the child."},{"q":"The hair in kwashiorkor becomes…","o":["thin, silky and coppery red","thick and black","curly","unchanged"],"e":"It can be plucked easily without pain."},{"q":"Skin changes in kwashiorkor are described as…","o":["dermatosis, often flaky-paint in areas of friction","smooth glossy skin","no change","thick calluses"],"e":"They are common in pressure and friction areas."},{"q":"The earliest manifestation of kwashiorkor is…","o":["growth retardation","oedema of the face","dermatosis","anaemia"],"e":"The child is lighter and shorter than peers."},{"q":"Oedema in kwashiorkor usually begins…","o":["in the feet","on the face","in the neck","in the abdomen"],"e":"It spreads up the legs, then hands and face."},{"q":"Mental changes in a child with kwashiorkor include…","o":["apathy and irritability","hyperactivity","excessive laughter","high alertness"],"e":"The child has no interest in surroundings."},{"q":"According to the notes, kwashiorkor is diagnosed when weight-for-age is…","o":["above 80% with body swelling","below 60% with swelling","60-80% with no swelling","below 60% without swelling"],"e":"60-80% with swelling is underweight kwashiorkor."},{"q":"Marasmic kwashiorkor is weight-for-age…","o":["below 60% with oedema","above 80% with oedema","60-80% without oedema","100% normal"],"e":"It has features of both marasmus and kwashiorkor."},{"q":"A feature of poor prognosis in kwashiorkor is…","o":["hypoglycaemia","weight gain","good appetite","clear consciousness"],"e":"Others are sepsis, seizures and altered sensorium."},{"q":"Weight-for-height percentage is calculated as…","o":["weight of child divided by weight of a normal child of the same height x 100","height divided by weight","age divided by weight","MUAC divided by height"],"e":"It indicates wasting."},{"q":"The first phase of treatment of kwashiorkor is…","o":["stabilisation","rehabilitation","follow-up","discharge"],"e":"It lasts about the first week and treats life-threatening conditions."},{"q":"In stabilisation, hypoglycaemia is corrected by feeding every…","o":["2 to 3 hours","12 hours","24 hours","48 hours"],"e":"Low glucose is a frequent cause of death."},{"q":"If a child cannot feed, hypoglycaemia is treated with…","o":["10% dextrose orally or by NG tube","plain water","normal saline","oral iron"],"e":"IV glucose is given if the child is unconscious."},{"q":"Hypothermia in a child with kwashiorkor is corrected with…","o":["warm clothes and kangaroo mother care","cold compresses","fans","removing clothing"],"e":"Persistent low temperature may indicate septic shock."},{"q":"The special rehydration fluid for malnourished children is…","o":["ReSoMal","standard high-sodium ORS","plain water","10% dextrose"],"e":"It has low sodium content."},{"q":"In kwashiorkor, blood levels of which minerals are low?","o":["Potassium, magnesium, copper and zinc","sodium only","calcium only","iron only"],"e":"These are corrected with supplements."},{"q":"Which is given for infections in severe malnutrition?","o":["Broad-spectrum antibiotics","No drugs","Only vitamins","Steroids"],"e":"Infections present atypically and are hard to detect."},{"q":"The dermatosis of kwashiorkor can be treated with…","o":["zinc supplements or 0.01% potassium permanganate","strong steroids","antifungal","nothing"],"e":"Castor oil or zinc ointment may also be applied."},{"q":"A complication of kwashiorkor is…","o":["blindness from vitamin A deficiency","high immunity","increased height","hypertension"],"e":"Low immunity and mental retardation are others."},{"q":"A differential diagnosis of kwashiorkor is…","o":["pellagra","malaria","measles","tetanus"],"e":"Acrodermatitis enteropathica is another."},{"q":"Marasmus occurs mostly in children below…","o":["2 years","10 years","15 years","adults only"],"e":"The child is extremely wasted."},{"q":"Which is a feature of marasmus?","o":["Loose skin folds without oedema","Oedema of the feet","Flaky paint dermatosis","Coppery hair"],"e":"There are no skin or hair changes."},{"q":"Which is NOT part of the WHO priority programme against child malnutrition?","o":["Bed rest","Growth monitoring","Oral rehydration therapy","Immunisation"],"e":"Others are exclusive breastfeeding and family planning."},{"q":"Severe acute malnutrition is defined by WHO as a weight-for-height Z-score below…","o":["-3 standard deviations","-1","0","+2"],"e":"A MUAC below 115 mm is another criterion."},{"q":"A MUAC below what value indicates severe acute malnutrition?","o":["115 mm","200 mm","150 mm","300 mm"],"e":"MUAC is a simple measure of the upper arm circumference."},{"q":"Therapeutic foods used to treat SAM are called…","o":["ready-to-use therapeutic foods (RUTF)","oral rehydration salts","vitamin syrups","infant formula"],"e":"They allow home treatment."},{"q":"CMAM stands for…","o":["Community-Based Management of Acute Malnutrition","Clinical Management of Anaemia and Malaria","Child Malnutrition and Mortality","Community Mobilisation for Adult Meals"],"e":"It is a decentralised approach."},{"q":"Children under 6 months with acute malnutrition are treated in…","o":["stabilisation centres","supplementary feeding","community homes","school"],"e":"Those with disabilities preventing safe RUTF use also go there."}]},{"id":"u7","icon":"🦴","title":"Arthritis: Osteoarthritis, Rheumatoid Arthritis & Gout","recap":["OA: slow, non-inflammatory, cartilage loss; pain worse with use, stiffness under 30 min, Heberden's (DIP) and Bouchard's (PIP) nodes, no systemic features.","RA: autoimmune, symmetric small-joint inflammation, morning stiffness over 1 hour, pannus, rheumatoid factor; 4 of 7 criteria for diagnosis.","Gout: uric acid crystals (monosodium urate) in joints, big toe, tophi; colchicine for acute attacks, allopurinol and probenecid for chronic control."],"qs":[{"q":"Arthritis basically refers to…","o":["inflammation of the joints","fractures of bone","muscle sprain","nerve damage"],"e":"Many types exist, including osteoarthritis, rheumatoid arthritis and gout."},{"q":"Osteoarthritis is best described as a…","o":["slow, progressive, non-inflammatory disorder of synovial joints","rapid inflammatory joint disease","infection of bone","muscle disease"],"e":"It causes progressive loss of articular cartilage."},{"q":"Osteoarthritis was previously known as…","o":["degenerative joint disease","gout","septic arthritis","rheumatic fever"],"e":"It is now recognised as more than simple wear."},{"q":"Which is a modifiable risk factor for hip and knee OA?","o":["Obesity","Age","Sex","Family history"],"e":"Weight loss reduces joint load."},{"q":"A distinguishing feature of OA from inflammatory arthritis is…","o":["no systemic manifestations","fever","weight loss","symmetrical involvement"],"e":"OA is localised."},{"q":"Pain in early OA is…","o":["worse with activity and relieved by rest","worse at rest only","absent","constant"],"e":"In advanced OA, pain may occur even at rest and disturb sleep."},{"q":"OA usually starts at what age?","o":["Above 40 years","Under 5 years","10 years","birth"],"e":"It is commonly seen in overweight people."},{"q":"Stiffness in OA after rest usually lasts…","o":["less than 30 minutes","more than 1 hour","all day","one week"],"e":"This distinguishes it from RA."},{"q":"Heberden's nodes are found on the…","o":["distal interphalangeal joints","proximal interphalangeal joints","knees","toes only"],"e":"Bouchard's nodes are on the proximal interphalangeal joints."},{"q":"Bouchard's nodes are found on the…","o":["proximal interphalangeal joints","distal interphalangeal joints","wrists","elbows"],"e":"They are bony enlargements."},{"q":"A grating sensation in a joint on movement is called…","o":["crepitation","effusion","tophus","pannus"],"e":"It is common in OA."},{"q":"OA typically affects joints…","o":["asymmetrically","always symmetrically","only in the hands","only in children"],"e":"This contrasts with RA."},{"q":"Management of OA focuses on…","o":["pain and inflammation control and maintaining joint function","curing the disease","amputation","bed rest only"],"e":"There is no cure for OA."},{"q":"An important nursing advice for an obese OA patient is…","o":["weight reduction","weight gain","total bed rest","avoid all activity"],"e":"It is critically important for pain control."},{"q":"Prolonged periods of rest in OA should…","o":["be avoided","be encouraged","be maximised","replace exercise"],"e":"Rest is balanced with exercise."},{"q":"Heat or cold applications in OA…","o":["help to reduce pain","cause the disease","are forbidden","increase stiffness"],"e":"They are helpful comfort measures."},{"q":"Intra-articular injections in OA use…","o":["corticosteroids","insulin","antibiotics","iron"],"e":"Surgery, such as joint replacement, is for advanced disease."},{"q":"Rheumatoid arthritis is thought to be…","o":["an autoimmune disorder","caused by overuse","infectious","due to trauma"],"e":"Rheumatoid factor combines with IgG to form immune complexes."},{"q":"The hallmark of rheumatoid arthritis is…","o":["pannus formation","Heberden's nodes","tophi","crepi raining blood and air from the pleural cavity."}]},{"id":"u10","icon":"🌬️","title":"Pneumonia & Bronchiectasis","recap":["Pneumonia = acute inflammation of lung parenchyma. CAP (commonest organism Streptococcus pneumoniae) vs HAP (48 hours or more after admission; Staph aureus, Pseudomonas, Klebsiella, E. coli).","Stages: congestion, red hepatization, grey hepatization, resolution. Rusty sputum, fever, fast pulse, dullness to percussion, consolidation on chest X-ray.","Bronchiectasis: chronic irreversible dilatation of airways with mucus build-up; treat with postural drainage, chest percussion, expectorants and antibiotics."],"qs":[{"q":"Pneumonia is…","o":["acute inflammation of the lung parenchyma (bronchioles and alveoli)","chronic airway narrowing","infection of the pleura only","inflammation of the trachea"],"e":"It is usually infective."},{"q":"Which is a non-infectious cause of pneumonia?","o":["Aspiration of gastric contents","Streptococcus pneumoniae","Virus","Fungus"],"e":"Inhalation of toxic gases is another."},{"q":"A predisposing factor for pneumonia is…","o":["cigarette smoking","regular exercise","good nutrition","vaccination"],"e":"Old age, malnutrition and immobility also predispose."},{"q":"A patient with prolonged immobility is at risk of pneumonia because of…","o":["pooling of secretions in the lungs","increased appetite","hyperventilation","better circulation"],"e":"Poor clearance of secretions favours infection."},{"q":"Community-acquired pneumonia (CAP) is when symptoms occur…","o":["in the community or within 48 hours of admission","more than 48 hours after admission","only in hospital","only on a ventilator"],"e":"HAP starts 48 hours or more after admission."},{"q":"The commonest cause of CAP is…","o":["Streptococcus pneumoniae","Pseudomonas","Klebsiella","E. coli"],"e":"Mycoplasma and Haemophilus are also causes."},{"q":"Hospital-acquired pneumonia is also called…","o":["nosocomial pneumonia","community pneumonia","opportunistic pneumonia", es breathing","it lowers BP","it has no effect"],"e":"Good hydration thins mucus."},{"q":"Suction in asthma is used…","o":["to remove excess mucus if indicated","routinely","never","to help sleep"],"e":"It clears the airway."},{"q":"Between attacks, an asthmatic patient…","o":["may have normal breathing and be symptom-free","is always breathless","has fever","has no risk"],"e":"Asthma is episodic and reversible."}]},{"id":"u13","icon":"🚬","title":"Chronic Obstructive Pulmonary Disease (COPD)","recap":["COPD is a preventable, progressive lung disease (chronic bronchitis and emphysema) with no cure; smoking is the main risk factor and cessation is the only measure that slows progression.","Chronic bronchitis = inflamed bronchi with excess mucus and productive cough; emphysema = destruction of alveolar walls with air trapping.","Care: bronchodilators, corticosteroids, oxygen, pursed-lip breathing, high calorie high protein diet, hydration, vaccination, infection prevention."],"qs":[{"q":"COPD is…","o":["a preventable, progressive disease that blocks airflow","a curable infection","an acute cold","a heart disease"],"e":"There is no cure, but symptoms can be managed."},{"q":"The two main conditions in COPD are…","o":["chronic bronchitis and emphysema","asthma and pneumonia","TB and pneumonia","cough and cold"],"e":"They often coexist."},{"q":"The main risk factor for COPD is…","o":["cigarette smoking","alcohol","exercise","sea air"],"e":"Active and passive smoking both contribute."},{"q":"Which occupational exposure increases the risk of COPD?","o":["Dusts, chemical fumes and mining","Desk work","Teaching","Fishing only"],"e":"Miners are at high risk."},{"q":"The only measure that slows progression of COPD is…","o":["smoking cessation","more exercise","oxygen therapy","bed rest"],"e":"It is the most important intervention."},{"q":"Chronic bronchitis involves…","o":["inflammation of the bronchi with excess mucus and productive cough","destroyed alveoli","pleural fluid","a lcer","Duodenal ulcer","Neither","Both equally"],"e":"Duodenal ulcers have little malignancy risk."},{"q":"Typical peptic ulcer pain is…","o":["burning, gnawing or aching","stabbing at the chest","colicky only","absent"],"e":"It is epigastric."},{"q":"The gastric mucus layer…","o":["protects the mucosa from acid","produces acid","digests food","stores food"],"e":"It traps and slows H+ diffusion."},{"q":"Bicarbonate in the stomach…","o":["neutralises acid","makes acid","causes ulcers","kills bacteria"],"e":"It is secreted by the mucosa."},{"q":"Prostaglandins protect the stomach by…","o":["stimulating mucus and bicarbonate and maintaining blood flow","increasing acid","thinning mucus","causing vasoconstriction"],"e":"NSAIDs inhibit them."},{"q":"A common cause of peptic ulcer is…","o":["NSAIDs and aspirin","vegetables","fruit","exercise"],"e":"H. pylori infection is another."},{"q":"Which is a risk factor for peptic ulcer?","o":["Severe physiological stress like burns","Rest","Water","Vitamins"],"e":"Smoking and alcohol also increase risk."},{"q":"In gastric ulcer, the critical factor is…","o":["the amount of acid able to penetrate the mucosa","the amount of acid secreted","acid absence","bile"],"e":"Back-diffusion of acid damages the mucosa."},{"q":"Duodenal ulcers are associated with…","o":["high acid content","low acid","no acid","alkaline stomach"],"e":"Increased vagal stimulation raises acid secretion."},{"q":"The definitive diagnostic procedure for peptic ulcer is…","o":["oesophagogastroduodenoscopy (EGD)","chest X-ray","ECG","EEG"],"e":"It also allows biopsy."},{"q":"Detection of H. pylori is done by…","o":["breath test, stool antigen or biopsy","ECG","urine test","sputum"],"e":"It guides treatment."},{"q":"Which drug suppresses acid production by blocking the proton pump?","o":["Omeprazole","Ranitidine","Aluminium hydroxide","Misoprostol"],"e":"Lansoprazole is another PPI."},{"q":"H2-receptor antagonists work by…","o":["blocking histamine-stimulated acid secr tage chronic liver disease with fibrosis and nodules; types: alcoholic (Laennec's), post-necrotic, biliary, cardiac.","Portal hypertension → varices, splenomegaly, ascites; liver failure → jaundice, encephalopathy (ammonia), bleeding. Hypoalbuminaemia and aldosterone add to ascites.","Ascites care: sodium restriction, spironolactone (± furosemide), therapeutic paracentesis with careful monitoring of BP and fluid balance."],"qs":[{"q":"Cirrhosis is…","o":["the end stage of chronic liver disease","an acute infection","a cancer","a kidney disease"],"e":"Normal liver tissue is replaced by fibrous tissue."},{"q":"The liver in cirrhosis is replaced by…","o":["fibrous connective tissue and nodules","fat only","blood","water"],"e":"It disrupts blood and bile flow."},{"q":"Alcoholic cirrhosis is also called…","o":["Laennec's cirrhosis","post-necrotic cirrhosis","biliary cirrhosis","cardiac cirrhosis"],"e":"It follows chronic alcohol use."},{"q":"Post-necrotic cirrhosis follows…","o":["viral hepatitis or toxins","heart failure","gallstones","exercise"],"e":"It is due to liver cell necrosis."},{"q":"Biliary cirrhosis results from…","o":["chronic biliary obstruction","heart failure","alcohol","anaemia"],"e":"Jaundice is a prominent feature."},{"q":"Cardiac cirrhosis results from…","o":["long-standing severe right-sided heart failure","left heart failure only","anaemia","malaria"],"e":"Congestion damages the liver."},{"q":"Portal hypertension arises because…","o":["fibrosis impedes blood flow through the liver","the liver enlarges","heart fails","kidneys fail"],"e":"Blood backs up in the portal system."},{"q":"A consequence of portal hypertension is…","o":["oesophageal varices","asthma","gout","arthritis"],"e":"Portosystemic collaterals form."},{"q":"Splenomegaly in portal hypertension leads to…","o":["hypersplenism","polycythaemia","hyperthyroidism","gout"],"e":"Blood cells are destroyed in the spleen."},{"q":"Ascites is…","o":["accumulation of serous fluid in the peritoneal cavity","pleural fluid","fluid in the joints","fluid in the lungs"],"e":"It is a common manifestation of cirrhosis."},{"q":"The primary cause of ascites in cirrhosis is…","o":["portal hypertension","anaemia","infection","malnutrition only"],"e":"Hypoalbuminaemia contributes."},{"q":"Hypoalbuminaemia causes ascites by…","o":["lowering plasma oncotic pressure","raising BP","increasing bile","raising pH"],"e":"Fluid escapes into the abdomen."},{"q":"Hyperaldosteronism in cirrhosis causes…","o":["sodium and water retention","sodium loss","dehydration","hypotension only"],"e":"It worsens ascites."},{"q":"Massive ascites can cause…","o":["respiratory difficulty","constipation","anaemia","hair loss"],"e":"The abdomen presses on the diaphragm."},{"q":"Early symptoms of cirrhosis are…","o":["anorexia, nausea and a heavy feeling in the right upper abdomen","high fever","chest pain","haemoptysis"],"e":"GI disturbances occur early."},{"q":"Jaundice in cirrhosis is due to…","o":["impaired bilirubin handling by the liver","excess bilirubin intake","anaemia only","heart failure"],"e":"It is a sign of liver insufficiency."},{"q":"Spider naevi are…","o":["dilated vessels with bright red centre on the face and chest","nodules on joints","bruises","moles"],"e":"Palmar erythema also occurs."},{"q":"Hepatic encephalopathy results from…","o":["accumulation of ammonia in the blood","low sugar","low sodium","high potassium"],"e":"The liver cannot convert ammonia to urea."},{"q":"In hepatic encephalopathy, protein intake is…","o":["reduced","increased","unchanged","irrelevant"],"e":"Ammonia comes from protein breakdown."},{"q":"A sign of hepatic encephalopathy is…","o":["confusion, drowsiness and flapping tremor","hypertension only","polyuria","itching only"],"e":"It progresses to coma."},{"q":"Bleeding tendency in cirrhosis is due to…","o":["poor synthesis of clotting factors","excess platelets","high vitamin K","anaemia"],"e":"The liver makes clotting factors."},{"q":"Peripheral oedema in c ath.","Risk factors: high LDL, low HDL, smoking, hypertension, diabetes, obesity, inactivity, stress, age, family history, oral contraceptives. Left and right coronary arteries arise from the aorta root.","Angina: transient precordial pain relieved by rest or glyceryl trinitrate (works in 1-2 min); beta-blockers (atenolol), isosorbide dinitrate; stop smoking, lose weight, exercise within limits."],"qs":[{"q":"Coronary artery disease is a type of…","o":["atherosclerosis affecting the coronary arteries","lung disease","kidney disease","liver disease"],"e":"Fatty plaque narrows the vessels supplying the heart."},{"q":"\"Atherosclerosis\" comes from Greek words meaning…","o":["fatty mush and hard","heart and vessel","blood and clot","narrow and wide"],"e":"Atheroma is fatty deposit, skleros is hard."},{"q":"Atherosclerosis is often called…","o":["hardening of the arteries","softening of the heart","hardening of the veins","thickening of blood"],"e":"Plaque stiffens and narrows the arteries."},{"q":"Another name for CAD is…","o":["coronary heart disease","rheumatic heart disease","cor pulmonale","cardiomyopathy"],"e":"It is also called atherosclerotic heart disease."},{"q":"Coronary arteries arise from…","o":["the root of the aorta","the pulmonary artery","the vena cava","the left atrium"],"e":"They supply blood to the myocardium."},{"q":"The left anterior descending artery supplies…","o":["the anterior interventricular septum and left ventricle","the right atrium only","the lungs","the brain"],"e":"It runs down the front of the heart."},{"q":"The right coronary artery supplies…","o":["the right ventricle and the posterior part of the heart","the left atrium only","the brain","the lungs"],"e":"Its posterior descending branch supplies the back of the heart."},{"q":"Most coronary blood flow occurs during…","o":["diastole","systole","isovolumetric contraction","exercise only"],"e":"The ventricles relax and the arteries fill."},{"q":"Collateral circulation in the heart…","o"
