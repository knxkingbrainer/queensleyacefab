ceryl trinitrate","eating","coughing","lying prone"],"e":"It is short-lived."},{"q":"A precipitant of angina is…","o":["exertion, emotional stress or cold","sleep","fluids","sitting quietly"],"e":"Heavy meals and sexual activity also trigger it."},{"q":"Temperature extremes may trigger angina because they…","o":["raise myocardial oxygen demand","lower oxygen demand","treat it","reduce pain"],"e":"Cold causes vasoconstriction."},{"q":"Angina differs from MI in that angina pain…","o":["lasts minutes and is relieved by rest or nitrates","is unrelieved by nitrates","lasts over 30 minutes","causes cardiac enzyme rise"],"e":"MI pain is prolonged and severe."},{"q":"The drug of choice for acute angina is…","o":["sublingual nitroglycerine (GTN)","oral atenolol","aspirin","digoxin"],"e":"It acts within 1-2 minutes."},{"q":"Nitroglycerine relieves angina by…","o":["dilating veins and arteries, reducing preload and afterload","constricting vessels","raising heart rate","increasing BP"],"e":"It also dilates collateral vessels."},{"q":"Nitroglycerine tablets are taken…","o":["sublingually","swallowed whole","by injection only","rubbed on skin only"],"e":"Sublingual absorption is rapid."},{"q":"A nurse advises a patient on GTN that…","o":["the tablets should be kept in a dark glass bottle","GTN should be chewed","GTN should be taken after a meal only","there are no side effects"],"e":"A side effect is headache."},{"q":"A side effect of nitroglycerine is…","o":["headache and hypotension","constipation","hair loss","cough"],"e":"Due to vasodilation."},{"q":"A beta-blocker used in angina is…","o":["atenolol","salbutamol","amoxicillin","furosemide"],"e":"It reduces heart rate and workload."},{"q":"Beta-blockers should be avoided in patients with…","o":["asthma","hypertension","anxiety","arrhythmia"],"e":"They can cause bronchospasm."},{"q":"A long-acting nitrate taken orally for angina is…","o":["isosorbide dinitrate","salbutamol","aminophylline","atropine"],"e":"It is used for prophylaxis."},{"q":"Which measure reduces CAD risk?","o":["Smoking cessation","Smoking less","High fat diet","Bed rest"],"e":"It is the most important step."},{"q":"Weight reduction in angina is advised for…","o":["overweight patients","all thin patients","no one","children only"],"e":"It reduces myocardial workload."},{"q":"Exercise for an angina patient should be…","o":["regular and within the limits of tolerance","vigorous","none","sudden and strenuous"],"e":"Regular exercise helps cardiac fitness."},{"q":"Treatment of abnormal lipids in CAD aims to…","o":["reach target levels","raise LDL","eliminate HDL","increase fat"],"e":"Diet and statins are used."},{"q":"Hypertension and diabetes in CAD patients should be…","o":["optimally managed","ignored","left to heal","treated with salt"],"e":"They accelerate atherosclerosis."},{"q":"During an angina attack, the nurse should first…","o":["stop activity and give prompt pain relief as prescribed","continue activity","give a heavy meal","give fluids only"],"e":"Rest reduces oxygen demand."},{"q":"Patient education for angina includes…","o":["medication, pain management and risk factor control","stopping all treatment","eating fatty food","heavy lifting"],"e":"Main nursing activities include education."},{"q":"C-reactive protein is an inflammatory marker which is…","o":["elevated as a risk factor for CAD","lowered in CAD","unrelated to CAD","normal in CAD"],"e":"Elevated CRP is associated with risk."},{"q":"Unrelieved chest pain lasting over 15-20 minutes despite GTN should be treated as…","o":["a possible myocardial infarction needing urgent care","normal angina","indigestion","muscle strain"],"e":"It may indicate MI, which is an emergency."}]},{"id":"u21","icon":"💔","title":"Heart Failure","recap":["Heart failure: the heart cannot pump enough blood for the body's metabolic needs. Causes: CAD, hypertension (3-fold risk), diabetes, valve disease, cardiomyopathy, anaemia, arrhythmias. Systolic (contraction), diastolic (filling) {"q":"Swelling of the feet and lower legs is called…","o":["dependent oedema","ascites","pleural effusion","clubbing"],"e":"Pitting is common."},{"q":"Abdominal swelling in right failure is due to…","o":["ascites and hepatic congestion","flatus","obesity","pregnancy"],"e":"Venous congestion affects the GIT and liver."},{"q":"Cardiac enzymes are checked in heart failure if…","o":["myocardial infarction is suspected","always","never","fever is present"],"e":"CPK and troponin rise."},{"q":"Goals of heart failure treatment include…","o":["relieving symptoms and improving cardiac output","curing permanently","removing the heart","fluid loading"],"e":"Treat the precipitating cause."},{"q":"A patient with heart failure should be placed…","o":["upright or semi-recumbent","flat","prone","head down"],"e":"It reduces venous return and dyspnoea."},{"q":"Bed rest in hospitalised heart failure patients…","o":["reduces cardiac workload","increases workload","causes oedema","is forbidden"],"e":"Gradual activity follows."},{"q":"Nutritional therapy in heart failure is…","o":["low sodium","high sodium","high fat","fasting"],"e":"Fluids may be restricted."},{"q":"A diuretic used in heart failure is…","o":["furosemide","insulin","salbutamol","aspirin"],"e":"It reduces fluid overload."},{"q":"Which drug class is used to reduce afterload in heart failure?","o":["ACE inhibitors","Antibiotics","Antimalarials","Steroids"],"e":"Captopril and enalapril are examples."},{"q":"Digoxin is used in heart failure to…","o":["strengthen myocardial contraction","reduce heart rate to zero","raise BP","cause diuresis"],"e":"It increases contractility."},{"q":"Before giving digoxin, the nurse should check…","o":["the apical pulse","temperature","weight","height"],"e":"Hold if pulse is below 60."},{"q":"A sign of digoxin toxicity is…","o":["nausea, vomiting and visual disturbances","constipation","hair loss","itching"],"e":"Potassium levels are monitored."},{"q":"Daily weighing in heart failure is done…"," e heart"],"e":"It guides antibiotic choice."},{"q":"The recommended urine specimen for culture is a…","o":["clean-catch midstream sample","first-morning random sample","24-hour sample","catheter tip"],"e":"It reduces contamination."},{"q":"The specimen for urine culture is collected in a…","o":["sterile container","clean bucket","any bottle","used jar"],"e":"Aseptic technique prevents contamination."},{"q":"The nurse handling a urine container should touch…","o":["only the outside","the inside of the lid","the rim","the urine"],"e":"This avoids contamination."},{"q":"For a woman collecting a midstream sample, the nurse instructs her to…","o":["separate the labia and clean the meatus front to back","wipe back to front","skip cleaning","catch the first drops"],"e":"Front-to-back cleaning avoids faecal contamination."},{"q":"For a male patient, the nurse instructs him to…","o":["retract the foreskin and clean the glans before voiding","skip cleaning","collect the initial stream","wash with antiseptic only"],"e":"He starts urinating and then catches the midstream."},{"q":"Why is the initial urine not collected?","o":["It flushes out contaminants","It is diluted","It is too warm","It is wasted"],"e":"The midstream portion is more representative."},{"q":"Normal urine colour is…","o":["amber yellow","dark brown","red","green"],"e":"Colour changes may indicate disease."},{"q":"Which cast may be occasionally normal in urine?","o":["Hyaline","Red cell","White cell","Granular"],"e":"Other casts suggest renal disease."},{"q":"Blood urea nitrogen (BUN) is…","o":["a waste product of protein metabolism excreted by the kidneys","a hormone","a vitamin","a fat"],"e":"It rises in renal dysfunction."},{"q":"Non-renal factors that raise BUN include…","o":["dehydration and high protein intake","overhydration","fasting","low protein diet"],"e":"GI bleeding also raises it."},{"q":"Serum creatinine is a more reliable measure of renal function because…","o":["it is released at a constant rat men."},{"q":"Which are lower urinary tract infections?","o":["Cystitis, urethritis and prostatitis","Pyelonephritis","Renal abscess","Perinephric abscess"],"e":"These are upper tract conditions."},{"q":"Which is an upper UTI?","o":["Pyelonephritis","Cystitis","Urethritis","Prostatitis"],"e":"It involves the renal pelvis."},{"q":"Complicated UTIs are associated with…","o":["catheterisation or urinary tract abnormalities","young healthy women","sexual activity only","dehydration"],"e":"They are often recurrent and nosocomial."},{"q":"Most uncomplicated UTIs are…","o":["community acquired in young women","hospital acquired","in the elderly only","in men only"],"e":"They usually respond to short antibiotics."},{"q":"The commonest organism causing UTI is…","o":["Escherichia coli","Streptococcus","Staphylococcus","Plasmodium"],"e":"It comes from the perineum or bowel."},{"q":"The most common route of infection is…","o":["ascending via the urethra","bloodstream","fistula","lymph"],"e":"Transurethral route."},{"q":"Which is a risk factor for UTI?","o":["Urinary catheterisation","Fluids","Voiding on time","Good hygiene"],"e":"Also obstruction, stones and pregnancy."},{"q":"Risk factors for UTI in older adults include…","o":["incomplete bladder emptying and immobility","exercise","high fluids","vaccination"],"e":"Use of bedpans also raises risk."},{"q":"Which is a symptom of lower UTI?","o":["Burning on urination","Haemoptysis","Jaundice","Wheeze"],"e":"Also frequency, urgency and suprapubic pain."},{"q":"Elderly patients with UTI often present with…","o":["nonspecific signs like confusion or fever","classic burning","no symptoms","rash"],"e":"Altered sensorium can be the only sign."},{"q":"Haematuria means…","o":["blood in the urine","pus in the urine","protein in the urine","sugar in the urine"],"e":"It may occur in UTI."},{"q":"Which nursing measure helps UTI?","o":["Liberal oral fluids","Fluid restriction","Holding urine","Caffeine"],"e":"Flushing the tract reduces bacteria."},{"q":"Patients with UTI should avoid…","o":["caffeine, citrus and spicy foods","water","rice","vegetables"],"e":"They irritate the bladder mucosa."},{"q":"To prevent UTI, women should wipe…","o":["front to back","back to front","either way","not at all"],"e":"It prevents faecal contamination of the urethra."},{"q":"Preventive advice for UTI includes…","o":["wearing cotton underwear","tight nylon clothing","douching","holding urine"],"e":"Also voiding after intercourse."},{"q":"Warm compresses in UTI are used to…","o":["relieve pain and bladder spasm","cause infection","reduce urine","cool the patient"],"e":"They improve comfort."},{"q":"For severe UTI, the IV antibiotic given may be…","o":["ceftriaxone or gentamicin","penicillin only","amoxicillin orally","chloramphenicol"],"e":"Oral drugs are given for mild cases."}]},{"id":"u23","icon":"🫘","title":"Pyelonephritis, Glomerulonephritis & Nephrotic Syndrome","recap":["Acute pyelonephritis: bacterial infection of renal pelvis/parenchyma, E. coli commonest; fever, rigors, flank pain, pyuria; fluids, broad-spectrum antibiotics (cephalosporin or quinolone). Chronic form scars the kidney and can cause ESRD.","Acute post-streptococcal GN: group A beta-haemolytic strep 1-3 weeks after throat/skin infection; haematuria (cola urine), oedema, hypertension; protein and salt restriction, penicillin.","Nephrotic syndrome: heavy proteinuria, hypoalbuminaemia, generalised oedema, hyperlipidaemia; high-biological-value protein diet, low sodium, diuretics."],"qs":[{"q":"Acute pyelonephritis is…","o":["bacterial infection of the renal pelvis and kidney tissue","inflammation of the bladder","kidney stones","a kidney tumour"],"e":"It is a complication of UTI."},{"q":"The commonest organism in pyelonephritis is…","o":["E. coli","Plasmodium","Mycobacterium","Candida"],"e":"Proteus and Enterobacter also occur."},{"q":"Risk factors for pyelonephritis include…","o":["pregnancy and urinary tract obstruction","exercise","high fluids","vaccination"],"e":"Also congenital malformations."},{"q":"Urine stasis promotes infection because…","o":["it is a good medium for bacterial growth","it kills bacteria","it raises pH","it cools urine"],"e":"Obstruction encourages stasis."},{"q":"Repeated attacks of acute pyelonephritis can lead to…","o":["chronic pyelonephritis","asthma","gout","hepatitis"],"e":"Scarring and fibrosis develop."},{"q":"Infection in pyelonephritis usually starts in the…","o":["renal medulla","brain","heart","bone"],"e":"It spreads to the cortex."},{"q":"A typical sign of acute pyelonephritis is…","o":["shaking chills, fever and flank pain","wheeze","rash","jaundice"],"e":"Also nausea, headache and haematuria."},{"q":"Pyelonephritis is diagnosed by…","o":["urine culture and sensitivity","sputum culture","ECG","chest X-ray"],"e":"Gram stain shows bacteria and white cells."},{"q":"An antibiotic for acute pyelonephritis is…","o":["a broad-spectrum cephalosporin such as ceftriaxone","insulin","iron","vitamin C"],"e":"Quinolones like ciprofloxacin are also used."},{"q":"Chronic pyelonephritis is a common cause of…","o":["chronic renal failure","asthma","gout","heart failure"],"e":"It involves scarring of the kidney."},{"q":"Patient education for UTI includes the need to…","o":["complete antibiotics and monitor urine","stop when well","avoid fluids","self medicate"],"e":"Follow-up urine tests are done."},{"q":"Glomerular diseases mainly affect the…","o":["glomeruli of the kidneys","bladder","ureters","urethra"],"e":"They are a leading cause of chronic renal failure."},{"q":"Glomerulonephritis is inflammation of the…","o":["glomerular capillaries","renal pelvis","bladder","ureter"],"e":"It is often immune-mediated."},{"q":"Acute glomerulonephritis mainly affects…","o":["children above 2 years","the newborn","the very old only","pregnant women only"],"e":"It can occur at any age."},{"q":"The commonest form of acute GN is…","o":["post-streptococcal","post-viral","drug induced","hereditary"],"e":"It follows group A beta-haemolytic streptococcal infection."},{"q":"The organism responsible for post-streptococcal GN is…","o":["group A beta-haemolytic streptococcus","Staph aureus","E. coli","Pseudomonas"],"e":"Usually a throat or skin infection."},{"q":"Post-streptococcal GN appears about…","o":["1 to 3 weeks after the infection","1 day after","6 months after","1 year after"],"e":"There is a latent period."},{"q":"In GN, damage to glomeruli is caused by…","o":["circulating antigen-antibody immune complexes","direct infection","toxins only","trauma"],"e":"They deposit in the glomerular membrane."},{"q":"Which infection may lead to acute GN?","o":["Impetigo","Sprain","Fracture","Rash from allergy"],"e":"Also hepatitis B and malaria."},{"q":"Which systemic disease can cause GN?","o":["Systemic lupus erythematosus","Asthma","Gout","Anaemia"],"e":"Diabetes is another."},{"q":"The urine in acute GN is typically…","o":["smoky or cola-coloured","colourless","green","clear yellow"],"e":"Due to haematuria."},{"q":"A sign of acute GN is…","o":["periorbital oedema","jaundice","wheeze","polyuria"],"e":"Also hypertension and oliguria."},{"q":"Haematuria and proteinuria in GN are due to…","o":["damage to the glomerular membrane","bladder infection","stones","tumour"],"e":"Blood and protein escape into urine."},{"q":"Altered excretion of sodium in GN leads to…","o":["oedema and hypertension","dehydration","hypotension","polyuria"],"e":"Fluid retention results."},{"q":"Glomerular filtration rate in acute GN is…","o":["decreased","increased","normal","absent"],"e":"Nitrogenous waste accumulates."},{"q":"Which test supports post-streptococcal GN?","o":["Raised ASO titre","Low ESR","Positive Mantoux","Raised uric acid"],"e":"ASO shows recent strep infection."},{"q":"The diet in acute GN is…","o":["protein and salt restricted","high protein","high salt","high fluid"],"e":"Protein is restricted when nitrogen retention occurs."},{"q":"Fluid retention is controlled by restricting fluid to…","o":["previous day's urine output plus insensible loss","unlimited","double urine output","nothing"],"e":"Weight and output are monitored."},{"q":"Antibiotic treatment in post-streptococcal GN is…","o":["penicillin","insulin","vitamin C","antimalarials"],"e":"It eradicates the infection."},{"q":"A complication of acute GN is…","o":["hypertensive encephalopathy","gout","pneumonia","anaemia only"],"e":"It is a medical emergency."},{"q":"Chronic GN is characterised by…","o":["slow progressive destruction of the glomeruli","sudden recovery","bacterial infection","bladder disease"],"e":"It leads to shrunken granular kidneys."},{"q":"Symptoms of chronic GN…","o":["develop slowly and are often unnoticed early","are sudden","are severe","are absent always"],"e":"It may go years to end stage."},{"q":"Nephrotic syndrome is characterised by…","o":["proteinuria, hypoalbuminaemia and oedema","haematuria only","fever","jaundice"],"e":"Also hyperlipidaemia."},{"q":"The most important indicator of glomerular damage in nephrotic syndrome is…","o":["proteinuria","haematuria","glycosuria","pyuria"],"e":"Protein leaks through the damaged membrane."},{"q":"Hypoalbuminaemia in nephrotic syndrome causes…","o":["reduced oncotic pressure and oedema","hypertension","polyuria","anaemia"],"e":"Fluid shifts to the interstitium."},{"q":"Reduced plasma volume in nephrotic syndrome activates…","o":["the renin-angiotensin-aldosterone system","the insulin system","the thyroid","the bone marrow"],"e":"Sodium and water are retained."},{"q":"Oedema in nephrotic syndrome is usually…","o":["pitting and in dependent areas","hard and dry","absent","only in the face"],"e":"The sacrum, ankles and hands are common sites."},{"q":"Nursing care in nephrotic syndrome includes…","o":["meticulous skin care and monitoring for pulmonary oedema","exercise","fluid loading","high salt"],"e":"Skin breaks down easily with oedema."},{"q":"Diet in nephrotic syndrome should include…","o":["protein of high biological value and low sodium","high sodium","fasting","high fat"],"e":"Also adequate calories."},{"q":"Meticulous aseptic technique matters in nephrotic syndrome because…","o":["patients are prone to infection","they are immune","infection helps healing","it reduces oedema"],"e":"Loss of immunoglobulins raises infection risk."}]},{"id":"u24","icon":"🚨","title":"Acute Renal Failure (Acute Kidney Injury)","recap":["ARF: abrupt, often reversible loss of kidney function with azotemia and fluid/electrolyte imbalance. Categories: prerenal (~55%, poor perfusion), intrarenal (~40%, acute tubular necrosis), postrenal (obstruction).","Phases: initiation, oliguria (under 400 ml/day, hyperkalaemia, uraemia), diuresis, recovery (3-12 months). Fluid allowed = 600 ml + previous day's urine output.","Treatment: correct the cause, stop nephrotoxins, restrict K and protein, dialysis if needed; furosemide/mannitol to establish urine flow."],"qs":[{"q":"Renal failure occurs when the kidneys…","o":["cannot remove metabolites or regulate fluids and electrolytes","produce too much urine","make too much blood","are infected only"],"e":"Waste products accumulate in the body."},{"q":"Acute renal failure is…","o":["an abrupt, often reversible decline in renal function","a slow progressive failure","always permanent","a bladder infection"],"e":"It needs prompt intervention."},{"q":"Azotaemia is…","o":["accumulation of nitrogenous waste in the blood","fluid in lungs","sugar in urine","protein loss"],"e":"It is a hallmark of renal failure."},{"q":"The most common causes of ARF are…","o":["ischaemia and nephrotoxins","exercise","fluids","vitamins"],"e":"They cause tubular damage."},{"q":"Which is a nephrotoxic drug?","o":["Gentamicin","Amoxicillin","Paracetamol in low doses","Vitamin C"],"e":"NSAIDs and contrast dye are others."},{"q":"ARF is categorised as…","o":["prerenal, intrarenal and postrenal","acute, subacute and chronic","primary and secondary","mild and severe"],"e":"These reflect where the problem lies."},{"q":"The most common category of ARF is…","o":["prerenal","intrarenal","postrenal","chronic"],"e":"It accounts for about 55%."},{"q":"Prerenal ARF results from…","o":["reduced blood flow to the kidneys","kidney damage","urinary obstruction","infection"],"e":"Hypoperfusion without kidney tissue damage."},{"q":"A cause of prerenal ARF is…","o":["haemorrhage or severe dehydration","glomerulonephritis","stones","prostate enlargement"],"e":"Also heart failure, shock and sepsis."},{"q":"Prerenal ARF is…","o":["quickly reversed if blood flow is restored","always permanent","unaffected by treatment","a chronic disease"],"e":"The renal parenchyma is undamaged."},{"q":"If prerenal ARF is untreated, it may lead to…","o":["acute tubular necrosis","nothing","gout","asthma"],"e":"This is intrarenal failure."},{"q":"Intrarenal ARF results from…","o":["actual damage to the renal parenchyma and nephrons","poor blood flow","obstruction","infection of bladder"],"e":"Acute tubular necrosis is the commonest form."},{"q":"Which is a cause of intrarenal ARF?","o":["Glomerulonephritis","Haemorrhage","Stones","BPH"],"e":"Also nephrotoxins and acute pyelonephritis."},{"q":"Postrenal ARF results from…","o":["obstruction of urine flow from the kidney","poor perfusion","tubular necrosis","infection"],"e":"Any blockage below the kidney."},{"q":"The most common cause of postrenal ARF is…","o":["benign prostatic hypertrophy","asthma","anaemia","stroke"],"e":"Stones and tumours also cause it."},{"q":"ARF has how many phases?","o":["Four","Two","Three","Six"],"e":"Initiation, oliguria, diuresis and recovery."},{"q":"The initiation phase begins…","o":["with the initial insult and ends when tubular injury occurs","with recovery","with diuresis","with dialysis"],"e":"Early management gives a good prognosis."},{"q":"Oliguria is a urine output below…","o":["400 ml in 24 hours","2 litres","1 litre","3 litres"],"e":"Waste products cannot be excreted."},{"q":"The oliguric phase is accompanied by…","o":["a rise in urea, creatinine and potassium","a fall in urea","polyuria","low BP"],"e":"Uraemic symptoms first appear."},{"q":"Non-oliguric renal failure may occur with…","o":["burns, trauma and halothane","dehydration","dialysis","stones"],"e":"The patient may pass normal volumes despite azotaemia."},{"q":"In the diuretic phase, the patient…","o":["passes large volumes of dilute urine","has no urine","has scanty urine","is constipated"],"e":"Dehydration and electrolyte loss are watched for."},{"q":"In the diuretic phase, the nurse should monitor for…","o":["dehydration and hypokalaemia","overload only","hyperkalaemia","hypertension"],"e":"Fluid and electrolytes are replaced."},{"q":"The recovery phase is characterised by…","o":["gradual return of renal function","sudden death","dialysis only","rising creatinine"],"e":"It may take 3 to 12 months."},{"q":"A common electrolyte problem in the oliguric phase is…","o":["hyperkalaemia","hypokalaemia","hypernatraemia","hypercalcaemia"],"e":"Potassium cannot be excreted."},{"q":"A dietary restriction in ARF is…","o":["potassium-containing foods like banana","sugar","rice","water"],"e":"Protein of high biological value is given in small amounts."},{"q":"The daily fluid allowed in oliguric ARF is about…","o":["600 ml plus the previous day's urine output","5 litres","unlimited","nothing"],"e":"This covers insensible losses."},{"q":"Why is daily weighing important in ARF?","o":["It is an accurate indicator of fluid status","to check height","to check hunger","to give medicines"],"e":"Weight changes show retention or loss."},{"q":"Low-dose dopamine in ARF is used to…","o":["improve renal perfusion","raise temperature","treat infection","reduce pain"],"e":"It dilates renal blood vessels."},{"q":"Furosemide in ARF is given to…","o":["establish urine flow when fluid volume is replaced","cause dehydration","raise BP","reduce oedema only"],"e":"It \"washes out\" nephrons."},{"q":"An osmotic diuretic used in ARF is…","o":["mannitol","furosemide","spironolactone","aspirin"],"e":"It draws fluid into the vascular space."},{"q":"Mannitol should be avoided in patients with…","o":["heart failure or pulmonary oedema","dehydration","oliguria","shock"],"e":"It expands vascular volume."},{"q":"Hyperkalaemia in ARF may be treated with…","o":["IV insulin with glucose, calcium and bicarbonate","potassium supplements","salt","orange juice"],"e":"These shift or antagonise potassium."},{"q":"Phosphate binders such as aluminium hydroxide are given to…","o":["control hyperphosphataemia","raise potassium","treat infection","reduce oedema"],"e":"They bind phosphate in the gut."},{"q":"Antacids, H2 blockers or PPIs in ARF prevent…","o":["GI bleeding from stress","infection","oedema","anaemia"],"e":"Stress response causes ulceration."},{"q":"Dialysis in ARF is indicated when…","o":["conservative treatment fails to control uraemia, K or overload","mild illness","always","never"],"e":"Haemodialysis or peritoneal dialysis."},{"q":"The dose of drugs in ARF should be…","o":["reduced","increased","doubled","unchanged"],"e":"Reduced clearance may cause toxicity."},{"q":"In ARF caused by diarrhoea and vomiting, the IV fluid used is…","o":["0.9% sodium chloride","dextrose 50%","distilled water","blood only"],"e":"Fluid losses are replaced early."},{"q":"A nursing measure for mouth care in ARF is…","o":["frequent mouth care to relieve dryness and uraemic taste","restrict mouth care","brushing roughly","no care"],"e":"Fluid restriction dries the mouth."},{"q":"Nursing care for patients with ARF includes preventing infection by…","o":["strict asepsis with lines and catheters","using catheters always","avoiding hand washing","crowding"],"e":"Indwelling catheters are avoided if possible."},{"q":"Signs of uraemia include…","o":["metallic taste, anorexia and uraemic odour of breath","hunger","hair growth","polycythaemia"],"e":"Nausea and vomiting are common."}]},{"id":"u25","icon":"🩺","title":"Chronic Renal Failure","recap":["CRF: progressive, irreversible loss of nephrons; stages: diminished renal reserve, renal insufficiency, end-stage renal disease (GFR below 5-10%). Causes: chronic GN, chronic pyelonephritis, hypertension, diabetes, polycystic kidneys.","Uraemia: anorexia, nausea, pruritus, pericarditis, asterixis, uraemic frost, hyperkalaemia, anaemia (low erythropoietin), bleeding tendency. Nocturia early.","Care: protein of high biological value, low Na and K, fluid restriction, ACE inhibitors (enalapril, captopril), erythropoietin, avoid NSAIDs; dialysis or transplant for ESRD."],"qs":[{"q":"Chronic renal failure is…","o":["progressive and irreversible loss of renal function","sudden reversible failure","a bladder infection","a kidney stone"],"e":"Nephrons are destroyed gradually."},{"q":"The early stage of CRF is…","o":["diminished renal reserve","uraemia","ESRD","dialysis"],"e":"Kidneys still maintain normal creatinine."},{"q":"In diminished renal reserve, the patient is usually…","o":["asymptomatic","severely ill","in coma","dying"],"e":"The remaining nephrons hypertrophy to compensate."},{"q":"Renal insufficiency is the stage where…","o":["GFR falls, creatinine and BUN rise, and nocturia appears","kidney is normal","dialysis is essential","the kidney works perfectly"],"e":"Anaemia and hypertension may appear."},{"q":"End-stage renal disease occurs when GFR falls below…","o":["5-10% of normal","50%","75%","90%"],"e":"Dialysis or transplant is needed."},{"q":"A cause of CRF is…","o":["chronic glomerulonephritis","exercise","vitamin use","dehydration only"],"e":"Chronic pyelonephritis is another."},{"q":"Polycystic kidney disease is…","o":["a hereditary cause of CRF","a cause of ARF","an infection","a stone"],"e":"Cysts replace renal tissue."},{"q":"Diabetes and hypertension contribute to CRF through…","o":["damage to the glomeruli and vessels","high fluid intake","vitamins","sleep"],"e":"They are leading causes."},{"q":"An early symptom of CRF is…","o":["nocturia","haemoptysis","wheeze","jaundice"],"e":"The kidney loses concentrating ability."},{"q":"Uraemia is…","o":["accumulation of nitrogenous wastes producing toxic symptoms","low urea","excess urine","a kidney stone"],"e":"It affects almost all body systems."},{"q":"Uraemic frost is…","o":["urea crystals deposited on the skin","a skin infection","a rash","hair loss"],"e":"A late sign."},{"q":"Asterixis is…","o":["a flapping tremor","a rash","a cough","a fracture"],"e":"It occurs in uraemia and hepatic encephalopathy."},{"q":"Pruritus in CRF is due to…","o":["uraemic toxins and calcium-phosphate deposits","allergy","infection","dry air"],"e":"Skin care helps."},{"q":"Pericarditis in CRF results from…","o":["uraemic toxins","infection only","MI","trauma"],"e":"A pericardial friction rub may be heard."},{"q":"Anaemia in CRF is due to…","o":["decreased erythropoietin production","excess iron","excess vitamin C","hypertension"],"e":"The kidney makes erythropoietin."},{"q":"Treatment of anaemia in CRF includes…","o":["erythropoietin, parenteral iron and folic acid","blood transfusion routinely","steroids","antibiotics"],"e":"Transfusion is avoided unless acute loss."},{"q":"Bleeding tendency in CRF results from…","o":["platelet dysfunction","excess platelets","vitamin C excess","hypertension"],"e":"Uraemia impairs platelet function."},{"q":"Hyperkalaemia in CRF is…","o":["common and dangerous","absent","beneficial","rare"],"e":"It can cause arrhythmias."},{"q":"Acute hyperkalaemia is treated with…","o":["IV insulin and glucose or 10% calcium gluconate","potassium chloride","orange juice","salt"],"e":"Dietary potassium is restricted."},{"q":"Which food should be avoided in CRF due to high potassium?","o":["Banana","Rice","Bread","Cassava"],"e":"Also oranges and tomatoes."},{"q":"Hypertension in CRF is managed with…","o":["sodium and fluid restriction and antihypertensives","salt","fluids","steroids"],"e":"Calcium channel blockers and ACE inhibitors are preferred."},{"q":"ACE inhibitors in CRF are renoprotective because they…","o":["reduce proteinuria and delay progression","raise BP","cause oedema","increase potassium loss"],"e":"Enalapril and captopril are examples."},{"q":"Patients with CRF should avoid…","o":["NSAIDs","water in small amounts","rest","vegetables"],"e":"They can reduce renal blood flow."},{"q":"The protein in the diet of a CRF patient should be…","o":["of high biological value and restricted","high and unrestricted","absent","plant only"],"e":"It lowers urea production."},{"q":"The diet should be…","o":["high calorie, low protein, low sodium, low potassium","low calorie","high protein","high potassium"],"e":"Calories spare protein."},{"q":"Fluid restriction in CRF is based on…","o":["previous 24-hour urine output","weight only","age","height"],"e":"Plus insensible losses."},{"q":"Regular weighing in CRF is…","o":["an accurate indicator of fluid status","not useful","for height","for hunger"],"e":"It shows fluid retention."},{"q":"Aluminium-containing antacids in CRF are avoided because…","o":["they accumulate and cause toxicity","they are cheap","they cause diarrhoea","they lower K"],"e":"Phosphate binders are used cautiously."},{"q":"Renal replacement therapy includes…","o":["haemodialysis, peritoneal dialysis and transplantation","antibiotics","diet","bed rest"],"e":"These treat ESRD."},{"q":"Dialysis is used when…","o":["conservative measures fail to maintain balance","the patient is well","the patient has mild symptoms","always"],"e":"It removes waste and corrects electrolytes."},{"q":"The best treatment for ESRD where possible is…","o":["kidney transplantation","bed rest","antibiotics","fasting"],"e":"It restores function."},{"q":"Early detection and treatment of which conditions reduces the risk of CRF?","o":["Diabetes and hypertension","Colds","Sprains","Headache"],"e":"Prevention is key."},{"q":"Frequent mouth care in CRF is given because…","o":["of uraemic fetor and dry mouth","of hunger","of rash","of itching"],"e":"Hygiene improves appetite."},{"q":"Small, frequent meals in CRF help to…","o":["manage anorexia and nausea","increase weight","cause oedema","reduce rest"],"e":"Appetite is poor in uraemia."},{"q":"Infection prevention in CRF includes…","o":["restricting visits from ill persons","crowding","sharing equipment","no hand washing"],"e":"Patients are immunocompromised."},{"q":"A nursing concern in CRF is…","o":["body image changes","hunger","exercise","sleep excess"],"e":"Patients should be encouraged to express feelings."},{"q":"Energy conservation in CRF is done by…","o":["ensuring rest, sleep and appropriate exercise","strenuous exercise","no rest","overwork"],"e":"Fatigue is common."},{"q":"The nurse should monitor a CRF patient for…","o":["pericarditis, pericardial effusion and electrolyte imbalance","hair colour","eye colour","height"],"e":"These are complications."},{"q":"Increased skin pigmentation and pallor in CRF are due to…","o":["retained pigments and anaemia","sunlight","allergy","infection"],"e":"They are uraemic skin changes."},{"q":"Rate of progression of CRF is faster in patients with…","o":["high protein intake and proteinuria","low protein diet","exercise","good BP control"],"e":"Protein restriction slows decline."}]},{"id":"u26","icon":"🧬","title":"Adrenal Disorders: Cushing's Syndrome & Addison's Disease","recap":["Adrenal cortex: cortisol (glucocorticoid), aldosterone (mineralocorticoid), sex steroids; medulla: adrenaline and noradrenaline. ACTH from the pituitary drives cortisol.","Cushing's: excess cortisol; most common cause is long-term steroids (exogenous); moon face, buffalo hump, truncal obesity, striae, hirsutism, hypertension, hyperglycaemia, osteoporosis, mood changes. Cushing's disease = pituitary tumour.","Addison's: adrenal insufficiency; weakness, weight loss, hyperpigmentation, hypotension, hyperkalaemia, hyponatraemia; lifelong hydrocortisone (2/3 morning, 1/3 evening); increase dose in stress."],"qs":[{"q":"The adrenal glands are located…","o":["on top of both kidneys","in the neck","in the chest","in the pelvis"],"e":"They are also called suprarenal glands."},{"q":"The adrenal medulla secretes…","o":["epinephrine and norepinephrine","cortisol","aldosterone","insulin"],"e":"These help with the stress response."},{"q":"The adrenal cortex secretes…","o":["steroid hormones","catecholamines only","insulin","thyroxine"],"e":"Including glucocorticoids and mineralocorticoids."},{"q":"The primary glucocorticoid in humans is…","o":["cortisol","aldosterone","adrenaline","insulin"],"e":"It regulates glucose metabolism and stress response."},{"q":"Mineralocorticoids regulate…","o":["sodium and water balance","glucose only","calcium only","growth"],"e":"Aldosterone is the main one."},{"q":"Aldosterone secretion is regulated through…","o":["the renin-angiotensin system","insulin","thyroxine","glucagon"],"e":"It helps control blood pressure."},{"q":"ACTH is secreted by the…","o":["anterior pituitary gland","posterior pituitary","thyroid","adrenal"],"e":"It stimulates the adrenal cortex."},{"q":"The anterior pituitary is called the master gland because it…","o":["secretes tropic hormones controlling other glands","is the largest","makes insulin","is in the neck"],"e":"TSH also stimulates the thyroid."},{"q":"Cushing syndrome results from…","o":["excess cortisol in the blood over a long period","cortisol deficiency","excess insulin","low thyroxine"],"e":"It has exogenous and endogenous causes."},{"q":"The commonest cause of Cushing syndrome is…","o":["long-term use of corticosteroids like prednisolone","pituitary tumour","adrenal cancer","infection"],"e":"This is exogenous Cushing."},{"q":"Exogenous Cushing syndrome is…","o":["temporary and resolves after stopping the drug","permanent always","fatal","inherited"],"e":"Doses are gradually tapered."},{"q":"Endogenous Cushing syndrome is caused by…","o":["hormone-secreting tumours of the adrenal or pituitary gland","steroid tablets","infection","diet"],"e":"It is uncommon and slow."},{"q":"Cushing disease is…","o":["a pituitary tumour causing excess ACTH","an adrenal tumour","steroid use","Addison's"],"e":"ACTH overstimulates cortisol production."},{"q":"A typical feature of Cushing syndrome is…","o":["a round \"moon\" face and a buffalo hump","weight loss","hyperpigmentation","hypotension"],"e":"Fat accumulates centrally."},{"q":"Limbs in Cushing syndrome are usually…","o":["thin while the trunk is obese","swollen","normal","paralysed"],"e":"Truncal obesity is typical."},{"q":"Skin changes in Cushing syndrome include…","o":["purple striae and easy bruising","hyperpigmentation","dry scaling","jaundice"],"e":"Skin is thin and fragile."},{"q":"A sign in women with Cushing syndrome is…","o":["hirsutism and irregular menses","hair loss only","lactation","no change"],"e":"Excess androgens cause hair growth."},{"q":"Cushing syndrome raises blood pressure because of…","o":["sodium and water retention","vasodilation","low sodium","low cortisol"],"e":"Cortisol has mineralocorticoid effects."},{"q":"Hyperglycaemia in Cushing syndrome is due to…","o":["increased gluconeogenesis","insulin excess","low cortisol","fasting"],"e":"Cortisol raises blood sugar."},{"q":"Bone changes in Cushing syndrome include…","o":["osteoporosis and fractures","thick bones","no change","rickets"],"e":"Muscle weakness also occurs."},{"q":"Psychological changes in Cushing syndrome include…","o":["anxiety, irritability and depression","euphoria only","none","hallucinations only"],"e":"Memory and concentration are reduced."},{"q":"Which test is used to diagnose Cushing syndrome?","o":["24-hour urinary free cortisol","urine culture","sputum AFB","ECG"],"e":"CT/MRI locates tumours."},{"q":"Treatment of Cushing syndrome aims to…","o":["normalise hormone secretion","raise cortisol","stop insulin","increase ACTH"],"e":"Treatment depends on the cause."},{"q":"In exogenous Cushing syndrome, the corticosteroid is…","o":["gradually reduced or altered","stopped abruptly","increased","doubled"],"e":"Sudden withdrawal may cause adrenal crisis."},{"q":"The nurse monitors a Cushing patient for…","o":["thromboembolism such as chest pain","hair colour","vision colour","height"],"e":"Clotting risk is increased."},{"q":"Emotional support for a Cushing patient is important because…","o":["of distress about disfigurement","of hunger","of hearing loss","of sleep"],"e":"Patients may feel unattractive."},{"q":"Adrenocortical insufficiency means…","o":["the adrenal cortex does not produce enough hormones","too much cortisol","too much insulin","thyroid excess"],"e":"It may be primary or secondary."},{"q":"Primary adrenal insufficiency is called…","o":["Addison's disease","Cushing's disease","Graves' disease","Conn's syndrome"],"e":"The adrenal glands are damaged."},{"q":"Secondary adrenal insufficiency is caused by…","o":["lack of ACTH from the pituitary","adrenal damage","steroid excess","infection"],"e":"Adrenals are not stimulated."},{"q":"In Addison's disease, hormones deficient are…","o":["cortisol and aldosterone","insulin","thyroxine","adrenaline only"],"e":"Both cortex hormones fall."},{"q":"A feature of Addison's disease is…","o":["hyperpigmentation of the skin","obesity","hirsutism","moon face"],"e":"High ACTH stimulates melanocytes."},{"q":"Blood pressure in Addison's disease is…","o":["low, with orthostatic hypotension","high","normal","unrecordable"],"e":"Sodium and water are lost."},{"q":"Serum potassium in Addison's disease is…","o":["raised (hyperkalaemia)","low","normal","absent"],"e":"Aldosterone deficiency retains potassium."},{"q":"Other signs of Addison's disease include…","o":["weight loss, weakness and anorexia","weight gain","hirsutism","obesity"],"e":"Also diarrhoea and depression."},{"q":"Treatment of Addison's disease is…","o":["lifelong glucocorticoid replacement","surgery only","short antibiotics","diet only"],"e":"Hydrocortisone is commonly used."},{"q":"Hydrocortisone replacement is given as…","o":["two-thirds in the morning and one-third in the evening","all at night","all at once","weekly"],"e":"This mimics the natural rhythm."},{"q":"In stress such as surgery or infection, Addison's patients need…","o":["increased cortisol doses","reduced doses","no drugs","only fluids"],"e":"Stress raises cortisol requirement."},{"q":"Adrenal crisis presents with…","o":["severe hypotension, dehydration and shock","hypertension","hyperglycaemia","hirsutism"],"e":"It needs emergency treatment."},{"q":"Nursing care for Addison's patients includes…","o":["daily weighing and fluid monitoring","restricting all fluids","high potassium foods","exercise"],"e":"Fluid volume deficit is watched for."},{"q":"Patients on long-term steroids should be taught not to…","o":["stop the drug suddenly","take it with food","report side effects","keep appointments"],"e":"Abrupt withdrawal can be dangerous."}]},{"id":"u27","icon":"🍬","title":"Diabetes Mellitus: Types, Diagnosis & Management","recap":["DM: metabolic disorders with hyperglycaemia from defects in insulin secretion and/or action. Type 1: beta-cell destruction, total insulin deficit, childhood onset, ketosis-prone. Type 2: insulin resistance with inadequate secretion, obesity, older adults.","Classic signs (3 Ps): polyuria, polydipsia, polyphagia; also weight loss, fatigue, recurrent infections, itching vulva. Fasting glucose 4-6 mmol/L target.","Management: education, diet, exercise, monitoring, medication. Insulin types: rapid (regular, IV-capable), intermediate (NPH), long-acting; abdomen is the best injection site."],"qs":[{"q":"Diabetes mellitus is…","o":["a group of metabolic disorders characterised by hyperglycaemia","a thyroid disorder","a bone disease","a kidney infection"],"e":"It results from defects in insulin secretion or action."},{"q":"Insulin is secreted by…","o":["beta cells of the islets of Langerhans","alpha cells","the liver","the adrenal"],"e":"It is made in the pancreas."},{"q":"Glucagon is secreted by…","o":["alpha cells of the islets of Langerhans","beta cells","the thyroid","the liver"],"e":"It raises blood glucose."},{"q":"Insulin functions to…","o":["move glucose from blood into cells","raise blood sugar","break down fat","stop digestion"],"e":"It lowers blood glucose."},{"q":"Insulin promotes storage of glucose in the liver and muscle as…","o":["glycogen","protein","urea","bile"],"e":"Glycogenesis."},{"q":"Insulin also…","o":["inhibits the breakdown of fat","stimulates fat breakdown","causes ketosis","increases gluconeogenesis"],"e":"It enhances fat storage."},{"q":"Type 1 diabetes was formerly called…","o":["insulin-dependent diabetes mellitus","non-insulin-dependent","gestational","secondary"],"e":"Also juvenile diabetes."},{"q":"Type 1 DM results from…","o":["destruction of pancreatic beta cells with total insulin deficiency","insulin resistance","excess insulin","obesity"],"e":"It is usually autoimmune."},{"q":"In type 1 DM, hyperglycaemia appears when…","o":["80-90% of beta-cell function is lost","10% is lost","none is lost","100% is gained"],"e":"A long preclinical period precedes it."},{"q":"Type 1 DM is most often seen in…","o":["childhood and adolescence","old age only","pregnancy only","infants under 1"],"e":"It may occur at any age."},{"q":"Ketosis in type 1 DM results from…","o":["breakdown of fat due to lack of insulin","excess insulin","high protein","excess water"],"e":"Ketone bodies accumulate."},{"q":"Type 2 DM results from…","o":["insulin resistance with a defect in compensatory insulin secretion","total insulin absence","autoimmunity","pancreatitis"],"e":"It is the commonest form."},{"q":"A risk factor for type 2 DM is…","o":["obesity and family history of diabetes","underweight","youth only","exercise"],"e":"Also a history of gestational DM."},{"q":"Weight loss and exercise in type 2 DM…","o":["improve insulin sensitivity","worsen it","have no effect","cause ketosis"],"e":"They help glycaemic control."},{"q":"Gestational diabetes is…","o":["diabetes first recognised in pregnancy","type 1 DM","type 2 DM","inherited only"],"e":"It occurs during pregnancy."},{"q":"The \"3 Ps\" of diabetes are…","o":["polyuria, polydipsia and polyphagia","pain, pallor and pyrexia","pulse, pressure and pallor","pus, pain and pruritus"],"e":"They result from glucose that cannot enter cells."},{"q":"Polyuria occurs because…","o":["glucose in urine draws water by osmotic diuresis","insulin is high","the kidneys fail","water intake is low"],"e":"High glucose exceeds renal threshold."},{"q":"Weight loss in DM results from…","o":["breakdown of fat and protein for energy","overeating","excess insulin","fluid retention"],"e":"Cells cannot use glucose."},{"q":"Recurrent itching of the vulva in women with diabetes is due to…","o":["candidal infection","allergy","dry skin","stress"],"e":"High glucose favours infection."},{"q":"Fasting is defined as no caloric intake for at least…","o":["8 hours","2 hours","30 minutes","1 hour"],"e":"For fasting blood glucose testing."},{"q":"The target fasting blood glucose in DM is…","o":["4-6 mmol/L","10-15 mmol/L","1-2 mmol/L","20 mmol/L"],"e":"Targets are individualised."},{"q":"HbA1c reflects…","o":["average blood glucose over the past 2-3 months","glucose now","glucose last week","glucose last year"],"e":"It is used for long-term control."},{"q":"Urine ketones in DM indicate…","o":["breakdown of fats","good control","infection","kidney function"],"e":"Ketonuria occurs in DKA."},{"q":"Objectives of DM management include preventing…","o":["acute and chronic complications","sleep","exercise","weight gain"],"e":"Also avoiding hypoglycaemia."},{"q":"The four main components of DM management are…","o":["education, medication, diet and exercise","surgery and radiotherapy","bed rest and fasting","drugs only"],"e":"Monitoring supports all."},{"q":"Patients with DM should be referred to…","o":["a dietician for an individualised meal plan","no one","a physiotherapist only","a surgeon"],"e":"All require diet therapy."},{"q":"Diabetics are encouraged to eat…","o":["complex carbohydrates and fibre","sweets","fried food","refined sugar"],"e":"Examples: whole grains and vegetables."},{"q":"Regular exercise in diabetics…","o":["increases glucose uptake and may reduce insulin need","raises blood sugar","causes DKA","has no effect"],"e":"It also lowers cholesterol."},{"q":"Self-monitoring of blood glucose uses…","o":["a glucometer with a lancet","a thermometer","a stethoscope","a scale"],"e":"A drop of blood is obtained by finger prick."},{"q":"Insulin is essential for…","o":["all type 1 DM patients","no one","only the old","mild cases only"],"e":"Lifelong insulin is needed."},{"q":"Insulin therapy…","o":["is not a cure but a means of control","cures DM","is temporary always","is oral"],"e":"It maintains life in type 1."},{"q":"Type 2 DM patients may need insulin when…","o":["oral drugs fail or during physical stress such as surgery","never","always","when well"],"e":"Infection also raises needs."},{"q":"Regular insulin is…","o":["clear, short-acting, and can be given IV","cloudy","long-acting","oral"],"e":"It is used in DKA."},{"q":"Regular insulin should be given about…","o":["30 minutes before meals","after meals","at bedtime only","1 hour after meals"],"e":"Onset is 30-60 minutes."},{"q":"NPH insulin appears…","o":["cloudy and must be mixed gently","clear","red","oral"],"e":"It is intermediate-acting."},{"q":"An insulin vial in use may be kept at room temperature for up to…","o":["4 weeks","1 day","1 year","1 hour"],"e":"Unopened vials go in the fridge."},{"q":"The best insulin injection site for absorption is the…","o":["abdomen","thigh","hip","deltoid"],"e":"Absorption: abdomen then deltoid, thigh, hip."},{"q":"Insulin is injected at…","o":["90 degrees into a pinched skin fold","10 degrees","IM","IV always"],"e":"A 45 degree angle may be used in thin people."},{"q":"Lipodystrophy from insulin injections is prevented by…","o":["rotating injection sites","using the same site","massage","heat"],"e":"Hypertrophy or atrophy of fat may occur."},{"q":"Hyperglycaemia in diabetes may be caused by insulin failing to…","o":["lower glucose by uptake in muscle and fat cells","raise glucose","digest fat","make ketones"],"e":"Insulin-resistant cells do not respond."}]},{"id":"u28","icon":"⚠️","title":"Diabetes: Oral Drugs & Complications","recap":["Oral drugs: sulfonylureas (glimepiride, glipizide, glyburide, tolbutamide; side effect hypoglycaemia), biguanide metformin (reduces hepatic glucose output; stop in renal insufficiency), thiazolidinediones (pioglitazone), meglitinides.","DKA (type 1): hyperglycaemia, ketosis, acidosis, dehydration, Kussmaul breathing, fruity breath; treat with IV fluids, insulin, potassium. HHS (type 2): severe hyperglycaemia, dehydration, no ketosis.","Hypoglycaemia: sweating, shakiness, hunger, confusion; give 15 g rapid sugar, IV glucose if unconscious. Complications: retinopathy, nephropathy, neuropathy, diabetic foot, MI, stroke."],"qs":[{"q":"Sulfonylureas lower blood glucose by…","o":["stimulating the pancreas to release insulin","blocking carbohydrate absorption","replacing insulin","reducing appetite"],"e":"They also increase tissue sensitivity."},{"q":"An example of a sulfonylurea is…","o":["glibenclamide (glyburide)","metformin","pioglitazone","insulin"],"e":"Also glipizide and tolbutamide."},{"q":"The main side effect of sulfonylureas is…","o":["hypoglycaemia","hyperglycaemia","constipation","hair loss"],"e":"Patients should eat regularly."},{"q":"Metformin lowers glucose mainly by…","o":["reducing glucose production by the liver","stimulating insulin release","blocking insulin","fat breakdown"],"e":"It also improves peripheral insulin sensitivity."},{"q":"Metformin should be discontinued if…","o":["renal insufficiency develops","patient eats","glucose is high","weight rises"],"e":"Lactic acidosis is a risk."},{"q":"Metformin is especially useful in…","o":["obese type 2 patients","type 1 patients","children with DKA","pregnant women with DKA"],"e":"It is used with diet."},{"q":"Thiazolidinediones such as pioglitazone work by…","o":["increasing tissue sensitivity to insulin","stimulating insulin release","blocking absorption","raising glucagon"],"e":"They can be combined with other drugs."},{"q":"Alpha-glucosidase inhibitors work by…","o":["blocking carbohydrate absorption in the intestine","increasing insulin","increasing glucagon","raising sugar"],"e":"They reduce postprandial glucose."},{"q":"Diabetic ketoacidosis occurs mostly in…","o":["type 1 diabetes","type 2 diabetes","gestational only","healthy people"],"e":"It results from absolute insulin deficiency."},{"q":"DKA involves all EXCEPT…","o":["hypoglycaemia","hyperglycaemia","metabolic acidosis","dehydration"],"e":"Hyperosmolarity is also present."},{"q":"DKA is characterised by…","o":["hyperglycaemia, ketosis and metabolic acidosis","low sugar","alkalosis","fluid overload"],"e":"Fat breakdown produces ketoacids."},{"q":"A sign of DKA is…","o":["fruity (acetone) breath","foul smell","cyanosis","jaundice"],"e":"Also Kussmaul breathing."},{"q":"Kussmaul respiration is…","o":["deep, rapid breathing","slow breathing","shallow breathing","apnoea"],"e":"It compensates for acidosis."},{"q":"Dehydration in DKA is caused by…","o":["osmotic diuresis","low intake only","vomiting only","sweating"],"e":"Glucose pulls water into urine."},{"q":"Skin in dehydrated DKA patients is…","o":["warm and dry","wet","cold and clammy","normal"],"e":"Mucous membranes are dry."},{"q":"The first priority in DKA treatment is…","o":["IV fluid replacement","insulin alone","antibiotics","diet"],"e":"0.9% saline is commonly used."},{"q":"Dextrose is added in DKA treatment when glucose falls to about…","o":["250 mg/dl","500 mg/dl","1000 mg/dl","50 mg/dl"],"e":"It prevents rapid fall and hypoglycaemia."},{"q":"Insulin in severe DKA is given…","o":["as an IV infusion of regular insulin","orally","as NPH only","rectally"],"e":"Mild cases use SC insulin."},{"q":"The electrolyte of concern in DKA treatment is…","o":["potassium","calcium","iron","magnesium"],"e":"Insulin drives K into cells, causing hypokalaemia."},{"q":"Hyperosmolar hyperglycaemic state (HHS) occurs in…","o":["type 2 diabetes","type 1 diabetes","children only","pregnancy only"],"e":"It is life threatening."},{"q":"HHS is characterised by…","o":["very high blood glucose and severe dehydration without ketosis","low glucose","ketoacidosis","normal osmolarity"],"e":"Enough insulin prevents fat breakdown."},{"q":"A precipitant of HHS is…","o":["acute illness such as infection or burns","exercise","fasting","vitamins"],"e":"Also some drugs."},{"q":"HHS onset is…","o":["slow, over days to weeks","sudden within hours","within minutes","instant"],"e":"Dehydration is severe."},{"q":"Metabolic acidosis in HHS is…","o":["not part of the pathophysiology","always present","severe","the main feature"],"e":"Ketones are absent."},{"q":"Hypoglycaemia is a blood glucose below about…","o":["3 mmol/L (54 mg/dl)","10 mmol/L","15 mmol/L","20 mmol/L"],"e":"The notes give 43-60 mg/dl."},{"q":"A cause of hypoglycaemia is…","o":["missed meal or insulin overdose","eating too much","inactivity","dehydration"],"e":"Alcohol and drugs like salicylates also cause it."},{"q":"A sign of hypoglycaemia is…","o":["shakiness, sweating and irritability","fruity breath","dehydration","Kussmaul breathing"],"e":"Also blurred vision and confusion."},{"q":"Immediate treatment of conscious hypoglycaemia is…","o":["15 g rapid-acting sugar","insulin","exercise","fluids only"],"e":"Three teaspoons of sugar or honey."},{"q":"An unconscious hypoglycaemic patient receives…","o":["IV dextrose","oral sugar","insulin","nothing"],"e":"Glucagon may also be used."},{"q":"A long-term vascular complication of DM is…","o":["coronary artery disease","asthma","TB","gout"],"e":"Also hypertension and stroke."},{"q":"Diabetic retinopathy is…","o":["damage to the retinal vessels causing blindness","hearing loss","dental caries","hair loss"],"e":"A leading cause of blindness."},{"q":"Diabetic nephropathy leads to…","o":["end-stage renal disease","asthma","arthritis","gout"],"e":"It is a major cause of ESRD."},{"q":"Diabetic neuropathy presents with…","o":["paraesthesia and impaired sensation","increased sensation","no changes","muscle growth"],"e":"Peripheral and autonomic nerves are affected."},{"q":"Diabetic patients are more prone to…","o":["infections","hypertension alone","gout","asthma"],"e":"Reduced immunity and poor circulation."},{"q":"Foot care for diabetics includes…","o":["daily inspection, with a mirror if needed","walking barefoot","hot pads","cutting corns"],"e":"Wear comfortable shoes and clean socks."},{"q":"Diabetics should test bath water with…","o":["a thermometer or the elbow","the foot","the toe","no test"],"e":"Neuropathy reduces temperature sensation."},{"q":"Diabetic women should prevent infection by…","o":["wearing cotton underwear and wiping front to back","tight nylon","douching","avoiding bathing"],"e":"Hygiene reduces candidiasis."},{"q":"Diabetic patients should trim toenails…","o":["straight across after washing","curved deeply","when dry","never"],"e":"Nails are softer after washing."},{"q":"Crossing the legs at the knees should be avoided by diabetics to…","o":["keep blood flowing to the feet","keep warm","look tidy","prevent pain"],"e":"Good circulation protects the feet."},{"q":"Shoes for diabetics should…","o":["allow room for the toes and fit snugly at the heel","be tight","be open-toed only","be shared"],"e":"Check inside for rough lining before wearing."}]},{"id":"u29","icon":"🦋","title":"Hyperthyroidism & Graves' Disease","recap":["Thyroid hormones raise metabolic rate. Hyperthyroidism: weight loss despite good appetite, heat intolerance, sweating, tremor, tachycardia, nervousness, diarrhoea, menstrual irregularity, exophthalmos. Women affected ~3-5 times more than men.","Commonest cause: Graves' disease (autoimmune; antibodies stimulate TSH receptors, diffuse goitre, exophthalmos). Others: toxic nodular goitre, excessive thyroid drugs.","Treatment: antithyroid drugs (propylthiouracil, carbimazole), propranolol for symptoms, radioactive iodine, subtotal thyroidectomy. Watch for agranulocytosis."],"qs":[{"q":"Thyroid hormones primarily affect…","o":["metabolism, cardiovascular, GI and neuromuscular function","only bones","only skin","only hearing"],"e":"Changes affect all major organ systems."},{"q":"Hyperthyroidism means…","o":["excess thyroid hormone in the body","lack of thyroid hormone","excess insulin","low TSH effect only"],"e":"It produces a hypermetabolic state."},{"q":"Untreated hyperthyroidism may cause…","o":["heart failure and significant weight loss","obesity","hypotension","growth"],"e":"Cardiac complications are serious."},{"q":"Hyperthyroidism affects…","o":["women more than men","men more than women","only men","only children"],"e":"Women are affected about 3 times more."},{"q":"In hyperthyroidism, metabolic rate is…","o":["increased","decreased","normal","absent"],"e":"There is excess thyroid hormone."},{"q":"Cardiac output in hyperthyroidism is…","o":["increased","decreased","absent","unchanged"],"e":"Heart rate and stroke volume rise."},{"q":"Protein breakdown in hyperthyroidism results in…","o":["negative nitrogen balance","positive balance","normal balance","no change"],"e":"Muscle wasting occurs."},{"q":"The commonest cause of hyperthyroidism is…","o":["Graves' disease","Addison's disease","cancer","infection"],"e":"It is autoimmune."},{"q":"Graves' disease is…","o":["an autoimmune disorder","an infection","a cancer","a nutritional disease"],"e":"It is more common in women."},{"q":"In Graves' disease, antibodies…","o":["bind TSH receptors and stimulate hormone release","destroy the thyroid","block iodine","lower TSH"],"e":"The thyroid cells hyperfunction."},{"q":"Another cause of hyperthyroidism is…","o":["toxic nodular goitre","iodine deficiency","Addison's","steroid use"],"e":"Excess thyroid medication can also cause it."},{"q":"Weight in hyperthyroidism…","o":["falls despite increased appetite","rises","is unchanged","rises with appetite"],"e":"Metabolism outpaces intake."},{"q":"A skin sign in hyperthyroidism is…","o":["smooth, warm, moist skin","dry coarse skin","cold pale skin","thick skin"],"e":"Sweating is increased."},{"q":"Heat intolerance in hyperthyroidism is due to…","o":["increased metabolic heat production","cold weather","anaemia","low BP"],"e":"Patients prefer cool places."},{"q":"A sign of hyperthyroidism is…","o":["fine tremor of the hands","bradycardia","constipation","cold intolerance"],"e":"Also nervousness and irritability."},{"q":"Pulse in hyperthyroidism is…","o":["rapid, sometimes above 100","slow","normal","absent"],"e":"Palpitations are common."},{"q":"Bowel pattern in hyperthyroidism tends to be…","o":["frequent stools or diarrhoea","constipation","unchanged","absent"],"e":"GI motility is increased."},{"q":"Menstruation in hyperthyroid women is often…","o":["irregular with reduced fertility","heavy","absent always","normal"],"e":"Hormonal disturbance."},{"q":"Exophthalmos is…","o":["protrusion of the eyeballs","drooping of the eyelids","redness of the eye","blindness"],"e":"It is seen in Graves' disease."},{"q":"Proptosis means…","o":["forward displacement of the eyeballs","closing of the eyes","itching","sunken eyes"],"e":"It results from oedema behind the eye."},{"q":"Proptosis in Graves' disease occurs in about…","o":["one-third of cases","all cases","none","10% only"],"e":"Bilateral usually."},{"q":"A risk of exophthalmos is…","o":["corneal dryness, irritation and ulceration","hearing loss","anaemia","hair loss"],"e":"Lids may not close completely."},{"q":"Eye care for a patient with exophthalmos includes…","o":["artificial tears and protection from dust","rubbing the eyes","exposure to wind","no care"],"e":"Sunglasses help."},{"q":"A goitre is…","o":["enlargement of the thyroid gland","thyroid cancer","a thyroid cyst","thyroid absence"],"e":"It may occur in hyper- or hypothyroidism."},{"q":"Treatment of hyperthyroidism aims to…","o":["establish the euthyroid state","raise hormone levels","induce goitre","stop thyroid forever"],"e":"It reduces hormone production."},{"q":"Antithyroid drugs act by…","o":["inhibiting thyroid hormone production","destroying the gland","increasing TSH","blocking receptors"],"e":"They do not affect hormones already formed."},{"q":"An antithyroid drug is…","o":["propylthiouracil","levothyroxine","hydrocortisone","insulin"],"e":"Carbimazole is another."},{"q":"Antithyroid drugs take effect in…","o":["several weeks","1 hour","1 day","instantly"],"e":"Existing hormone must be used up."},{"q":"Propranolol is given in hyperthyroidism to…","o":["control tachycardia and tremor","treat infection","lower TSH","reduce oedema"],"e":"It is a beta-blocker."},{"q":"A serious side effect of antithyroid drugs is…","o":["agranulocytosis","weight gain","hypertension","hair growth"],"e":"Sore throat or fever must be reported."},{"q":"Antithyroid drugs should be taken…","o":["at the same time each day with meals","at random","only when ill","once weekly"],"e":"This keeps blood levels stable."},{"q":"Signs of overtreatment (hypothyroidism) include…","o":["fatigue and cold intolerance","insomnia","tremor","sweating"],"e":"The nurse monitors for these."},{"q":"Radioactive iodine therapy…","o":["destroys overactive thyroid tissue","stimulates the thyroid","causes goitre","is painful"],"e":"It is given orally."},{"q":"Subtotal thyroidectomy is…","o":["removal of part of the thyroid gland","removal of the whole gland","a tonsil operation","a parathyroid operation"],"e":"It leaves part of the gland in place."},{"q":"Before thyroidectomy, patients are given…","o":["antithyroid drugs to reach a euthyroid state","steroids","insulin","antibiotics"],"e":"This reduces surgical risk."},{"q":"A patient with hyperthyroidism should have a diet that is…","o":["high calorie, high protein","low calorie","low protein","fasting"],"e":"Metabolism is raised."},{"q":"Hyperthyroid patients should avoid…","o":["caffeine and stimulants","fluids","rest","fruits"],"e":"They worsen tremor and tachycardia."},{"q":"The nurse should provide a hyperthyroid patient with…","o":["a cool, calm environment","a hot room","a noisy ward","extra blankets"],"e":"Rest reduces metabolic demand."},{"q":"Thyroid storm is…","o":["a life-threatening exacerbation of hyperthyroidism","a mild cold","a thyroid cyst","hypothyroidism"],"e":"It needs emergency care."},{"q":"Thyroid-stimulating hormone (TSH) is released by the…","o":["anterior pituitary","adrenal cortex","pancreas","hypothalamus only"],"e":"It stimulates the thyroid gland."}]},{"id":"u30","icon":"🧠","title":"Meningitis","recap":["Meningitis: inflammation of the meninges. Aseptic (viral) vs septic (bacterial). Commonest bacterial cause of epidemics: Neisseria meningitidis (cerebrospinal meningitis, CSM), seen in northern Ghana in the harmattan season; others: H. influenzae, S. pneumoniae.","Classic triad: fever, severe headache, neck stiffness; also photophobia, vomiting, positive Kernig's and Brudzinski's signs, seizures, altered consciousness.","Diagnosis: lumbar puncture (CSF for Gram stain, culture). Treat: IV antibiotics that cross the blood-brain barrier, started without delay; isolation, tepid sponging, seizure precautions."],"qs":[{"q":"Meningitis is an inflammation of the…","o":["meninges covering the brain and spinal cord","lungs","heart","liver"],"e":"It is most commonly infective."},{"q":"The meninges are…","o":["protective membranes covering the brain and spinal cord","bones of the skull","muscles","nerves"],"e":"There are three layers."},{"q":"Aseptic meningitis is usually caused by…","o":["viruses","bacteria","parasites only","allergy"],"e":"The cause is not bacterial."},{"q":"Septic meningitis is caused by…","o":["bacteria","viruses only","allergy","trauma"],"e":"It is more serious."},{"q":"The organism causing cerebrospinal meningitis epidemics is…","o":["Neisseria meningitidis","Plasmodium","E. coli","Salmonella"],"e":"It is the meningococcus."},{"q":"Other bacteria causing meningitis include…","o":["Haemophilus influenzae and Streptococcus pneumoniae","Plasmodium","Candida","Giardia"],"e":"Also E. coli in neonates."},{"q":"Which organism causes meningitis in neonates?","o":["Escherichia coli","Neisseria meningitidis","Cryptococcus","Mycobacterium"],"e":"It is associated with neonatal infection."},{"q":"Cryptococcus neoformans is a…","o":["fungus causing meningitis","bacterium","virus","protozoan"],"e":"It is seen in immunosuppression."},{"q":"Mycobacterium tuberculosis can cause…","o":["tuberculous meningitis","asthma","gout","arthritis"],"e":"It has a slower onset."},{"q":"In Ghana, CSM is common in…","o":["the northern regions","the coastal areas only","the forest zone only","Accra only"],"e":"It occurs during the harmattan."},{"q":"CSM outbreaks occur mostly in…","o":["the harmattan season","the rainy season only","the wet season","any time equally"],"e":"Dry dusty weather favours spread."},{"q":"Outbreaks of meningitis often occur in…","o":["densely populated communities like schools and camps","isolated farms","single homes","hospitals only"],"e":"Close contact spreads droplets."},{"q":"Meningococcal meningitis is…","o":["contagious with a short history","non-infectious","chronic","inherited"],"e":"Cases need isolation."},{"q":"Meningitis may be confused with…","o":["cerebral malaria","asthma","gout","anaemia"],"e":"Both present with fever and altered consciousness."},{"q":"Which condition increases the risk of bacterial meningitis?","o":["Viral upper respiratory infection","Exercise","Good nutrition","Vitamins"],"e":"Otitis media and mastoiditis also do."},{"q":"Bacteria can enter the subarachnoid space from…","o":["otitis media and mastoiditis","the stomach","the bladder","the skin of the foot"],"e":"Infection crosses from adjacent structures."},{"q":"The classic triad of meningitis is…","o":["fever, headache and neck stiffness","cough, fever and wheeze","rash, joint pain and fever","vomiting, diarrhoea and thirst"],"e":"Often with photophobia."},{"q":"Neck stiffness in meningitis is called…","o":["nuchal rigidity","torticollis","kyphosis","scoliosis"],"e":"The neck resists flexion."},{"q":"Photophobia means…","o":["intolerance of light","fear of dark","blurred vision","deafness"],"e":"It is common in meningitis."},{"q":"Kernig's sign is positive when…","o":["the patient cannot fully extend the knee with the hip flexed","the neck can flex","the pupils dilate","the knee jerk is absent"],"e":"It indicates meningeal irritation."},{"q":"Brudzinski's sign is positive when…","o":["neck flexion causes the hips and knees to flex","the neck is supple","the eyes close","the feet dorsiflex"],"e":"It indicates meningeal irritation."},{"q":"Other signs of meningitis include…","o":["vomiting, irritability and altered consciousness","hair loss","jaundice","wheeze"],"e":"Seizures may occur."},{"q":"Memory impairment in meningitis is a sign of…","o":["cerebral involvement","normal ageing","recovery","allergy"],"e":"Mental changes may occur."},{"q":"The key diagnostic procedure in meningitis is…","o":["lumbar puncture","chest X-ray","ECG","ultrasound"],"e":"CSF is examined."},{"q":"CSF from a lumbar puncture in meningitis is tested by…","o":["Gram stain and culture","urine culture","Mantoux","Widal"],"e":"It identifies the organism."},{"q":"A blood film is also done in suspected meningitis to exclude…","o":["malaria","gout","TB","anaemia"],"e":"Cerebral malaria mimics meningitis."},{"q":"Treatment goals in meningitis include…","o":["eradicating the organism and preventing spread to contacts","hiding the diagnosis","no drugs","long fasting"],"e":"Isolation protects others."},{"q":"Antibiotics for bacterial meningitis must…","o":["cross the blood-brain barrier","be oral only","be mild","be topical"],"e":"Cephalosporins and penicillin are used."},{"q":"Antibiotics in meningitis are given…","o":["intravenously and started without delay","orally after diagnosis","after a week","intramuscularly only"],"e":"Delay increases mortality."},{"q":"The IV antibiotic course in bacterial meningitis is usually about…","o":["7 to 14 days","1 day","3 months","1 year"],"e":"Initially IV for at least 7 days."},{"q":"A steroid sometimes given in meningitis is…","o":["dexamethasone","insulin","salbutamol","digoxin"],"e":"It reduces inflammation."},{"q":"Phenytoin is given in meningitis for…","o":["seizures","fever","infection","pain"],"e":"Anticonvulsants prevent fits."},{"q":"Fever in meningitis is reduced by…","o":["tepid sponging","ice baths","heavy covering","fasting"],"e":"Antipyretics are also given."},{"q":"During seizures in meningitis, the nurse should…","o":["prevent injury","restrain forcefully","give oral fluids","leave the patient"],"e":"Padding and protecting from falls."},{"q":"A comatose patient with meningitis is fed through…","o":["a nasogastric tube","the mouth","IV only","no feeding"],"e":"It prevents aspiration."},{"q":"The nurse assesses a meningitis patient's…","o":["vital signs and level of consciousness","hair","eye colour","height"],"e":"Frequent assessments detect deterioration."},{"q":"A patient with meningitis should be nursed in…","o":["a quiet, dim room","a bright noisy ward","a crowded ward","the corridor"],"e":"It reduces photophobia and headache."},{"q":"A nursing diagnosis in meningitis is…","o":["acute pain related to headache and meningeal irritation","constipation","hearing loss","risk of burns"],"e":"Also risk for injury."},{"q":"Risk for infection transmission in meningitis is managed by…","o":["isolation and droplet precautions","open ward care","no precautions","sharing items"],"e":"The organism is contagious."},{"q":"A complication of meningitis is…","o":["hearing loss and brain damage","fractures","gout","asthma"],"e":"Seizures and hydrocephalus also occur."}]},{"id":"u31","icon":"⚡","title":"Stroke (Cerebrovascular Accident)","recap":["Stroke: sudden neurological deficit from reduced blood supply to part of the brain (ischaemic ~80%) or haemorrhage (~20%). Types: thrombotic, embolic, haemorrhagic (intracerebral, subarachnoid). TIA lasts under 24 h with full recovery.","Risk factors: age, hypertension, diabetes, heart disease, smoking, obesity, high cholesterol, oral contraceptives, alcohol, inactivity. Hypertension is the commonest.","Effects: hemiplegia on the opposite side, aphasia (left hemisphere), dysphagia, incontinence, emotional lability. Care: positioning, prevent contractures, swallow care, bladder/bowel training, rehabilitation."],"qs":[{"q":"A stroke is…","o":["a sudden neurological deficit from reduced blood flow to part of the brain","a heart attack","a lung disease","a skull fracture"],"e":"It results in death of brain cells."},{"q":"Stroke occurs when…","o":["blood supply to the brain is inadequate or a vessel bleeds","the heart stops","the lungs fail","oxygen is high"],"e":"Both ischaemia and haemorrhage cause it."},{"q":"Which is a non-modifiable risk factor for stroke?","o":["Age","Smoking","Obesity","Alcohol"],"e":"Family history, gender and race too."},{"q":"Stroke risk increases with…","o":["age","youth","exercise","good diet"],"e":"Men are affected more, but more women die of it."},{"q":"Which is a modifiable risk factor for stroke?","o":["Hypertension","Age","Race","Gender"],"e":"Also diabetes, smoking and obesity."},{"q":"The most important modifiable risk factor for stroke is…","o":["hypertension","sunlight","water","rest"],"e":"It damages cerebral vessels."},{"q":"Which contributes to stroke risk?","o":["Oral contraceptives","Breastfeeding","Vitamin C","Water"],"e":"Also heart disease and sleep apnoea."},{"q":"Transient ischaemic attack (TIA) lasts…","o":["not more than 24 hours with complete recovery","weeks","permanently","months"],"e":"It is a warning sign of stroke."},{"q":"A TIA is important because it…","o":["warns of a possible future stroke","is harmless","never recurs","needs no follow-up"],"e":"Risk factors must be controlled."},{"q":"Reversible ischaemic neurological deficit lasts…","o":["more than 24 hours and resolves in days","1 minute","permanently","1 hour"],"e":"No permanent deficit remains."},{"q":"A stroke in evolution is…","o":["a progressive stroke with worsening deficits","a mild stroke","a TIA","a cured stroke"],"e":"Stabilisation shows no further progression."},{"q":"A completed stroke is when…","o":["the neurological deficit is established and stable","the deficit is worsening","symptoms vanish","the person dies"],"e":"Maximum deficit is reached."},{"q":"Thrombotic stroke is caused by…","o":["occlusion of a cerebral vessel by a thrombus","rupture of a vessel","embolus from the heart","infection"],"e":"It is the commonest cause of cerebral infarction."},{"q":"Thrombotic stroke is often associated with…","o":["hypertension or diabetes","fever","fracture","dehydration only"],"e":"Atherosclerosis narrows the vessel."},{"q":"Embolic stroke occurs when…","o":["an embolus lodges in a cerebral artery","a vessel ruptures","a tumour grows","the brain swells"],"e":"The embolus may be a clot from the heart."},{"q":"The source of most cerebral emboli is…","o":["the heart","the kidney","the lung","the liver"],"e":"Atrial fibrillation is a cause."},{"q":"Haemorrhagic stroke results from…","o":["rupture of a cerebral blood vessel","a blood clot in a vessel","low BP","anaemia"],"e":"It is the most fatal type."},{"q":"Haemorrhagic strokes account for about…","o":["20% of strokes","80% of strokes","5%","50%"],"e":"Ischaemic strokes are the majority."},{"q":"The two types of haemorrhagic stroke are…","o":["intracerebral and subarachnoid haemorrhage","thrombotic and embolic","TIA and RIND","major and minor"],"e":"Bleeding is inside or around the brain."},{"q":"The commonest cause of intracerebral haemorrhage is…","o":["hypertension","anaemia","asthma","infection"],"e":"Also ruptured aneurysm and anticoagulants."},{"q":"In subarachnoid haemorrhage, blood enters the…","o":["subarachnoid space","lungs","bone","muscle"],"e":"It irritates the meninges."},{"q":"A classic symptom of subarachnoid haemorrhage is…","o":["a sudden severe headache","a gradual cough","itching","rash"],"e":"Also neck stiffness and vomiting."},{"q":"Hemiplegia is…","o":["paralysis of one side of the body","paralysis of both legs","loss of speech","loss of vision"],"e":"It occurs on the side opposite the brain lesion."},{"q":"Damage to the left side of the brain causes…","o":["right-sided paralysis","left-sided paralysis","no paralysis","paralysis on both sides"],"e":"Motor pathways cross."},{"q":"The affected shoulder in hemiplegia tends to…","o":["rotate internally (adduction)","rotate externally","stay normal","lift"],"e":"Positioning prevents contractures."},{"q":"The affected foot in hemiplegia tends to be…","o":["plantar flexed and inverted","dorsiflexed","normal","swollen"],"e":"Footdrop results."},{"q":"An initial period after stroke commonly has…","o":["flaccidity","spasticity","rigidity","tremor"],"e":"Spasticity develops later."},{"q":"Aphasia means…","o":["loss of the ability to use or understand language","loss of movement","loss of vision","loss of memory only"],"e":"It follows damage to the dominant hemisphere."},{"q":"The dominant hemisphere for language in most people is the…","o":["left hemisphere","right hemisphere","cerebellum","pons"],"e":"It applies to most right- and left-handed people."},{"q":"Receptive aphasia results from damage to…","o":["Wernicke's area","Broca's area","the cerebellum","the pons"],"e":"The patient cannot understand speech."},{"q":"Dysphagia is…","o":["difficulty swallowing","difficulty speaking","difficulty walking","difficulty seeing"],"e":"Aspiration is a risk."},{"q":"A patient with dysphagia after stroke is at risk of…","o":["aspiration pneumonia and malnutrition","obesity","hypertension","anaemia"],"e":"Tube feeding may be needed."},{"q":"A patient with dysphagia should be fed…","o":["sitting upright with the head elevated","lying flat","prone","quickly"],"e":"The nurse checks the swallow reflex."},{"q":"After a stroke, emotions may be…","o":["labile or unpredictable","fixed","absent","flat always"],"e":"Patients may laugh or cry inappropriately."},{"q":"Right-brain damage often causes…","o":["left-sided paralysis and spatial-perceptual problems","aphasia only","right paralysis","no deficit"],"e":"Patients may deny or minimise problems."},{"q":"Left-brain damage typically causes…","o":["right hemiplegia, aphasia and slow cautious behaviour","left paralysis only","impulsive behaviour","none"],"e":"Language is affected."},{"q":"Nursing priority for a stroke patient is…","o":["ineffective cerebral tissue perfusion","hair care","colour","hearing"],"e":"Airway, breathing and circulation are first."},{"q":"Preventing joint deformity after stroke involves…","o":["proper positioning and regular position changes","keeping one position","restraints","massaging hard"],"e":"Also an exercise programme and early ambulation."},{"q":"Bladder problems after stroke such as incontinence are managed by…","o":["bladder training and regular toileting","catheter for life","restricting fluids","no attention"],"e":"Flaccid bladder and confusion contribute."},{"q":"Primary prevention of stroke includes…","o":["controlling hypertension and stopping smoking","fasting","bed rest","high salt intake"],"e":"Prevention is key."}]}]</script>
<script>
const UNITS = JSON.parse(document.getElementById('quiz-data').textContent);
const PER_Q = 30;              // seconds per question -> 40 questions = 20:00
const LETTERS = ['A','B','C','D'];
const MIX = {id:'mix',icon:'🎀',title:'Surprise Mix — all units',count:40,recap:['40 random questions drawn from every unit, exam style.','Great for checking what really stuck 💡','Every question shows which unit it came from in the review.'],qs:null};

const AFFIRMATIONS = [
  "You're glowing today, Priscy 💗 one unit at a time!",
  "Future nurse Priscy: gentle hands, brilliant mind 👑",
  "Every question you answer makes you a stronger nurse 💫",
  "Sip some water, Priscy 💧 you're doing amazing ✨",
  "Somewhere, a patient will feel safe because of you 💕",
  "Small steps today, graduation gown tomorrow 🎓💜",
  "You are so capable, Priscy. Keep going, gem 💎",
  "Progress over perfection — look how far you've come 🌷",
  "Hohoe's brightest future nurse, casually being brilliant ✨",
  "Rest if you need to, then come back and shine 🌙",
  "Your heart is as strong as your brain, Priscy 💖",
  "Loved, capable and unstoppable — that's you 🌹"
];
const MID_LOVE = ["A quarter of the way bloomed 🌸 lovely, Priscy!","Halfway petals bloomed, Priscy 🌷 you're doing beautifully!","Three quarters done 💎 the finish line is waving at you!","Steady heart, sharp mind — that's my Priscy 💗","You're built for this, gem 💎 keep going!","Soft hands, strong knowledge, big heart 👑"];
const TIMER_LOVE = ["Take your time, beautiful. You know more than you think 💗","Trust your first instinct, Priscy ✨","Skipped one? Tap its little dot to come back 🌷","Deep breath. You've got this 💫","A nurse in the making 👑","Sending you warm hugs through the screen 🤗💕"];
const PERFECT = ["PERFECT, Priscy!! 👑✨ A flawless garden. The world is lucky you're becoming a nurse 💖","100%! You're a queen, a genius and the love of every textbook 💎💗"];
const GREAT = ["Brilliant work, Priscy! 💎 You're blooming beautifully — just a few petals left to polish 🌸","So proud of you 💕 That's a really strong result. Review the pink ones and you'll be unstoppable!"];
const GOOD = ["Lovely progress, Priscy 🌷 You know a lot already — read the explanations and go again, you'll fly!","You're growing, gem 💜 Every mistake you review now is one you won't make on the ward."];
