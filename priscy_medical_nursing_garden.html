const KIND = ["Hey, Priscy 💗 this one was tough and that's completely okay. Read the explanations slowly, then try again — you'll surprise yourself 💪🌸","Not your day, but it IS your journey 🌷 Champions review, rest and return. I believe in you, always 💕"];

const store = {
  get(){ try{ return JSON.parse(localStorage.getItem('priscy_med_best')||'{}'); }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem('priscy_med_best',JSON.stringify(v)); }catch(e){} }
};
let best = store.get();
function resetProgress(){ if(confirm('Reset all your saved scores on this device?')){ try{ localStorage.removeItem('priscy_med_best'); }catch(e){} location.reload(); } }
let current = UNITS[0].id;
let session = null, tick = null, loveTimer = null;

const $ = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const fmt = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const badgeFor = p => p==null?'':p>=100?'👑':p>=80?'🌸':p>=50?'🌷':'🌱';

function deco(){
  const layer=$('#deco-layer');
  const items=[['cloud','☁️','3.2rem'],['cloud','☁️','2.2rem'],['cloud','☁️','4rem'],['heart','💗','1.6rem'],['heart','💜','1.3rem'],['heart','💕','1.8rem'],['gem','💎','1.5rem'],['gem','💠','1.3rem'],['sparkle','✨','1.3rem'],['sparkle','🌟','1.4rem'],['heart','🌷','1.6rem'],['heart','🌸','1.5rem'],['heart','🦋','1.5rem'],['heart','🧸','1.5rem'],['sparkle','💫','1.3rem'],['heart','🍓','1.4rem']];
  items.forEach(([t,e,s])=>{const el=document.createElement('div');el.className='floaty '+t;el.textContent=e;el.style.fontSize=s;el.style.left=Math.random()*94+'vw';el.style.top=Math.random()*90+'vh';el.style.animationDuration=(14+Math.random()*14)+'s';el.style.animationDelay=(Math.random()*8)+'s';layer.appendChild(el);});
}
function confetti(){
  const bits=['🌸','💖','✨','💎','🌷','💗','👑','🎀'];
  for(let i=0;i<46;i++){
    const el=document.createElement('div'); el.className='fall'; el.textContent=pick(bits);
    el.style.left=Math.random()*100+'vw'; el.style.fontSize=(1+Math.random()*1.3)+'rem';
    el.style.animationDuration=(3+Math.random()*3)+'s'; el.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(el); setTimeout(()=>el.remove(),7500);
  }
}
function affirm(){ const el=$('#affirmation'); el.style.opacity=0; setTimeout(()=>{el.textContent=pick(AFFIRMATIONS);el.style.opacity=1;},300); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),3800); }

function gardenMeter(){
  const bloomed=UNITS.filter(u=>(best[u.id]||0)>=80).length, tried=UNITS.filter(u=>best[u.id]!=null).length;
  $('#gmText').textContent=`${bloomed}/${UNITS.length} bloomed 🌸 · ${tried} tried`;
  $('#gmFill').style.width=(bloomed/UNITS.length*100)+'%';
}
function allUnits(){ return [MIX,...UNITS]; }
function unit(){ return current==='mix'?MIX:UNITS.find(u=>u.id===current); }
function unitNo(){ return current==='mix'?0:UNITS.findIndex(u=>u.id===current)+1; }
function heading(u){ return u.id==='mix'?u.title:`Unit ${unitNo()}: ${u.title}`; }
function countOf(u){ return u.count||u.qs.length; }

function renderNav(){
  const q=($('#search').value||'').toLowerCase().trim();
  const list=$('#unitList'); list.innerHTML='';
  allUnits().forEach((u,idx)=>{
    const i=idx-1;
    if(q && !(u.title.toLowerCase().includes(q)||('unit '+(i+1)).includes(q))) return;
    const b=document.createElement('button');
    b.className='unit-btn'+(u.id===current?' active':'')+(u.id==='mix'?' mix':'');
    b.innerHTML=`<span class="emoji">${u.icon}</span><span>${u.id==='mix'?'':`<span class="num">Unit ${i+1}</span><br>`}${esc(u.title)}</span>`+(best[u.id]!=null?`<span class="pill">${badgeFor(best[u.id])} ${best[u.id]}%</span>`:'');
    b.onclick=()=>{
      if(session && !session.finished){ if(!confirm('Leave this quiz? Your timer and answers will be lost.')) return; stopTimer(); session=null; }
      current=u.id; renderNav(); renderIntro(); window.scrollTo({top:0,behavior:'smooth'});
    };
    list.appendChild(b);
  });
  gardenMeter();
}

function renderIntro(){
  const u=unit(), n=countOf(u);
  $('#main').innerHTML=`
    <div class="unit-header"><div class="big-emoji">${u.icon}</div><div><h2>${esc(heading(u))}</h2><div class="tagline">Ready to bloom through this one, Priscy? 🌷</div></div></div>
    <div class="card"><h3>💜 Quick review before you start</h3><ul>${u.recap.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>
    <div class="rules">
      <div class="rule">📝 ${n} questions</div>
      <div class="rule">⏱️ ${fmt(n*PER_Q)} for the whole quiz</div>
      <div class="rule">🙈 Answers &amp; explanations appear after you submit</div>
      <div class="rule">🔀 Questions &amp; options are shuffled</div>
    </div>
    <div class="center">
      <button class="btn big" id="startBtn">Start Quiz 💗</button>
      <div class="best">${best[u.id]!=null?`Your best here: ${badgeFor(best[u.id])} ${best[u.id]}%`:'The timer only starts when you tap the button. Take a breath first 🌬️'}</div>
    </div>`;
  $('#startBtn').onclick=()=>startQuiz();
}

function buildQs(raw){
  return shuffle(raw).map(q=>({q:q.q,e:q.e,src:q.src||null,o:q.o,opts:shuffle(q.o.map((t,i)=>({t,ok:i===0}))),pick:null}));
}
function startQuiz(custom){
  const u=unit(); let raw;
  if(custom) raw=custom;
  else if(u.id==='mix'){
    raw=shuffle(UNITS.flatMap((x,i)=>x.qs.map(q=>({...q,src:`Unit ${i+1}: ${x.title}`})))).slice(0,40);
  } else raw=u.qs;
  const qs=buildQs(raw);
  const total=Math.max(120,qs.length*PER_Q);
  session={unitId:u.id,qs,total,left:total,finished:false,loveAt:{},custom:!!custom};
  renderQuiz();
  toast(`Good luck, Priscy! You have ${fmt(total)}, all yours 💕`);
  stopTimer();
  tick=setInterval(()=>{
    session.left--; updateClock();
    if(session.left<=0){ toast("Time's up, sweet girl ⏰ — submitting your beautiful work 💗"); submitQuiz(true); }
  },1000);
}
function stopTimer(){ clearInterval(tick); tick=null; clearInterval(loveTimer); loveTimer=null; }

function renderQuiz(){
  const u=unit(), s=session;
  $('#main').innerHTML=`
    <div class="unit-header"><div class="big-emoji">${u.icon}</div><div><h2>${esc(heading(u))}${s.custom?' — second chance 🔄':''}</h2></div></div>
    <div class="timerbar" id="timerbar">
      <div class="timerrow"><div class="clock" id="clock">${fmt(s.left)}</div><div class="prog" id="prog"></div></div>
      <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
      <div class="timefill" aria-hidden="true"><div id="tfill"></div></div>
      <div class="dots" id="dots">${s.qs.map((_,i)=>`<button class="dot" data-i="${i}" aria-label="Go to question ${i+1}">${i+1}</button>`).join('')}</div>
      <div class="love" id="love">${pick(TIMER_LOVE)}</div>
    </div>
    <div id="qs">${s.qs.map((q,i)=>`
      <div class="qcard" id="qc${i}">
        <div class="qtext"><span class="qnum">Q${i+1}.</span>${esc(q.q)}</div>
        ${q.opts.map((o,oi)=>`<label class="opt" data-q="${i}" data-o="${oi}"><input type="radio" name="q${i}" value="${oi}"><span><b>${LETTERS[oi]}.</b> ${esc(o.t)}</span></label>`).join('')}
      </div>`).join('')}
    </div>
    <div class="submitrow"><button class="btn" id="submitBtn">Submit my answers 💗</button></div>`;
  document.querySelectorAll('#qs input').forEach(inp=>{
    inp.addEventListener('change',e=>{
      const lab=e.target.closest('.opt'); const qi=+lab.dataset.q, oi=+lab.dataset.o;
      session.qs[qi].pick=oi;
      document.querySelectorAll(`#qc${qi} .opt`).forEach(o=>o.classList.remove('sel'));
      lab.classList.add('sel'); $('#qc'+qi).classList.remove('unans'); updateProgress();
    });
  });
  document.querySelectorAll('.dot').forEach(d=>d.onclick=()=>$('#qc'+d.dataset.i).scrollIntoView({behavior:'smooth',block:'start'}));
  $('#submitBtn').onclick=()=>submitQuiz(false);
  updateProgress(); updateClock();
  clearInterval(loveTimer);
  loveTimer=setInterval(()=>{const l=$('#love'); if(l&&session&&!session.finished) l.textContent=pick(TIMER_LOVE);},12000);
}
function answered(){ return session.qs.filter(q=>q.pick!==null).length; }
function updateProgress(){
  const n=answered(), t=session.qs.length;
  $('#prog').textContent=`${n} / ${t} answered`;
  $('#fill').style.width=(n/t*100)+'%';
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('done',session.qs[i].pick!==null));
  [0.25,0.5,0.75].forEach((f,k)=>{ const m=Math.round(t*f); if(n===m && !session.loveAt[m]){ session.loveAt[m]=1; toast(MID_LOVE[k]); } });
  if(n===t && !session.loveAt.all){ session.loveAt.all=1; toast("All answered! Review if you like, then submit 💕"); }
}
function updateClock(){
  const c=$('#clock'); if(!c) return;
  c.textContent=fmt(Math.max(0,session.left));
  c.classList.toggle('low',session.left<=60);
  $('#tfill').style.width=(Math.max(0,session.left)/session.total*100)+'%';
  if(session.left===60) toast("One minute left, Priscy — you've got this! 💪💗");
}

function submitQuiz(auto){
  const s=session; if(!s||s.finished) return;
  const n=answered(), t=s.qs.length;
  if(!auto && n<t){
    if(!confirm(`You have ${t-n} unanswered question(s). Submit anyway?`)){
      const first=s.qs.findIndex(q=>q.pick===null);
      s.qs.forEach((q,i)=>{ if(q.pick===null) $('#qc'+i).classList.add('unans'); });
      $('#qc'+first).scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
  }
  stopTimer(); s.finished=true;
  const used=s.total-Math.max(0,s.left);
  const correct=s.qs.filter(q=>q.pick!==null&&q.opts[q.pick].ok).length;
  const wrong=s.qs.filter(q=>q.pick!==null&&!q.opts[q.pick].ok).length;
  const skipped=t-n, pct=Math.round(correct/t*100);
  if(!s.custom && (best[s.unitId]==null||pct>best[s.unitId])){ best[s.unitId]=pct; store.set(best); }
  s.result={correct,wrong,skipped,pct,used};
  renderNav(); renderReview('all');
  window.scrollTo({top:0,behavior:'smooth'});
  if(pct>=80) confetti();
}

function renderReview(filter){
  const u=unit(), s=session, r=s.result;
  if(!s.msg) s.msg = r.pct===100?pick(PERFECT):r.pct>=80?pick(GREAT):r.pct>=50?pick(GOOD):pick(KIND);
  const visible=s.qs.map((q,i)=>({q,i})).filter(({q})=>{
    const ok=q.pick!==null&&q.opts[q.pick].ok;
    if(filter==='wrong') return q.pick!==null&&!ok;
    if(filter==='skipped') return q.pick===null;
    return true;
  });
  const missed=r.wrong+r.skipped;
  $('#main').innerHTML=`
    <div class="unit-header"><div class="big-emoji">${u.icon}</div><div><h2>${esc(heading(u))}</h2><div class="tagline">Your results, Priscy 💗</div></div></div>
    <div class="result">
      <div class="badge">${badgeFor(r.pct)||'🌱'}</div>
      <div class="score">${r.correct} / ${s.qs.length} &nbsp;(${r.pct}%)</div>
      <div class="msg">${s.msg}</div>
      <div class="stats"><div class="stat">✅ ${r.correct} correct</div><div class="stat">❌ ${r.wrong} wrong</div><div class="stat">⏭️ ${r.skipped} skipped</div><div class="stat">⏱️ ${fmt(r.used)} used</div></div>
    </div>
    <div class="filters" role="group" aria-label="Filter answers">
      <button class="chip ${filter==='all'?'on':''}" data-f="all">All (${s.qs.length})</button>
      <button class="chip ${filter==='wrong'?'on':''}" data-f="wrong">Wrong (${r.wrong})</button>
      <button class="chip ${filter==='skipped'?'on':''}" data-f="skipped">Skipped (${r.skipped})</button>
    </div>
    <div id="review">${visible.length?visible.map(({q,i})=>reviewCard(q,i)).join(''):'<div class="card center">Nothing here — beautiful! 🌸</div>'}</div>
    <div class="submitrow">
      <button class="btn" id="retry">Try again 🔄</button>
      ${missed?`<button class="btn" id="retryMissed">Retry only my ${missed} missed 💪</button>`:''}
      ${unitNo()>0&&unitNo()<UNITS.length?'<button class="btn ghost" id="next">Next unit 🌷</button>':''}
    </div>`;
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>renderReview(c.dataset.f));
  $('#retry').onclick=()=>{session=null;renderIntro();window.scrollTo({top:0,behavior:'smooth'});};
  const rm=$('#retryMissed'); if(rm) rm.onclick=()=>{
    const raw=s.qs.filter(q=>q.pick===null||!q.opts[q.pick].ok).map(q=>({q:q.q,e:q.e,src:q.src,o:q.o}));
    startQuiz(raw); window.scrollTo({top:0,behavior:'smooth'});
  };
  const nx=$('#next'); if(nx) nx.onclick=()=>{session=null;current=UNITS[unitNo()].id;renderNav();renderIntro();window.scrollTo({top:0,behavior:'smooth'});};
}
function reviewCard(q,i){
  const ok=q.pick!==null&&q.opts[q.pick].ok;
  const verdict=q.pick===null?'<div class="verdict skip">⏭️ Skipped</div>':ok?'<div class="verdict ok">✅ Correct — well done, Priscy! 💗</div>':'<div class="verdict no">❌ Not quite — here\'s why 💜</div>';
  const opts=q.opts.map((o,oi)=>{
    let cls='opt locked', tag='';
    if(o.ok){cls+=' correct';tag='<span class="tag">✔ Correct answer</span>';}
    else if(oi===q.pick){cls+=' incorrect';tag='<span class="tag">Your answer</span>';}
    return `<div class="${cls}"><span><b>${LETTERS[oi]}.</b> ${esc(o.t)}</span>${tag}</div>`;
  }).join('');
  return `<div class="qcard">${q.src?`<div class="src">📚 ${esc(q.src)}</div>`:''}<div class="qtext"><span class="qnum">Q${i+1}.</span>${esc(q.q)}</div>${verdict}${opts}<div class="expl"><b>Why:</b> ${esc(q.e)}</div></div>`;
}

$('#unitCount').textContent=UNITS.length;
$('#search').addEventListener('input',renderNav);
deco(); renderNav(); renderIntro(); affirm(); setInterval(affirm,9000);
</script>
</body>
</html>
